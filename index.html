を含む。)を定めることができる。", "bg": "【制定時】1947年提出法案に第115条の2はなかった。\n【1985年追加】昭和60年法律第45号によって追加された。法に基づく命令（省令等）の制定・改廃に伴い、移行時に合理的に必要な経過措置を命令自体に置くための授権規定。\n【対象の限定】『合理的に必要と判断される範囲内』という法文上の条件があり、無制限の例外設定を認めたものではない。", "deb": "【1985年追加条文／改正に伴う移行の扱い】\n① 法律の改正で制度が変わるとき、施行日を境にすべて一度に切り替えられるのか。\n→ 昭和60年法律第45号で加えられた第115条の2は、法律に基づく命令を制定・改廃する場合、その命令で必要な経過措置を置くことを認めた。\n② 行政は、どんな経過措置でも置けるのか。\n→ 条文は、合理的に必要と判断される範囲に限っている。新しい制度へ移すための調整を認める一方、移行措置の名で自由に本則を変える形にはしていない。\n※追加された法文から読む制度の焦点。1985年の追加理由を直接述べる本条固有の国会質疑・答弁は未確認。", "tsu": "【法文】命令の制定・改廃を対象に、その施行に必要な経過措置を当該命令で定める。『罰則に関する経過措置』も含むが、法文が要求する合理的必要性の範囲に限定される。\n【注意】具体的にどの省令・何年の経過措置が設けられたかは、それぞれの改正省令と附則を別途確認する。本条だけで具体的な期間や例外が決定されるものではない。\n【固有通達】現行有効性と改廃を確認できた本条固有の通達は「—」。", "kako": "—", "rows": [6], "ch": 12}, {"key": "h116", "num": [116], "label": "第116条", "caption": "適用除外", "status": null, "sheet": "第115～119条", "scope": "honsoku", "text": "(適用除外)\n第116条　第1条から第11条まで、次項、第117条から第119条まで及び第121条の規定を除き、この法律は、船員法(昭和22年法律第100号)第1条第1項に規定する船員については、適用しない。\n②　この法律は、同居の親族のみを使用する事業及び家事使用人については、適用しない。", "bg": "【1947年提出法案】旧第116条は船員についての適用特例を設け、総則（第1〜11条）や罰則等の特定条文の適用を残していた。現在の同居親族のみの事業・家事使用人の除外を、制定法案の第116条第2項として記載してはならない。\n【1998年改正】平成10年法律第112号によって第116条を全文改正し、船員の適用除外規定と第2項の除外を現行形式に整理。\n【立法上の位置づけ】船員の労働関係については船員法による規律があるため、労基法をすべて重複適用する制度にはしていない。", "deb": "【1947年の提出法案／船員の適用特例】\n① 船で働く人には、陸上と同じ条文をすべて適用するのか。\n→ 制定時の第116条は船員についての特例を置き、第1〜11条など一部の規定を残しながら、それ以外を適用除外とする構造を採った。基本原則まで全面的に外す形ではなかった。\n② 現在は、どこで適用の境界を引いているのか。\n→ 1998年の全文改正後も、船員の特例を第1項に置く。一方、第2項は同居の親族だけを使用する事業と家事使用人について、労基法の適用除外を定めている。\n「船員にはどの条文を残すか」と「法律全体を適用しない対象は何か」は、別の区分として読む必要がある。\n※制定時法案・改正法・現行法文からの整理。条文固有の往復質疑は未確認。", "tsu": "【第1項・船員】船員法1条1項の船員は、原則として労基法の適用除外。ただし労基法1〜11条、116条2項、117〜119条、121条は適用が残る。\n【第2項・同居親族のみ】事業が同居親族のみの労働力で成り立つ場合が除外対象。他人を1人でも雇えばこの除外は使えず、同居親族の労働者性は勤務実態による（昭和54年4月2日基発153号、厚労省Q&Aに掲載）。\n【家事使用人】作業の種類だけでなく雇用関係・指揮命令など実態で判断。個人家庭の家事を請け負う事業者に雇われ指揮命令下で従事する者は、当然に家事使用人へ該当しない（昭和63年3月14日基発150号・婦発47号、厚労省Q&A）。\n【注意】法の適用除外であることと、労働契約上の義務がないこととは別問題。通達の全改廃は未確認。\n\n【原典確認の限定】昭和54年4月2日基発153号は厚労省の研究会資料に引用を確認したが、通達の原文全体・その後の全改廃の確認はできていない。通知固有の現行有効性を断定しない。", "kako": "平成29年\n令和4年", "rows": [7], "ch": 12}, {"key": "h117", "num": [117], "label": "第117条", "caption": "", "status": null, "sheet": "第115～119条", "scope": "honsoku", "text": "第117条　第5条の規定に違反した者は、1年以上10年以下の拘禁刑又は200,000円以上3,000,000円以下の罰金に処する。", "bg": "【1947年提出法案】強制労働の禁止（第5条）違反を特に重い刑罰で処罰。自由刑は1年以上10年以下の『懲役』、罰金は2千円以上3万円以下と規定していた。\n【現行】自由刑の範囲は1年以上10年以下、罰金は20万円以上300万円以下。額の変更について複数の改正法があるため、改正法ごとの増額理由は追加検証まで推測しない。\n【2025年6月1日】刑法の懲役・禁錮の一本化に伴い、自由刑の名称が『拘禁刑』に変更。", "deb": "【1947年3月23日・貴族院特別委員会／罰則章、発言110〜113】\n① 畠山一清委員長は、刑罰が厳しく、施行当初に善意で誤った者まで重く処罰されないかと懸念した。\n→ 寺本廣作政府委員は、罰則の重さを他の法律との均衡から説明した。強制労働に関する第117条の懲役上限10年は、当時の刑法の恐喝などとの比較を考慮したという。\n② 法律に不慣れな現場へ、最初から厳罰だけで臨むのか。\n→ 吉武惠市政府委員は、施行当初は教育・指導を重視する運用を考えていると述べた。\n強制して働かせる行為には重い刑を置く一方、施行初期の監督をどう進めるかも同じ審議で問われていた。\n※罰則章全体の実際の質疑・説明。刑名・刑額は1947年当時のもので、現在の「拘禁刑」と区別する。", "tsu": "【構成要件】労基法5条の『暴行、脅迫、監禁その他精神又は身体の自由を不当に拘束する手段』による、労働者の意思に反する労働の強制。\n【法定刑】1年以上10年以下の拘禁刑、または20万円以上300万円以下の罰金。\n【改廃】令和4年法律第68号等による刑種の変更を厚労省掲載現行法・労働局の2026年広報資料で確認。2025年6月1日以後の行為は拘禁刑の規定。刑法改正前の事案と混同しない。\n【通達】刑種変更を除く第117条固有の現行通達の後続改廃を網羅できず「—」。", "kako": "平成29年", "rows": [8], "ch": 13}, {"key": "h118", "num": [118], "label": "第118条", "caption": "", "status": null, "sheet": "第115～119条", "scope": "honsoku", "text": "第118条　第6条、第56条、第63条又は第64条の2の規定に違反した者は、1年以下の拘禁刑又は500,000円以下の罰金に処する。\n②　第70条の規定に基づいて発する厚生労働省令(第63条又は第64条の2の規定に係る部分に限る。)に違反した者についても前項の例による。", "bg": "【1947年提出法案】第118条は第6条の中間搾取や当時の年少者・女性等の就業制限に関する違反を第117条とは異なる罰則で処罰する構成。法定刑は1年以下の懲役又は1万円以下の罰金。\n【現行】第6条・第56条・第63条・第64条の2、ならびに第70条に基づく特定省令違反を対象。1年以下の拘禁刑又は50万円以下の罰金。\n【2025年6月】拘禁刑への変更。制定時と現在の参照条番号・対象規定を同じものとして扱わない。", "deb": "【1947年3月23日・貴族院特別委員会／罰則章の政府説明、発言111】\n① 強制労働以外の違反も、同じ重さの刑にするのか。\n→ 寺本廣作政府委員は、中間搾取、有害物の製造、最低年齢・坑内労働の禁止などに関する旧第118条の刑を説明した。\n② その重さは、何と比較して決めたのか。\n→ 寺本は、当時の有害物製造禁止に関する法制や児童虐待防止法などとの均衡を挙げた。条文ごとの禁止に刑を付けるだけでなく、既存の刑罰体系の中で重さをそろえようとする説明だった。\n※複数の罰則をまとめて説明した実際の政府発言であり、本条単独の往復質疑ではない。旧第118条の参照条番号は現行法と異なる。", "tsu": "【第1項】対象＝第6条（中間搾取禁止）、第56条（最低年齢）、第63条（年少者の坑内労働）、第64条の2（妊産婦の坑内業務）。\n【第2項】第70条に基づく厚生労働省令のうち、第63条又は第64条の2に係る部分への違反も同じ刑。\n【刑】1年以下の拘禁刑又は50万円以下の罰金。第119条の『6か月・30万円』と混同しない。\n【通達・改廃】刑種の改正について公式法令で確認。個別省令の適用関係と通達の全後続改廃は別途照合。", "kako": "—", "rows": [9], "ch": 13}, {"key": "h119", "num": [119], "label": "第119条", "caption": "", "status": null, "sheet": "第115～119条", "scope": "honsoku", "text": "第119条　次の各号のいずれかに該当する者は、6月以下の拘禁刑又は300,000円以下の罰金に処する。\n1　第3条、第4条、第7条、第16条、第17条、第18条第1項、第19条、第20条、第22条第4項、第32条、第34条、第35条、第36条第6項、第37条、第39条(第7項を除く。)、第61条、第62条、第64条の3から第67条まで、第72条、第75条から第77条まで、第79条、第80条、第94条第2項、第96条又は第104条第2項の規定に違反した者\n2　第33条第2項、第96条の2第2項又は第96条の3第1項の規定による命令に違反した者\n3　第40条の規定に基づいて発する厚生労働省令に違反した者\n4　第70条の規定に基づいて発する厚生労働省令(第62条又は第64条の3の規定に係る部分に限る。)に違反した者", "bg": "【1947年提出法案】労働時間・賃金・労働契約・年少者保護など広範な違反を、6か月以下の懲役又は5千円以下の罰金で処罰する法案が提示されていた。第119条は多くの労働基準規定に実効性を持たせるための罰則体系の一角をなす。\n【改正による変化】労働時間上限規制等、各制度の変更とともに参照条項が改められてきた。平成30年法律第71号等の改正と現行条番号を区別する。\n【2025年6月】自由刑は拘禁刑。現行の罰金額は上限30万円。", "deb": "【1947年3月23日・貴族院特別委員会／発言097〜098、110〜113】\n① 種田虎雄委員は、保温・採光などの基準違反について、告発があれば直ちに処罰されるのかと尋ねた。\n→ 河合良成厚生大臣は、施行初期は監督官による教育・戒告などを重視し、段階を踏んで適用する考えを答えた。\n② 第119条の刑は、どの程度の重さを想定していたのか。\n→ 寺本廣作政府委員は、他の労働法制や米国の公正労働基準法の刑罰と比較して説明した。当時の提出法案は、6月以下の懲役又は5000円以下の罰金としていた。\n条文上の罰則と、実際に監督・指導をどう進めるかは、別の問題として議論されている。\n※制定時の関連質疑と罰則章の説明。現在の刑額や刑事処分の運用を示すものではない。", "tsu": "【法定刑】6か月以下の拘禁刑又は30万円以下の罰金。\n【第1号】例として均等待遇（3条）、男女同一賃金（4条）、労働時間（32条）、休憩（34条）、休日（35条）、時間外労働の上限（36条6項）、割増賃金（37条）、年休（39条ただし7項除外）、申告に対する不利益取扱い（104条2項）等を列挙する。※省略なく条文原文の第1号全文を別欄に収録。\n【第2号】33条2項・96条の2第2項・96条の3第1項の命令違反。\n【第3号】40条による厚労省令違反。\n【第4号】70条による厚労省令のうち62条・64条の3に係る部分違反。\n【注意】36協定の締結・届出義務違反の全部が無条件で119条罰則に直結するのではない。参照される36条6項の違反と他規定を分ける。罰則規定の存在から個々の事件の犯罪成立を即断しない。", "kako": "令和2年", "rows": [10], "ch": 13}, {"key": "h120", "num": [120], "label": "第120条", "caption": "", "status": null, "sheet": "第120～121条", "scope": "honsoku", "text": "第120条　次の各号のいずれかに該当する者は、300,000円以下の罰金に処する。\n1　第14条、第15条第1項若しくは第3項、第18条第7項、第22条第1項から第3項まで、第23条から第27条まで、第32条の2第2項(第32条の3第4項、第32条の4第4項及び第32条の5第3項において準用する場合を含む。)、第32条の5第2項、第33条第1項ただし書、第38条の2第3項(第38条の3第2項において準用する場合を含む。)、第39条第7項、第57条から第59条まで、第64条、第68条、第89条、第90条第1項、第91条、第95条第1項若しくは第2項、第96条の2第1項、第105条(第100条第3項において準用する場合を含む。)又は第106条から第109条までの規定に違反した者\n2　第70条の規定に基づいて発する厚生労働省令(第14条の規定に係る部分に限る。)に違反した者\n3　第92条第2項又は第96条の3第2項の規定による命令に違反した者\n4　第101条(第100条第3項において準用する場合を含む。)の規定による労働基準監督官又は女性主管局長若しくはその指定する所属官吏の臨検を拒み、妨げ、若しくは忌避し、その尋問に対して陳述をせず、若しくは虚偽の陳述をし、帳簿書類の提出をせず、又は虚偽の記載をした帳簿書類の提出をした者\n5　第104条の2の規定による報告をせず、若しくは虚偽の報告をし、又は出頭しなかつた者", "bg": "【1947年制定時】第120条は、労働条件の明示、金品返還、賃金支払、就業規則・名簿・台帳等の義務違反や監督官への協力拒否を処罰する罰金刑として設けられた。1947年3月6日に示された提出法案では、法定刑は5,000円以下の罰金。当時の参照条番号は現行と異なる。\n【後年の改正】現在の法定刑は30万円以下の罰金。労働時間制度、安全衛生法制、監督手続等の改正に伴い、処罰対象となる参照条文・各号も改められてきた。改正理由を個々の条番号変更から推測しない。\n【位置づけ】第117～119条の拘禁刑を含み得る罰則と異なり、第120条は罰金刑だけを規定する。", "deb": "【1947年3月23日・貴族院特別委員会／罰則章、発言110〜113】\n① 畠山一清委員長は、新しい法律の刑罰の厳しさを問題にした。\n→ 寺本廣作政府委員は、実際に違反した者を処罰するのが原則で、事業主には違反防止義務に関する罰金もあると説明した。\n② 制度に不慣れな使用者へ、どのように適用を始めるのか。\n→ 吉武惠市政府委員は、施行当初は指導や注意を重視する考えを述べた。\n第120条の制定時法案には、各種の義務違反に対する5000円以下の罰金が置かれていた。義務を履行させるための刑と、現場へ制度を浸透させる監督の進め方を、併せて読む場面である。\n※実際の質疑は罰則章全体に関するもの。本条単独の逐条問答ではなく、金額は制定当時のもの。", "tsu": "【法令に基づく整理（個別通達ではない）】\n①第1号：契約期間、明示事項、賃金支払、年少者保護、就業規則・寄宿舎規則、労働者名簿・賃金台帳・記録保存等、列記された条項違反。\n②第2号：第70条に基づく厚生労働省令のうち、第14条の規定に係る部分への違反。\n③第3号：第92条第2項又は第96条の3第2項の命令違反。\n④第4号：監督官等の臨検・尋問・書類提出に対する拒否、妨害、虚偽陳述等。\n⑤第5号：第104条の2に基づく報告・出頭義務違反。\n【法定刑】いずれも30万円以下の罰金。第119条の「6か月以下の拘禁刑又は30万円以下の罰金」と区別する。\n【第120条固有の現行有効な通達】—（原文・改廃を確認できたものは掲載していない）。", "kako": "—", "rows": [5], "ch": 13}, {"key": "h121", "num": [121], "label": "第121条", "caption": "", "status": null, "sheet": "第120～121条", "scope": "honsoku", "text": "第121条　この法律の違反行為をした者が、当該事業の労働者に関する事項について、事業主のために行為した代理人、使用人その他の従業者である場合においては、事業主に対しても各本条の罰金刑を科する。ただし、事業主(事業主が法人である場合においてはその代表者、事業主が営業に関し成年者と同一の行為能力を有しない未成年者又は成年被後見人である場合においてはその法定代理人(法定代理人が法人であるときは、その代表者)を事業主とする。次項において同じ。)が違反の防止に必要な措置をした場合においては、この限りでない。\n②　事業主が違反の計画を知りその防止に必要な措置を講じなかつた場合、違反行為を知り、その是正に必要な措置を講じなかつた場合又は違反を教唆した場合においては、事業主も行為者として罰する。", "bg": "【1947年制定時】政府提出法案の段階から、違反した従業者だけでなく事業主にも責任を問う「両罰」の仕組みを設け、事業主が違反防止の必要な措置をした場合の例外も規定した。\n【制度設計】第1項は、事業主自身が現場で実行していない違反についても、事業主に罰金刑を科し得る仕組み。第2項は、事業主が違反計画を知って放置、違反を知って是正せず、又は違反を教唆した場合に、事業主を行為者として扱う仕組み。\n【沿革】条文中の法定代理人などに関する文言には後年改正がある（厚労省掲載法令沿革：平成11年法律第151号・平成16年法律第147号）。旧法の「禁治産者」を現行語句と混同しない。", "deb": "【1947年3月23日・貴族院特別委員会／発言101〜103、111】\n① 牧野英一委員は、第121条第1項の事業主への罰金と、第2項で事業主を行為者として処罰する場合は、何が違うのかと尋ねた。\n→ 吉武惠市政府委員は、第1項では事業主に罰金を科す一方、第2項では事業主も違反行為者として処罰されると説明した。\n② 事業主自身を行為者とするのは、どんな場合なのか。\n→ 吉武は、違反の計画を知りながら防止しなかった場合、違反を知っても是正しなかった場合、教唆した場合などを挙げた。その場合は、当時の法定刑が体刑なら、事業主にもその刑が及ぶとした。\n③ 寺本廣作政府委員は、実際の行為者を処罰する原則と、事業主に違反防止義務を課す仕組みを補足した。\n「部下がした違反への責任」と「知りながら関与した事業主自身の違反」を分けて考える質疑だった。\n※制定時の答弁。刑名は現在の用語と区別する。", "tsu": "【法令に基づく整理（個別通達ではない）】\n①第1項の対象：違反行為者が、事業主のために行為した代理人・使用人その他の従業者であり、当該事業の労働者に関する事項で違反した場合。\n②第1項の効果：違反行為者とは別に、事業主にも「各本条の罰金刑」を科す。ただし、事業主（法人では代表者等）が違反防止に必要な措置をしたときは、この限りでない。\n③第2項の効果：事業主が違反計画を知って防止措置をしない、違反行為を知って是正措置をしない、又は違反を教唆したときは、事業主も「行為者」として処罰される。第1項の罰金限定と異なる。\n④法人が事業主である場合でも、代表者・現場の違反行為者・法人の関係を分けて判断する。\n【第121条固有の現行有効な通達】—（原文・改廃を確認できたものは掲載していない）。", "kako": "—", "rows": [6], "ch": 13}, {"key": "f122", "num": [122], "label": "附則第122条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第122～126条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第122条\n\nこの法律施行の期日は、勅令で、これを定める。", "bg": "附則第122条　施行期日\n\n1947年に公布された法律を、公布と同時にすべて動かすのではなく、施行日を別の命令に委ねた。監督行政や事業場の準備と、最低基準を実施する時期をつなぐ規定である。国立公文書館の解説で、同年9月1日と11月1日の段階施行を確認した。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 公布されたら、その日からすべての義務が始まるのか。\n→ 第122条は施行日を勅令に委ねている。公布日と施行日を分け、1947年には9月・11月の段階施行が行われた。法律の成立だけで実施の時点は決まらない。", "tsu": "国立公文書館「労働基準法公布」（公的解説）\n1947年9月1日に主要規定が施行され、一部規定は11月1日に施行された。\n第122条自体は日付を明記せず、別の命令で施行時点を定める構造。通達そのものではなく公的解説で確認した。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "f123", "num": [123], "label": "附則第123条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第122～126条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第123条\n\n工場法、工業労働者最低年齢法、労働者災害扶助法、商店法、黄燐燐寸製造禁止法及び昭和14年法律第87号は、これを廃止する。", "bg": "附則第123条　旧法の廃止\n\n工場・商店などに分かれていた旧来の保護法令を、労働基準法による共通の最低基準へ移すための整理。旧法を廃止しても、過去の災害や行為の扱いは別の附則で残すという構造になっている。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 旧法を廃止すると、以前の事故の扶助も消えるのか。\n→ 第123条は旧法を廃止する一方、第129条は施行前の業務災害について旧法の扶助を残す。制度を統合することと、既に起きた事故の扱いは別々に決めている。", "tsu": "個別の制定・施行通達は未照合。\n条文の適用関係：第123条は旧法を廃止する一方、第129条は施行前の業務災害について旧法の扶助を残す。制度を統合することと、既に起きた事故の扱いは別々に決めている。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "f124", "num": [124], "label": "附則第124条", "caption": "", "status": "1947年制定時の歴史条文・現行掲載範囲外", "sheet": "附則第122～126条", "scope": "fusoku", "text": "【1947年制定時の歴史条文・現行掲載範囲外】\n第124条　鉱業法の一部を次のように改正する。\n\n第71条第2号、第6章及び第75条乃至第80条ノ4を削除し、第97条第3号及び第4号を削る。", "bg": "附則第124条　旧鉱業法の整理\n\n労基法の制定は、工場だけでなく鉱山の労働者の保護にも及ぶ。旧鉱業法側の条項を削ることで、従来の制度と新しい労働基準の重複を整理した。A欄は1947年制定時の法文であり、現行附則の掲載条文とは分けて読む。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① なぜ労基法の附則で、鉱業法の条文を削るのか。\n→ 新しい最低基準と旧法の制度が並ぶため、旧鉱業法側の指定条項を整理した。A欄は削除する箇所を正確に指定する改正規定であり、現行の鉱業法の条番号を示すものではない。", "tsu": "個別の制定・施行通達は未照合。\n条文の適用関係：新しい最低基準と旧法の制度が並ぶため、旧鉱業法側の指定条項を整理した。A欄は削除する箇所を正確に指定する改正規定であり、現行の鉱業法の条番号を示すものではない。", "kako": "—\n（未確認）", "rows": [7]}, {"key": "f125", "num": [125], "label": "附則第125条", "caption": "", "status": "1947年制定時の歴史条文・現行掲載範囲外", "sheet": "附則第122～126条", "scope": "fusoku", "text": "【1947年制定時の歴史条文・現行掲載範囲外】\n第125条　砂鉱法の一部を次のように改正する。\n\n第23条第1項中「第76条乃至第79条」を削り、同条第2項を削る。", "bg": "附則第125条　砂鉱法の整理\n\n鉱業法と同様に、砂鉱法の参照条項・項を整理した規定。保護ルールを新法へ移す際は、新しい法律を作るだけでなく、旧法側に残る参照も直す必要があることが分かる。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 砂鉱法の参照先をそのまま残してはいけないのか。\n→ 第125条は特定の参照を削り、項自体も削除する。法律の切替えでは、参照先だけ残ることによる不整合も処理する。制定当時の法律相互のつながりを見る規定である。", "tsu": "個別の制定・施行通達は未照合。\n条文の適用関係：第125条は特定の参照を削り、項自体も削除する。法律の切替えでは、参照先だけ残ることによる不整合も処理する。制定当時の法律相互のつながりを見る規定である。", "kako": "—\n（未確認）", "rows": [8]}, {"key": "f126", "num": [126], "label": "附則第126条", "caption": "", "status": "1947年制定時の歴史条文・現行掲載範囲外", "sheet": "附則第122～126条", "scope": "fusoku", "text": "【1947年制定時の歴史条文・現行掲載範囲外】\n第126条　労働組合法の一部を次のように改正する。\n\n第32条　削除", "bg": "附則第126条　労働組合法の整理\n\n労働組合法の第32条を削除するという、他法の整理規定。労基法の権利や義務を直接定める本文と、制度の重複を整理する附則との役割の違いが見える。削除対象は当時の労働組合法の条番号である。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 「第三十二条　削除」とあるなら、労基法第32条が消えるのか。\n→ 削除されるのは、冒頭で名指しした当時の労働組合法第32条。労基法の労働時間規定ではない。他法改正の附則は、どの法律の条番号なのかを最初に確認する。", "tsu": "個別の制定・施行通達は未照合。\n条文の適用関係：削除されるのは、冒頭で名指しした当時の労働組合法第32条。労基法の労働時間規定ではない。他法改正の附則は、どの法律の条番号なのかを最初に確認する。", "kako": "—\n（未確認）", "rows": [9]}, {"key": "f127", "num": [127], "label": "附則第127条", "caption": "", "status": "1947年制定時の歴史条文・現行掲載範囲外", "sheet": "附則第127～131条", "scope": "fusoku", "text": "【1947年制定時の歴史条文・現行掲載範囲外】\n第127条　第18条第2項、第49条、第57条、第60条乃至第63条、第89条、第95条及び第106条乃至第108条の規定は、この法律施行の日から6箇月間は、これを適用しない。\n\n②　旧法によつて禁止又は制限された事項で前項の規定に係るものについては、同項の期間中は、なお従前の規定による。", "bg": "附則第127条　施行当初の6か月猶予\n\n新しい書類・設備・労働時間規制などを一斉に適用する際の、施行当初の準備期間を定めた。猶予の間も旧法の禁止・制限を維持し、制度の切替えで保護が空白にならないようにしている。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 6か月は新法が適用されないなら、その間は自由に労働させられたのか。\n→ 第2項は、旧法で禁止・制限されていた事項について従前の規定を残す。準備のための猶予と、保護の撤廃は同じではない。対象条文の指定にも注意する。", "tsu": "個別の制定・施行通達は未照合。\n条文の適用関係：第2項は、旧法で禁止・制限されていた事項について従前の規定を残す。準備のための猶予と、保護の撤廃は同じではない。対象条文の指定にも注意する。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "f128", "num": [128], "label": "附則第128条", "caption": "", "status": "1947年制定時の歴史条文・現行掲載範囲外", "sheet": "附則第127～131条", "scope": "fusoku", "text": "【1947年制定時の歴史条文・現行掲載範囲外】\n第128条　この法律施行の際、満12才以上の児童を使用する使用者が、引き続きその者を使用する場合においては、この法律施行の日から6箇月間は、その者については第56条の規定は、これを適用しない。\n\n②　この法律施行の際、満16才以上の男子を使用する使用者が、引き続きその者を使用する場合においては、この法律施行の日から1年間は、その者については第64条の規定は、これを適用しない。", "bg": "附則第128条　既存の児童・坑内労働の猶予\n\n制定時点で既に働いていた児童や坑内で働く男子について、継続使用に限った短期間の適用猶予を置いた。新しい最低年齢・坑内労働禁止の原則に対し、施行時の既存関係をどう移すかを扱う歴史上の規定である。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 猶予期間なら、新しく児童を雇ってもよかったのか。\n→ 対象は施行時に既に使用され、引き続き使用される者。児童について6か月、満16歳以上の男子の坑内労働について1年という異なる期間を置いた。新規採用まで一般的に許す条文ではない。", "tsu": "個別の制定・施行通達は未照合。\n条文の適用関係：対象は施行時に既に使用され、引き続き使用される者。児童について6か月、満16歳以上の男子の坑内労働について1年という異なる期間を置いた。新規採用まで一般的に許す条文ではない。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "f129", "num": [129], "label": "附則第129条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第127～131条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第129条\n\nこの法律施行前、労働者が業務上負傷し、疾病にかかり、又は死亡した場合における災害補償については、なお旧法の扶助に関する規定による。", "bg": "附則第129条　施行前の災害補償\n\n災害の発生が施行前である場合には、補償を後から新制度へ切り替えず、旧法の扶助規定を用いる。旧法廃止と、過去の事故に対する扶助の継続を両立させるための条文である。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 補償を請求した日が施行後なら、新法で計算するのか。\n→ 条文の分岐点は請求日ではなく、施行前に業務上の負傷・疾病・死亡があったかどうか。旧法の扶助を用いる場面を、事故等の発生時点で区切っている。", "tsu": "個別の制定・施行通達は未照合。\n条文の適用関係：条文の分岐点は請求日ではなく、施行前に業務上の負傷・疾病・死亡があったかどうか。旧法の扶助を用いる場面を、事故等の発生時点で区切っている。", "kako": "—\n（未確認）", "rows": [7]}, {"key": "f130", "num": [130], "label": "附則第130条", "caption": "", "status": "1947年制定時の歴史条文・現行掲載範囲外", "sheet": "附則第127～131条", "scope": "fusoku", "text": "【1947年制定時の歴史条文・現行掲載範囲外】\n第130条　この法律施行前（第127条第2項の場合においては、同条第1項の期間を含む。）になした行為に関する罰則の適用については、なお旧法による。", "bg": "附則第130条　旧法による罰則\n\n新法の施行を境に、過去の行為に対する罰則まで自動的に新法へ置き換わることを避ける規定。第127条の猶予期間中に旧法が引き続き適用される行為も、旧法による処罰の側に残している。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 新法が施行されたら、旧法時代の違反も新法の罰則で処理するのか。\n→ 制定時の第130条は、施行前の行為と第127条による旧法適用期間中の行為を、旧法の罰則に接続する。行為の時点と、その時点の適用法を合わせて読む。", "tsu": "個別の制定・施行通達は未照合。\n条文の適用関係：制定時の第130条は、施行前の行為と第127条による旧法適用期間中の行為を、旧法の罰則に接続する。行為の時点と、その時点の適用法を合わせて読む。", "kako": "—\n（未確認）", "rows": [8]}, {"key": "f131", "num": [131], "label": "附則第131条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第127～131条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第131条\n\n命令で定める規模以下の事業又は命令で定める業種の事業に係る第32条第1項（第60条第2項の規定により読み替えて適用する場合を除く。）の規定の適用については、平成9年3月31日までの間は、第32条第1項中「40時間」とあるのは、「40時間を超え44時間以下の範囲内において命令で定める時間」とする。\n\n②　前項の規定により読み替えて適用する第32条第1項の命令は、労働者の福祉、労働時間の動向その他の事情を考慮して定めるものとする。\n\n③　第1項の規定により読み替えて適用する第32条第1項の命令を制定し、又は改正する場合においては、当該命令で、一定の規模以下の事業又は一定の業種の事業については、一定の期間に限り、当該命令の制定前又は改正前の例による旨の経過措置（罰則に関する経過措置を含む。）を定めることができる。\n\n④　労働大臣は、第1項の規定により読み替えて適用する第32条第1項の命令の制定又は改正の立案をしようとするときは、あらかじめ、中央労働基準審議会の意見を聴かなければならない。", "bg": "附則第131条　週40時間への段階移行\n\n週48時間から40時間への短縮を、業種・規模を考慮して段階的に進めた時代の規定。A欄に残る特例の期限は1997年3月31日。現在の週44時間特例は第40条・施行規則による別の仕組みである。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 附則に44時間とあるから、今もすべての小規模事業で44時間にできるのか。\n→ 第1項の期限は1997年3月31日。この条文の猶予は終わっている。現在の特例措置対象事業場は第40条・施行規則第25条の2による別制度なので、対象や要件を混ぜない。", "tsu": "昭和62年9月26日 発基第76号（既存の出典資料100・380）\n週40時間への短縮を段階的に進め、変形制・フレックスタイム等を導入した改正の趣旨を説明する。\n本条の猶予期限は1997年3月31日。現在の第40条による週44時間特例の要件へは、そのまま転用しない。", "kako": "—\n（未確認）", "rows": [9]}, {"key": "f132", "num": [132], "label": "附則第132条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第132～136条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第132条\n\n前条第1項の規定が適用される間における同項に規定する事業に係る第32条の4第1項の規定の適用については、同項各号列記以外の部分中「次に掲げる事項を定めたときは、第32条の規定にかかわらず、その協定で」とあるのは「次に掲げる事項及び」と、「労働時間が40時間」とあるのは「労働時間を40時間（命令で定める規模以下の事業にあつては、40時間を超え42時間以下の範囲内において命令で定める時間）以内とし、当該時間を超えて労働させたときはその超えた時間（第37条第1項の規定の適用を受ける時間を除く。）の労働について同条の規定の例により割増賃金を支払う定めをしたときは、第32条の規定にかかわらず、当該期間を平均し1週間当たりの労働時間が同条第1項の労働時間」と、「労働させることができる」とあるのは「労働させることができる。この場合において、使用者は、当該期間を平均し1週間当たり40時間（前段の命令で定める規模以下の事業にあつては、前段の命令で定める時間）を超えて労働させたときは、その超えた時間（第37条第1項の規定の適用を受ける時間を除く。）の労働について、第37条の規定の例により割増賃金を支払わなければならない」と、同項第2号中「40時間」とあるのは「第32条第1項の労働時間」とする。\n\n②　前条第1項の規定が適用される間における同項に規定する事業に係る第32条の5第1項の規定の適用については、同項中「協定がある」とあるのは「協定により、1週間の労働時間を40時間（命令で定める規模以下の事業にあつては、40時間を超え42時間以下の範囲内において命令で定める時間）以内とし、当該時間を超えて労働させたときはその超えた時間（第37条第1項の規定の適用を受ける時間を除く。）の労働について同条の規定の例により割増賃金を支払う定めをした」と、「1日について」とあるのは「1週間について同条第1項の労働時間を超えない範囲内において、1日について」と、「労働させることができる」とあるのは「労働させることができる。この場合において、使用者は、1週間について40時間（前段の命令で定める規模以下の事業にあつては、前段の命令で定める時間）を超えて労働させたときは、その超えた時間（第37条第1項の規定の適用を受ける時間を除く。）の労働について、第37条の規定の例により割増賃金を支払わなければならない」とする。\n\n③　前条第4項の規定は、前2項の規定により読み替えて適用する第32条の4第1項及び第32条の5第1項（第2項の規定により読み替えた部分に限る。）の命令について準用する。", "bg": "附則第132条　変形制と割増賃金の移行\n\n短縮への猶予がある事業で変形労働時間制等を使うとき、40時間（小規模事業の読替えを含む）を超えた時間の割増をどう確保するかを定めた。第131条の移行を、制度の柔軟性と賃金の保障の両面から支える。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 変形制を使えば、短縮の移行中は割増賃金を払わなくてよいのか。\n→ 読替えは、40時間等を超えた部分への割増支払を組み込んでいる。第131条の猶予に接続した制度であり、変形制という名称だけで賃金負担をなくしていない。", "tsu": "平成6年1月4日 基発第1号（既存の出典資料102）\n1年単位の変形労働時間制への改正と照合する。\n本条は第131条の適用期間に接続し、40時間等を超えた部分に第37条の例による割増支払を求める読替えを置く。現行の一般的な変形制の説明とは区別する。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "f133", "num": [133], "label": "附則第133条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第132～136条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第133条\n\n厚生労働大臣は、第36条第2項の基準を定めるに当たつては、満18歳以上の女性のうち雇用の分野における男女の均等な機会及び待遇の確保等のための労働省関係法律の整備に関する法律（平成9年法律第92号）第4条の規定による改正前の第64条の2第4項に規定する命令で定める者に該当しない者について平成11年4月1日以後同条第1項及び第2項の規定が適用されなくなつたことにかんがみ、当該者のうち子の養育又は家族の介護を行う労働者（厚生労働省令で定める者に限る。以下この条において「特定労働者」という。）の職業生活の著しい変化がその家庭生活に及ぼす影響を考慮して、厚生労働省令で定める期間、特定労働者（その者に係る時間外労働を短いものとすることを使用者に申し出た者に限る。）に係る第36条第1項の協定で定める労働時間の延長の限度についての基準は、当該特定労働者以外の者に係る同項の協定で定める労働時間の延長の限度についての基準とは別に、これより短いものとして定めるものとする。この場合において、1年についての労働時間の延長の限度についての基準は、150時間を超えないものとしなければならない。", "bg": "附則第133条　女性保護規制廃止時の家庭生活への配慮\n\n1999年4月から女性一般の時間外・休日労働の保護規制が適用されなくなることに伴い、子育て・介護を担う一定の労働者の家庭生活への急激な影響を考慮した規定。施行規則附則第67条第2項が定める期間は1999年4月1日から2002年3月31日までで、現在の一般的な上限ではない。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 女性の規制をなくすなら、子育て中の人にも直ちに同じ延長限度を使うのか。\n→ 条文は、一定の子育て・介護を担う特定労働者が申し出た場合、一般より短い限度基準を別に定めることとした。この移行措置の期間は2002年3月31日まで。年間150時間を、現在の子育て・介護を担う人すべての上限と読まない。", "tsu": "委任先の法令：労働基準法施行規則附則第67条\n① 第1項は対象者を、一定の子の養育又は一定の家族の介護を行う女性労働者で、指定の除外事由に当たらないものとする。\n② 第2項が定める期間は1999年4月1日から2002年3月31日まで。\n個別の施行通達は未照合だが、対象・終了時点は委任先の省令原文で確認した。現行の育児・介護休業法による時間外労働制限とは区別する。", "kako": "—\n（未確認）", "rows": [7]}, {"key": "f134", "num": [134], "label": "附則第134条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第132～136条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第134条\n\n常時300人以下の労働者を使用する事業に係る第39条の規定の適用については、昭和66年3月31日までの間は同条第1項中「10労働日」とあるのは「6労働日」と、同年4月1日から昭和69年3月31日までの間は同項中「10労働日」とあるのは「8労働日」とする。", "bg": "附則第134条　小規模事業の年休日数の移行\n\n年休の初年度付与日数を10日に引き上げる際、常時300人以下の事業について6日、8日という段階を置いた。原文の「昭和66年」「昭和69年」は、暦年として1991年（平成3年）、1994年（平成6年）に当たる。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 原文の「昭和66年」は存在しない年だから、条文は読めないのか。\n→ 元号の変更前に置いた将来年の表現が残っている。1991年3月末までは6日、その後1994年3月末までは8日という移行を示す。現在の初年度10日を6日にする根拠にはならない。", "tsu": "個別の制定・施行通達は未照合。\n条文の適用関係：元号の変更前に置いた将来年の表現が残っている。1991年3月末までは6日、その後1994年3月末までは8日という移行を示す。現在の初年度10日を6日にする根拠にはならない。", "kako": "—\n（未確認）", "rows": [8]}, {"key": "f135", "num": [135], "label": "附則第135条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第132～136条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第135条\n\n6箇月経過日から起算した継続勤務年数が4年から8年までのいずれかの年数に達する日の翌日が平成11年4月1日から平成12年3月31日までの間にある労働者に関する第39条の規定の適用については、同日までの間は、次の表の上欄に掲げる当該6箇月経過日から起算した継続勤務年数の区分に応じ、同条第2項の表中次の表の中欄に掲げる字句は、同表の下欄に掲げる字句とする。\n\n4年 ／ 6労働日 ／ 5労働日\n\n5年 ／ 8労働日 ／ 6労働日\n\n6年 ／ 10労働日 ／ 7労働日\n\n7年 ／ 10労働日 ／ 8労働日\n\n8年 ／ 10労働日 ／ 9労働日\n\n②　6箇月経過日から起算した継続勤務年数が5年から7年までのいずれかの年数に達する日の翌日が平成12年4月1日から平成13年3月31日までの間にある労働者に関する第39条の規定の適用については、平成12年4月1日から平成13年3月31日までの間は、次の表の上欄に掲げる当該6箇月経過日から起算した継続勤務年数の区分に応じ、同条第2項の表中次の表の中欄に掲げる字句は、同表の下欄に掲げる字句とする。\n\n5年 ／ 8労働日 ／ 7労働日\n\n6年 ／ 10労働日 ／ 8労働日\n\n7年 ／ 10労働日 ／ 9労働日\n\n③　前2項の規定は、第72条に規定する未成年者については、適用しない。", "bg": "附則第135条　年休の加算日数の移行\n\n継続勤務に伴う年休の加算を拡充する際の、1999年度・2000年度の経過措置。表の数字は初年度の基本10日への加算を読み替えるもので、表にある数字だけを年休の総日数と読まないことが大切である。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 表の「五労働日」なら、その年の年休は合計5日なのか。\n→ 表は第39条第2項の加算の字句を読み替える。基本の10日と加算を合わせて考える。第3項で第72条の未成年者を除いている点も、一般の年休と技能者養成の特例を分ける手掛かりになる。", "tsu": "個別の制定・施行通達は未照合。\n条文の適用関係：表は第39条第2項の加算の字句を読み替える。基本の10日と加算を合わせて考える。第3項で第72条の未成年者を除いている点も、一般の年休と技能者養成の特例を分ける手掛かりになる。", "kako": "—\n（未確認）", "rows": [9]}, {"key": "f136", "num": [136], "label": "附則第136条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第132～136条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第136条\n\n使用者は、第39条第1項から第4項までの規定による有給休暇を取得した労働者に対して、賃金の減額その他不利益な取扱いをしないようにしなければならない。", "bg": "附則第136条　年休取得の不利益取扱い\n\n休暇を取る権利があっても、取得すると賞与や精皆勤手当が減るなら、労働者は行使をためらう。1987年改正で不利益取扱いを避ける規定を置き、年休の実際の取得を支えた。旧条番号は第134条で、現在の第136条と区別する。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 休んだ日の賃金は払うが、賞与の算定では欠勤扱いにしてよいのか。\n→ 昭和63年の施行通達は、精皆勤手当・賞与で年休取得日を欠勤等として扱い、取得を抑制する不利益を避けるよう説明する。減額の程度により民事上無効となり得るという説明と、この条文の罰則の有無は区別する。", "tsu": "昭和63年1月1日 基発第1号・婦発第1号\n① 精皆勤手当・賞与の計算で年休取得日を欠勤等として扱い、取得を抑制する不利益取扱いを避ける。\n② 減額等の程度により公序良俗に反して民事上無効となる場合があり、是正指導の対象となる。\n③ 本条は不利益をしないよう求める規定であり、本条違反について労基法の罰則が直接設けられたという説明ではない。旧通達の条番号と現行番号を区別する。", "kako": "—\n（未確認）", "rows": [11]}, {"key": "f137", "num": [137], "label": "附則第137条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第137～141条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第137条\n\n期間の定めのある労働契約（一定の事業の完了に必要な期間を定めるものを除き、その期間が1年を超えるものに限る。）を締結した労働者（第14条第1項各号に規定する労働者を除く。）は、労働基準法の一部を改正する法律（平成15年法律第104号）附則第3条に規定する措置が講じられるまでの間、民法第628条の規定にかかわらず、当該労働契約の期間の初日から1年を経過した日以後においては、その使用者に申し出ることにより、いつでも退職することができる。", "bg": "附則第137条　有期契約からの退職\n\n2003年改正で有期契約の原則上限を1年から3年へ延ばす際、退職できない期間まで長期化する懸念から、衆議院修正で設けられた。1年を超える契約に、1年経過後の退職の入口を残した。", "deb": "2024年5月10日・衆議院法務委員会厚生労働委員会連合審査会（後年の直接質疑）\n① 宮本徹委員は、第137条を何のために設けたのか、外国人にも適用されるのかと質問した。\n→ 武見敬三国務大臣は、2003年に契約上限を1年から3年へ延ばした際、自由に退職できない状態が長期化する懸念を受け、衆議院の法案修正で設けたと説明。国籍を問わず適用されると答えた。\n※新設時の逐語的なやり取りではなく、発言164～165で制度の由来を確認したもの。", "tsu": "平成15年10月22日 基発第1022001号 第1・3\n① 1年を超える契約で、一定事業の完了に必要な期間を定めるもの、高度専門職等・60歳以上の第14条第1項各号の対象を除く。\n② 契約初日から1年経過後は、民法第628条の事由がなくても使用者への申出で退職できる。\n③ 改正法の3年後の検討時点で自動失効するのではなく、必要な措置が講じられるまで有効。無期転換の5年とは別制度。", "kako": "令和3年\n択一問2A\n令和7年\n択一問3A\n（関連：第14条の例外。第137条直接の出題ではない）", "rows": [5]}, {"key": "f138", "num": [138], "label": "附則第138条", "caption": "", "status": "旧規定・2023年4月から猶予廃止", "sheet": "附則第137～141条", "scope": "fusoku", "text": "【旧規定・2023年4月から猶予廃止】\n第138条　中小事業主（その資本金の額又は出資の総額が300,000,000円（小売業又はサービス業を主たる事業とする事業主については50,000,000円、卸売業を主たる事業とする事業主については100,000,000円）以下である事業主及びその常時使用する労働者の数が300人（小売業を主たる事業とする事業主については50人、卸売業又はサービス業を主たる事業とする事業主については100人）以下である事業主をいう。）の事業については、当分の間、第37条第1項ただし書の規定は、適用しない。", "bg": "附則第138条　中小企業の割増率猶予（旧規定）\n\n2008年改正で月60時間を超える時間外労働の割増率を50％以上にする際、中小事業主には適用を猶予した。2018年の働き方改革で猶予を終えることとされ、2023年4月以降は中小企業にも50％以上が適用される。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 「当分の間」なら、中小企業は今も月60時間超を25％で済ませられるのか。\n→ 旧第138条の猶予は、2018年改正の第二段階が2023年4月に施行されて終了した。時間外労働の上限規制に関する中小企業の1年猶予とは、対象も終了時点も異なる。", "tsu": "厚生労働省の2018年改正施行通達（基発0907第1号）・第4\n2023年4月から、中小企業に対する月60時間超の割増賃金率の猶予を廃止。\nA欄は2008年成立法に載る旧第138条。現在の労働条件を判断する際には第37条の50％以上の規定を適用する。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "f139", "num": [139], "label": "附則第139条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第137～141条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第139条\n\n工作物の建設の事業（災害時における復旧及び復興の事業に限る。）その他これに関連する事業として厚生労働省令で定める事業に関する第36条の規定の適用については、当分の間、同条第5項中「時間（第2項第4号に関して協定した時間を含め100時間未満の範囲内に限る。）」とあるのは「時間」と、「同号」とあるのは「第2項第4号」とし、同条第6項（第2号及び第3号に係る部分に限る。）の規定は適用しない。\n\n②　前項の規定にかかわらず、工作物の建設の事業その他これに関連する事業として厚生労働省令で定める事業については、令和6年3月31日（同日及びその翌日を含む期間を定めている第36条第1項の協定に関しては、当該協定に定める期間の初日から起算して1年を経過する日）までの間、同条第2項第4号中「1箇月及び」とあるのは、「1日を超え3箇月以内の範囲で前項の協定をする使用者及び労働組合若しくは労働者の過半数を代表する者が定める期間並びに」とし、同条第3項から第5項まで及び第6項（第2号及び第3号に係る部分に限る。）の規定は適用しない。", "bg": "附則第139条　建設事業の上限規制\n\n上限規制導入時には建設事業に移行期間を置いた。2024年4月以降、通常の建設事業には原則の規制が適用され、災害時の復旧・復興に限った特例が続く。建設事業全体の猶予と、災害復旧の特例を区別して読む。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 2024年以降も、建設工事なら月100時間・平均80時間の規制を外せるのか。\n→ 特例が続くのは災害時の復旧・復興等に限られる。通常工事は一般の上限規制へ移る。特例の場面でも、年720時間等まで消えると読むのは誤りである。", "tsu": "基発0907第1号 第2・厚生労働省「建設業・ドライバー・医師等の時間外労働の上限規制」\n2024年以降は通常の建設工事にも一般の上限規制。災害時の復旧・復興では休日労働込みの月100時間未満・2～6か月平均80時間以内が適用されない。年720時間や限度超過月数6か月の規制まで外れるわけではない。", "kako": "—\n（未確認）", "rows": [7]}, {"key": "f140", "num": [140], "label": "附則第140条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第137～141条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第140条\n\n一般乗用旅客自動車運送事業（道路運送法（昭和26年法律第183号）第3条第1号ハに規定する一般乗用旅客自動車運送事業をいう。）の業務、貨物自動車運送事業（貨物自動車運送事業法（平成元年法律第83号）第2条第1項に規定する貨物自動車運送事業をいう。）の業務その他の自動車の運転の業務として厚生労働省令で定める業務に関する第36条の規定の適用については、当分の間、同条第5項中「時間（第2項第4号に関して協定した時間を含め100時間未満の範囲内に限る。）並びに1年について労働時間を延長して労働させることができる時間（同号に関して協定した時間を含め720時間を超えない範囲内に限る。）を定めることができる。この場合において、第1項の協定に、併せて第2項第2号の対象期間において労働時間を延長して労働させる時間が1箇月について45時間（第32条の4第1項第2号の対象期間として3箇月を超える期間を定めて同条の規定により労働させる場合にあつては、1箇月について42時間）を超えることができる月数（1年について6箇月以内に限る。）を定めなければならない」とあるのは、「時間並びに1年について労働時間を延長して労働させることができる時間（第2項第4号に関して協定した時間を含め960時間を超えない範囲内に限る。）を定めることができる」とし、同条第6項（第2号及び第3号に係る部分に限る。）の規定は適用しない。\n\n②　前項の規定にかかわらず、同項に規定する業務については、令和6年3月31日（同日及びその翌日を含む期間を定めている第36条第1項の協定に関しては、当該協定に定める期間の初日から起算して1年を経過する日）までの間、同条第2項第4号中「1箇月及び」とあるのは、「1日を超え3箇月以内の範囲で前項の協定をする使用者及び労働組合若しくは労働者の過半数を代表する者が定める期間並びに」とし、同条第3項から第5項まで及び第6項（第2号及び第3号に係る部分に限る。）の規定は適用しない。", "bg": "附則第140条　自動車運転業務の上限規制\n\n自動車運転業務の業務特性・取引慣行の課題に対応する移行措置として設けられた。2024年4月以降は時間外労働に年960時間の上限がある。休息・拘束時間は改善基準告示でも管理するため、年の上限だけで完結しない。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 年960時間なら、休日労働も含めた全労働時間の枠なのか。\n→ 年960時間は時間外労働の上限で、休日労働を含めた数字ではない。単月100時間未満・複数月平均80時間以内等の一般ルールの一部は適用されないが、36協定や改善基準告示による管理は必要である。", "tsu": "基発0907第1号 第2・厚生労働省の現行説明\n特別条項付き36協定での年の時間外上限は960時間（休日労働を含まない）。月100時間未満・複数月平均80時間以内、月45時間を超える月数6か月以内という一般の規制の一部は適用されない。\n拘束時間・休息期間等は改善基準告示による別の管理も必要。運転業務と同じ会社のすべての職種を混同しない。", "kako": "—\n（未確認）", "rows": [8]}, {"key": "f141", "num": [141], "label": "附則第141条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第137～141条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第141条\n\n医業に従事する医師（医療提供体制の確保に必要な者として厚生労働省令で定める者に限る。）に関する第36条の規定の適用については、当分の間、同条第2項第4号中「における1日、1箇月及び1年のそれぞれの期間について」とあるのは「における」とし、同条第3項中「限度時間」とあるのは「限度時間並びに労働者の健康及び福祉を勘案して厚生労働省令で定める時間」とし、同条第5項及び第6項（第2号及び第3号に係る部分に限る。）の規定は適用しない。\n\n②　前項の場合において、第36条第1項の協定に、同条第2項各号に掲げるもののほか、当該事業場における通常予見することのできない業務量の大幅な増加等に伴い臨時的に前項の規定により読み替えて適用する同条第3項の厚生労働省令で定める時間を超えて労働させる必要がある場合において、同条第2項第4号に関して協定した時間を超えて労働させることができる時間（同号に関して協定した時間を含め、同条第5項に定める時間及び月数並びに労働者の健康及び福祉を勘案して厚生労働省令で定める時間を超えない範囲内に限る。）その他厚生労働省令で定める事項を定めることができる。\n\n③　使用者は、第1項の場合において、第36条第1項の協定で定めるところによつて労働時間を延長して労働させ、又は休日において労働させる場合であつても、同条第6項に定める要件並びに労働者の健康及び福祉を勘案して厚生労働省令で定める時間を超えて労働させてはならない。\n\n④　前3項の規定にかかわらず、医業に従事する医師については、令和6年3月31日（同日及びその翌日を含む期間を定めている第36条第1項の協定に関しては、当該協定に定める期間の初日から起算して1年を経過する日）までの間、同条第2項第4号中「1箇月及び」とあるのは、「1日を超え3箇月以内の範囲で前項の協定をする使用者及び労働組合若しくは労働者の過半数を代表する者が定める期間並びに」とし、同条第3項から第5項まで及び第6項（第2号及び第3号に係る部分に限る。）の規定は適用しない。\n\n⑤　第3項の規定に違反した者は、6月以下の拘禁刑又は300,000円以下の罰金に処する。", "bg": "附則第141条　医師の上限規制\n\n医師の長時間労働を是正する一方、医療提供体制を維持するための特例。2024年4月以降、対象となる医師について省令による時間の上限と健康確保の条件を組み合わせる。条文の委任先まで読む必要がある。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 医師なら、36協定を結べば何時間でも働かせられるのか。\n→ 第1項だけでなく第2・3項と省令を合わせる。上限や健康確保の条件があり、第3項違反には第5項の罰則がある。病院で働く人すべてではなく、条文・省令で定める医師が対象である。", "tsu": "基発0907第1号 第2・厚生労働省の現行説明\n36協定の特別延長時間は、A・連携B水準で年960時間、B・C水準で年1,860時間（いずれも休日労働を含む）。個人の労働時間は兼業先も通算して別に管理するため、連携B水準の協定上限と個人上限は同じとは限らない。医療法等の追加的健康確保措置も必要。", "kako": "—\n（未確認）", "rows": [10]}, {"key": "f142", "num": [142], "label": "附則第142条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第142～143条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第142条\n\n鹿児島県及び沖縄県における砂糖を製造する事業に関する第36条の規定の適用については、令和6年3月31日（同日及びその翌日を含む期間を定めている同条第1項の協定に関しては、当該協定に定める期間の初日から起算して1年を経過する日）までの間、同条第5項中「時間（第2項第4号に関して協定した時間を含め100時間未満の範囲内に限る。）」とあるのは「時間」と、「同号」とあるのは「第2項第4号」とし、同条第6項（第2号及び第3号に係る部分に限る。）の規定は適用しない。", "bg": "附則第142条　鹿児島・沖縄の砂糖製造業\n\n鹿児島県・沖縄県の砂糖製造業について、上限規制の一部を一定期間猶予した規定。期限付きの移行措置であり、地域・業種だけを見て現在も一般規制の適用がないと判断しない。", "deb": "条文から読む論点（学習上の問い。実際の個別質疑は未確認）\n① 鹿児島・沖縄で砂糖を製造すれば、いつまでも月の上限を外せるのか。\n→ 第142条は期限付き。2024年4月以降は一般の上限規制が適用される。施行境界をまたぐ協定には、その協定の初日から1年という読替えもあるため、当時の適用日を丁寧に追う。", "tsu": "基発0907第1号 第2・厚生労働省の現行説明\n鹿児島・沖縄の砂糖製造業には2024年4月以降、一般の上限規制がすべて適用される。A欄の経過措置は現在の恒久的な適用除外ではない。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "f143", "num": [143], "label": "附則第143条", "caption": "", "status": "現行掲載条文（附則・抄）", "sheet": "附則第142～143条", "scope": "fusoku", "text": "【現行掲載条文（附則・抄）】\n第143条\n\n第109条の規定の適用については、当分の間、同条中「5年間」とあるのは、「3年間」とする。\n\n②　第114条の規定の適用については、当分の間、同条ただし書中「5年」とあるのは、「3年」とする。\n\n③　第115条の規定の適用については、当分の間、同条中「賃金の請求権はこれを行使することができる時から5年間」とあるのは、「退職手当の請求権はこれを行使することができる時から5年間、この法律の規定による賃金（退職手当を除く。）の請求権はこれを行使することができる時から3年間」とする。", "bg": "附則第143条　時効・保存・付加金の暫定3年\n\n民法の短期消滅時効廃止を受け、賃金の時効等を本則で5年に延ばした一方、労使関係や紛争処理への影響に配慮し、当分の間は3年とした。本則の5年と、附則を読んだ実際の3年を合わせて覚える。", "deb": "2020年3月11日・衆議院厚生労働委員会\n① 宮本徹委員は、5年後に検討するなら、なぜ暫定措置を「5年間」とせず「当分の間」にしたのかと質問した。\n→ 坂口卓政府参考人は、賃金の時効を初めて見直す影響を特定の期間で見通すのは難しく、労使の議論を経て当分の間3年とし、別に施行5年後の検証を置いたと答えた。\n② 宮本委員は、使用者が反対し続ければ暫定措置も続くのではないかと重ねた。\n→ 坂口参考人は、改正法附則第3条の検討と必要な措置の規定を含めて法案を提案していると説明した（発言172～175）。", "tsu": "令和2年4月1日 基発0401第27号\n① 賃金（退職手当を除く。）の時効、労働者名簿等の保存、付加金の請求期間は、本則5年を当分の間3年にする。退職手当の時効は5年を維持。\n② 賃金の新期間は2020年4月1日以後に支払期日が来る請求権に適用。付加金は同日以後の違反に適用する。\n③ 施行5年後の検討規定は、暫定3年を自動的に5年へ変える規定ではない。年休等のその他の請求権を3年にする規定でもない。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "k01", "num": null, "label": "昭和22年8月31日法律第97号　附則", "caption": "", "status": null, "sheet": "改正法附則01～05", "scope": "kaisei", "text": "昭和22年8月31日法律第97号　附則\n【e-Gov掲載範囲（抄）】\n\n第13条\n\nこの法律の施行期日は、その成立の日から30日を超えない期間内において、政令で、これを定める。", "bg": "昭和二二年八月三一日法律第九七号\n\n法文上の役割：施行時点の指定。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律の施行期日は、その成立の日から三十日を超えない期間内において、政令で、これを定める。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律の施行期日は、その成立の日から三十日を超えない期間内において、政令で、これを定める。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "k02", "num": null, "label": "昭和24年5月16日法律第70号　附則", "caption": "", "status": null, "sheet": "改正法附則01～05", "scope": "kaisei", "text": "昭和24年5月16日法律第70号　附則\n【e-Gov掲載範囲（抄）】\n\n１　この法律施行の期日は、公布の日から起算して90日をこえない期間内において、政令で定める。", "bg": "昭和二四年五月一六日法律第七〇号\n\n法文上の役割：施行時点の指定。本文の切替えに加え、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律施行の期日は、公布の日から起算して九十日をこえない期間内において、政令で定める。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律施行の期日は、公布の日から起算して九十日をこえない期間内において、政令で定める。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "k03", "num": null, "label": "昭和24年5月31日法律第166号　附則", "caption": "", "status": null, "sheet": "改正法附則01～05", "scope": "kaisei", "text": "昭和24年5月31日法律第166号　附則\n【e-Gov掲載範囲】\n\nこの法律は、昭和24年6月1日から施行する。", "bg": "昭和二四年五月三一日法律第一六六号\n\n法文上の役割：施行時点の指定。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、昭和二十四年六月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、昭和二十四年六月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [7]}, {"key": "k04", "num": null, "label": "昭和25年12月20日法律第290号　附則", "caption": "", "status": null, "sheet": "改正法附則01～05", "scope": "kaisei", "text": "昭和25年12月20日法律第290号　附則\n【e-Gov掲載範囲】\n\nこの法律は、新法の施行の日から施行する。", "bg": "昭和二五年一二月二〇日法律第二九〇号\n\n法文上の役割：施行時点の指定。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、新法の施行の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、新法の施行の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [8]}, {"key": "k05", "num": null, "label": "昭和27年7月31日法律第287号　附則", "caption": "", "status": null, "sheet": "改正法附則01～05", "scope": "kaisei", "text": "昭和27年7月31日法律第287号　附則\n【e-Gov掲載範囲（抄）】\n\n１　この法律は、昭和27年9月1日から施行する。\n\n２　この法律の施行の際使用者が改正前の労働基準法第18条第2項の規定による認可を受けて、労働者の貯蓄金を管理している場合においては、この法律の施行後は、改正後の同項の規定による届出があつたものとみなす。\n\n４　改正後の労働基準法第76条第2項及び第3項の規定は、この法律施行の際同条第1項の規定による休業補償を受けている労働者についても適用あるものとし、且つ、その労働者につき左の各号の一に該当する事由があるときは、使用者は、左の各号の区分によつて当該各号に定める比率に応じて休業補償を改訂し、昭和28年1月から、改訂された額により休業補償を行わなければならない。\n\n1　常時100人以上の労働者を使用する事業場において昭和22年9月1日から昭和26年3月31日までの間に業務上負傷し、又は疾病にかかつた者については、昭和27年1月から3月までの平均給与額が、その負傷し又は疾病にかかつた日の属する会計年度において当該労働者と同一の事業場の同種の労働者に対して所定労働時間労働した場合に支払われた通常の賃金の1箇月1人当り平均額（以下本項において会計年度における平均給与額という。）の100分の120をこえる場合は、その比率\n\n2　常時100人以上の労働者を使用する事業場において昭和22年9月1日から昭和26年3月31日までの間において業務上負傷し、又は疾病にかかつた者で前号の場合に該当しないものについては、昭和27年7月から9月までの平均給与額が、会計年度における平均給与額の100分の120をこえる場合は、その比率\n\n3　常時100人以上の労働者を使用する事業場において昭和26年4月以後において業務上負傷し、又は疾病にかかつた者については、昭和27年7月から9月までの平均給与額が、当該労働者の負傷し、又は疾病にかかつた日の属する四半期の平均給与額の100分の120をこえる場合は、その比率\n\n4　常時100人未満の労働者を使用する事業場において業務上負傷し、又は疾病にかかつた者が、前各号に該当する場合においては、命令で定める比率\n\n5　日々雇い入れられる者については、命令で定める比率", "bg": "昭和二七年七月三一日法律第二八七号\n\n貯蓄金の管理や休業補償の改正を、既存の認可・受給関係へどう接続するかを扱う。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 既に受けた貯蓄金管理の認可は、改正後の届出として扱う。休業補償については施行時の受給者にも新規定を適用し、一定の条件で補償額を改訂する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：既に受けた貯蓄金管理の認可は、改正後の届出として扱う。休業補償については施行時の受給者にも新規定を適用し、一定の条件で補償額を改訂する。", "kako": "—\n（未確認）", "rows": [9]}, {"key": "k06", "num": null, "label": "昭和29年6月10日法律第171号　附則", "caption": "", "status": null, "sheet": "改正法附則06～10", "scope": "kaisei", "text": "昭和29年6月10日法律第171号　附則\n【e-Gov掲載範囲】\n\nこの法律施行の期日は、公布の日から起算して90日をこえない期間内において、政令で定める。", "bg": "昭和二九年六月一〇日法律第一七一号\n\n法文上の役割：施行時点の指定。本文の切替えに加え、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律施行の期日は、公布の日から起算して九十日をこえない期間内において、政令で定める。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律施行の期日は、公布の日から起算して九十日をこえない期間内において、政令で定める。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "k07", "num": null, "label": "昭和31年6月4日法律第126号　附則", "caption": "", "status": null, "sheet": "改正法附則06～10", "scope": "kaisei", "text": "昭和31年6月4日法律第126号　附則\n【e-Gov掲載範囲（抄）】\n\n１　この法律の施行期日は、公布の日から起算して6箇月をこえない範囲内で、政令で定める。\n\n１２　この法律の施行前に、改正前の労働基準法第86条の規定により労働者災害補償審査会がした審査又は仲裁の請求の受理その他の行為は、改正後の労働基準法第86条の規定により労働者災害補償保険審査官がした審査又は仲裁の請求の受理その他の行為とみなす。", "bg": "昭和三一年六月四日法律第一二六号\n\n法文上の役割：施行時点の指定。本文の切替えに加え、旧処分・手続等を新制度につなぐ扱い、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律の施行期日は、公布の日から起算して六箇月をこえない範囲内で、政令で定める。」と定める。ほかに掲載される条項は、既存の法律関係・手続等の接続を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律の施行期日は、公布の日から起算して六箇月をこえない範囲内で、政令で定める。」と定める。ほかに掲載される条項は、既存の法律関係・手続等の接続を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "k08", "num": null, "label": "昭和33年5月2日法律第133号　附則", "caption": "", "status": null, "sheet": "改正法附則06～10", "scope": "kaisei", "text": "昭和33年5月2日法律第133号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、公布の日から起算して6月をこえない範囲内で、政令で定める日から施行する。", "bg": "昭和三三年五月二日法律第一三三号\n\n法文上の役割：施行期日。本文の切替えに加え、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、公布の日から起算して六月をこえない範囲内で、政令で定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、公布の日から起算して六月をこえない範囲内で、政令で定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [7]}, {"key": "k09", "num": null, "label": "昭和34年4月15日法律第137号　附則", "caption": "", "status": null, "sheet": "改正法附則06～10", "scope": "kaisei", "text": "昭和34年4月15日法律第137号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律の施行期日は、公布の日から起算して90日をこえない範囲内において、各規定につき、政令で定める。", "bg": "昭和三四年四月一五日法律第一三七号\n\n法文上の役割：施行期日。本文の切替えに加え、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律の施行期日は、公布の日から起算して九十日をこえない範囲内において、各規定につき、政令で定める。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律の施行期日は、公布の日から起算して九十日をこえない範囲内において、各規定につき、政令で定める。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [8]}, {"key": "k10", "num": null, "label": "昭和37年9月15日法律第161号　附則", "caption": "", "status": null, "sheet": "改正法附則06～10", "scope": "kaisei", "text": "昭和37年9月15日法律第161号　附則\n【e-Gov掲載範囲（抄）】\n\n１　この法律は、昭和37年10月1日から施行する。\n\n２　この法律による改正後の規定は、この附則に特別の定めがある場合を除き、この法律の施行前にされた行政庁の処分、この法律の施行前にされた申請に係る行政庁の不作為その他この法律の施行前に生じた事項についても適用する。ただし、この法律による改正前の規定によつて生じた効力を妨げない。\n\n３　この法律の施行前に提起された訴願、審査の請求、異議の申立てその他の不服申立て（以下「訴願等」という。）については、この法律の施行後も、なお従前の例による。この法律の施行前にされた訴願等の裁決、決定その他の処分（以下「裁決等」という。）又はこの法律の施行前に提起された訴願等につきこの法律の施行後にされる裁決等にさらに不服がある場合の訴願等についても、同様とする。\n\n４　前項に規定する訴願等で、この法律の施行後は行政不服審査法による不服申立てをすることができることとなる処分に係るものは、同法以外の法律の適用については、行政不服審査法による不服申立てとみなす。\n\n５　第3項の規定によりこの法律の施行後にされる審査の請求、異議の申立てその他の不服申立ての裁決等については、行政不服審査法による不服申立てをすることができない。\n\n６　この法律の施行前にされた行政庁の処分で、この法律による改正前の規定により訴願等をすることができるものとされ、かつ、その提起期間が定められていなかつたものについて、行政不服審査法による不服申立てをすることができる期間は、この法律の施行の日から起算する。\n\n８　この法律の施行前にした行為に対する罰則の適用については、なお従前の例による。\n\n９　前8項に定めるもののほか、この法律の施行に関して必要な経過措置は、政令で定める。\n\n１０　この法律及び行政事件訴訟法の施行に伴う関係法律の整理等に関する法律（昭和37年法律第140号）に同一の法律についての改正規定がある場合においては、当該法律は、この法律によつてまず改正され、次いで行政事件訴訟法の施行に伴う関係法律の整理等に関する法律によつて改正されるものとする。", "bg": "昭和三七年九月一五日法律第一六一号\n\n行政不服審査制度の切替えに伴う、旧処分・既存の不服申立ての経過措置を扱う。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 施行前の事項にも新規定を適用する一方、既に提起された訴願等は従前の例により処理する。処分の日と不服申立ての日で適用関係が分かれる。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：施行前の事項にも新規定を適用する一方、既に提起された訴願等は従前の例により処理する。処分の日と不服申立ての日で適用関係が分かれる。", "kako": "—\n（未確認）", "rows": [9]}, {"key": "k11", "num": null, "label": "昭和40年6月11日法律第130号　附則", "caption": "", "status": null, "sheet": "改正法附則11～15", "scope": "kaisei", "text": "昭和40年6月11日法律第130号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、昭和40年8月1日から施行する。ただし、第2条及び附則第13条の規定は昭和40年11月1日から、第3条並びに附則第14条から附則第43条まで及び附則第45条の規定は昭和41年2月1日から施行する。\n\n（労働基準法の一部改正に伴う経過措置）\n\n第10条\n\n事業が数次の請負によつて行なわれる場合における災害補償であつて、昭和40年7月31日以前に生じた事故に係るものについては、前条の規定による改正前の労働基準法第87条の規定の例による。\n\n（労働基準法の一部改正に伴う経過措置）\n\n第20条\n\n昭和41年2月1日前に生じた事由に係る労働基準法第75条から第77条まで、第79条及び第80条の規定による災害補償については、前条の規定による同法第79条及び第84条第1項の規定の改正にかかわらず、なお従前の例による。\n\n第21条\n\n附則第8条第1項の規定によりなお効力を有することとされる第1条の規定による改正前の労働者災害補償保険法第17条から第19条の2までの規定により保険給付の全部又は一部が支給されない場合において使用者が行なうべき災害補償については、なお附則第19条の規定による改正前の労働基準法第84条第1項の規定の例による。", "bg": "昭和四〇年六月一一日法律第一三〇号\n\n法文上の役割：施行期日、労働基準法の一部改正に伴う経過措置、労働基準法の一部改正に伴う経過措置。本文の切替えに加え、旧制度の取扱いを残す経過措置を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律は、昭和四十年八月一日から施行する。ただし、第二条及び附則第十三条の規定は昭和四十年十一月一日から、第三条並びに附則第十四条から附則第四十三条まで及び附則第四十五条の規定は昭和四十一年二月一日から施行する。」と定める。ほかに掲載される条項は、労働基準法の一部改正に伴う経過措置、労働基準法の一部改正に伴う経過措置を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、昭和四十年八月一日から施行する。ただし、第二条及び附則第十三条の規定は昭和四十年十一月一日から、第三条並びに附則第十四条から附則第四十三条まで及び附則第四十五条の規定は昭和四十一年二月一日から施行する。」と定める。ほかに掲載される条項は、労働基準法の一部改正に伴う経過措置、労働基準法の一部改正に伴う経過措置を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "k12", "num": null, "label": "昭和42年8月1日法律第108号　附則", "caption": "", "status": null, "sheet": "改正法附則11～15", "scope": "kaisei", "text": "昭和42年8月1日法律第108号　附則\n【e-Gov掲載範囲（抄）】\n\n１　この法律は、公布の日から施行する。", "bg": "昭和四二年八月一日法律第一〇八号\n\n法文上の役割：施行時点の指定。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、公布の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、公布の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [7]}, {"key": "k13", "num": null, "label": "昭和43年6月15日法律第99号　附則", "caption": "", "status": null, "sheet": "改正法附則11～15", "scope": "kaisei", "text": "昭和43年6月15日法律第99号　附則\n【e-Gov掲載範囲（抄）】\n\n１　この法律は、公布の日から施行する。", "bg": "昭和四三年六月一五日法律第九九号\n\n法文上の役割：施行時点の指定。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、公布の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、公布の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [8]}, {"key": "k14", "num": null, "label": "昭和44年7月18日法律第64号　附則", "caption": "", "status": null, "sheet": "改正法附則11～15", "scope": "kaisei", "text": "昭和44年7月18日法律第64号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律（以下「新法」という。）は、昭和44年10月1日から施行する。", "bg": "昭和四四年七月一八日法律第六四号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律（以下「新法」という。）は、昭和四十四年十月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律（以下「新法」という。）は、昭和四十四年十月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [9]}, {"key": "k15", "num": null, "label": "昭和47年6月8日法律第57号　附則", "caption": "", "status": null, "sheet": "改正法附則11～15", "scope": "kaisei", "text": "昭和47年6月8日法律第57号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、公布の日から起算して6月をこえない範囲内において政令で定める日から施行する。\n\n（政令への委任）\n\n第2条\n\nこの附則に定めるもののほか、この法律の施行に関して必要な経過措置は、政令で定める。\n\n（罰則に関する経過措置）\n\n第3条\n\nこの法律の施行前にした行為に対する罰則の適用については、なお従前の例による。", "bg": "昭和四七年六月八日法律第五七号\n\n法文上の役割：施行期日、政令への委任、罰則に関する経過措置。本文の切替えに加え、旧制度の取扱いを残す経過措置、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律は、公布の日から起算して六月をこえない範囲内において政令で定める日から施行する。」と定める。ほかに掲載される条項は、政令への委任、罰則に関する経過措置を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、公布の日から起算して六月をこえない範囲内において政令で定める日から施行する。」と定める。ほかに掲載される条項は、政令への委任、罰則に関する経過措置を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [10]}, {"key": "k16", "num": null, "label": "昭和51年5月27日法律第34号　附則", "caption": "", "status": null, "sheet": "改正法附則16～20", "scope": "kaisei", "text": "昭和51年5月27日法律第34号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、公布の日から起算して1年を超えない範囲内において、各規定につき、政令で定める日から施行する。\n\n（労働基準法の一部改正に伴う経過措置）\n\n第5条\n\n前条の規定の施行の日前にした同条の規定による改正前の労働基準法の規定に違反する行為に対する罰則の適用については、なお従前の例による。", "bg": "昭和五一年五月二七日法律第三四号\n\n法文上の役割：施行期日、労働基準法の一部改正に伴う経過措置。本文の切替えに加え、旧制度の取扱いを残す経過措置、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律は、公布の日から起算して一年を超えない範囲内において、各規定につき、政令で定める日から施行する。」と定める。ほかに掲載される条項は、労働基準法の一部改正に伴う経過措置を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、公布の日から起算して一年を超えない範囲内において、各規定につき、政令で定める日から施行する。」と定める。ほかに掲載される条項は、労働基準法の一部改正に伴う経過措置を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "k17", "num": null, "label": "昭和58年12月2日法律第78号　附則", "caption": "", "status": null, "sheet": "改正法附則16～20", "scope": "kaisei", "text": "昭和58年12月2日法律第78号　附則\n【e-Gov掲載範囲】\n\n１　この法律（第1条を除く。）は、昭和59年7月1日から施行する。\n\n２　この法律の施行の日の前日において法律の規定により置かれている機関等で、この法律の施行の日以後は国家行政組織法又はこの法律による改正後の関係法律の規定に基づく政令（以下「関係政令」という。）の規定により置かれることとなるものに関し必要となる経過措置その他この法律の施行に伴う関係政令の制定又は改廃に関し必要となる経過措置は、政令で定めることができる。", "bg": "昭和五八年一二月二日法律第七八号\n\n法文上の役割：施行時点の指定。本文の切替えに加え、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律（第一条を除く。）は、昭和五十九年七月一日から施行する。」と定める。ほかに掲載される条項は、既存の法律関係・手続等の接続を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律（第一条を除く。）は、昭和五十九年七月一日から施行する。」と定める。ほかに掲載される条項は、既存の法律関係・手続等の接続を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "k18", "num": null, "label": "昭和59年12月25日法律第87号　附則", "caption": "", "status": null, "sheet": "改正法附則16～20", "scope": "kaisei", "text": "昭和59年12月25日法律第87号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、昭和60年4月1日から施行する。\n\n（政令への委任）\n\n第28条\n\n附則第2条から前条までに定めるもののほか、この法律の施行に関し必要な事項は、政令で定める。", "bg": "昭和五九年一二月二五日法律第八七号\n\n法文上の役割：施行期日、政令への委任。本文の切替えに加え、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律は、昭和六十年四月一日から施行する。」と定める。ほかに掲載される条項は、政令への委任を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、昭和六十年四月一日から施行する。」と定める。ほかに掲載される条項は、政令への委任を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [7]}, {"key": "k19", "num": null, "label": "昭和60年6月1日法律第45号　附則", "caption": "", "status": null, "sheet": "改正法附則16～20", "scope": "kaisei", "text": "昭和60年6月1日法律第45号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、昭和61年4月1日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　第2条中労働基準法第100条の2及び第120条第4号の改正規定並びに次条第1項、附則第3条及び附則第17条（労働省設置法（昭和24年法律第162号）第4条第30号の次に1号を加える改正規定並びに同法第4条第32号及び第34号並びに第9条第1項の改正規定に限る。）の規定公布の日\n\n（労働基準法の一部改正に伴う経過措置）\n\n第2条\n\nこの法律（前条各号に掲げる規定については、当該各規定。次条及び附則第19条において同じ。）の施行前に第2条の規定による改正前の労働基準法（これに基づく命令を含む。）の規定によりされた処分、手続その他の行為は、同条の規定による改正後の労働基準法（これに基づく命令を含む。）の相当規定によりされた処分、手続その他の行為とみなす。\n\n２　産後6週間を経過する日がこの法律の施行前である女子については、第2条の規定による改正後の労働基準法第65条第2項の規定は、適用しない。\n\n３　この法律の施行前に第2条の規定による改正前の労働基準法第65条第2項ただし書の規定により就業するに至つた女子で、この法律の施行の際産後6週間を経過していないものについては、第2条の規定による改正後の労働基準法第65条第2項の規定にかかわらず、なお従前の例による。\n\n４　この法律の施行前に解雇された満18才以上の女子が帰郷する場合における旅費の負担については、なお従前の例による。\n\n第3条\n\nこの法律の施行前にした行為並びに前条第3項及び第4項の規定によりなお従前の例によることとされる事項に係るこの法律の施行後にした行為に対する罰則の適用については、なお従前の例による。\n\n（その他の経過措置の政令への委任）\n\n第19条\n\nこの附則に規定するもののほか、この法律の施行に伴い必要な経過措置（罰則に関する経過措置を含む。）は、政令で定める。\n\n（検討）\n\n第20条\n\n政府は、この法律の施行後適当な時期において、第1条の規定による改正後の雇用の分野における男女の均等な機会及び待遇の確保等女子労働者の福祉の増進に関する法律及び第2条の規定による改正後の労働基準法第6章の2の規定の施行状況を勘案し、必要があると認めるときは、これらの法律の規定について検討を加え、その結果に基づいて必要な措置を講ずるものとする。", "bg": "昭和六〇年六月一日法律第四五号\n\n男女雇用機会均等法と労基法の改正に伴い、産後休業や女性の労働時間について既存関係を調整する。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 施行前の処分等を新規定に接続する「みなし」と、産後6週間を経過する時点等で区切る扱いが並ぶ。法律全体の施行日だけでは各人への適用は決まらない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：施行前の処分等を新規定に接続する「みなし」と、産後6週間を経過する時点等で区切る扱いが並ぶ。法律全体の施行日だけでは各人への適用は決まらない。", "kako": "—\n（未確認）", "rows": [8]}, {"key": "k20", "num": null, "label": "昭和60年6月8日法律第56号　附則", "caption": "", "status": null, "sheet": "改正法附則16～20", "scope": "kaisei", "text": "昭和60年6月8日法律第56号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、昭和60年10月1日から施行する。", "bg": "昭和六〇年六月八日法律第五六号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、昭和六十年十月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、昭和六十年十月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [11]}, {"key": "k21", "num": null, "label": "昭和60年7月5日法律第89号　附則", "caption": "", "status": null, "sheet": "改正法附則21～25", "scope": "kaisei", "text": "昭和60年7月5日法律第89号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、労働者派遣事業の適正な運営の確保及び派遣労働者の就業条件の整備等に関する法律（昭和60年法律第88号）の施行の日から施行する。", "bg": "昭和六〇年七月五日法律第八九号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、労働者派遣事業の適正な運営の確保及び派遣労働者の就業条件の整備等に関する法律（昭和六十年法律第八十八号）の施行の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、労働者派遣事業の適正な運営の確保及び派遣労働者の就業条件の整備等に関する法律（昭和六十年法律第八十八号）の施行の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "k22", "num": null, "label": "昭和62年9月26日法律第99号　附則", "caption": "", "status": null, "sheet": "改正法附則21～25", "scope": "kaisei", "text": "昭和62年9月26日法律第99号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、昭和63年4月1日から施行する。\n\n（労働時間に関する経過措置）\n\n第2条\n\n昭和63年3月31日を含む1週間に係る労働時間については、この法律による改正後の労働基準法（以下「新法」という。）第32条第1項、第33条、第36条、第37条、第60条、第64条の2及び第66条第2項の規定にかかわらず、なお従前の例による。\n\n２　この法律の施行の際使用者がこの法律による改正前の労働基準法（以下「旧法」という。）第32条第2項の規定により労働させることとしている労働者に関しては、同項の規定に基づく就業規則その他これに準ずるものによる定めをしている4週間以内の一定の期間のうち昭和63年3月31日を含む期間に係る労働時間については、新法第32条、第32条の2、第33条、第36条、第37条、第64条の2及び第66条第2項の規定にかかわらず、なお従前の例による。\n\n（年次有給休暇に関する経過措置）\n\n第3条\n\nこの法律の施行の際4月1日以外の日が基準日（新法第39条第1項に定める継続勤務の期間の終了する日の翌日をいう。以下この条において同じ。）である労働者に係る有給休暇については、この法律の施行の日後の最初の基準日の前日までの間は、新法第39条第1項から第3項までの規定にかかわらず、なお従前の例による。\n\n２　新法第133条に規定する事業に使用される労働者であつて昭和66年4月1日において継続勤務するもののうち、同日において4月1日以外の日が基準日である労働者に係る有給休暇については、同年4月1日から同日後の最初の基準日の前日までの間は、同月1日前において同条の規定により読み替えて適用する新法第39条第1項から第3項までの規定の例による。\n\n３　前項の規定は、新法第133条に規定する事業に使用される労働者であつて昭和69年4月1日において継続勤務するものについて準用する。\n\n（時効に関する経過措置）\n\n第4条\n\nこの法律の施行前に生じた退職手当の請求権の消滅時効については、なお従前の例による。\n\n（罰則に関する経過措置）\n\n第5条\n\nこの法律の施行前にした行為並びに附則第2条及び第3条第1項の規定によりなお従前の例によることとされる事項に係るこの法律の施行後にした行為に対する罰則の適用については、なお従前の例による。\n\n（政令への委任）\n\n第6条\n\n附則第2条から前条までに定めるもののほか、この法律の施行に伴い必要な経過措置（罰則に関する経過措置を含む。）は、政令で定める。\n\n（検討）\n\n第7条\n\n政府は、この法律の施行後3年を経過した場合において、新法の規定の施行の状況を勘案し、必要があると認めるときは、新法の規定について検討を加え、その結果に基づいて必要な措置を講ずるものとする。", "bg": "昭和六二年九月二六日法律第九九号\n\n1987年の労働時間短縮・年休拡充を、週・変形制の期間・年休の基準日の途中で切り替えないための規定。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 1988年3月31日を含む週や一定の変形期間には旧制度を残す。年休は施行後の最初の基準日まで従前の例とする。初日の一斉切替えではない。", "tsu": "昭和63年1月1日 基発第1号・婦発第1号。\n労働時間・年休改正の施行の説明と照合する。年休の段階移行で通達・旧附則が示す旧条番号と、現在の附則の条番号を区別する。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "k23", "num": null, "label": "平成3年5月15日法律第76号　附則", "caption": "", "status": null, "sheet": "改正法附則21～25", "scope": "kaisei", "text": "平成3年5月15日法律第76号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成4年4月1日から施行する。", "bg": "平成三年五月一五日法律第七六号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、平成四年四月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、平成四年四月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [10]}, {"key": "k24", "num": null, "label": "平成4年7月2日法律第90号　附則", "caption": "", "status": null, "sheet": "改正法附則21～25", "scope": "kaisei", "text": "平成4年7月2日法律第90号　附則\n【e-Gov掲載範囲】\n\nこの法律は、公布の日から起算して3月を超えない範囲内において政令で定める日から施行する。", "bg": "平成四年七月二日法律第九〇号\n\n法文上の役割：施行時点の指定。本文の切替えに加え、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、公布の日から起算して三月を超えない範囲内において政令で定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、公布の日から起算して三月を超えない範囲内において政令で定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [11]}, {"key": "k25", "num": null, "label": "平成5年7月1日法律第79号　附則", "caption": "", "status": null, "sheet": "改正法附則21～25", "scope": "kaisei", "text": "平成5年7月1日法律第79号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成6年4月1日から施行する。\n\n（労働時間に関する経過措置）\n\n第2条\n\n平成6年3月31日を含む1週間に係る労働時間については、この法律による改正後の労働基準法（以下「新労働基準法」という。）第32条第1項（新労働基準法第131条第1項の規定により読み替えて適用する場合を含む。次項において同じ。）、第32条の5第1項（新労働基準法第132条第2項の規定により読み替えて適用する場合を含む。）、第33条、第36条、第37条、第60条、第64条の2並びに第66条第1項及び第2項の規定にかかわらず、なお従前の例による。\n\n２　この法律の施行の際使用者がこの法律による改正前の労働基準法（以下「旧労働基準法」という。）第32条の2、第32条の3及び旧労働基準法第132条第1項の規定により読み替えて適用する旧労働基準法第32条の4第1項の規定により労働させることとしている労働者に関しては、旧労働基準法第32条の2の規定に基づく就業規則その他これに準ずるものによる定めをしている1箇月以内の一定の期間、旧労働基準法第32条の3の規定に基づく同条の協定（労働時間の短縮の促進に関する臨時措置法第7条に規定する労働時間短縮推進委員会の決議を含む。以下この条において同じ。）による定めをしている旧労働基準法第32条の3第2号の清算期間又は旧労働基準法第132条第1項の規定により読み替えて適用する旧労働基準法第32条の4第1項の規定に基づく同項の協定による定めをしている3箇月以内の一定の期間（以下この項において「旧労働基準法による協定等の期間」という。）のうち平成6年3月31日を含む旧労働基準法による協定等の期間に係る労働時間については、新労働基準法第32条第1項、第32条の2、第32条の3、第32条の4第1項（新労働基準法第132条第1項の規定により読み替えて適用する場合を含む。第5項において同じ。）、第33条、第36条、第37条、第64条の2並びに第66条第1項及び第2項の規定にかかわらず、なお従前の例による。\n\n３　この法律の施行前に使用者が旧労働基準法第38条の2第4項の規定に基づき同項の協定（この法律の施行の際現に効力を有するものに限る。）で定めた業務は、当該協定が効力を有する間は、新労働基準法第38条の2第4項の命令で定めた業務とみなす。\n\n４　平成9年3月31日においてその労働時間について新労働基準法第131条第1項の規定により読み替えて適用する新労働基準法第32条第1項（以下この項及び次項において「読替え後の新労働基準法第32条第1項」という。）の規定が適用されている労働者に関しては、同日を含む1週間に係る労働時間については、読替え後の新労働基準法第32条第1項の規定の例による。\n\n５　使用者が新労働基準法第32条の2から第32条の4第1項までの規定により労働させることとしている労働者であって、平成9年3月31日においてその労働時間について読替え後の新労働基準法第32条第1項の規定が適用されているものに関しては、新労働基準法第32条の2の規定に基づく就業規則その他これに準ずるものによる定めをしている1箇月以内の一定の期間、新労働基準法第32条の3の規定に基づく同条の協定による定めをしている同条第2号の清算期間又は新労働基準法第32条の4第1項の規定に基づく同項の協定による定めをしている同項第2号の対象期間（以下この項において「新労働基準法による協定等の期間」という。）のうち同日を含む新労働基準法による協定等の期間に係る労働時間については、読替え後の新労働基準法第32条第1項の規定の例による。\n\n６　平成9年3月31日においてその労働時間について新労働基準法第132条第1項又は第2項の規定により読み替えて適用する新労働基準法第32条の4第1項又は第32条の5第1項の規定が適用されている労働者に関しては、同日を含む新労働基準法第132条第1項の規定により読み替えて適用する新労働基準法第32条の4第1項の規定に基づく同項の協定による定めをしている同項第2号の対象期間を平均し1週間について又は同日を含む1週間について使用者が40時間を超えて労働させたときにおけるその超えた時間（新労働基準法第37条第1項の規定の適用を受ける時間を除く。）の労働については、新労働基準法第132条第1項又は第2項の規定により読み替えて適用する新労働基準法第32条の4第1項又は第32条の5第1項の規定の例による。\n\n（有給休暇に関する経過措置）\n\n第3条\n\n新労働基準法第39条第1項及び第2項の規定は、6箇月を超えて継続勤務する日がこの法律の施行の日（以下「施行日」という。）以後である労働者について適用し、施行日前に6箇月を超えて継続勤務している労働者については、なお従前の例による。この場合において、その雇入れの日が施行日前である労働者に関する同条第1項及び第2項の規定の適用については、同条第1項中「その雇入れの日」とあるのは「労働基準法及び労働時間の短縮の促進に関する臨時措置法の一部を改正する法律（平成5年法律第79号）の施行の日（次項において「施行日」という。）」と、同条第2項中「1年6箇月」とあるのは「施行日から起算して1年6箇月」と、「6箇月を」とあるのは「施行日から起算して6箇月を」とする。\n\n２　施行日前の育児休業等に関する法律（平成3年法律第76号）第2条第1項に規定する育児休業をした期間については、新労働基準法第39条第7項の規定は、適用しない。\n\n（報告等に関する経過措置）\n\n第4条\n\nこの法律の施行前に旧労働基準法第110条の規定により行政官庁又は労働基準監督官から要求のあった報告又は出頭は、新労働基準法第104条の2の規定により行政官庁又は労働基準監督官が命じた報告又は出頭とみなす。\n\n（罰則に関する経過措置）\n\n第6条\n\nこの法律の施行前にした行為並びに附則第2条第1項及び第2項並びに第3条第1項の規定によりなお従前の例によることとされる事項に係るこの法律の施行後にした行為に対する罰則の適用については、なお従前の例による。\n\n（政令への委任）\n\n第7条\n\n附則第2条から前条までに定めるもののほか、この法律の施行に伴い必要な経過措置（罰則に関する経過措置を含む。）は、政令で定める。", "bg": "平成五年七月一日法律第七九号\n\n1993年の改正による週40時間制・変形制・年休の移行を、継続中の期間や休業の時点に応じて調整する。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 1994年・1997年の境界を含む週や清算・対象期間には個別の経過措置がある。年休や育児休業の期間も別に区切るので、施行日だけで全部を判断しない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：1994年・1997年の境界を含む週や清算・対象期間には個別の経過措置がある。年休や育児休業の期間も別に区切るので、施行日だけで全部を判断しない。", "kako": "—\n（未確認）", "rows": [12]}, {"key": "k26", "num": null, "label": "平成7年6月9日法律第107号　附則", "caption": "", "status": null, "sheet": "改正法附則26～30", "scope": "kaisei", "text": "平成7年6月9日法律第107号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成7年10月1日から施行する。ただし、第2条並びに附則第3条、第5条、第7条、第11条、第13条、第14条、第16条、第18条、第20条及び第22条の規定は、平成11年4月1日から施行する。", "bg": "平成七年六月九日法律第一〇七号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、平成七年十月一日から施行する。ただし、第二条並びに附則第三条、第五条、第七条、第十一条、第十三条、第十四条、第十六条、第十八条、第二十条及び第二十二条の規定は、平成十一年四月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、平成七年十月一日から施行する。ただし、第二条並びに附則第三条、第五条、第七条、第十一条、第十三条、第十四条、第十六条、第十八条、第二十条及び第二十二条の規定は、平成十一年四月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "k27", "num": null, "label": "平成9年6月18日法律第92号　附則", "caption": "", "status": null, "sheet": "改正法附則26～30", "scope": "kaisei", "text": "平成9年6月18日法律第92号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成11年4月1日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　第1条（次号に掲げる改正規定を除く。）、第3条（次号に掲げる改正規定を除く。）、第5条、第6条、第7条（次号に掲げる改正規定を除く。）並びに附則第3条、第6条、第7条、第10条及び第14条（次号に掲げる改正規定を除く。）の規定公布の日から起算して6月を超えない範囲内において政令で定める日\n\n2　第1条中雇用の分野における男女の均等な機会及び待遇の確保等女子労働者の福祉の増進に関する法律第26条の前の見出しの改正規定、同条の改正規定（「事業主は」の下に「、労働省令で定めるところにより」を加える部分及び「できるような配慮をするように努めなければならない」を「できるようにしなければならない」に改める部分に限る。）、同法第27条の改正規定（「講ずるように努めなければならない」を「講じなければならない」に改める部分及び同条に2項を加える部分に限る。）、同法第34条の改正規定（「及び第12条第2項」を「、第12条第2項及び第27条第3項」に改める部分、「第12条第1項」の下に「、第27条第2項」を加える部分及び「第14条及び」を「第14条、第26条及び」に改める部分に限る。）及び同法第35条の改正規定、第3条中労働基準法第65条第1項の改正規定（「10週間」を「14週間」に改める部分に限る。）、第7条中労働省設置法第5条第41号の改正規定（「が講ずるように努めるべき措置についての」を「に対する」に改める部分に限る。）並びに附則第5条、第12条及び第13条の規定並びに附則第14条中運輸省設置法（昭和24年法律第157号）第4条第1項第24号の2の3の改正規定（「講ずるように努めるべき措置についての指針」を「講ずべき措置についての指針等」に改める部分に限る。）平成10年4月1日\n\n（罰則に関する経過措置）\n\n第2条\n\nこの法律の施行前にした行為に対する罰則の適用については、なお従前の例による。", "bg": "平成九年六月一八日法律第九二号\n\n女性一般の労働時間等の保護規制の見直しと、多胎妊娠の産前休業などを、複数の施行時点で導入する。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 本体は1999年4月だが、一部規定は1998年4月等。法律全体の施行日と個々の改正規定の施行日を分ける。旧行為の罰則は従前の例に接続する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：本体は1999年4月だが、一部規定は1998年4月等。法律全体の施行日と個々の改正規定の施行日を分ける。旧行為の罰則は従前の例に接続する。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "k28", "num": null, "label": "平成10年9月30日法律第112号　附則", "caption": "", "status": null, "sheet": "改正法附則26～30", "scope": "kaisei", "text": "平成10年9月30日法律第112号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成11年4月1日から施行する。ただし、第105条の2の次に1条を加える改正規定並びに附則第8条の規定及び附則第15条の規定（地方公務員法（昭和25年法律第261号）第58条第3項の改正規定中「及び第102条」を「、第102条及び第105条の3」に改める部分に限る。）は平成10年10月1日から、第38条の2の次に2条を加える改正規定（第38条の4に係る部分に限る。）、第56条第1項の改正規定、同条第2項の改正規定（「満12才」を「満13歳」に改める部分に限る。）、第60条第3項の改正規定（同項第2号の改正規定を除く。）及び第106条第1項の改正規定（第38条の4第1項及び第5項に規定する決議に係る部分に限る。）並びに附則第6条の規定、附則第11条第1項の規定及び附則第15条の規定（同法第58条第3項の改正規定中「第39条第5項」を「第38条の4、第39条第5項」に改める部分に限る。）は平成12年4月1日から施行する。\n\n（退職時の証明に関する経過措置）\n\n第2条\n\nこの法律による改正後の労働基準法（以下「新法」という。）第22条第1項の規定は、この法律の施行の日以後に退職した労働者について適用し、この法律の施行の日前に退職した労働者については、なお従前の例による。\n\n（労働時間に関する経過措置）\n\n第3条\n\nこの法律による改正前の労働基準法（以下「旧法」という。）第32条の4の規定は、同条第1項の協定（労働時間の短縮の促進に関する臨時措置法（平成4年法律第90号）第7条に規定する労働時間短縮推進委員会の同項に規定する事項についての決議を含む。）であって、この法律の施行の際同項第2号の対象期間として平成11年3月31日を含む期間を定めているものについては、なおその効力を有する。\n\n（休憩に関する経過措置）\n\n第4条\n\nこの法律の施行前にされた旧法第34条第2項ただし書の許可の申請であって、この法律の施行の際に許可又は不許可の処分がされていないものについての許可又は不許可の処分については、なお従前の例による。\n\n２　この法律の施行前に旧法第34条第2項ただし書の規定による許可を受けた場合（前項の規定により同項の許可を受けた場合を含む。）における休憩時間については、なお従前の例による。\n\n（年次有給休暇に関する経過措置）\n\n第5条\n\nこの法律の施行の際4月1日以外の日が基準日（継続勤務した期間を新法第39条第2項に規定する6箇月経過日から1年ごとに区分した各期間（最後に1年未満の期間を生じたときは、当該期間）の初日をいう。以下この条において同じ。）である労働者に係る有給休暇については、この法律の施行の日後の最初の基準日の前日までの間は、同項及び新法第39条第3項の規定にかかわらず、なお従前の例による。\n\n２　新法第135条第1項に規定する労働者であって平成12年4月1日において継続勤務するもののうち、同日において4月1日以外の日が基準日である労働者に係る有給休暇については、同年4月1日から同日後の最初の基準日の前日までの間は、同月1日前において同項の規定により読み替えて適用する新法第39条第2項及び第3項の規定の例による。\n\n３　前項の規定は、新法第135条第2項に規定する労働者であって平成13年4月1日において継続勤務するものについて準用する。\n\n（最低年齢に関する経過措置）\n\n第6条\n\n第56条第2項の改正規定（「満12才」を「満13歳」に改める部分に限る。以下この条において同じ。）の施行前にされた満12歳の児童を使用する許可の申請（映画の製作又は演劇の事業に係る職業に係る申請を除く。）であって、第56条第2項の改正規定の施行の際に許可又は不許可の処分がされていないものについての許可又は不許可の処分については、なお従前の例による。\n\n２　第56条第2項の改正規定の施行前に旧法第56条第2項の規定による許可を受けた場合（前項の規定により同項の許可を受けた場合を含む。）における児童の使用については、なお従前の例による。\n\n３　新法第56条第2項に規定する職業のうち、満12歳の児童の就労実態、当該児童の就労に係る事業の社会的必要性及び当該事業の代替要員の確保の困難性を考慮して厚生労働省令で定める職業については、厚生労働省令で定める日までに行政官庁の許可を受けたときは、満12歳の児童をその者が満13歳に達するまでの間、その者の修学時間外に使用することができる。この場合において、第57条第2項、第60条第2項及び第61条第5項の規定の適用については、第57条第2項中「児童」とあるのは、「児童（労働基準法の一部を改正する法律（平成10年法律第112号）附則第6条第3項の規定により使用する児童を含む。第60条第2項及び第61条第5項において同じ。）」とする。\n\n（年少者の労働時間に関する経過措置）\n\n第7条\n\nこの法律の施行の際旧法第60条第3項に規定する者を労働させることとしている使用者については、同項第2号の規定に基づき旧法第32条の4第1項第2号の規定の例による対象期間として定められている期間（平成11年3月31日を含む期間に限る。）が終了するまでの間、新法第60条第3項第2号中「第32条の4及び第32条の4の2の規定」とあるのは、「労働基準法の一部を改正する法律（平成10年法律第112号）による改正前の第32条の4の規定」として、同項の規定を適用する。\n\n（紛争の解決の援助に関する経過措置）\n\n第8条\n\n平成11年3月31日までの間は、新法第105条の3第1項中「雇用の分野における男女の均等な機会及び待遇の確保等に関する法律（昭和47年法律第113号）第12条第1項」とあるのは、「雇用の分野における男女の均等な機会及び待遇の確保等女性労働者の福祉の増進に関する法律（昭和47年法律第113号）第14条」とする。\n\n（罰則に関する経過措置）\n\n第9条\n\nこの法律（附則第1条ただし書に規定する規定については、当該規定）の施行前にした行為並びに附則第2条及び第5条第1項の規定によりなお従前の例によることとされる事項並びに附則第3条の規定によりなお効力を有することとされる旧法第32条の4の規定に係る事項に係るこの法律の施行後にした行為に対する罰則の適用については、なお従前の例による。\n\n（政令への委任）\n\n第10条\n\n附則第2条から前条までに定めるもののほか、この法律の施行に伴い必要な経過措置（罰則に関する経過措置を含む。）は、政令で定める。\n\n（検討）\n\n第11条\n\n政府は、第38条の2の次に2条を加える改正規定（第38条の4に係る部分に限る。）の施行後3年を経過した場合において、新法第38条の4の規定について、その施行の状況を勘案しつつ検討を加え、必要があると認めるときは、その結果に基づいて必要な措置を講ずるものとする。\n\n２　政府は、新法第133条の厚生労働省令で定める期間が終了するまでの間において、子の養育又は家族の介護を行う労働者の時間外労働の動向、育児休業、介護休業等育児又は家族介護を行う労働者の福祉に関する法律（平成3年法律第76号）の施行の状況等を勘案し、当該労働者の福祉の増進の観点から、時間外労働が長時間にわたる場合には当該労働者が時間外労働の免除を請求することができる制度に関し検討を加え、その結果に基づいて必要な措置を講ずるものとする。\n\n（深夜業に関する自主的な努力の促進）\n\n第12条\n\n国は、深夜業に従事する労働者の就業環境の改善、健康管理の推進等当該労働者の就業に関する条件の整備のための事業主、労働者その他の関係者の自主的な努力を促進するものとする。", "bg": "平成一〇年九月三〇日法律第一一二号\n\n1998年の有期契約・労働時間・年休等の改正を、既存の契約、協定、基準日に接続する経過措置。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 労働条件明示の新規定は施行後に締結される契約から、年休は基準日や当時の加算表から判断する。条文ごとに「契約日」「協定期間」「基準日」のどれを区切るか読む。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：労働条件明示の新規定は施行後に締結される契約から、年休は基準日や当時の加算表から判断する。条文ごとに「契約日」「協定期間」「基準日」のどれを区切るか読む。", "kako": "—\n（未確認）", "rows": [8]}, {"key": "k29", "num": null, "label": "平成11年7月16日法律第87号　附則", "caption": "", "status": null, "sheet": "改正法附則26～30", "scope": "kaisei", "text": "平成11年7月16日法律第87号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成12年4月1日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　第1条中地方自治法第250条の次に5条、節名並びに2款及び款名を加える改正規定（同法第250条の9第1項に係る部分（両議院の同意を得ることに係る部分に限る。）に限る。）、第40条中自然公園法附則第9項及び第10項の改正規定（同法附則第10項に係る部分に限る。）、第244条の規定（農業改良助長法第14条の3の改正規定に係る部分を除く。）並びに第472条の規定（市町村の合併の特例に関する法律第6条、第8条及び第17条の改正規定に係る部分を除く。）並びに附則第7条、第10条、第12条、第59条ただし書、第60条第4項及び第5項、第73条、第77条、第157条第4項から第6項まで、第160条、第163条、第164条並びに第202条の規定公布の日\n\n（国等の事務）\n\n第159条\n\nこの法律による改正前のそれぞれの法律に規定するもののほか、この法律の施行前において、地方公共団体の機関が法律又はこれに基づく政令により管理し又は執行する国、他の地方公共団体その他公共団体の事務（附則第161条において「国等の事務」という。）は、この法律の施行後は、地方公共団体が法律又はこれに基づく政令により当該地方公共団体の事務として処理するものとする。\n\n（処分、申請等に関する経過措置）\n\n第160条\n\nこの法律（附則第1条各号に掲げる規定については、当該各規定。以下この条及び附則第163条において同じ。）の施行前に改正前のそれぞれの法律の規定によりされた許可等の処分その他の行為（以下この条において「処分等の行為」という。）又はこの法律の施行の際現に改正前のそれぞれの法律の規定によりされている許可等の申請その他の行為（以下この条において「申請等の行為」という。）で、この法律の施行の日においてこれらの行為に係る行政事務を行うべき者が異なることとなるものは、附則第2条から前条までの規定又は改正後のそれぞれの法律（これに基づく命令を含む。）の経過措置に関する規定に定めるものを除き、この法律の施行の日以後における改正後のそれぞれの法律の適用については、改正後のそれぞれの法律の相当規定によりされた処分等の行為又は申請等の行為とみなす。\n\n２　この法律の施行前に改正前のそれぞれの法律の規定により国又は地方公共団体の機関に対し報告、届出、提出その他の手続をしなければならない事項で、この法律の施行の日前にその手続がされていないものについては、この法律及びこれに基づく政令に別段の定めがあるもののほか、これを、改正後のそれぞれの法律の相当規定により国又は地方公共団体の相当の機関に対して報告、届出、提出その他の手続をしなければならない事項についてその手続がされていないものとみなして、この法律による改正後のそれぞれの法律の規定を適用する。\n\n（不服申立てに関する経過措置）\n\n第161条\n\n施行日前にされた国等の事務に係る処分であって、当該処分をした行政庁（以下この条において「処分庁」という。）に施行日前に行政不服審査法に規定する上級行政庁（以下この条において「上級行政庁」という。）があったものについての同法による不服申立てについては、施行日以後においても、当該処分庁に引き続き上級行政庁があるものとみなして、行政不服審査法の規定を適用する。この場合において、当該処分庁の上級行政庁とみなされる行政庁は、施行日前に当該処分庁の上級行政庁であった行政庁とする。\n\n２　前項の場合において、上級行政庁とみなされる行政庁が地方公共団体の機関であるときは、当該機関が行政不服審査法の規定により処理することとされる事務は、新地方自治法第2条第9項第1号に規定する第1号法定受託事務とする。\n\n（罰則に関する経過措置）\n\n第163条\n\nこの法律の施行前にした行為に対する罰則の適用については、なお従前の例による。\n\n（その他の経過措置の政令への委任）\n\n第164条\n\nこの附則に規定するもののほか、この法律の施行に伴い必要な経過措置（罰則に関する経過措置を含む。）は、政令で定める。\n\n（検討）\n\n第250条\n\n新地方自治法第2条第9項第1号に規定する第1号法定受託事務については、できる限り新たに設けることのないようにするとともに、新地方自治法別表第1に掲げるもの及び新地方自治法に基づく政令に示すものについては、地方分権を推進する観点から検討を加え、適宜、適切な見直しを行うものとする。\n\n第251条\n\n政府は、地方公共団体が事務及び事業を自主的かつ自立的に執行できるよう、国と地方公共団体との役割分担に応じた地方税財源の充実確保の方途について、経済情勢の推移等を勘案しつつ検討し、その結果に基づいて必要な措置を講ずるものとする。", "bg": "平成一一年七月一六日法律第八七号\n\n地方分権に伴う行政の権限・手続・不服申立てを、既存の処分や申請とつなぐ規定。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 既存の処分・申請を、新制度の相当する手続等とみなす。新制度に移るたびに利用者が申請し直す構造ではない。過去の罰則や審査請求の扱いは別条で残す。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：既存の処分・申請を、新制度の相当する手続等とみなす。新制度に移るたびに利用者が申請し直す構造ではない。過去の罰則や審査請求の扱いは別条で残す。", "kako": "—\n（未確認）", "rows": [15]}, {"key": "k30", "num": null, "label": "平成11年7月16日法律第102号　附則", "caption": "", "status": null, "sheet": "改正法附則26～30", "scope": "kaisei", "text": "平成11年7月16日法律第102号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、内閣法の一部を改正する法律（平成11年法律第88号）の施行の日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　略\n\n2　附則第10条第1項及び第5項、第14条第3項、第23条、第28条並びに第30条の規定公布の日\n\n（別に定める経過措置）\n\n第30条\n\n第2条から前条までに規定するもののほか、この法律の施行に伴い必要となる経過措置は、別に法律で定める。", "bg": "平成一一年七月一六日法律第一〇二号\n\n法文上の役割：施行期日、別に定める経過措置。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律は、内閣法の一部を改正する法律（平成十一年法律第八十八号）の施行の日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。」と定める。ほかに掲載される条項は、別に定める経過措置を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、内閣法の一部を改正する法律（平成十一年法律第八十八号）の施行の日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。」と定める。ほかに掲載される条項は、別に定める経過措置を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [20]}, {"key": "k31", "num": null, "label": "平成11年7月16日法律第104号　附則", "caption": "", "status": null, "sheet": "改正法附則31～35", "scope": "kaisei", "text": "平成11年7月16日法律第104号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、内閣法の一部を改正する法律（平成11年法律第88号）の施行の日から施行する。", "bg": "平成一一年七月一六日法律第一〇四号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、内閣法の一部を改正する法律（平成十一年法律第八十八号）の施行の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、内閣法の一部を改正する法律（平成十一年法律第八十八号）の施行の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "k32", "num": null, "label": "平成11年12月8日法律第151号　附則", "caption": "", "status": null, "sheet": "改正法附則31～35", "scope": "kaisei", "text": "平成11年12月8日法律第151号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成12年4月1日から施行する。\n\n（経過措置）\n\n第3条\n\n民法の一部を改正する法律（平成11年法律第149号）附則第3条第3項の規定により従前の例によることとされる準禁治産者及びその保佐人に関するこの法律による改正規定の適用については、次に掲げる改正規定を除き、なお従前の例による。\n\n1から25まで　略\n\n第4条\n\nこの法律の施行前にした行為に対する罰則の適用については、なお従前の例による。", "bg": "平成一一年一二月八日法律第一五一号\n\n法文上の役割：施行期日、経過措置。本文の切替えに加え、旧制度の取扱いを残す経過措置を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律は、平成十二年四月一日から施行する。」と定める。ほかに掲載される条項は、経過措置を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、平成十二年四月一日から施行する。」と定める。ほかに掲載される条項は、経過措置を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "k33", "num": null, "label": "平成11年12月22日法律第160号　附則", "caption": "", "status": null, "sheet": "改正法附則31～35", "scope": "kaisei", "text": "平成11年12月22日法律第160号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律（第2条及び第3条を除く。）は、平成13年1月6日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　第995条（核原料物質、核燃料物質及び原子炉の規制に関する法律の一部を改正する法律附則の改正規定に係る部分に限る。）、第1305条、第1306条、第1324条第2項、第1326条第2項及び第1344条の規定公布の日", "bg": "平成一一年一二月二二日法律第一六〇号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律（第二条及び第三条を除く。）は、平成十三年一月六日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律（第二条及び第三条を除く。）は、平成十三年一月六日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [8]}, {"key": "k34", "num": null, "label": "平成12年5月19日法律第71号　附則", "caption": "", "status": null, "sheet": "改正法附則31～35", "scope": "kaisei", "text": "平成12年5月19日法律第71号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、公布の日から施行する。", "bg": "平成一二年五月一九日法律第七一号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、公布の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、公布の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [9]}, {"key": "k35", "num": null, "label": "平成13年4月25日法律第35号　附則", "caption": "", "status": null, "sheet": "改正法附則31～35", "scope": "kaisei", "text": "平成13年4月25日法律第35号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成13年10月1日から施行する。ただし、第1条及び第6条の規定並びに次条（第2項後段を除く。）及び附則第6条の規定、附則第11条の規定（社会保険労務士法（昭和43年法律第89号）別表第1第20号の13の改正規定を除く。）並びに附則第12条の規定は、同年6月30日から施行する。\n\n（政令への委任）\n\n第5条\n\nこの附則に定めるもののほか、この法律の施行に関して必要な経過措置は、政令で定める。\n\n（罰則に関する経過措置）\n\n第6条\n\nこの法律（附則第1条ただし書に規定する規定については、当該規定。以下同じ。）の施行前にした行為並びに附則第2条第3項及び第4条第1項の規定によりなお従前の例によることとされる場合におけるこの法律の施行後にした行為に対する罰則の適用については、なお従前の例による。", "bg": "平成一三年四月二五日法律第三五号\n\n2001年の改正について、施行前の行為の罰則と、必要な追加の経過措置を扱う。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 過去の行為の罰則は従前の例により、法律に列挙し切れない経過措置は政令へ委ねる。委任は、政令の内容そのものをA欄が既に示しているという意味ではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：過去の行為の罰則は従前の例により、法律に列挙し切れない経過措置は政令へ委ねる。委任は、政令の内容そのものをA欄が既に示しているという意味ではない。", "kako": "—\n（未確認）", "rows": [10]}, {"key": "k36", "num": null, "label": "平成13年11月16日法律第118号　附則", "caption": "", "status": null, "sheet": "改正法附則36～40", "scope": "kaisei", "text": "平成13年11月16日法律第118号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、公布の日から施行する。", "bg": "平成一三年一一月一六日法律第一一八号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、公布の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、公布の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "k37", "num": null, "label": "平成14年7月31日法律第98号　附則", "caption": "", "status": null, "sheet": "改正法附則36～40", "scope": "kaisei", "text": "平成14年7月31日法律第98号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、公社法の施行の日から施行する。\n\n（罰則に関する経過措置）\n\n第38条\n\n施行日前にした行為並びにこの法律の規定によりなお従前の例によることとされる場合及びこの附則の規定によりなおその効力を有することとされる場合における施行日以後にした行為に対する罰則の適用については、なお従前の例による。", "bg": "平成一四年七月三一日法律第九八号\n\n法文上の役割：施行期日、罰則に関する経過措置。本文の切替えに加え、旧制度の取扱いを残す経過措置を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律は、公社法の施行の日から施行する。」と定める。ほかに掲載される条項は、罰則に関する経過措置を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、公社法の施行の日から施行する。」と定める。ほかに掲載される条項は、罰則に関する経過措置を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "k38", "num": null, "label": "平成14年7月31日法律第100号　附則", "caption": "", "status": null, "sheet": "改正法附則36～40", "scope": "kaisei", "text": "平成14年7月31日法律第100号　附則\n【e-Gov掲載範囲】\n\n（施行期日）\n\n第1条\n\nこの法律は、民間事業者による信書の送達に関する法律（平成14年法律第99号）の施行の日から施行する。\n\n（罰則に関する経過措置）\n\n第2条\n\nこの法律の施行前にした行為に対する罰則の適用については、なお従前の例による。\n\n（その他の経過措置の政令への委任）\n\n第3条\n\n前条に定めるもののほか、この法律の施行に関し必要な経過措置は、政令で定める。", "bg": "平成一四年七月三一日法律第一〇〇号\n\n施行日、旧行為の罰則、施行5年後の検討という三つの役割をまとめた附則。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 5年後の検討は、改正後の規定を5年間だけ有効とする意味ではない。検討結果に基づく必要な措置と、期限による失効は区別する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：5年後の検討は、改正後の規定を5年間だけ有効とする意味ではない。検討結果に基づく必要な措置と、期限による失効は区別する。", "kako": "—\n（未確認）", "rows": [7]}, {"key": "k39", "num": null, "label": "平成14年8月2日法律第102号　附則", "caption": "", "status": null, "sheet": "改正法附則36～40", "scope": "kaisei", "text": "平成14年8月2日法律第102号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成14年10月1日から施行する。", "bg": "平成一四年八月二日法律第一〇二号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、平成十四年十月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、平成十四年十月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [9]}, {"key": "k40", "num": null, "label": "平成15年7月4日法律第104号　附則", "caption": "", "status": null, "sheet": "改正法附則36～40", "scope": "kaisei", "text": "平成15年7月4日法律第104号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、公布の日から起算して6月を超えない範囲内において政令で定める日から施行する。\n\n（罰則に関する経過措置）\n\n第2条\n\nこの法律の施行前にした行為に対する罰則の適用については、なお従前の例による。\n\n（検討）\n\n第3条\n\n政府は、この法律の施行後3年を経過した場合において、この法律による改正後の労働基準法第14条の規定について、その施行の状況を勘案しつつ検討を加え、その結果に基づいて必要な措置を講ずるものとする。", "bg": "平成一五年七月四日法律第一〇四号\n\n2003年の有期契約上限等の見直し。施行後3年の検討規定は、本法第137条の退職特例とつながる。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 3年後に検討することと、3年経過で第137条が自動失効することは別。第137条は、この附則第3条の措置が講じられるまで続く。\n本法第137条の議論欄に、確認した国会質疑を掲載。", "tsu": "平成15年10月22日 基発第1022001号 第1・3\n① 1年を超える契約で、一定事業の完了に必要な期間を定めるもの、高度専門職等・60歳以上の第14条第1項各号の対象を除く。\n② 契約初日から1年経過後は、民法第628条の事由がなくても使用者への申出で退職できる。\n③ 改正法の3年後の検討時点で自動失効するのではなく、必要な措置が講じられるまで有効。無期転換の5年とは別制度。", "kako": "—\n（未確認）", "rows": [10]}, {"key": "k41", "num": null, "label": "平成16年6月2日法律第76号　附則", "caption": "", "status": null, "sheet": "改正法附則41～45", "scope": "kaisei", "text": "平成16年6月2日法律第76号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、破産法（平成16年法律第75号。次条第8項並びに附則第3条第8項、第5条第8項、第16項及び第21項、第8条第3項並びに第13条において「新破産法」という。）の施行の日から施行する。\n\n（政令への委任）\n\n第14条\n\n附則第2条から前条までに規定するもののほか、この法律の施行に関し必要な経過措置は、政令で定める。", "bg": "平成一六年六月二日法律第七六号\n\n法文上の役割：施行期日、政令への委任。本文の切替えに加え、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律は、破産法（平成十六年法律第七十五号。次条第八項並びに附則第三条第八項、第五条第八項、第十六項及び第二十一項、第八条第三項並びに第十三条において「新破産法」という。）の施行の日から施行する。」と定める。ほかに掲載される条項は、政令への委任を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、破産法（平成十六年法律第七十五号。次条第八項並びに附則第三条第八項、第五条第八項、第十六項及び第二十一項、第八条第三項並びに第十三条において「新破産法」という。）の施行の日から施行する。」と定める。ほかに掲載される条項は、政令への委任を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "k42", "num": null, "label": "平成16年12月1日法律第147号　附則", "caption": "", "status": null, "sheet": "改正法附則41～45", "scope": "kaisei", "text": "平成16年12月1日法律第147号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、公布の日から起算して6月を超えない範囲内において政令で定める日から施行する。", "bg": "平成一六年一二月一日法律第一四七号\n\n法文上の役割：施行期日。本文の切替えに加え、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、公布の日から起算して六月を超えない範囲内において政令で定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、公布の日から起算して六月を超えない範囲内において政令で定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "k43", "num": null, "label": "平成17年10月21日法律第102号　附則", "caption": "", "status": null, "sheet": "改正法附則41～45", "scope": "kaisei", "text": "平成17年10月21日法律第102号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、郵政民営化法の施行の日から施行する。\n\n（罰則に関する経過措置）\n\n第117条\n\nこの法律の施行前にした行為、この附則の規定によりなお従前の例によることとされる場合におけるこの法律の施行後にした行為、この法律の施行後附則第9条第1項の規定によりなおその効力を有するものとされる旧郵便為替法第38条の8（第2号及び第3号に係る部分に限る。）の規定の失効前にした行為、この法律の施行後附則第13条第1項の規定によりなおその効力を有するものとされる旧郵便振替法第70条（第2号及び第3号に係る部分に限る。）の規定の失効前にした行為、この法律の施行後附則第27条第1項の規定によりなおその効力を有するものとされる旧郵便振替預り金寄附委託法第8条（第2号に係る部分に限る。）の規定の失効前にした行為、この法律の施行後附則第39条第2項の規定によりなおその効力を有するものとされる旧公社法第70条（第2号に係る部分に限る。）の規定の失効前にした行為、この法律の施行後附則第42条第1項の規定によりなおその効力を有するものとされる旧公社法第71条及び第72条（第15号に係る部分に限る。）の規定の失効前にした行為並びに附則第2条第2項の規定の適用がある場合における郵政民営化法第104条に規定する郵便貯金銀行に係る特定日前にした行為に対する罰則の適用については、なお従前の例による。", "bg": "平成一七年一〇月二一日法律第一〇二号\n\n法文上の役割：施行期日、罰則に関する経過措置。本文の切替えに加え、旧制度の取扱いを残す経過措置を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律は、郵政民営化法の施行の日から施行する。」と定める。ほかに掲載される条項は、罰則に関する経過措置を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、郵政民営化法の施行の日から施行する。」と定める。ほかに掲載される条項は、罰則に関する経過措置を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [7]}, {"key": "k44", "num": null, "label": "平成17年11月2日法律第108号　附則", "caption": "", "status": null, "sheet": "改正法附則41～45", "scope": "kaisei", "text": "平成17年11月2日法律第108号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成18年4月1日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　略\n\n2　第4条中労働時間の短縮の促進に関する臨時措置法附則第2条を削り、同法附則第1条の見出し及び条名を削る改正規定並びに附則第12条の規定公布の日", "bg": "平成一七年一一月二日法律第一〇八号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、平成十八年四月一日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、平成十八年四月一日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [9]}, {"key": "k45", "num": null, "label": "平成18年6月21日法律第82号　附則", "caption": "", "status": null, "sheet": "改正法附則41～45", "scope": "kaisei", "text": "平成18年6月21日法律第82号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成19年4月1日から施行する。\n\n（罰則に関する経過措置）\n\n第4条\n\nこの法律の施行前にした行為に対する罰則の適用については、なお従前の例による。\n\n（検討）\n\n第5条\n\n政府は、この法律の施行後5年を経過した場合において、新法及び第2条の規定による改正後の労働基準法第64条の2の規定の施行の状況を勘案し、必要があると認めるときは、これらの規定について検討を加え、その結果に基づいて必要な措置を講ずるものとする。", "bg": "平成一八年六月二一日法律第八二号\n\n法文上の役割：施行期日、罰則に関する経過措置、検討。本文の切替えに加え、旧制度の取扱いを残す経過措置、施行後の検討を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律は、平成十九年四月一日から施行する。」と定める。ほかに掲載される条項は、罰則に関する経過措置、検討を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、平成十九年四月一日から施行する。」と定める。ほかに掲載される条項は、罰則に関する経過措置、検討を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [10]}, {"key": "k46", "num": null, "label": "平成19年12月5日法律第128号　附則", "caption": "", "status": null, "sheet": "改正法附則46～50", "scope": "kaisei", "text": "平成19年12月5日法律第128号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、公布の日から起算して3月を超えない範囲内において政令で定める日から施行する。", "bg": "平成一九年一二月五日法律第一二八号\n\n法文上の役割：施行期日。本文の切替えに加え、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、公布の日から起算して三月を超えない範囲内において政令で定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、公布の日から起算して三月を超えない範囲内において政令で定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "k47", "num": null, "label": "平成20年12月12日法律第89号　附則", "caption": "", "status": null, "sheet": "改正法附則46～50", "scope": "kaisei", "text": "平成20年12月12日法律第89号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成22年4月1日から施行する。\n\n（罰則に関する経過措置）\n\n第2条\n\nこの法律の施行前にした行為に対する罰則の適用については、なお従前の例による。\n\n（検討）\n\n第3条\n\n政府は、この法律の施行後3年を経過した場合において、この法律による改正後の労働基準法（以下この条において「新法」という。）第37条第1項ただし書及び第138条の規定の施行の状況、時間外労働の動向等を勘案し、これらの規定について検討を加え、その結果に基づいて必要な措置を講ずるものとする。\n\n２　政府は、前項に定めるものを除くほか、この法律の施行後5年を経過した場合において、新法の施行の状況を勘案し、必要があると認めるときは、新法の規定について検討を加え、その結果に基づいて必要な措置を講ずるものとする。", "bg": "平成二〇年一二月一二日法律第八九号\n\n月60時間超の割増率引上げ・時間単位年休等を2010年4月に施行し、3年後・5年後の検討を置いた。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 旧第138条を含む割増率の仕組みには3年後の検討を定めた。それだけで中小企業の猶予が3年後に消えるのではなく、後の2018年改正で2023年終了となった。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：旧第138条を含む割増率の仕組みには3年後の検討を定めた。それだけで中小企業の猶予が3年後に消えるのではなく、後の2018年改正で2023年終了となった。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "k48", "num": null, "label": "平成24年6月27日法律第42号　附則", "caption": "", "status": null, "sheet": "改正法附則46～50", "scope": "kaisei", "text": "平成24年6月27日法律第42号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成25年4月1日から施行する。", "bg": "平成二四年六月二七日法律第四二号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、平成二十五年四月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、平成二十五年四月一日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [8]}, {"key": "k49", "num": null, "label": "平成26年6月25日法律第82号　附則", "caption": "", "status": null, "sheet": "改正法附則46～50", "scope": "kaisei", "text": "平成26年6月25日法律第82号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、公布の日から起算して1年を超えない範囲内において政令で定める日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　附則第6条の規定公布の日\n\n2　略\n\n3　第66条第1項の改正規定、第66条の9の次に1条を加える改正規定、第104条の改正規定及び第106条第1項の改正規定（「第63条」の下に「、第66条の10第9項」を加える部分に限る。）並びに附則第2条から第24条までを削り、附則第25条を附則第2条とし、附則第26条を附則第3条とする改正規定及び附則に1条を加える改正規定公布の日から起算して1年6月を超えない範囲内において政令で定める日\n\n（政令への委任）\n\n第6条\n\n附則第2条から前条までに定めるもののほか、この法律の施行に関し必要な経過措置は、政令で定める。", "bg": "平成二六年六月二五日法律第八二号\n\n法文上の役割：施行期日、政令への委任。本文の切替えに加え、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律は、公布の日から起算して一年を超えない範囲内において政令で定める日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。」と定める。ほかに掲載される条項は、政令への委任を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、公布の日から起算して一年を超えない範囲内において政令で定める日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。」と定める。ほかに掲載される条項は、政令への委任を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [9]}, {"key": "k50", "num": null, "label": "平成27年5月29日法律第31号　附則", "caption": "", "status": null, "sheet": "改正法附則46～50", "scope": "kaisei", "text": "平成27年5月29日法律第31号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成30年4月1日から施行する。ただし、次の各号に掲げる規定は、それぞれ当該各号に定める日から施行する。\n\n1　第1条の規定、第5条中健康保険法第90条第2項及び第95条第6号の改正規定、同法第153条第1項の改正規定、同法附則第4条の4の改正規定、同法附則第5条の改正規定、同法附則第5条の2の改正規定、同法附則第5条の3の改正規定並びに同条の次に4条を加える改正規定、第7条中船員保険法第70条第4項の改正規定及び同法第85条第2項第3号の改正規定、第8条の規定並びに第12条中社会保険診療報酬支払基金法第15条第2項の改正規定並びに次条第1項並びに附則第6条から第9条まで、第15条、第18条、第26条、第59条、第62条及び第67条から第69条までの規定公布の日\n\n2　第2条、第5条（前号に掲げる改正規定を除く。）、第7条（前号に掲げる改正規定を除く。）、第9条、第12条（前号に掲げる改正規定を除く。）及び第14条の規定並びに附則第16条、第17条、第19条、第21条から第25条まで、第33条から第44条まで、第47条から第51条まで、第56条、第58条及び第64条の規定平成28年4月1日\n\n（罰則に関する経過措置）\n\n第68条\n\nこの法律（附則第1条各号に掲げる規定については、当該各規定。以下この条において同じ。）の施行前にした行為及びこの附則の規定によりなお従前の例によることとされる場合におけるこの法律の施行後にした行為に対する罰則の適用については、なお従前の例による。\n\n（その他の経過措置の政令への委任）\n\n第69条\n\nこの附則に規定するもののほか、この法律の施行に伴い必要な経過措置（罰則に関する経過措置を含む。）は、政令で定める。", "bg": "平成二七年五月二九日法律第三一号\n\n法文上の役割：施行期日、罰則に関する経過措置、その他の経過措置の政令への委任。本文の切替えに加え、旧制度の取扱いを残す経過措置、政令への委任を置く。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 冒頭の規定は「この法律は、平成三十年四月一日から施行する。ただし、次の各号に掲げる規定は、それぞれ当該各号に定める日から施行する。」と定める。ほかに掲載される条項は、罰則に関する経過措置、その他の経過措置の政令への委任を扱う。各条の対象と時点を分けて確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、平成三十年四月一日から施行する。ただし、次の各号に掲げる規定は、それぞれ当該各号に定める日から施行する。」と定める。ほかに掲載される条項は、罰則に関する経過措置、その他の経過措置の政令への委任を扱う。各条の対象と時点を分けて確認する。", "kako": "—\n（未確認）", "rows": [11]}, {"key": "k51", "num": null, "label": "平成29年6月2日法律第45号　附則", "caption": "", "status": null, "sheet": "改正法附則51～55", "scope": "kaisei", "text": "平成29年6月2日法律第45号　附則\n【e-Gov掲載範囲】\n\nこの法律は、民法改正法の施行の日から施行する。ただし、第103条の2、第103条の3、第267条の2、第267条の3及び第362条の規定は、公布の日から施行する。", "bg": "平成二九年六月二日法律第四五号\n\n法文上の役割：施行時点の指定。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、民法改正法の施行の日から施行する。ただし、第百三条の二、第百三条の三、第二百六十七条の二、第二百六十七条の三及び第三百六十二条の規定は、公布の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、民法改正法の施行の日から施行する。ただし、第百三条の二、第百三条の三、第二百六十七条の二、第二百六十七条の三及び第三百六十二条の規定は、公布の日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "k52", "num": null, "label": "平成30年7月6日法律第71号　附則", "caption": "", "status": null, "sheet": "改正法附則51～55", "scope": "kaisei", "text": "平成30年7月6日法律第71号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、平成31年4月1日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　第3条の規定並びに附則第7条第2項、第8条第2項、第14条及び第15条の規定、附則第18条中社会保険労務士法（昭和43年法律第89号）別表第1第18号の改正規定、附則第19条中高年齢者等の雇用の安定等に関する法律（昭和46年法律第68号）第28条及び第38条第3項の改正規定、附則第20条中建設労働者の雇用の改善等に関する法律（昭和51年法律第33号）第30条第2項の改正規定、附則第27条の規定、附則第28条中厚生労働省設置法（平成11年法律第97号）第4条第1項第52号の改正規定及び同法第9条第1項第4号の改正規定（「（平成10年法律第46号）」の下に「、労働施策の総合的な推進並びに労働者の雇用の安定及び職業生活の充実等に関する法律」を加える部分に限る。）並びに附則第30条の規定公布の日\n\n2　略\n\n3　第1条中労働基準法第138条の改正規定令和5年4月1日\n\n（時間外及び休日の労働に係る協定に関する経過措置）\n\n第2条\n\n第1条の規定による改正後の労働基準法（以下「新労基法」という。
