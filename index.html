<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="立法史ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>労働基準法 条文立法史ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: sidebar (scope, search, chapters → articles) + reading area.
   Wide screens: statute text pinned on the left (past-exam years on top), the story of the article
   (背景→議論→通達→出典) on the right. Narrow screens: stacked.
   Colour carries meaning only: chapter = its own hue, column = its own hue, time-point tag = era,
   past exam = rose, study status = green / orange. */
:root{
  --bg:#f6f7f5; --paper:#ffffff; --ink:#1d2321; --sub:#5e6763; --faint:#8a928e; --rule:#d9dedb; --panel:#f1f3f2;
  --c-bg:#94601a;  --c-bg-s:#fbf2e2;     /* 背景：社会事情・時代 */
  --c-deb:#2c5d97; --c-deb-s:#ebf1f9;    /* 議論：問い */
  --c-ans:#2d7556; --c-ans-s:#eaf4ee;    /* 答弁・説明 */
  --c-tsu:#67488f; --c-tsu-s:#f2edf8;    /* 通達：解釈・要件 */
  --c-src:#5f6a66; --c-src-s:#f0f2f1;    /* 出典 */
  --c-exam:#ad3646; --c-exam-s:#fbe8ea;  /* 過去問 */
  --c-done:#2d7556; --c-rev:#c25e17;
  --t-old:#94601a; --t-amend:#4b54a8; --t-now:#2d7556; --t-gone:#7b7f7d;
  --mk-num:#f3e6b5; --mk-sub:#2c5d97; --mk-exc:#c25e17;
  --hl0:#ffe94d; --hl1:#9ee89a; --hl2:#a9d4ff;
  --chS:42%; --chT:31%; --chB:93%; --chM:48%;
  --f-law:"BIZ UDMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --fs:17px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131817; --paper:#1a201f; --ink:#e3e8e6; --sub:#a1aba7; --faint:#7c8682; --rule:#2e3734; --panel:#1f2725;
  --c-bg:#e2b36d; --c-bg-s:#2d2618; --c-deb:#8db6e8; --c-deb-s:#1b2533; --c-ans:#86c9a8; --c-ans-s:#1a2b23;
  --c-tsu:#c3a9e6; --c-tsu-s:#272035; --c-src:#a6b0ac; --c-src-s:#212826; --c-exam:#ef8f9b; --c-exam-s:#36202a;
  --c-done:#86c9a8; --c-rev:#f0a467; --t-old:#e2b36d; --t-amend:#a9b0f0; --t-now:#86c9a8; --t-gone:#9aa09d;
  --mk-num:#4c4425; --mk-sub:#8db6e8; --mk-exc:#f0a467; --hl0:#8a7a12; --hl1:#2f6b37; --hl2:#2b5a86; --chS:35%; --chT:76%; --chB:19%; --chM:60%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131817; --paper:#1a201f; --ink:#e3e8e6; --sub:#a1aba7; --faint:#7c8682; --rule:#2e3734; --panel:#1f2725;
  --c-bg:#e2b36d; --c-bg-s:#2d2618; --c-deb:#8db6e8; --c-deb-s:#1b2533; --c-ans:#86c9a8; --c-ans-s:#1a2b23;
  --c-tsu:#c3a9e6; --c-tsu-s:#272035; --c-src:#a6b0ac; --c-src-s:#212826; --c-exam:#ef8f9b; --c-exam-s:#36202a;
  --c-done:#86c9a8; --c-rev:#f0a467; --t-old:#e2b36d; --t-amend:#a9b0f0; --t-now:#86c9a8; --t-gone:#9aa09d;
  --mk-num:#4c4425; --mk-sub:#8db6e8; --mk-exc:#f0a467; --hl0:#8a7a12; --hl1:#2f6b37; --hl2:#2b5a86; --chS:35%; --chT:76%; --chB:19%; --chM:60%; color-scheme:dark}
:root.big{--fs:19px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:var(--fs);line-height:1.8}
a{color:var(--c-deb)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c-deb);outline-offset:2px}
/* chapter hue helpers: element sets --h */
.chc{color:hsl(var(--h) var(--chS) var(--chT))}
.chbg{background:hsl(var(--h) calc(var(--chS) + 8%) var(--chB))}
.chdot{display:inline-block;width:.62em;height:.62em;border-radius:2px;background:hsl(var(--h) var(--chS) var(--chM));flex:none}

.app{display:grid;grid-template-columns:330px minmax(0,1fr);height:100vh}
/* sidebar */
.side{border-right:1px solid var(--rule);background:var(--paper);display:flex;flex-direction:column;min-height:0}
.brandrow{display:flex;align-items:stretch;border-bottom:1px solid var(--rule)}
.brand{padding:14px 8px 10px 16px;cursor:pointer;flex:1;min-width:0}
.sideclose{flex:none;width:48px;border:0;border-left:1px solid var(--rule);background:none;color:var(--sub);font-size:1em;cursor:pointer}
.sideclose:hover{background:var(--panel);color:var(--ink)}
.filters .fnow{color:var(--c-done);font-weight:700}
.scrim{display:none}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}
.app.collapsed .side{visibility:hidden;overflow:hidden;border:0}
.app.collapsed .menu-btn{display:inline-block}
.brand b{display:block;font-family:var(--f-law);font-size:1.05em;line-height:1.4}
.brand span{font-size:.72em;color:var(--sub)}
.scopes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 12px 0}
.scopes button{border:1px solid var(--rule);background:var(--bg);border-radius:6px;padding:5px 2px;font-size:.74em;cursor:pointer;white-space:nowrap}
.scopes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sform{padding:10px 12px;display:flex;gap:6px}
.sform input{flex:1;min-width:0;border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--bg);font-size:.88em}
.filters{display:flex;gap:10px;padding:0 12px 8px;font-size:.74em;color:var(--sub);flex-wrap:wrap}
.filters label{display:flex;gap:4px;align-items:center;cursor:pointer}
.list{overflow-y:auto;flex:1;padding:0 6px 20px;min-height:0}
.grp{font-size:.72em;color:var(--sub);padding:12px 10px 4px;line-height:1.5}
.chh{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:6px;padding:7px 10px;margin-top:8px;cursor:pointer;text-align:left;font-size:.8em;line-height:1.4}
.chh b{flex:none}
.chh span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chh small{flex:none;font-size:.86em;opacity:.85;font-variant-numeric:tabular-nums}
.chh::after{content:"▾";flex:none;font-size:.8em;opacity:.7}
.chh[aria-expanded="false"]::after{content:"▸"}
.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:.86em;line-height:1.45}
.item:hover{background:var(--panel)}
.item[aria-current="true"]{background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule)}
.item small{display:block;color:var(--sub);font-size:.82em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tx{min-width:0}
.marksq{display:flex;gap:4px;align-items:center}
.pill{font-size:.7em;border-radius:3px;padding:0 5px;line-height:1.6;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ex{color:var(--c-exam);background:var(--c-exam-s)}
.pill.done{color:var(--paper);background:var(--c-done)}
.pill.rev{color:var(--paper);background:var(--c-rev)}
.pill.memo{color:var(--sub);border:1px solid var(--rule)}
.sidefoot{border-top:1px solid var(--rule);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:5px 10px;font-size:.8em;cursor:pointer;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--panel);border-color:var(--ink)}

/* main */
.main{overflow-y:auto;min-height:0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.top-in{display:flex;gap:8px;align-items:center;padding:8px 20px;flex-wrap:wrap}
.top-in .crumb{flex:1;min-width:0;font-size:.8em;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px;align-items:center}
.menu-btn{display:none}
.page{padding:18px 24px 80px;max-width:1520px}
.chband{display:inline-flex;gap:8px;align-items:center;border-radius:6px;padding:2px 10px;font-size:.8em;text-decoration:none;font-weight:700}
.head h1{font-family:var(--f-law);font-size:1.62em;line-height:1.35;margin:8px 0 0}
.titlerow{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:8px}
.titlerow h1{flex:1;min-width:0;margin:0}
.stepper{display:flex;gap:6px;flex:none}
.step{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.86em;line-height:1.3;text-align:left}
.step[data-dir="1"]{text-align:right}
.step small{display:block;font-size:.78em;color:var(--sub);white-space:nowrap}
.step .ar{font-size:1.5em;line-height:1;color:var(--sub)}
.step:hover:not(:disabled){border-color:var(--ink)}
.step:disabled{opacity:.4;cursor:default}
@media (max-width:900px){.stepper{width:100%}.step{flex:1;justify-content:space-between}}

.head .cap{font-family:var(--f-law);color:var(--sub);font-size:.95em;margin-left:.4em;font-weight:400}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.badge{font-size:.72em;border:1px solid var(--rule);border-radius:4px;padding:1px 8px;color:var(--sub);background:var(--paper)}
.rec{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 0}
.rec .btn[data-st="done"][aria-pressed="true"]{background:var(--c-done);color:var(--paper);border-color:var(--c-done)}
.rec .btn[data-st="review"][aria-pressed="true"]{background:var(--c-rev);color:var(--paper);border-color:var(--c-rev)}
.marks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78em;color:var(--sub);margin-left:auto}
.marks .btn[data-mark="n"][aria-pressed="true"]{background:var(--mk-num)}
.marks .btn[data-mark="s"][aria-pressed="true"]{border-color:var(--mk-sub);color:var(--mk-sub)}
.marks .btn[data-mark="x"][aria-pressed="true"]{border-color:var(--mk-exc);color:var(--mk-exc)}

.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:16px}
@media (min-width:1180px){
  .grid{grid-template-columns:minmax(0,47fr) minmax(0,53fr);align-items:start}
  .lawbox{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow-y:auto}
}
.lawbox{background:var(--paper);border:1px solid var(--rule);border-top:4px solid hsl(var(--h,150) var(--chS) var(--chM));border-radius:10px;padding:14px 22px 18px}
.exam{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:10px;margin-bottom:10px;border-bottom:1px dashed var(--rule)}
.exam .lb{font-size:.74em;font-weight:700;color:var(--c-exam);margin-right:2px;cursor:help}
.yr{display:inline-flex;align-items:baseline;gap:2px;font-size:.78em;border-radius:5px;padding:1px 8px;font-variant-numeric:tabular-nums;line-height:1.7;white-space:nowrap}
.yr.r{background:var(--c-exam);color:var(--paper)}
.yr.h{border:1px solid var(--c-exam);color:var(--c-exam);background:var(--c-exam-s)}
.yr.none{border:1px dashed var(--rule);color:var(--sub)}
.exam .dt{font-size:.74em;color:var(--sub)}
.exam .cnt{margin-left:auto;font-size:.72em;color:var(--sub)}
.sec-h{font-size:.76em;letter-spacing:.1em;color:var(--sub);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.law{font-family:var(--f-law);font-size:1.06em;line-height:2.05}
.law p{margin:0}
.law .cap-l{color:var(--sub)}
.law .gap{height:.6em}
.law .kou{padding-left:1.2em;text-indent:-1.2em}
.law .gou{padding-left:2.2em;text-indent:-1.2em}
.law .sub{padding-left:3.2em;text-indent:-1.2em}
.tag{display:inline-block;font-family:var(--f-ui);font-size:.72em;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 6px;line-height:1.7;text-indent:0;margin:2px 0;color:var(--t-old)}
.tag.amend{color:var(--t-amend)} .tag.now{color:var(--t-now)} .tag.gone{color:var(--t-gone);border-style:dashed}
.law a.ref{color:inherit;text-decoration:underline;text-decoration-color:var(--c-deb);text-underline-offset:3px}
.law a.ref:hover{color:var(--c-deb)}
.rd a.ref{color:inherit;text-decoration:underline dotted;text-decoration-color:var(--c-deb);text-underline-offset:3px}
.mk .n{background:var(--mk-num);border-radius:2px}
.mk .s{text-decoration:underline;text-decoration-color:var(--mk-sub);text-decoration-thickness:2px;text-underline-offset:4px}
.mk .x{text-decoration:underline dotted;text-decoration-color:var(--mk-exc);text-decoration-thickness:2px;text-underline-offset:4px}
.legend{font-size:.74em;color:var(--sub);margin-top:10px}
.hlbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px;font-size:.92em}
.hlbar .btn[data-hl="pen"][aria-pressed="true"]{background:var(--hl0);color:#222;border-color:#b59a00}
.hlbar .btn[data-hl="erase"][aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hlcols{display:none;gap:6px}
.hlbar.pen .hlcols{display:inline-flex}
.hlc{width:28px;height:28px;border-radius:50%;border:2px solid var(--rule);cursor:pointer;padding:0}
.hlc[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset}
.hlc.c0{background:var(--hl0)} .hlc.c1{background:var(--hl1)} .hlc.c2{background:var(--hl2)}
.hlbar .hint{font-size:.76em;color:var(--sub);flex-basis:100%}
.hlbar .hint:empty{display:none}
.hlbar [data-hlclear][hidden]{display:none}
.law.hlon{touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:crosshair;-webkit-touch-callout:none}
.law.hlon a.ref{pointer-events:none}
mark.hl{color:inherit;background:linear-gradient(transparent 38%, var(--hlc) 38%, var(--hlc) 92%, transparent 92%);border-radius:1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pill.hlp{background:var(--hl0);color:#222;border-color:transparent}
mark.hl.c0{--hlc:var(--hl0)} mark.hl.c1{--hlc:var(--hl1)} mark.hl.c2{--hlc:var(--hl2)}
@media print{.hlbar{display:none}}
/* reference preview: read the referred article without leaving the page */
.peek-scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.25)}
.peek{position:fixed;z-index:41;background:var(--paper);display:flex;flex-direction:column;box-shadow:0 0 34px rgba(0,0,0,.25);
  top:0;right:0;bottom:0;width:min(600px,92vw);border-left:4px solid hsl(var(--h,150) var(--chS) var(--chM))}
.peek[hidden],.peek-scrim[hidden],.backchip[hidden]{display:none}
.peek-h{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--rule)}
.peek-h .tt{flex:1;min-width:0}
.peek-h .kk{font-size:.72em;color:var(--sub)}
.peek-h h3{margin:2px 0 0;font-family:var(--f-law);font-size:1.15em;line-height:1.4}
.peek-h h3 small{font-weight:400;color:var(--sub);margin-left:.4em;font-size:.82em}
.peek-x{border:0;background:none;font-size:1.4em;line-height:1;color:var(--sub);cursor:pointer;padding:2px 6px}
.peek-tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--rule)}
.peek-tools .open{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.peek-b{overflow-y:auto;padding:12px 16px 24px;flex:1;-webkit-overflow-scrolling:touch}
.peek-b .law p.hit-kou{background:var(--c-deb-s);box-shadow:-6px 0 0 var(--c-deb-s),6px 0 0 var(--c-deb-s);border-radius:2px}
.peek-note{font-size:.76em;color:var(--sub);margin:0 0 8px;line-height:1.6}
@media (max-width:900px){
  .peek{top:auto;left:0;right:0;width:auto;max-height:78vh;border-left:0;border-top:4px solid hsl(var(--h,150) var(--chS) var(--chM));border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom)}
}
.backchip{position:fixed;z-index:35;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  border-radius:999px;padding:9px 16px 9px 12px;font-size:.86em;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;gap:8px}
.backchip .x{opacity:.7;margin-left:6px;padding:0 2px}
.legend span{margin-right:10px}

.read{display:flex;flex-direction:column;gap:18px}
.toc{display:flex;gap:6px;flex-wrap:wrap}
.toc a{font-size:.78em;border-radius:99px;padding:2px 12px;text-decoration:none;font-weight:700}
.toc .t-bg{color:var(--c-bg);background:var(--c-bg-s)} .toc .t-deb{color:var(--c-deb);background:var(--c-deb-s)}
.toc .t-tsu{color:var(--c-tsu);background:var(--c-tsu-s)} .toc .t-src{color:var(--c-src);background:var(--c-src-s)}
.toc .t-memo{color:var(--sub);border:1px solid var(--rule)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:0 20px 16px;scroll-margin-top:70px;overflow:hidden}
.card>h2{font-size:.95em;margin:0 -20px 12px;padding:9px 20px;display:flex;align-items:baseline;gap:10px}
.card>h2 .no{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;color:var(--paper);font-size:.85em;flex:none;align-self:center}
.card>h2 small{font-weight:400;color:var(--sub);font-size:.78em}
.card.bg>h2{background:var(--c-bg-s);color:var(--c-bg)} .card.bg>h2 .no{background:var(--c-bg)}
.card.deb>h2{background:var(--c-deb-s);color:var(--c-deb)} .card.deb>h2 .no{background:var(--c-deb)}
.card.tsu>h2{background:var(--c-tsu-s);color:var(--c-tsu)} .card.tsu>h2 .no{background:var(--c-tsu)}
.card.memo>h2{background:var(--panel);color:var(--ink)}
.rd{font-size:.97em;line-height:1.9}
.rd p{margin:0 0 .15em}
.rd .gap{height:.7em}
.rd .hd{font-weight:700;margin-top:.4em}
.card.deb .rd .hd{color:var(--c-deb)}
.rd .lq{display:inline-block;border-bottom:1px dashed var(--c-rev);color:var(--c-rev)}
.rd .q{padding-left:1.4em;text-indent:-1.4em;margin-top:.6em}
.rd .q .qn{color:var(--c-deb);font-weight:700}
.rd .a{margin:.25em 0 .25em 1.2em;padding:4px 10px 4px 2.2em;text-indent:-1.2em;background:var(--c-ans-s);border-radius:6px}
.rd .a .an{color:var(--c-ans);font-weight:700}
.rd .nt{font-size:.88em;color:var(--sub);padding-left:1.2em;text-indent:-1.2em;margin-top:.3em}
.notice{font-size:.82em;background:var(--panel);border:1px dashed var(--rule);border-radius:8px;padding:8px 12px;margin:0 0 12px;line-height:1.7}
.notice b{color:var(--c-rev)}
.none{color:var(--sub)}
details.src{background:var(--paper);border:1px solid var(--rule);border-radius:10px;scroll-margin-top:70px}
details.src>summary{cursor:pointer;padding:10px 20px;font-size:.95em;font-weight:700;color:var(--c-src);background:var(--c-src-s);border-radius:10px;list-style:none;display:flex;gap:10px;align-items:baseline}
details.src[open]>summary{border-radius:10px 10px 0 0}
details.src>summary::-webkit-details-marker{display:none}
details.src>summary::before{content:"＋";font-weight:400}
details.src[open]>summary::before{content:"－"}

a_rows": [], "entries": ["k46", "k47", "k48", "k49", "k50"]}, {"title": "改正法附則51～55", "scope": "kaisei", "head": "労働基準法　改正法ごとの附則（51～55）", "notes_top": ["各改正法を1区分として、労基法のe-Gov掲載範囲を収録。「抄」は改正法の附則全体ではない。", "実際の国会質疑と、条文から読む学習上の問いを区別。過去問の「—」は未確認。出典資料の附則欄を参照。"], "cols": ["条文原文", "背景", "議論（実際の質疑・条文の論点）", "通達・公的説明（要件・例外）", "過去問出題年"], "notes": [], "extra_rows": [], "entries": ["k51", "k52", "k53", "k54", "k55"]}, {"title": "改正法附則56～58", "scope": "kaisei", "head": "労働基準法　改正法ごとの附則（56～58）", "notes_top": ["各改正法を1区分として、労基法のe-Gov掲載範囲を収録。「抄」は改正法の附則全体ではない。", "実際の国会質疑と、条文から読む学習上の問いを区別。過去問の「—」は未確認。出典資料の附則欄を参照。"], "cols": ["条文原文", "背景", "議論（実際の質疑・条文の論点）", "通達・公的説明（要件・例外）", "過去問出題年"], "notes": [], "extra_rows": [], "entries": ["k56", "k57", "k58"]}], "entries": [{"key": "h1", "num": [1], "label": "第1条", "caption": "労働条件の原則", "status": null, "sheet": "第1～5条", "scope": "honsoku", "text": "（労働条件の原則）\n第1条　労働条件は、労働者が人たるに値する生活を営むための必要を充たすべきものでなければならない。\n\n②　この法律で定める労働条件の基準は最低のものであるから、労働関係の当事者は、この基準を理由として労働条件を低下させてはならないことはもとより、その向上を図るように努めなければならない。", "bg": "敗戦後の生活難と産業再建のなか、労働条件を労使の契約だけに任せず、人間らしい生活を支える最低基準として法律に定めようとした。基準を「下限」でなく条件引下げの口実にしないことも重視した。", "deb": "1947年3月22日・貴族院特別委員会\n① 種田虎雄委員は、当時の官庁・会社には土曜日を半日勤務にする所があるが、8時間労働制の導入を理由に土曜日も8時間働かせてよいのかと質問した。\n→ 吉武惠市政府委員は、「法律が8時間まで認めたから」と従来の勤務を延長するのは法の趣旨に沿わないと答弁。ただし、新しく設ける会社・工場が最初から土曜8時間勤務を定めることは妨げない、と区別した。\n② 畠山一清委員長は、「人たるに値する生活」は最低限の生存を意味するのか、それとも文化的な生活まで含むのかと質問した。\n→ 吉武委員は、単に生きるだけではなく文化的な生活も含むと説明。ただし、その具体的水準は、物資が乏しい時代と豊かな時代とで違い得ると答えた。", "tsu": "昭和22年9月13日 発基第17号・法第1条関係\n① 第1条は、労働者が人格ある人間として生活するための労働条件を保障する基本理念を示したものであり、労基法の各条文を解釈するとき常に考慮する。\n② 「人たるに値する生活」は、労働者本人だけでなく、標準的な家族の生活も含めて考える。\n③ 第2項違反かどうかは、労基法の最低基準を理由に労働条件を下げたかを重視して判断する。経済状況などの変化による引下げが、すべて直ちに第1条違反になるわけではない。", "kako": "平成30年\n令和3年\n令和4年\n令和6年", "rows": [5], "ch": 0}, {"key": "h2", "num": [2], "label": "第2条", "caption": "労働条件の決定", "status": null, "sheet": "第1～5条", "scope": "honsoku", "text": "（労働条件の決定）\n第2条　労働条件は、労働者と使用者が、対等の立場において決定すべきものである。\n\n②　労働者及び使用者は、労働協約、就業規則及び労働契約を遵守し、誠実に各々その義務を履行しなければならない。", "bg": "働くために雇用を必要とする労働者と、採用・賃金を決める使用者では、契約上の自由があっても交渉力は等しくない。政府は、法律上だけでなく現実にも対等な立場で決めることを理念とした。", "deb": "—", "tsu": "—", "kako": "—", "rows": [6], "ch": 0}, {"key": "h3", "num": [3], "label": "第3条", "caption": "均等待遇", "status": null, "sheet": "第1～5条", "scope": "honsoku", "text": "（均等待遇）\n第3条　使用者は、労働者の国籍、信条又は社会的身分を理由として、賃金、労働時間その他の労働条件について、差別的取扱をしてはならない。", "bg": "戦前からの身分的な差別を改め、憲法上の平等の理念を賃金・労働時間など日常の労働条件に具体化しようとした。", "deb": "1947年3月22日・貴族院特別委員会\n種田虎雄委員は、「社会的身分」には卒業した学校や受けた教育の違いも含まれるのかと尋ねた。\n→ 吉武惠市政府委員は、学校を卒業したことは一つの「資格」であって、ここでいう社会的身分ではないと答えた。「社会的身分」は生まれながらの地位を指すという説明である。\n種田委員が、教育程度の差による一定の賃金差は第3条違反にならないのかと重ねて確認すると、吉武委員はその理解を肯定した。\n※制定当時の答弁であり、他の法令や現行の差別禁止法制全体まで一括して判断したものではない。", "tsu": "昭和22年9月13日 発基第17号・法第3条関係\n「信条」には、特定の宗教上の信念だけでなく、政治上の信念も含まれる。「社会的身分」は生まれながらの身分を指し、通達はその例に部落出身者を挙げている。\n学歴や職務上の地位を、そのままこの通達にいう「社会的身分」と扱う説明ではない。", "kako": "平成29年\n平成30年\n令和2年\n令和3年\n令和4年\n令和6年", "rows": [7], "ch": 0}, {"key": "h4", "num": [4], "label": "第4条", "caption": "男女同一賃金の原則", "status": null, "sheet": "第1～5条", "scope": "honsoku", "text": "（男女同一賃金の原則）\n第4条　使用者は、労働者が女性であることを理由として、賃金について、男性と差別的取扱いをしてはならない。", "bg": "従来、女性の賃金は男性より低く扱われていた。女性であることを一律に賃金差の理由とする慣行を改め、社会的・経済的地位を高めようとした。", "deb": "1947年3月22日・貴族院特別委員会\n① 種田虎雄委員は、男女同一賃金や女性保護を進めると、企業が女性を採用しなくなり、かえって女性の働く場が狭まるのではないかと懸念を示した。\n→ 河合良成大臣は、運用次第では懸念のような事態もあり得ると認めつつ、同じ労働能率なのに女性だから賃金が低いという従来の慣行を正すことが原則だと説明した。\n② 種田委員は、保護規定をめぐって採用を控えるという企業側の発言を聞いたと補足した（委員が紹介した伝聞であり、確認済みの実例とは扱わない）。\n③ 東久世通忠委員が、最低賃金にも男女差を設けるのかと質問。\n→ 吉武惠市政府委員は、能力が同じなら原則として差を設けるべきではないと答えた。ただし、当時の生活賃金と家族構成との関係についても言及し、具体案はまだないと述べた。", "tsu": "昭和22年9月13日 発基第17号・法第4条関係\n① 封建的な経済構造のもとで男性より低く扱われていた女性の賃金差別を廃止し、女性の社会的・経済的地位を高めることが目的。\n② 一人ひとりの職務、実際の能率、技能などに基づく個人差は、直ちに第4条の禁止する性差別とはならない。\n③ しかし、「女性は平均的に能率や知能が低い」「勤続年数が短い」「扶養家族が少ない」など、性別による一般化を理由に賃金差を付けることは違法。当該事業場で平均的な傾向が実際に見られても、性別を理由に差を付けてよいことにはならない。", "kako": "平成30年\n令和元年\n令和4年\n令和6年", "rows": [8], "ch": 0}, {"key": "h5", "num": [5], "label": "第5条", "caption": "強制労働の禁止", "status": null, "sheet": "第1～5条", "scope": "honsoku", "text": "（強制労働の禁止）\n第5条　使用者は、暴行、脅迫、監禁その他精神又は身体の自由を不当に拘束する手段によつて、労働者の意思に反して労働を強制してはならない。", "bg": "暴行・脅迫・監禁などによって労働者を意思に反して働かせる封建的慣行を断つことが課題だった。労働条件の最低水準だけでなく、働くかどうかを決める自由自体を守ろうとした。", "deb": "—", "tsu": "昭和22年9月13日 発基第17号・法第5条関係\n① 強制労働は、労働関係に残っていた封建的な慣行の典型であり、通常の違反以上に重大な性質があるため、施行当初から監督・取締りを厳格に行うよう指示した。\n② 自由を「不当に拘束する手段」は、暴行・脅迫・監禁だけに限られない。賠償予定（16条）、前借金相殺（17条）、強制貯金（18条）などに関わる拘束も例示されている。一方、就業規則に社会通念上許容される懲戒規定を置くことは、それだけで不当な拘束にはならない。\n※他条違反があれば当然に第5条も成立するという趣旨ではない。", "kako": "平成29年\n平成30年\n令和元年\n令和2年\n令和3年\n令和4年\n令和7年", "rows": [9], "ch": 0}, {"key": "h6", "num": [6], "label": "第6条", "caption": "中間搾取の排除", "status": null, "sheet": "第6～10条", "scope": "honsoku", "text": "（中間搾取の排除）\n第6条　何人も、法律に基いて許される場合の外、業として他人の就業に介入して利益を得てはならない。", "bg": "職業の紹介や労働者の就業を仲介する立場が、労働関係に介入して利益を得る旧来の慣行が問題とされた。制定時の政府は、強制労働などとともに中間搾取の排除を労働法制の基本原則に据えた。", "deb": "1947年3月22日・貴族院特別委員会\n寺本廣作政府委員が第6条を読み上げた後、畠山一清委員長は、請負や建築事業における「口入業務」との関係で議論がありそうだと述べた。\nしかし、この場では具体的な質問や政府答弁には進まず、第7条の審議へ移った。したがって、委員長の発言を「政府が特定の口入業務を違法と判断した答弁」とは扱わない。", "tsu": "昭和22年9月13日 発基第17号・法第6条関係\n①「法律に基いて許される場合」として、通達は制定当時の職業紹介法と、その委任命令に基づく場合を挙げた。現在の職業紹介・派遣などの適法性は、当時の法律名ではなく現行法令に照らして判断する。\n②禁止の範囲は採用の入口だけではない。労働関係が続く間に仲介し、いわゆる「納屋頭」が労働者の繰込みに伴う手当を受け取るような関係にも及ぶ、と説明している。", "kako": "平成29年\n令和2年\n令和7年", "rows": [5], "ch": 0}, {"key": "h7", "num": [7], "label": "第7条", "caption": "公民権行使の保障", "status": null, "sheet": "第6～10条", "scope": "honsoku", "text": "（公民権行使の保障）\n第7条　使用者は、労働者が労働時間中に、選挙権その他公民としての権利を行使し、又は公の職務を執行するために必要な時間を請求した場合においては、拒んではならない。但し、権利の行使又は公の職務の執行に妨げがない限り、請求された時刻を変更することができる。", "bg": "仕事の拘束時間と、選挙や公的な役割を果たす時間が重なると、労働者は社会・政治に参加しにくい。制定時には、労働者の公民としての権利・公の職務を、雇用関係に妨げられず行えるようにすることが重視された。", "deb": "1947年3月22日・貴族院特別委員会\n① 東久世通忠委員は、公民権行使のため職場を離れた時間について、使用者は賃金を支払う必要があるのかと質問した。\n→ 吉武惠市政府委員は、第7条は公民権行使の機会を保障する条文であり、その時間を有給とするか無給とするかまでは定めていないと答えた。\n② 畠山一清委員長は、議員として議会へ出席するときも、勤務時間を与える義務があるのか、また有給とすべきかと確認した。\n→ 吉武委員は、議員として公の職務を果たす時間も拒否できないが、賃金を支払うことまでは第7条で義務づけていないと明言した。", "tsu": "【制定時】昭和22年9月13日 発基第17号・法第7条関係\n選挙権・被選挙権の行使や、議員・労働委員会委員など法令に根拠のある公の職務に必要な時間を保障する。通達は、単に訴訟を起こす権利（訴権）などは対象に含めない趣旨と説明した。\n【現在の解釈例規】令和2年2月14日 基発0214第12号\n公の職務には、議員・労働委員会委員・裁判員・労働審判員・一定の証人・投票立会人等が含まれる。ただし法令上の職務なら何でも該当するわけではなく、公民としての権利を実効あるものとするための公的義務に当たるかを判断する。予備自衛官の招集は第7条の公の職務に当たらない（自衛隊法による別の保護はある）。\n\n【改廃確認】平成17年9月30日基発0930第6号で労働審判員・裁判員を追加。令和2年2月14日基発0214第12号は、昭和63年基発150号・婦発47号等の第7条関係解釈例規の一部を改正。通達番号・原文とも厚労省掲載で確認。", "kako": "平成29年\n平成30年\n令和元年\n令和2年\n令和3年\n令和7年", "rows": [6], "ch": 0}, {"key": "h8", "num": [8], "label": "第8条", "caption": "", "status": "削除", "sheet": "第6～10条", "scope": "honsoku", "text": "第8条　削除", "bg": "制定時の第8条は、法の適用対象となる事業・事務所を業種ごとに列挙していた。平成10年法律第112号による改正を経て、1999年に条文が削除され、事業の分類は別表第1などで確認する構造となった。", "deb": "—", "tsu": "【旧第8条に関する歴史資料（現行第8条の解釈ではない）】\n昭和22年9月13日 発基第17号・旧法第8条関係\n① 事業分類は名称ではなく、主たる事業内容と実際の労働の姿から決める。\n② 経営上一体でも労働態様が著しく異なり、場所・建物・会計等の独立性があれば別事業として扱える。ただし労働者一人ひとりの仕事内容で事業を細切れにはできない。\n③ 鉱山・土木建築会社の本社と現場は別に扱う。農林水産の一定設備での加工は製造事業として整理する。鉄道病院等は医療事業として扱うが、職場内の小さな医務室等は原則別事業としない。\n※旧第8条の規定・分類を、削除後の現行条文として適用しない。", "kako": "—", "rows": [7], "ch": 0}, {"key": "h9", "num": [9], "label": "第9条", "caption": "定義", "status": null, "sheet": "第6～10条", "scope": "honsoku", "text": "（定義）\n第9条　この法律で「労働者」とは、職業の種類を問わず、事業又は事務所（以下「事業」という。）に使用される者で、賃金を支払われる者をいう。", "bg": "最低基準を作るだけでは、誰が守られるのかが曖昧になる。法律は職業の種類では線引きせず、事業で使用され、労働の対償として賃金を支払われる人を「労働者」と定義した。制度の対象を確定するための条文である。", "deb": "1947年3月22日・貴族院特別委員会\n① 畠山一清委員長は、賃金を受ける人が労働者なら「嘱託」や「顧問」も入るのかと問いかけた。\n→ 吉武惠市政府委員は、労務を提供し、その報酬として給与を受ける者は対象に含まれると説明。ただし、管理的地位の者には労働時間規制の適用除外があり得ると補足した。\n② 委員長は、顧問等を労働者に含めるかで賞与総額や配分が変わるのではないかと繰り返し質問した。\n→ 吉武委員は、法律は企業の賞与配分方法まで一律に定めないと述べたうえで、顧問が相談などの労務を提供し、報酬を受ける場合は労働者に含まれるという説明をした。\n※これは制定時の答弁。現行の労働者性を報酬の有無だけで決められる趣旨ではない。", "tsu": "—", "kako": "平成29年\n平成30年\n令和元年\n令和2年\n令和4年\n令和7年", "rows": [8], "ch": 0}, {"key": "h10", "num": [10], "label": "第10条", "caption": "", "status": null, "sheet": "第6～10条", "scope": "honsoku", "text": "第10条　この法律で使用者とは、事業主又は事業の経営担当者その他その事業の労働者に関する事項について、事業主のために行為をするすべての者をいう。", "bg": "労働基準を実際に守らせるには、経営者本人だけでなく、現場で労働条件に関する権限を持つ者にも、各条文の義務を履行する責任が必要となる。使用者を肩書きだけで限定しない仕組みである。", "deb": "—", "tsu": "昭和22年9月13日 発基第17号・法第10条関係\n①「使用者」は、労働基準法の各条に定められた義務を実際に履行する責任を持つ者をいう。部長・課長などの肩書ではなく、その事業の中で当該義務について実質的な権限を与えられているかによって判断する。\n② どれほど高い地位でも、権限がなく単に上司の命令を伝えるだけなら、その事項についての「使用者」には当たらない。\n③ 各事業では、誰にどの義務についての権限があるかをあらかじめ明確にするよう行政が指導すべきだとした。", "kako": "令和2年\n令和4年\n令和6年", "rows": [9], "ch": 0}, {"key": "h11", "num": [11], "label": "第11条", "caption": "", "status": null, "sheet": "第11～15条", "scope": "honsoku", "text": "第11条　この法律で賃金とは、賃金、給料、手当、賞与その他名称の如何を問わず、労働の対償として使用者が労働者に支払うすべてのものをいう。", "bg": "敗戦直後は物資が不足し、現金に代えて物品を渡すこともあった。「手当」「厚生」など名称の違いで賃金保護を免れることがないよう、労務の対価を広く賃金と捉える規定が必要とされた。", "deb": "1947年3月22日・貴族院特別委員会\n種田虎雄委員は、官庁や会社が福利厚生として物や便益を与える場合も「賃金」に含まれるのかと質問した。\n→ 吉武惠市政府委員は、物資不足で金銭に代えて物を支給することがあり、その物が労務の対価なら賃金として扱うべきだと説明。他方、厚生施設に会社が費用を支出したというだけでは賃金にはならないと区別した。", "tsu": "【昭和22年9月13日 発基第17号・第11条関係】\n① 物・利益を支給して現金賃金が減る場合、または契約で現金賃金とは別の給付があらかじめ約束されている場合は、賃金となる。\n② ただし、相応の代金を徴収するものや福利厚生施設そのものは原則賃金としない。代金が著しく低額なら、賃金と評価され得る。\n③ 退職金、結婚祝金、弔慰金、見舞金などの恩恵的給付は原則賃金ではないが、労働協約・就業規則・労働契約で支給条件があらかじめ明確なら、賃金に該当する。", "kako": "平成30年\n令和元年\n令和2年\n令和3年\n令和6年\n令和7年", "rows": [5], "ch": 0}, {"key": "h12", "num": [12], "label": "第12条", "caption": "", "status": null, "sheet": "第11～15条", "scope": "honsoku", "text": "第12条　この法律で平均賃金とは、これを算定すべき事由の発生した日以前3箇月間にその労働者に対し支払われた賃金の総額を、その期間の総日数で除した金額をいう。ただし、その金額は、次の各号の一によつて計算した金額を下つてはならない。\n\n1　賃金が、労働した日若しくは時間によつて算定され、又は出来高払制その他の請負制によつて定められた場合においては、賃金の総額をその期間中に労働した日数で除した金額の100分の60\n2　賃金の一部が、月、週その他一定の期間によつて定められた場合においては、その部分の総額をその期間の総日数で除した金額と前号の金額の合算額\n\n②　前項の期間は、賃金締切日がある場合においては、直前の賃金締切日から起算する。\n\n③　前2項に規定する期間中に、次の各号のいずれかに該当する期間がある場合においては、その日数及びその期間中の賃金は、前2項の期間及び賃金の総額から控除する。\n\n1　業務上負傷し、又は疾病にかかり療養のために休業した期間\n2　産前産後の女性が第65条の規定によつて休業した期間\n3　使用者の責めに帰すべき事由によつて休業した期間\n4　育児休業、介護休業等育児又は家族介護を行う労働者の福祉に関する法律(平成3年法律第76号)第2条第1号に規定する育児休業又は同条第2号に規定する介護休業(同法第61条第3項に規定する行政執行法人介護休業及び同法第61条の2第3項に規定する介護をするための休業を含む。第39条第10項において同じ。)をした期間\n5　試みの使用期間\n④　第1項の賃金の総額には、臨時に支払われた賃金及び3箇月を超える期間ごとに支払われる賃金並びに通貨以外のもので支払われた賃金で一定の範囲に属しないものは算入しない。\n\n⑤　賃金が通貨以外のもので支払われる場合、第1項の賃金の総額に算入すべきものの範囲及び評価に関し必要な事項は、厚生労働省令で定める。\n\n⑥　雇入後3箇月に満たない者については、第1項の期間は、雇入後の期間とする。\n\n⑦　日日雇い入れられる者については、その従事する事業又は職業について、厚生労働大臣の定める金額を平均賃金とする。\n\n⑧　第1項乃至第6項によつて算定し得ない場合の平均賃金は、厚生労働大臣の定めるところによる。", "bg": "解雇予告手当や休業手当、災害補償などで金額の基礎となる「普段の賃金」を統一的に算定する必要がある。暦日を用いる原則のほか、日給・出来高給が低く計算されすぎないための最低保障などが設けられている。", "deb": "1947年3月22日・貴族院特別委員会\n第12条の読み上げ後、種田虎雄委員は、政府として日給制と月給制のどちらを基本と考えるかを質問した。\n→ 吉武惠市政府委員は、出来高による労働には日給が適する場合があり、事務職などでは月給が適する場合もあるため、全産業に一律の賃金形態を強制する考えではないと説明した。\n※これは第12条の審議中に出た「賃金形態」の質疑であり、平均賃金の計算式自体についての質疑ではない。", "tsu": "【昭和22年9月13日 発基第17号・第12条関係（制定当時の説明）】\n①「臨時に支払われた賃金」は、突発的な事由による支給や、条件が決まっていても発生が不確実で非常にまれな結婚手当などをいう。名称だけで判断しない。\n② 現物給与の評価額の基準については、別途の指示によるとしている。\n③ 日々雇い入れられる労働者の平均賃金は別途の告示で定め、当時、将来的な算定方法についても言及した。\n④ 通常の方法で算定できないケースにつき、算定期間が長期間の休業等にまたがり賃金水準が変わったときは、同一業務に従事する労働者の平均額から推算すること、雇入れ当日に算定事由が生じたときは契約上の賃金額等から推算することなどを示した。\n※④は当時の施行規則等に結び付いた説明。現行の算定実務では施行規則・後年の通知の確認が必要。", "kako": "令和元年\n令和4年\n令和7年", "rows": [6, 7], "ch": 0}, {"key": "h13", "num": [13], "label": "第13条", "caption": "この法律違反の契約", "status": null, "sheet": "第11～15条", "scope": "honsoku", "text": "(この法律違反の契約)\n第13条　この法律で定める基準に達しない労働条件を定める労働契約は、その部分については無効とする。この場合において、無効となつた部分は、この法律で定める基準による。", "bg": "政府は、民法上の一般的な雇用契約の仕組みだけでは労働者保護が十分でないと説明した。労基法より低い条件を合意してしまっても、その部分だけを法の最低基準に置き換えることで保護を実効化する（条文の構造による説明）。", "deb": "—", "tsu": "—", "kako": "平成30年", "rows": [8], "ch": 1}, {"key": "h14", "num": [14], "label": "第14条", "caption": "契約期間等", "status": null, "sheet": "第11～15条", "scope": "honsoku", "text": "(契約期間等)\n第14条　労働契約は、期間の定めのないものを除き、一定の事業の完了に必要な期間を定めるもののほかは、3年(次の各号のいずれかに該当する労働契約にあつては、5年)を超える期間について締結してはならない。\n\n1　専門的な知識、技術又は経験(以下この号及び第41条の2第1項第1号において「専門的知識等」という。)であつて高度のものとして厚生労働大臣が定める基準に該当する専門的知識等を有する労働者(当該高度の専門的知識等を必要とする業務に就く者に限る。)との間に締結される労働契約\n\n2　満60歳以上の労働者との間に締結される労働契約(前号に掲げる労働契約を除く。)\n\n②　厚生労働大臣は、期間の定めのある労働契約の締結時及び当該労働契約の期間の満了時において労働者と使用者との間に紛争が生ずることを未然に防止するため、使用者が講ずべき労働契約の期間の満了に係る通知に関する事項その他必要な事項についての基準を定めることができる。\n\n③　行政官庁は、前項の基準に関し、期間の定めのある労働契約を締結する使用者に対し、必要な助言及び指導を行うことができる。", "bg": "【制定時】年季奉公のような長期契約による身分的拘束を防ぐため、原則1年を上限とした。\n【2003年改正】繰り返し更新される有期雇用の実態等を踏まえ、原則3年・一定の場合5年に延長し、雇止めなどの紛争予防を制度化した。", "deb": "1947年3月22日・貴族院特別委員会\n種田虎雄委員は、契約期間が原則1年で毎年更新されるなら、更新時に従前より労働時間を長くするなど条件を変えられるのかと質問した。\n→ 吉武惠市政府委員は、個々の契約は1年単位でも工場全体の労働条件は継続していると指摘。法律の制定を口実に条件を下げるのは趣旨に反するが、経済再建上の必要があり労使が納得して協議し、法に反しなければ一切の変更を禁じるわけではないと説明した。\n※審議当時の期間上限は原則「1年」。現行の「3年・5年」と区別する。", "tsu": "【平成15年10月22日 基発第1022001号・第14条関係（改正時）】\n① 有期契約が更新を重ねて継続する実態を踏まえ、契約期間の上限を原則1年から3年へ、一定の労働者については5年へ延長した。\n② 高度な専門知識等による5年の特例は、資格・学位を持つだけでは足りず、その知識等を必要とする業務に就く場合に限る。\n③ 契約の締結・更新・雇止めに伴う紛争を防止するため、告示による基準と行政の助言・指導の仕組みを設けた。\n※通達発出後の告示改正等があるため、更新上限の説明など現行実務は現行法令で確認。\n\n【後続改正】平成15年基発1022001号は厚労省に原文掲載あり。平成20年・平成22年に関連する一部改正通知が存在する。2003年当時の有期契約・雇止め制度の記述を現行の明示事項や更新上限規制と同一視しない。改廃の全履歴を確定したものではない。", "kako": "平成29年\n平成30年\n令和2年\n令和3年\n令和4年\n令和6年\n令和7年", "rows": [9], "ch": 1}, {"key": "h15", "num": [15], "label": "第15条", "caption": "労働条件の明示", "status": null, "sheet": "第11～15条", "scope": "honsoku", "text": "(労働条件の明示)\n第15条　使用者は、労働契約の締結に際し、労働者に対して賃金、労働時間その他の労働条件を明示しなければならない。この場合において、賃金及び労働時間に関する事項その他の厚生労働省令で定める事項については、厚生労働省令で定める方法により明示しなければならない。\n\n②　前項の規定によつて明示された労働条件が事実と相違する場合においては、労働者は、即時に労働契約を解除することができる。\n\n③　前項の場合、就業のために住居を変更した労働者が、契約解除の日から14日以内に帰郷する場合においては、使用者は、必要な旅費を負担しなければならない。", "bg": "採用時に約束された賃金・仕事内容と、実際の条件が違えば、労働者は生活や住居を移した後に不利益を受ける。締結時の明示義務と、事実相違時の解除・帰郷旅費を一体で設けた（第2章全体の政府説明と条文構造からの整理）。", "deb": "—", "tsu": "【昭和22年9月13日 発基第17号・第15条関係】\n① 契約締結時に示す「従事すべき業務」は、仕事の内容が分かるよう具体的かつ詳細に説明する。ただし、将来従事させる予定の業務も含めて広く明示して差し支えない。\n② 明示された労働条件と事実が異なり、労働者が契約を解除して帰郷する場合の「必要な旅費」には、本人だけでなく、就業のため一緒に移転した家族の旅費も含まれる。\n※明示事項の範囲・方法については、その後の施行規則改正も踏まえて現行要件を確認。\n\n【令和5年3月30日 基発0330第1号・2024年4月1日施行】\n就業場所・業務の変更範囲と、有期契約の更新上限（通算契約期間・更新回数）を明示事項に追加。無期転換申込権が発生する契約では、申込みの機会と転換後の労働条件も明示する。制定時の業務明示に関する説明と区別する。", "kako": "平成29年\n令和元年\n令和2年\n令和3年\n令和4年\n令和6年\n令和7年", "rows": [10], "ch": 1}, {"key": "h16", "num": [16], "label": "第16条", "caption": "賠償予定の禁止", "status": null, "sheet": "第16～20条", "scope": "honsoku", "text": "（賠償予定の禁止）\n第16条　使用者は、労働契約の不履行について違約金を定め、又は損害賠償額を予定する契約をしてはならない。", "bg": "政府は1947年の提案理由で、違約金・損害賠償額の予定は労働者を職場に縛り付ける封建的な慣行につながると説明した。退職などの不履行に先立って金銭的な制裁を決め、離職の自由を奪うことを防ぐ。", "deb": "—", "tsu": "【昭和22年9月13日 発基第17号・第16条関係】\nこの条文が禁じるのは、労働契約の不履行について違約金や損害賠償額を前もって『決めておく』ことである。\n現実に損害が生じた場合、使用者がその損害の賠償を請求することまで一律に禁止する趣旨ではない。ただし、実際に賠償責任が成立するかは別途判断する。", "kako": "平成30年\n令和3年\n令和4年\n令和6年", "rows": [5], "ch": 1}, {"key": "h17", "num": [17], "label": "第17条", "caption": "前借金相殺の禁止", "status": null, "sheet": "第16～20条", "scope": "honsoku", "text": "（前借金相殺の禁止）\n第17条　使用者は、前借金その他労働することを条件とする前貸の債権と賃金を相殺してはならない。", "bg": "前借金を働く義務と結び付けて賃金から天引きすると、借金を返すまで辞めにくくなる。政府は、賠償予定・強制貯金とともに、こうした身分的拘束を排除するため第17条を設けた。", "deb": "—", "tsu": "【昭和22年9月13日 発基第17号・第17条関係】\n① 返済期限を繰り上げた場合であっても、明らかに労働者を職場に縛り付ける効果がないものは、ここでいう『労働することを条件とする債権』には含まれない。\n② 労働者が個人的な信用に基づき使用者から借り入れる必要がある場合でも、使用者が賃金と借金を相殺するのではなく、労働者の自由意思による返済に委ねるよう求めている。\n※借金をすること自体を全面的に禁止する規定ではない。", "kako": "令和3年\n令和4年\n令和7年", "rows": [6], "ch": 1}, {"key": "h18", "num": [18], "label": "第18条", "caption": "強制貯金", "status": null, "sheet": "第16～20条", "scope": "honsoku", "text": "（強制貯金）\n第18条　使用者は、労働契約に附随して貯蓄の契約をさせ、又は貯蓄金を管理する契約をしてはならない。\n\n②　使用者は、労働者の貯蓄金をその委託を受けて管理しようとする場合においては、当該事業場に、労働者の過半数で組織する労働組合があるときはその労働組合、労働者の過半数で組織する労働組合がないときは労働者の過半数を代表する者との書面による協定をし、これを行政官庁に届け出なければならない。\n\n③　使用者は、労働者の貯蓄金をその委託を受けて管理する場合においては、貯蓄金の管理に関する規程を定め、これを労働者に周知させるため作業場に備え付ける等の措置をとらなければならない。\n\n④　使用者は、労働者の貯蓄金をその委託を受けて管理する場合において、貯蓄金の管理が労働者の預金の受入であるときは、利子をつけなければならない。この場合において、その利子が、金融機関の受け入れる預金の利率を考慮して厚生労働省令で定める利率による利子を下るときは、その厚生労働省令で定める利率による利子をつけたものとみなす。\n⑤　使用者は、労働者の貯蓄金をその委託を受けて管理する場合において、労働者がその返還を請求したときは、遅滞なく、これを返還しなければならない。\n\n⑥　使用者が前項の規定に違反した場合において、当該貯蓄金の管理を継続することが労働者の利益を著しく害すると認められるときは、行政官庁は、使用者に対して、その必要な限度の範囲内で、当該貯蓄金の管理を中止すべきことを命ずることができる。\n\n⑦　前項の規定により貯蓄金の管理を中止すべきことを命ぜられた使用者は、遅滞なく、その管理に係る貯蓄金を労働者に返還しなければならない。", "bg": "戦前の工場貯金には、労働者の「足止め」のための貯金と、会社の事業資金を集めるための貯金があった。貯蓄を雇用の条件として強制する慣行をなくし、任意に会社へ預けた貯金も保護する必要があった。", "deb": "1947年3月22日・貴族院特別委員会\n① 種田虎雄委員は、銀行よりも有利な利率で会社が従業員に貯金を奨励している事例を挙げ、「強制」と「任意」の区別が曖昧ではないかと質問した。\n→ 寺本廣作政府委員は、労働者の退職を妨げる「足止め」のための貯金を禁止する趣旨だと答弁。工場貯金には、退職の拘束と事業資金の調達という二つの目的があったと説明した。\n② 寺本委員は、事業資金目的で会社が貯金を預かる場合でも、会社が倒産すれば労働者は仕事だけでなく貯金まで失う危険があると指摘。契約に付随する強制貯金かどうかを契約内容から見分ける必要があると説明した。\n③ 種田委員は、賃金の一定割合を別口座に積み立て、高い利率を付ける例もあるので、解釈を明確にしてほしいと要望した。\n※当時の政府答弁にある「行政官庁の認可」は1947年の制度。現在は第18条第2項の労使協定・届出などによる。", "tsu": "【昭和52年1月7日 基発第4号・社内預金制度の運用（後年通達）】\n① 労働者の任意の委託で会社が貯蓄金を管理する場合も、第18条第2項の労使協定・届出等が必要。会社が預金を受け入れる方式なら、これとは別に賃金の支払の確保等に関する法律による貯金の保全措置も必要となる。\n② 協定・届出なく会社が預金を受け入れるのは第18条第2項違反であり、預り金等に関する別法にも抵触するおそれがある。\n③ 労働者本人が金融機関に預けた預金の『通帳だけを会社が保管する場合』は、社内預金の受入れと異なり、第18条第4項の利息規定等や賃確法の預金保全義務の適用対象とはならない。ただし貯蓄金の『管理』として労使協定・届出等の問題は残る。\n④ 社内預金の対象は、労基法第9条の労働者に限る。退職者、家族、社内親睦団体などは対象に含めない。会社の共済会も『使用者』として第18条第2項の管理主体にはならない。\n※昭和22年の施行通達には第18条関係の独立項目はない。1947年の委員会答弁で説明された制度と、現行の労使協定・届出・保全規制は区別する。\n\n【原典確認】昭和52年1月7日基発第4号の厚労省公表本文を確認。本文中で旧来の社内預金関係通知を廃止・整理している。1977年通知の記述を無改正の現行通達と断定しない。", "kako": "令和元年\n令和3年\n令和6年", "rows": [7, 8], "ch": 1}, {"key": "h19", "num": [19], "label": "第19条", "caption": "解雇制限", "status": null, "sheet": "第16～20条", "scope": "honsoku", "text": "（解雇制限）\n第19条　使用者は、労働者が業務上負傷し、又は疾病にかかり療養のために休業する期間及びその後30日間並びに産前産後の女性が第65条の規定によつて休業する期間及びその後30日間は、解雇してはならない。ただし、使用者が、第81条の規定によつて打切補償を支払う場合又は天災事変その他やむを得ない事由のために事業の継続が不可能となつた場合においては、この限りでない。\n\n②　前項但書後段の場合においては、その事由について行政官庁の認定を受けなければならない。", "bg": "業務災害による療養や産前産後休業の時期は、収入・再就職の面で特に弱い立場になりやすい。政府は、契約解除によって生じる生活問題に最低限の保障を与える制度として解雇制限を位置付けた。", "deb": "1946年9月18日・貴族院の別法案特別委員会（労働基準法の起草過程に関する政府説明）\n吉武惠市政府委員は、労働基準法草案の公聴会で寄せられた労働者側の意見を紹介した。業務上の負傷・疾病から回復しても働く能力が低下していることがあるのに、回復から30日後には解雇され得るのは不十分であり、もっと長く雇用すべきだという意見である。\n→ これは草案に対する労働者側の反応を政府が議会で説明したもの。第19条の逐条審議における委員の発言・答弁と混同しない。\n※最終的な条文は『療養休業中及びその後30日間』『産前産後休業中及びその後30日間』を原則として解雇制限する構造となった。", "tsu": "【昭和22年9月13日 発基第17号・第19条関係】\n解雇制限の例外となる『天災事変その他やむを得ない事由のために事業の継続が不可能となった場合』とは、事業の全部又は大部分の継続が不可能となった場合を意味する。\n一部の業務が難しくなったというだけでは足りず、例外に当たるかは不可抗力性なども含めて判断する。条文上、この例外を適用するときは行政官庁の認定が必要である。\n※『全部又は大部分』は昭和22年通達の具体的な説明。不可抗力性や認定要件は現行条文等も併せて読む。", "kako": "平成29年\n平成30年\n令和元年\n令和7年", "rows": [9], "ch": 1}, {"key": "h20", "num": [20], "label": "第20条", "caption": "解雇の予告", "status": null, "sheet": "第16～20条", "scope": "honsoku", "text": "（解雇の予告）\n第20条　使用者は、労働者を解雇しようとする場合においては、少くとも30日前にその予告をしなければならない。30日前に予告をしない使用者は、30日分以上の平均賃金を支払わなければならない。但し、天災事変その他やむを得ない事由のために事業の継続が不可能となつた場合又は労働者の責に帰すべき事由に基いて解雇する場合においては、この限りでない。\n\n②　前項の予告の日数は、1日について平均賃金を支払つた場合においては、その日数を短縮することができる。\n\n③　前条第2項の規定は、第1項但書の場合にこれを準用する。", "bg": "突然の解雇では新たな職を探す時間も当面の生活資金も失われる。政府案は30日前の予告または30日分以上の平均賃金を保障し、契約終了による生活の打撃を和らげる制度を構想した。", "deb": "1947年3月17日・衆議院労働基準法案委員会／3月18日・衆議院本会議\n① 荒畑勝三委員は、政府案の解雇予告『30日』では短すぎるとして『60日』への修正を提案した。\n② 本会議でも、解雇された人が新たな就職先を見つけるには時間がかかるとし、当時の不況期に失業が長引いた経験を挙げて、30日では生活に困窮するおそれがあると主張した。\n③ 他方、衆議院委員会では、法案の早期成立を優先して政府原案を無修正で成立させるべきだとの意見も示された。結果として『60日』への修正は採用されず、『30日』が条文に残った。\n※記録から確認できるのはこの対立と審議経過であり、不採用の理由を政府が個別に説明したと断定しない。", "tsu": "【昭和22年9月13日 発基第17号・第20条関係】\n解雇予告・予告手当の例外となる『労働者の責に帰すべき事由』には、労働者の故意・過失やそれと同視できる事由が含まれる。ただし、行為の存在だけで機械的に決めず、継続勤務年数や従来の勤務状況などを合わせて総合判断する。\nなお、災害等による事業継続不能を理由とする例外と、労働者の責に帰すべき事由を理由とする例外は別であり、いずれも第20条第3項が準用する第19条第2項の認定の取扱いを確認する。", "kako": "平成30年\n令和元年\n令和2年\n令和4年\n令和7年", "rows": [10], "ch": 1}, {"key": "h21", "num": [21], "label": "第21条", "caption": "", "status": null, "sheet": "第21～25条", "scope": "honsoku", "text": "第21条　前条の規定は、左の各号の一に該当する労働者については適用しない。但し、第1号に該当する者が1箇月を超えて引き続き使用されるに至つた場合、第2号若しくは第3号に該当する者が所定の期間を超えて引き続き使用されるに至つた場合又は第4号に該当する者が14日を超えて引き続き使用されるに至つた場合においては、この限りでない。\n\n1　日日雇い入れられる者\n2　2箇月以内の期間を定めて使用される者\n3　季節的業務に4箇月以内の期間を定めて使用される者\n4　試の使用期間中の者", "bg": "【制度の背景】日雇い・短期契約・試用中の人について、通常の継続雇用と同じ解雇予告を一律に課すのではなく、短期雇用の実情に応じた例外を設けた。一方、雇用が所定期間を超えて続いた場合は予告の保護を及ぼす構成である。", "deb": "—", "tsu": "—", "kako": "平成30年", "rows": [5], "ch": 1}, {"key": "h22", "num": [22], "label": "第22条", "caption": "退職時等の証明", "status": null, "sheet": "第21～25条", "scope": "honsoku", "text": "（退職時等の証明）\n第22条　労働者が、退職の場合において、使用期間、業務の種類、その事業における地位、賃金又は退職の事由(退職の事由が解雇の場合にあつては、その理由を含む。)について証明書を請求した場合においては、使用者は、遅滞なくこれを交付しなければならない。\n\n②　労働者が、第20条第1項の解雇の予告がされた日から退職の日までの間において、当該解雇の理由について証明書を請求した場合においては、使用者は、遅滞なくこれを交付しなければならない。ただし、解雇の予告がされた日以後に労働者が当該解雇以外の事由により退職した場合においては、使用者は、当該退職の日以後、これを交付することを要しない。\n\n③　前2項の証明書には、労働者の請求しない事項を記入してはならない。\n\n④　使用者は、あらかじめ第三者と謀り、労働者の就業を妨げることを目的として、労働者の国籍、信条、社会的身分若しくは労働組合運動に関する通信をし、又は第1項及び第2項の証明書に秘密の記号を記入してはならない。", "bg": "【第2章の制定時説明に対応】労働契約の終了時に生じる生活上の問題を最小限保障するという政府方針の下、退職者が必要な証明を得られるようにした。前勤務先による再就職妨害を防ぐ規定も置く。解雇理由の証明等は後年の改正を反映した現行法上の制度。", "deb": "—", "tsu": "【昭和22年9月13日 発基第17号・旧第22条第3項関係】\nこの禁止は、事業主同士が事前に申し合わせ、労働者の再就職を妨げるためにブラックリストを回覧するような、計画的な就業妨害を防ぐ趣旨である。\nこれに対し、あらかじめ示し合わせたわけではなく、個別の具体的な照会に回答することまでは、一律に禁止するものではない。\n※通達がいう旧第3項は、現行法では第4項に対応する。", "kako": "平成29年\n平成30年\n令和元年\n令和4年", "rows": [6], "ch": 1}, {"key": "h23", "num": [23], "label": "第23条", "caption": "金品の返還", "status": null, "sheet": "第21～25条", "scope": "honsoku", "text": "（金品の返還）\n第23条　使用者は、労働者の死亡又は退職の場合において、権利者の請求があつた場合においては、7日以内に賃金を支払い、積立金、保証金、貯蓄金その他名称の如何を問わず、労働者の権利に属する金品を返還しなければならない。\n\n②　前項の賃金又は金品に関して争がある場合においては、使用者は、異議のない部分を、同項の期間中に支払い、又は返還しなければならない。", "bg": "【第2章の制定時説明に対応】退職・死亡後に労働者の賃金や貯蓄金等が使用者の手元に残ると、本人・遺族の生活に支障が生じる。権利者の請求に応じて一定期間内に清算させる仕組みとして設けた。", "deb": "—", "tsu": "【昭和22年9月13日 発基第17号・第23条関係】\n第1項・第2項にいう『権利者』には、労働者本人や死亡した労働者の権利を承継する者などが該当し、一般の債権者は含まれない。\n単に『会社に対して労働者への債権を持つ人』であることを理由として、会社に7日以内の賃金支払・金品返還を請求できるわけではない。", "kako": "平成30年\n令和元年\n令和2年\n令和6年", "rows": [7], "ch": 1}, {"key": "h24", "num": [24], "label": "第24条", "caption": "", "status": null, "sheet": "第21～25条", "scope": "honsoku", "text": "第3章　賃金\n（賃金の支払）\n第24条　賃金は、通貨で、直接労働者に、その全額を支払わなければならない。ただし、法令若しくは労働協約に別段の定めがある場合又は厚生労働省令で定める賃金について確実な支払の方法で厚生労働省令で定めるものによる場合においては、通貨以外のもので支払い、また、法令に別段の定めがある場合又は当該事業場の労働者の過半数で組織する労働組合があるときはその労働組合、労働者の過半数で組織する労働組合がないときは労働者の過半数を代表する者との書面による協定がある場合においては、賃金の一部を控除して支払うことができる。\n\n②　賃金は、毎月1回以上、一定の期日を定めて支払わなければならない。ただし、臨時に支払われる賃金、賞与その他これに準ずるもので厚生労働省令で定める賃金(第89条において「臨時の賃金等」という。)については、この限りでない。", "bg": "【1947年政府提案理由】当時の政府は、通貨払・直接払・全額払・定期払を、労働者の基本的権利として法定すべきだと説明した。現物支給や賃金の不確実な支払から生活を守り、最低限の賃金支払ルールを産業横断的に定めた。", "deb": "【1947年3月22日・貴族院特別委員会】\n① 種田虎雄委員は、賃金を日給制にするか月給制にするかを質問し、支払方法については労働者のためになるべく頻繁に支払うことが望ましいと述べた。\n② 吉武惠市政府委員は、衆議院で週給制や月2回払いを求める意見もあったと紹介したうえで、法律はあらゆる業態に適用されるため、最低限『毎月1回以上』という原則を採ったと説明した。\n③ 日給か月給かという賃金体系そのものについては、職種・業務の性質が異なるため一律には定め難いとも答弁した。\n※議論は第24条第2項の定期払を含む賃金制度全般に関するもの。", "tsu": "【昭和22年9月13日 発基第17号・第24条関係】\n通達がいう『賞与』とは、定期・臨時のいずれの支給でも、原則として勤務成績に応じて支払われ、支給額があらかじめ確定していないものをいう。\n定期的に支給され、しかも金額があらかじめ確定しているものは、名称が『賞与』であってもこの意味での賞与には当たらない。\nそのような賃金で施行規則上の例外にも該当しないものは、第24条第2項により毎月支払わなければならない。", "kako": "平成29年\n平成30年\n令和元年\n令和3年\n令和4年\n令和6年\n令和7年", "rows": [8], "ch": 2}, {"key": "h25", "num": [25], "label": "第25条", "caption": "非常時払", "status": null, "sheet": "第21～25条", "scope": "honsoku", "text": "（非常時払）\n第25条　使用者は、労働者が出産、疾病、災害その他厚生労働省令で定める非常の場合の費用に充てるために請求する場合においては、支払期日前であつても、既往の労働に対する賃金を支払わなければならない。", "bg": "【条文から読み取れる制度目的】出産・疾病・災害などで急な費用が生じたとき、通常の給料日まで待てない場合がある。将来分の賃金を前借りさせるのではなく、既に働いた分の賃金を期限前に受け取れるようにする規定。制定時の個別起草理由は未確認。", "deb": "—", "tsu": "—", "kako": "平成29年\n令和元年\n令和3年\n令和4年\n令和7年", "rows": [9], "ch": 2}, {"key": "h26", "num": [26], "label": "第26条", "caption": "休業手当", "status": null, "sheet": "第26～30条", "scope": "honsoku", "text": "（休業手当）\n第26条　使用者の責に帰すべき事由による休業の場合においては、使用者は、休業期間中当該労働者に、その平均賃金の100分の60以上の手当を支払わなければならない。", "bg": "【制定時の趣旨】使用者側の事情で仕事が止まり、働く意思のある労働者が収入を失う場合に、生活を支える最低限の所得を確保するために設けられた。休業中の賃金を常に全額保障する規定ではなく、平均賃金の60％以上という最低基準を置いた。", "deb": "【1947年3月22日・貴族院労働基準法案特別委員会】\n東久世通忠委員は、当時の健康保険の給付割合が60％から70％、80％に引き上げられることがあれば、労基法第26条の休業手当もそれに合わせて引き上げるのかと質問した。\n→ 吉武惠市政府委員は、健康保険側の改正状況についてはまだ連絡を受けていないと断ったうえで、労基法の休業手当は当面60％で進め、将来の改定は別途考えると答えた。\n※健康保険の給付と労基法の休業手当は別制度であり、給付率が自動的に連動するという答弁ではない。", "tsu": "—", "kako": "平成29年\n平成30年\n令和元年\n令和3年\n令和7年", "rows": [5], "ch": 2}, {"key": "h27", "num": [27], "label": "第27条", "caption": "出来高払制の保障給", "status": null, "sheet": "第26～30条", "scope": "honsoku", "text": "（出来高払制の保障給）\n第27条　出来高払制その他の請負制で使用する労働者については、使用者は、労働時間に応じ一定額の賃金の保障をしなければならない。", "bg": "【制定時の趣旨】働いても原材料不足など本人の責任でない事情で出来高が少ないと、完全歩合では賃金が極端に下がる。成果による賃金制度を認めながら、実際に働いた時間に応じた収入の土台を保障するための規定。", "deb": "【1947年3月22日・貴族院労働基準法案特別委員会】\n種田虎雄委員は、第27条の趣旨を説明してほしいと質問した。\n→ 吉武惠市政府委員は、工場で材料が不足して十分に働けず、製品が1つしか作れなければ、その1つ分だけが賃金となって労働者は生活に困る、と具体例を挙げた。そのため出来高払にも一定の保障が必要だと説明。\n種田委員の質問を受けた吉武委員は、保障する金額まで法律で全国一律に決めることは企業ごとに事情が異なるので難しく、第27条では保障の原則を規定したと答えた。", "tsu": "【昭和22年9月13日 発基第17号・法第27条関係】\n材料不足など本人の責任によらない事情で出来高賃金が下がることを防ぐ規定。保障給は、通常得られる実収賃金と大きく離れない収入を確保できるよう定める。\n【現行の行政解説・厚生労働省Q&A】\n保障率を法律が一律に規定しているわけではないが、平均賃金の6割程度以上を目安とする説明が示されている。従前の「通常の実収賃金の6割程度」という記載を補正し、通達の趣旨とQ&Aの金額目安を分ける。\n【確認範囲】昭和63年基発150号・婦発47号の一部改正通知は確認済み。全改正後の全文逐語照合は未完了。", "kako": "令和元年\n令和4年", "rows": [6], "ch": 2}, {"key": "h28", "num": [28], "label": "第28条", "caption": "最低賃金", "status": null, "sheet": "第26～30条", "scope": "honsoku", "text": "（最低賃金）\n第28条　賃金の最低基準に関しては、最低賃金法（昭和34年法律第137号）の定めるところによる。", "bg": "【制定時】1947年の第28条は、行政官庁が一定の事業・職業の最低賃金を定める根拠だった。最低賃金の水準を法律で一律に固定せず、審議手続で決める仕組みを想定した。\n【1959年改正】最低賃金制度は独立の最低賃金法に移され、第28条はその法律を参照する入口の規定に改められた。", "deb": "【1947年3月22日・貴族院労働基準法案特別委員会／最低賃金制度全体の議論】\n種田虎雄委員は、賃金を職階・能率・仕事内容の違いに応じて定める考え方に言及し、最低賃金を含む賃金制度の方向性を政府に質問した。\n→ 吉武惠市政府委員は、最低限の生活を保障することと、労働能率を考慮することの双方が重要だと説明。一律の賃金体系を直ちに確定させることは難しく、研究を続けると答えた。\n※第28条の条文そのものに限った質疑ではなく、最低賃金・賃金制度を横断した審議として整理した。", "tsu": "【昭和34年9月16日 発基第114号・最低賃金法の施行について】\n従来は労基法第28条〜第31条に最低賃金の制度が置かれていたが、最低賃金法の制定・施行によって、第28条を「最低賃金法による」とする参照規定に改め、残りの条文を削除した。低賃金労働者の賃金の最低額を保障し、生活の安定、労働力の質の向上、公正な競争を図るという目的を明示している。\n※ここで引用する最低賃金法の制度目的は、労基法の現行第28条の内容そのものではない。", "kako": "—", "rows": [7], "ch": 2}, {"key": "h29-old", "num": [29], "label": "旧第29条", "caption": "第29条から第31条まで　削除", "status": "削除", "sheet": "第26～30条", "scope": "honsoku", "text": "第29条から第31条まで　削除", "bg": "【旧第29条・1959年削除】1947年の制度では、最低賃金について中央・地方の賃金委員会を設け、労働者・使用者・公益の各代表を同数で構成する仕組みを規定した。最低賃金額を行政だけで独断せず、三者が関与して検討する設計だった。1959年の最低賃金法制定で旧規定は削除され、最低賃金審議会に引き継がれた。\n※現行法は第29条から第31条までを一括して「削除」と表記する。", "deb": "【1947年3月22日・貴族院労働基準法案特別委員会】\n種田虎雄委員は、最低賃金を決める賃金委員会の委員をどのように選ぶのか、公益委員について労働者側・使用者側双方の同意を必要とするのかと質問した。\n→ 吉武惠市政府委員は、委員会は労働者・使用者・公益の三者から成り、公益委員の選任に労使双方の同意を得ることまでは法律上の要件としていないと回答した。専門的事項を扱う委員会なので、労働委員会とは運用の性質が異なる面もあると説明した。\n種田委員は、公益委員の選任をめぐる意見対立で制度が機能しなくならないかと重ねて懸念を示した。", "tsu": "【昭和22年9月13日 発基第17号・旧法第29条関係】\n賃金委員会の組織については官制が公布済みであり、運用については今後別の通達で示す予定だと通知した。これは1947年当時の説明で、現在も同じ賃金委員会が存在するという意味ではない。\n【昭和34年9月16日 発基第114号】\n最低賃金法の制定に伴い、旧労基法第29条に基づく賃金委員会が廃止され、新しい最低賃金審議会が設けられた。", "kako": "—", "rows": [8], "ch": 2}, {"key": "h30-old", "num": [30], "label": "旧第30条", "caption": "第29条から第31条まで　削除", "status": "削除", "sheet": "第26～30条", "scope": "honsoku", "text": "第29条から第31条まで　削除", "bg": "【旧第30条・1959年削除】1947年の旧第30条は、最低賃金を定める前に賃金委員会の調査・意見を求め、公聴会を経るなどの手続を規定した。最低賃金の決定に労使・公益の意見を反映させる手続だった。1959年の最低賃金法制定に伴って削除された。\n※現行法は第29条から第31条までを一括して「削除」と表記する。", "deb": "—", "tsu": "【昭和34年9月16日 発基第114号・最低賃金法の施行について】\n最低賃金法の施行によって、最低賃金の決定に関する旧労基法第28条〜第31条の制度は独立法へ移された。旧第30条の賃金委員会の調査・意見聴取などの手続も、現在はそのまま労基法第30条として運用されていない。\n※これは条文の改廃を説明する通達であり、旧第30条固有の判断基準を追加したものではない。", "kako": "—", "rows": [9], "ch": 2}, {"key": "h31-old", "num": [31], "label": "旧第31条", "caption": "第29条から第31条まで　削除", "status": "削除", "sheet": "第31～35条", "scope": "honsoku", "text": "第29条から第31条まで　削除", "bg": "【旧制度・1959年廃止】制定時の旧第31条は、最低賃金が定められた後は、その額より低い賃金で雇うことを原則禁止し、一部の認定・許可等による例外を定めていた。1959年に最低賃金法が独立し、現在の労基法第31条は削除されている。", "deb": "—", "tsu": "【昭和34年9月16日・最低賃金法施行関係通達】最低賃金制度の規定を労基法から独立の最低賃金法へ整理し、旧第29条〜第31条を削除した。旧第31条の例外規定を、現在も労基法第31条に残る制度であるかのように読んではならない。", "kako": "—", "rows": [5], "ch": 2}, {"key": "h32", "num": [32], "label": "第32条", "caption": "労働時間", "status": null, "sheet": "第31～35条", "scope": "honsoku", "text": "（労働時間）\n第32条　使用者は、労働者に、休憩時間を除き1週間について40時間を超えて、労働させてはならない。\n②　使用者は、1週間の各日については、労働者に、休憩時間を除き1日について8時間を超えて、労働させてはならない。", "bg": "【制定時】長時間労働が一般的だった時代に、国際的な8時間労働制を最低基準として採用した。当初は1日8時間・週48時間。\n【1987年改正】労働者の福祉と雇用・経済構造の変化を背景に、週40時間への段階的短縮を決めた。", "deb": "【1947年3月18日・衆議院本会議／労働基準法案の委員長報告（発言029）】矢野庄太郎委員長は、政府案の「実働8時間制」を「拘束8時間制」にするべきだとの委員会質疑を紹介した。政府は、拘束8時間制を採る事業もある一方、実働8時間を超える事業が相当数あること、設備・技術等の事情に左右されることから全国の最低基準としては実働8時間制が適当であり、将来の理想として拘束8時間制に進むことを考える、と答えたという。\n【1947年3月22日・貴族院特別委員会／発言004〜007】種田虎雄委員は土曜半日勤務を8時間勤務に延長できるかを質問。吉武惠市政府委員は「法ができた」という理由で既存条件を引き下げることは趣旨に反すると説明。\n※衆議院本会議の記述は委員長が委員会審議を報告したもので、個別発言の直接引用ではない。", "tsu": "【昭和22年9月13日・発基第17号（制定時）】当時の第1項は「1日8時間・週48時間」が基本原則であることを徹底させる規定だと説明した。旧第2項の就業規則等や事業場外労働に関する説明は、後年に条文が移動・改正されたため現在の第32条へそのまま当てはめない。\n【昭和62年9月26日・発基第76号】週40時間を本則に置きながら、規模・業種などを考慮し段階的に短縮する方針を示した。", "kako": "平成29年\n平成30年\n令和元年\n令和2年\n令和4年\n令和6年", "rows": [6], "ch": 3}, {"key": "h32-2", "num": [32, 2], "label": "第32条の2", "caption": "", "status": null, "sheet": "第31～35条", "scope": "honsoku", "text": "第32条の2　使用者は、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者との書面による協定により、又は就業規則その他これに準ずるものにより、1箇月以内の一定の期間を平均し1週間当たりの労働時間が前条第1項の労働時間を超えない定めをしたときは、同条の規定にかかわらず、その定めにより、特定された週において同項の労働時間又は特定された日において同条第2項の労働時間を超えて、労働させることができる。\n②　使用者は、厚生労働省令で定めるところにより、前項の協定を行政官庁に届け出なければならない。", "bg": "【1987年改正】従来の4週間以内の変形期間を、賃金計算にも一般的な1か月以内に拡大。週休の増加と業務の繁閑への対応を両立させようとした。", "deb": "—", "tsu": "【昭和63年1月1日・基発第1号等】1か月単位の変形制は、所定の期間・各日各週の労働時間を事前に具体的に特定する制度である。後から業務都合で自由に勤務時間を変更できる仕組みではない。1987年改正により期間が4週間以内から1か月以内へ延びたが、労働者保護の要件がなくなったわけではない。\n\n【後続改正確認】昭和63年1月1日基発第1号・婦発第1号は厚労省公表原文で確認。平成22年5月18日の関係通達整備、令和5年の裁量労働制関係改正など、後年の部分改正がある。発出当初の条項番号や対象要件をそのまま現行法へ適用しない。", "kako": "平成29年\n令和元年\n令和3年\n令和4年\n令和6年", "rows": [7], "ch": 3}, {"key": "h32-3", "num": [32, 3], "label": "第32条の3", "caption": "", "status": null, "sheet": "第31～35条", "scope": "honsoku", "text": "第32条の3　使用者は、就業規則その他これに準ずるものにより、その労働者に係る始業及び終業の時刻をその労働者の決定に委ねることとした労働者については、当該事業場の労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者との書面による協定により、次に掲げる事項を定めたときは、その協定で第2号の清算期間として定められた期間を平均し1週間当たりの労働時間が第32条第1項の労働時間を超えない範囲内において、同条の規定にかかわらず、1週間において同項の労働時間又は1日において同条第2項の労働時間を超えて、労働させることができる。\n1　この項の規定による労働時間により労働させることができることとされる労働者の範囲\n2　清算期間（その期間を平均し1週間当たりの労働時間が第32条第1項の労働時間を超えない範囲内において労働させる期間をいい、3箇月以内の期間に限るものとする。以下この条及び次条において同じ。）\n3　清算期間における総労働時間\n4　その他厚生労働省令で定める事項\n②　清算期間が1箇月を超えるものである場合における前項の規定の適用については、同項各号列記以外の部分中「労働時間を超えない」とあるのは「労働時間を超えず、かつ、当該清算期間をその開始の日以後1箇月ごとに区分した各期間（最後に1箇月未満の期間を生じたときは、当該期間。以下この項において同じ。）ごとに当該各期間を平均し1週間当たりの労働時間が50時間を超えない」と、「同項」とあるのは「同条第1項」とする。\n③　1週間の所定労働日数が5日の労働者について第1項の規定により労働させる場合における同項の規定の適用については、同項各号列記以外の部分（前項の規定により読み替えて適用する場合を含む。）中「第32条第1項の労働時間」とあるのは「第32条第1項の労働時間（当該事業場の労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者との書面による協定により、労働時間の限度について、当該清算期間における所定労働日数を同条第2項の労働時間に乗じて得た時間とする旨を定めたときは、当該清算期間における日数を7で除して得た数をもつてその時間を除して得た時間）」と、「同項」とあるのは「同条第1項」とする。\n④　前条第2項の規定は、第1項各号に掲げる事項を定めた協定について準用する。ただし、清算期間が1箇月以内のものであるときは、この限りでない。", "bg": "【1987年改正】始業・終業時刻を労働者自身が選ぶ仕組みを制度化し、労働時間の効率化と生活との調和を図った。\n【2018年改正】清算期間の上限を1か月から3か月に延長しつつ、期間中の長時間労働への歯止めを設けた。", "deb": "—", "tsu": "【昭和63年1月1日・基発第1号等】始業・終業時刻を本人の決定に委ね、労使協定で清算期間と総労働時間等を定める。清算期間全体で法定労働時間の総枠を管理する点が通常の変形制と異なる。標準となる1日の労働時間は年休の取扱いにも使い、コアタイムやフレキシブルタイムを設ける場合はその時間帯も定める。\n【現行制度との区別】現在の3か月清算では、清算期間全体の枠だけでなく各1か月区分の週平均50時間の規律もある。\n\n【後続改正確認】昭和63年1月1日基発第1号・婦発第1号は厚労省公表原文で確認。平成22年5月18日の関係通達整備、令和5年の裁量労働制関係改正など、後年の部分改正がある。発出当初の条項番号や対象要件をそのまま現行法へ適用しない。\n\n【平成30年9月7日 基発0907第1号・2019年4月1日施行】\nフレックスタイム制の清算期間上限を1か月から3か月へ延長。1か月を超える場合は、清算期間全体の法定労働時間の総枠と、各1か月区分の週平均50時間の枠を管理する。労使協定の届出が必要。1988年当初の制度と区別する。", "kako": "平成30年\n令和元年\n令和2年\n令和3年\n令和4年", "rows": [8, 9], "ch": 3}, {"key": "h32-3-2", "num": [32, 3, 2], "label": "第32条の3の2", "caption": "", "status": null, "sheet": "第31～35条", "scope": "honsoku", "text": "第32条の3の2　使用者が、清算期間が1箇月を超えるものであるときの当該清算期間中の前条第1項の規定により労働させた期間が当該清算期間より短い労働者について、当該労働させた期間を平均し1週間当たり40時間を超えて労働させた場合においては、その超えた時間（第33条又は第36条第1項の規定により延長し、又は休日に労働させた時間を除く。）の労働については、第37条の規定の例により割増賃金を支払わなければならない。", "bg": "【2018年改正】3か月までの長い清算期間で、途中退職等により「後半に少なく働いて帳尻を合わせる」機会を持てない人に、働いた期間を基に割増賃金を清算する規定を設けた。", "deb": "—", "tsu": "—", "kako": "—", "rows": [10], "ch": 3}, {"key": "h32-4", "num": [32, 4], "label": "第32条の4", "caption": "", "status": null, "sheet": "第31～35条", "scope": "honsoku", "text": "第32条の4　使用者は、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者との書面による協定により、次に掲げる事項を定めたときは、第32条の規定にかかわらず、その協定で第2号の対象期間として定められた期間を平均し1週間当たりの労働時間が40時間を超えない範囲内において、当該協定（次項の規定による定めをした場合においては、その定めを含む。）で定めるところにより、特定された週において同条第1項の労働時間又は特定された日において同条第2項の労働時間を超えて、労働させることができる。\n1　この条の規定による労働時間により労働させることができることとされる労働者の範囲\n2　対象期間（その期間を平均し1週間当たりの労働時間が40時間を超えない範囲内において労働させる期間をいい、1箇月を超え1年以内の期間に限るものとする。以下この条及び次条において同じ。）\n3　特定期間（対象期間中の特に業務が繁忙な期間をいう。第3項において同じ。）\n4　対象期間における労働日及び当該労働日ごとの労働時間（対象期間を1箇月以上の期間ごとに区分することとした場合においては、当該区分による各期間のうち当該対象期間の初日の属する期間（以下この条において「最初の期間」という。）における労働日及び当該労働日ごとの労働時間並びに当該最初の期間を除く各期間における労働日数及び総労働時間）\n5　その他厚生労働省令で定める事項\n②　使用者は、前項の協定で同項第4号の区分をし当該区分による各期間のうち最初の期間を除く各期間における労働日数及び総労働時間を定めたときは、当該各期間の初日の少なくとも30日前に、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者の同意を得て、厚生労働省令で定めるところにより、当該労働日数を超えない範囲内において当該各期間における労働日及び当該総労働時間を超えない範囲内において当該各期間における労働日ごとの労働時間を定めなければならない。\n③　厚生労働大臣は、労働政策審議会の意見を聴いて、厚生労働省令で、対象期間における労働日数の限度並びに1日及び1週間の労働時間の限度並びに対象期間（第1項の協定で特定期間として定められた期間を除く。）及び同項の協定で特定期間として定められた期間における連続して労働させる日数の限度を定めることができる。\n④　第32条の2第2項の規定は、第1項の協定について準用する。", "bg": "【1987年改正】当初は3か月以内の変形制として導入。\n【1993年改正】1年以内に対象期間を拡大し、季節的な繁閑に対応しながら休日増加と総労働時間の短縮を目指した。", "deb": "—", "tsu": "【昭和62年9月26日・発基第76号】当初の3か月以内の変形制でも、労使協定で時間を特定し、1日・1週の労働時間および連続勤務日数に限度を設ける制度設計を示した。\n【平成6年1月4日・基発第1号】その後の1年単位への拡大を踏まえ、対象期間、労働日・時間の特定、限度、届出等の運用を整理。現在の規定は1987年当初の3か月制と同一ではない。\n\n【適用時点】平成6年1月4日基発第1号は公的原文を確認できるが、現在の1年単位の変形労働時間制の全条件を1994年通知のみで確定できない。現行法・施行規則と照合して運用する。", "kako": "平成30年\n令和2年", "rows": [11, 12], "ch": 3}, {"key": "h32-4-2", "num": [32, 4, 2], "label": "第32条の4の2", "caption": "", "status": null, "sheet": "第31～35条", "scope": "honsoku", "text": "第32条の4の2　使用者が、対象期間中の前条の規定により労働させた期間が当該対象期間より短い労働者について、当該労働させた期間を平均し1週間当たり40時間を超えて労働させた場合においては、その超えた時間（第33条又は第36条第1項の規定により延長し、又は休日に労働させた時間を除く。）の労働については、第37条の規定の例により割増賃金を支払わなければならない。", "bg": "【後年改正】1年単位の変形制では繁忙期に長く働き、閑散期に短く働くことを予定する。対象期間の途中で退職する労働者が、繁忙期の労働だけを引き受けて不利にならないよう、実際の勤務期間に応じて割増賃金を精算させる。", "deb": "—", "tsu": "—", "kako": "—", "rows": [13], "ch": 3}, {"key": "h32-5", "num": [32, 5], "label": "第32条の5", "caption": "", "status": null, "sheet": "第31～35条", "scope": "honsoku", "text": "第32条の5　使用者は、日ごとの業務に著しい繁閑の差が生ずることが多く、かつ、これを予測した上で就業規則その他これに準ずるものにより各日の労働時間を特定することが困難であると認められる厚生労働省令で定める事業であつて、常時使用する労働者の数が厚生労働省令で定める数未満のものに従事する労働者については、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者との書面による協定があるときは、第32条第2項の規定にかかわらず、1日について10時間まで労働させることができる。\n②　使用者は、前項の規定により労働者に労働させる場合においては、厚生労働省令で定めるところにより、当該労働させる1週間の各日の労働時間を、あらかじめ、当該労働者に通知しなければならない。\n③　第32条の2第2項の規定は、第1項の協定について準用する。", "bg": "【1987年改正】日ごとの業務量の変動を予測しにくい小規模事業で、1週間を単位に効率的な時間配分を可能とし、総労働時間の短縮につなげることを目指した。", "deb": "—", "tsu": "【昭和63年1月1日・基発第1号等】対象は小売業・旅館・料理店・飲食店等のうち一定規模未満に限定され、1日の労働時間は10時間まで。各日の時間は原則として週が始まる前に書面で通知する。変更できるのは、急な天候変化など客観的で緊急・やむを得ない事情がある場合で、単なる使用者の都合は理由にならない。\n\n【後続改正確認】昭和63年1月1日基発第1号・婦発第1号は厚労省公表原文で確認。平成22年5月18日の関係通達整備、令和5年の裁量労働制関係改正など、後年の部分改正がある。発出当初の条項番号や対象要件をそのまま現行法へ適用しない。", "kako": "—", "rows": [14], "ch": 3}, {"key": "h33", "num": [33], "label": "第33条", "caption": "災害等による臨時の必要がある場合の時間外労働等", "status": null, "sheet": "第31～35条", "scope": "honsoku", "text": "（災害等による臨時の必要がある場合の時間外労働等）\n第33条　災害その他避けることのできない事由によつて、臨時の必要がある場合においては、使用者は、行政官庁の許可を受けて、その必要の限度において第32条から前条まで若しくは第40条の労働時間を延長し、又は第35条の休日に労働させることができる。ただし、事態急迫のために行政官庁の許可を受ける暇がない場合においては、事後に遅滞なく届け出なければならない。\n②　前項ただし書の規定による届出があつた場合において、行政官庁がその労働時間の延長又は休日の労働を不適当と認めるときは、その後にその時間に相当する休憩又は休日を与えるべきことを、命ずることができる。\n③　公務のために臨時の必要がある場合においては、第1項の規定にかかわらず、官公署の事業（別表第1に掲げる事業を除く。）に従事する国家公務員及び地方公務員については、第32条から前条まで若しくは第40条の労働時間を延長し、又は第35条の休日に労働させることができる。", "bg": "【制定時】災害や事故、公務上の緊急事態への対応には法定労働時間・休日の例外が必要だが、通常の繁忙と区別して必要最小限にとどめる考えから設けられた。", "deb": "【1947年3月10日・衆議院本会議】官公吏についてなぜ労働時間の例外を設けるのかが問われた。\n→ 政府は、議会開会中の予算・資料作成、外交、市町村の災害救済など公益上の臨時対応を例示。ただし一般の労働者以上の過重労働を当然に求める趣旨ではなく、可能な限り埋め合わせを考えると説明した。", "tsu": "【昭和22年9月13日・発基第17号】災害・緊急・不可抗力等、客観的に避けられない場合に限定して厳格に扱う。単なる繁忙や経営上の必要は認めない。一方、急病やボイラー爆発など人命・公益の保護、業務継続を不能にする突発的な機械故障の修理は認め得る。通常予見できる部分修理や定期点検は認めない。事後の措置も脱法や著しい長時間延長の有無に注意する。", "kako": "平成30年\n令和3年\n令和4年\n令和5年\n令和6年", "rows": [15], "ch": 3}, {"key": "h34", "num": [34], "label": "第34条", "caption": "休憩", "status": null, "sheet": "第31～35条", "scope": "honsoku", "text": "（休憩）\n第34条　使用者は、労働時間が6時間を超える場合においては少くとも45分、8時間を超える場合においては少くとも1時間の休憩時間を労働時間の途中に与えなければならない。\n②　前項の休憩時間は、一斉に与えなければならない。ただし、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者との書面による協定があるときは、この限りでない。\n③　使用者は、第1項の休憩時間を自由に利用させなければならない。", "bg": "【制定時】勤務を中断できる時間を保障して疲労・事故を防ぐため、実労働時間に応じた休憩、原則一斉付与、自由利用を設けた。", "deb": "【1947年3月18日・衆議院本会議】休憩を与え始める時間について、労働者側から修正意見が提出された。\n→ 提案者は、4〜5時間働く頃に疲れが強まり災害が起こるとして、「6時間を超えたら」では遅く、5時間継続後に45分、7時間超で1時間以上とすべきだと主張した。\n※これは採用された条文ではなく、採用前の対案である。最終的に現行法の「6時間超・8時間超」の枠組みが残った。", "tsu": "【昭和22年9月13日・発基第17号】作業していないだけの手待時間は休憩ではなく、労働者が権利として労働から離れることを保障された時間が休憩となる。会社の指示で拘束される時間は労働時間として扱う。休憩中の行動に職場秩序上の合理的な制限を加えることは、休憩の目的を損なわない限り許される。\n※同通達の「一斉休憩について行政の許可を受ける」という部分は旧制度であり、現在は所定の労使協定等による。", "kako": "平成29年\n令和5年\n令和6年", "rows": [16], "ch": 3}, {"key": "h35", "num": [35], "label": "第35条", "caption": "休日", "status": null, "sheet": "第31～35条", "scope": "honsoku", "text": "（休日）\n第35条　使用者は、労働者に対して、毎週少くとも1回の休日を与えなければならない。\n②　前項の規定は、4週間を通じ4日以上の休日を与える使用者については適用しない。", "bg": "【制定時】働く日が続けば疲労回復や生活の時間が確保できない。政府は週休制を国際的に広く認められた最低基準として法定した。", "deb": "【1947年3月15日・衆議院委員会】労働組合の健全な発展を考え、メーデーや年末年始も有給休日とする制度を法律に盛り込むべきではないかとの意見が示された。\n→ しかし制定法の第35条は有給の休日を一律に義務付けず、原則週1日、例外として4週間に4日以上という休日の付与を規定した。\n※提案された有給休日制度を条文が採用したという意味ではない。", "tsu": "【昭和22年9月13日・発基第17号】毎週少なくとも1回の休日を与えるのが原則であり、4週間を通じ4日以上を与える方式は例外だと明確に説明。例外方式を利用する場合にも、当時の旧第32条第2項に準じて、できる限り一定の定めをするよう指導している。なお、現行の4週間の起算日指定の要件そのものを説明した通達ではない。", "kako": "平成29年\n平成30年", "rows": [17], "ch": 3}, {"key": "h36", "num": [36], "label": "第36条", "caption": "時間外及び休日の労働", "status": null, "sheet": "第36～40条", "scope": "honsoku", "text": "（時間外及び休日の労働）第36条\n使用者は、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者との書面による協定をし、厚生労働省令で定めるところによりこれを行政官庁に届け出た場合においては、第32条から第32条の5まで若しくは第40条の労働時間（以下この条において「労働時間」という。）又は前条の休日（以下この条において「休日」という。）に関する規定にかかわらず、その協定で定めるところによつて労働時間を延長し、又は休日に労働させることができる。\n\n②　前項の協定においては、次に掲げる事項を定めるものとする。\n\n1　この条の規定により労働時間を延長し、又は休日に労働させることができることとされる労働者の範囲\n2　対象期間（この条の規定により労働時間を延長し、又は休日に労働させることができる期間をいい、1年間に限るものとする。第4号及び第6項第3号において同じ。）\n\n3　労働時間を延長し、又は休日に労働させることができる場合\n\n4　対象期間における1日、1箇月及び1年のそれぞれの期間について労働時間を延長して労働させることができる時間又は労働させることができる休日の日数\n\n5　労働時間の延長及び休日の労働を適正なものとするために必要な事項として厚生労働省令で定める事項\n\n③　前項第4号の労働時間を延長して労働させることができる時間は、当該事業場の業務量、時間外労働の動向その他の事情を考慮して通常予見される時間外労働の範囲内において、限度時間を超えない時間に限る。\n④　前項の限度時間は、1箇月について45時間及び1年について360時間（第32条の4第1項第2号の対象期間として3箇月を超える期間を定めて同条の規定により労働させる場合にあつては、1箇月について42時間及び1年について320時間）とする。\n⑤　第1項の協定においては、第2項各号に掲げるもののほか、当該事業場における通常予見することのできない業務量の大幅な増加等に伴い臨時的に第3項の限度時間を超えて労働させる必要がある場合において、1箇月について労働時間を延長して労働させ、及び休日において労働させることができる時間（第2項第4号に関して協定した時間を含め100時間未満の範囲内に限る。）並びに1年について労働時間を延長して労働させることができる時間（同号に関して協定した時間を含め720時間を超えない範囲内に限る。）を定めることができる。この場合において、第1項の協定に、併せて第2項第2号の対象期間において労働時間を延長して労働させる時間が1箇月について45時間（第32条の4第1項第2号の対象期間として3箇月を超える期間を定めて同条の規定により労働させる場合にあつては、1箇月について42時間）を超えることができる月数（1年について6箇月以内に限る。）を定めなければならない。\n⑥　使用者は、第1項の協定で定めるところによつて労働時間を延長して労働させ、又は休日において労働させる場合であつても、次の各号に掲げる時間について、当該各号に定める要件を満たすものとしなければならない。\n\n1　坑内労働その他厚生労働省令で定める健康上特に有害な業務について、1日について労働時間を延長して労働させた時間2時間を超えないこと。\n\n2　1箇月について労働時間を延長して労働させ、及び休日において労働させた時間100時間未満であること。\n\n3　対象期間の初日から1箇月ごとに区分した各期間に当該各期間の直前の1箇月、2箇月、3箇月、4箇月及び5箇月の期間を加えたそれぞれの期間における労働時間を延長して労働させ、及び休日において労働させた時間の1箇月当たりの平均時間80時間を超えないこと。\n⑦　厚生労働大臣は、労働時間の延長及び休日の労働を適正なものとするため、第1項の協定で定める労働時間の延長及び休日の労働について留意すべき事項、当該労働時間の延長に係る割増賃金の率その他の必要な事項について、労働者の健康、福祉、時間外労働の動向その他の事情を考慮して指針を定めることができる。\n\n⑧　第1項の協定をする使用者及び労働組合又は労働者の過半数を代表する者は、当該協定で労働時間の延長及び休日の労働を定めるに当たり、当該協定の内容が前項の指針に適合したものとなるようにしなければならない。\n\n⑨　行政官庁は、第7項の指針に関し、第1項の協定をする使用者及び労働組合又は労働者の過半数を代表する者に対し、必要な助言及び指導を行うことができる。\n\n⑩　前項の助言及び指導を行うに当たつては、労働者の健康が確保されるよう特に配慮しなければならない。\n⑪　第3項から第5項まで及び第6項（第2号及び第3号に係る部分に限る。）の規定は、新たな技術、商品又は役務の研究開発に係る業務については適用しない。", "bg": "【制定時】敗戦後、実働8時間・週48時間を新たな最低基準とした一方、通常予想される臨時の業務にも対応する余地が必要だった。そこで、労働者側との書面協定によって例外を認めた。\n【2018年改正】協定があれば長時間労働を広く延長できる構造を見直し、時間外労働に罰則付きの上限を設けた。", "deb": "—", "tsu": "【制定時・昭和22年9月13日 発基第17号】第36条は、通常予想される臨時の必要に対応する8時間制の例外である。労使協定は「業務の都合」など曖昧な理由で済ませず、できるだけ具体的な事由を示して締結するよう指導する。なお、当時の施行規則第18条の業務範囲は別途通達する予定とされた。\n【2018年改正後】原則の限度時間（月45時間・年360時間）と特別条項の上限は法定され、36協定を結んでも法定の上限を超えて働かせられない。1947年の説明を現行の上限規制なしの扱いとして読まない。", "kako": "平成29年\n平成30年\n令和元年\n令和2年\n令和3年\n令和4年\n令和7年", "rows": [5, 6, 7, 8, 9, 10, 11], "ch": 3}, {"key": "h37", "num": [37], "label": "第37条", "caption": "時間外、休日及び深夜の割増賃金", "status": null, "sheet": "第36～40条", "scope": "honsoku", "text": "（時間外、休日及び深夜の割増賃金）第37条\n使用者が、第33条又は前条第1項の規定により労働時間を延長し、又は休日に労働させた場合においては、その時間又はその日の労働については、通常の労働時間又は労働日の賃金の計算額の2割5分以上5割以下の範囲内でそれぞれ政令で定める率以上の率で計算した割増賃金を支払わなければならない。ただし、当該延長して労働させた時間が1箇月について60時間を超えた場合においては、その超えた時間の労働については、通常の労働時間の賃金の計算額の5割以上の率で計算した割増賃金を支払わなければならない。\n\n②　前項の政令は、労働者の福祉、時間外又は休日の労働の動向その他の事情を考慮して定めるものとする。\n③　使用者が、当該事業場に、労働者の過半数で組織する労働組合があるときはその労働組合、労働者の過半数で組織する労働組合がないときは労働者の過半数を代表する者との書面による協定により、第1項ただし書の規定により割増賃金を支払うべき労働者に対して、当該割増賃金の支払に代えて、通常の労働時間の賃金が支払われる休暇（第39条の規定による有給休暇を除く。）を厚生労働省令で定めるところにより与えることを定めた場合において、当該労働者が当該休暇を取得したときは、当該労働者の同項ただし書に規定する時間を超えた時間の労働のうち当該取得した休暇に対応するものとして厚生労働省令で定める時間の労働については、同項ただし書の規定による割増賃金を支払うことを要しない。\n④　使用者が、午後10時から午前5時まで（厚生労働大臣が必要であると認める場合においては、その定める地域又は期間については午後11時から午前6時まで）の間において労働させた場合においては、その時間の労働については、通常の労働時間の賃金の計算額の2割5分以上の率で計算した割増賃金を支払わなければならない。\n\n⑤　第1項及び前項の割増賃金の基礎となる賃金には、家族手当、通勤手当その他厚生労働省令で定める賃金は算入しない。", "bg": "【制定時】8時間労働制などの例外を認める一方、通常と異なる時間帯や長時間の勤務に対し、賃金上の追加保障を設けた。\n【後年の改正】長時間労働を抑制する観点から、月60時間を超える法定時間外労働の割増率を5割以上とした。中小企業の適用猶予は2023年4月に終了した。", "deb": "1947年3月22日・貴族院特別委員会\n① 種田虎雄委員は、25％の割増とは時給1円なら1円25銭という意味かと確認した。\n→ 寺本廣作政府委員は、その理解を肯定した。\n② 種田委員は、当時の国内の実際の支払い方と諸外国の制度も質問した。\n→ 寺本委員は限定的な工場調査を紹介し、基本給だけでは実態を比較しにくいと説明。吉武惠市政府委員は国際労働会議で採択された基準に言及し、諸外国の割増率との関係を答えた。\n※議論は制定時の率と支払状況に関するもの。現行法の割増率の詳細とは分けて読む。", "tsu": "【制定時・昭和22年9月13日 発基第17号】割増賃金の計算から除く家族手当・通勤手当・別居手当・子女教育手当は、手当の名前ではなく実際の内容によって判断する。「家族手当」と名付ければ何でも一律に除外できるわけではない。\n【後年の取扱い】月60時間を超える法定時間外労働には5割以上の率が適用される。中小企業も2023年4月以降は適用対象。", "kako": "平成29年\n平成30年\n令和元年\n令和2年\n令和3年\n令和4年\n令和7年", "rows": [12, 13, 14], "ch": 3}, {"key": "h38", "num": [38], "label": "第38条", "caption": "時間計算", "status": null, "sheet": "第36～40条", "scope": "honsoku", "text": "（時間計算）第38条\n労働時間は、事業場を異にする場合においても、労働時間に関する規定の適用については通算する。\n\n②　坑内労働については、労働者が坑口に入つた時刻から坑口を出た時刻までの時間を、休憩時間を含め労働時間とみなす。但し、この場合においては、第34条第2項及び第3項の休憩に関する規定は適用しない。", "bg": "法定労働時間の保護を、事業場を異にして働く場合も念頭に置いて定めた。第2項は坑内労働の特殊性を踏まえ、坑口から坑口までを原則として労働時間に含める構造である。", "deb": "—", "tsu": "【制定時・昭和22年9月13日 発基第17号】坑内労働の出入坑時間について、当時の施行規則に基づく許可の基準を具体化した。例えば小規模の団体入坑には許可しないこと、徒歩による出入坑について所要時間の限度を設けること、人車やケージを利用する場合の合理的所要時間を算定することなどを示している。\n※これらは1947年当時の許可制度に関する歴史資料であり、そのまま現在の許可基準として適用しない。現行の第1項（事業場を異にする労働時間の通算）について、この通達に独立した説明は確認できない。", "kako": "—", "rows": [15], "ch": 3}, {"key": "h38-2", "num": [38, 2], "label": "第38条の2", "caption": "", "status": null, "sheet": "第36～40条", "scope": "honsoku", "text": "第38条の2\n労働者が労働時間の全部又は一部について事業場外で業務に従事した場合において、労働時間を算定し難いときは、所定労働時間労働したものとみなす。ただし、当該業務を遂行するためには通常所定労働時間を超えて労働することが必要となる場合においては、当該業務に関しては、厚生労働省令で定めるところにより、当該業務の遂行に通常必要とされる時間労働したものとみなす。\n\n②　前項ただし書の場合において、当該業務に関し、当該事業場に、労働者の過半数で組織する労働組合があるときはその労働組合、労働者の過半数で組織する労働組合がないときは労働者の過半数を代表する者との書面による協定があるときは、その協定で定める時間を同項ただし書の当該業務の遂行に通常必要とされる時間とする。\n\n③　使用者は、厚生労働省令で定めるところにより、前項の協定を行政官庁に届け出なければならない。", "bg": "【1987年改正】出張や外回りなど、事業場の外で勤務し、実際の時間を算定し難い仕事について、労働時間をどう算定するかを明文化した。「外勤である」というだけでは適用できず、算定の困難さが前提となる。", "deb": "—", "tsu": "【1988年1月1日 基発第1号・婦発第1号】事業場外で働き、労働時間を算定し難いときは、原則として所定労働時間働いたものとみなす。通常、その業務には所定時間を超える労働が必要なら、業務の遂行に通常必要とされる時間で算定する。事業場内と事業場外の両方で仕事をする場合は、事業場内で実際に働いた時間の取扱いにも注意が必要である。\nこの制度は、外勤者の実労働時間を把握できる場合まで、一律にみなし時間へ置き換えるものではない。\n\n【後続改正確認】昭和63年1月1日基発第1号・婦発第1号は厚労省公表原文で確認。平成22年5月18日の関係通達整備、令和5年の裁量労働制関係改正など、後年の部分改正がある。発出当初の条項番号や対象要件をそのまま現行法へ適用しない。", "kako": "令和元年\n令和6年", "rows": [16], "ch": 3}, {"key": "h38-3", "num": [38, 3], "label": "第38条の3", "caption": "", "status": null, "sheet": "第36～40条", "scope": "honsoku", "text": "第38条の3\n使用者が、当該事業場に、労働者の過半数で組織する労働組合があるときはその労働組合、労働者の過半数で組織する労働組合がないときは労働者の過半数を代表する者との書面による協定により、次に掲げる事項を定めた場合において、労働者を第1号に掲げる業務に就かせたときは、当該労働者は、厚生労働省令で定めるところにより、第2号に掲げる時間労働したものとみなす。\n\n1　業務の性質上その遂行の方法を大幅に当該業務に従事する労働者の裁量にゆだねる必要があるため、当該業務の遂行の手段及び時間配分の決定等に関し使用者が具体的な指示をすることが困難なものとして厚生労働省令で定める業務のうち、労働者に就かせることとする業務（以下この条において「対象業務」という。）\n\n2　対象業務に従事する労働者の労働時間として算定される時間\n\n3　対象業務の遂行の手段及び時間配分の決定等に関し、当該対象業務に従事する労働者に対し使用者が具体的な指示をしないこと。\n4　対象業務に従事する労働者の労働時間の状況に応じた当該労働者の健康及び福祉を確保するための措置を当該協定で定めるところにより使用者が講ずること。\n\n5　対象業務に従事する労働者からの苦情の処理に関する措置を当該協定で定めるところにより使用者が講ずること。\n\n6　前各号に掲げるもののほか、厚生労働省令で定める事項\n\n②　前条第3項の規定は、前項の協定について準用する。", "bg": "【1987年改正】研究開発など、仕事の進め方・時間配分を労働者の裁量に大幅に委ねる必要がある専門業務について、通常の労働時間の把握方法と異なる「みなし」を認めた。業務の名称だけでは適用できない。", "deb": "—", "tsu": "【1988年1月1日 基発第1号・婦発第1号】対象業務は、その遂行方法や時間配分について使用者が具体的な指示をすることが難しく、労働者の裁量に委ねる必要がある業務に限定する。労使協定に所定事項を定め、みなし時間を設ける制度である。\n※その後、健康・福祉確保措置や苦情処理、本人同意等について改正があるため、制定時の通達だけで現行の導入要件を判断しない。\n\n【重要な改正】昭和63年1月1日基発第1号・婦発第1号の専門業務型裁量労働制関係は、令和5年の公的な新旧対照表に改正文言が示されている。現行の本人同意、健康・福祉確保措置等は改正後の法令・指針・通知で確認する。\n\n【令和5年8月2日 基発0802第7号・2024年4月1日適用】\n専門業務型は、本人同意と不同意者の不利益取扱い禁止、同意撤回手続、同意・撤回の記録保存を協定事項に追加。本人同意は労働者ごと・協定の有効期間ごとに得る。記録は有効期間中及び満了後3年間保存する。", "kako": "令和6年", "rows": [17, 18], "ch": 3}, {"key": "h38-4", "num": [38, 4], "label": "第38条の4", "caption": "", "status": null, "sheet": "第36～40条", "scope": "honsoku", "text": "第38条の4\n賃金、労働時間その他の当該事業場における労働条件に関する事項を調査審議し、事業主に対し当該事項について意見を述べることを目的とする委員会（使用者及び当該事業場の労働者を代表する者を構成員とするものに限る。）が設置された事業場において、当該委員会がその委員の5分の4以上の多数による議決により次に掲げる事項に関する決議をし、かつ、使用者が、厚生労働省令で定めるところにより当該決議を行政官庁に届け出た場合において、第2号に掲げる労働者の範囲に属する労働者を当該事業場における第1号に掲げる業務に就かせたときは、当該労働者は、厚生労働省令で定めるところにより、第3号に掲げる時間労働したものとみなす。\n1　事業の運営に関する事項についての企画、立案、調査及び分析の業務であつて、当該業務の性質上これを適切に遂行するにはその遂行の方法を大幅に労働者の裁量に委ねる必要があるため、当該業務の遂行の手段及び時間配分の決定等に関し使用者が具体的な指示をしないこととする業務（以下この条において「対象業務」という。）\n\n2　対象業務を適切に遂行するための知識、経験等を有する労働者であつて、当該対象業務に就かせたときは当該決議で定める時間労働したものとみなされることとなるものの範囲\n\n3　対象業務に従事する前号に掲げる労働者の範囲に属する労働者の労働時間として算定される時間\n\n4　対象業務に従事する第2号に掲げる労働者の範囲に属する労働者の労働時間の状況に応じた当該労働者の健康及び福祉を確保するための措置を当該決議で定めるところにより使用者が講ずること。\n5　対象業務に従事する第2号に掲げる労働者の範囲に属する労働者からの苦情の処理に関する措置を当該決議で定めるところにより使用者が講ずること。\n\n6　使用者は、この項の規定により第2号に掲げる労働者の範囲に属する労働者を対象業務に就かせたときは第3号に掲げる時間労働したものとみなすことについて当該労働者の同意を得なければならないこと及び当該同意をしなかつた当該労働者に対して解雇その他不利益な取扱いをしてはならないこと。\n\n7　前各号に掲げるもののほか、厚生労働省令で定める事項\n\n②　前項の委員会は、次の各号に適合するものでなければならない。\n\n1　当該委員会の委員の半数については、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者に厚生労働省令で定めるところにより任期を定めて指名されていること。\n2　当該委員会の議事について、厚生労働省令で定めるところにより、議事録が作成され、かつ、保存されるとともに、当該事業場の労働者に対する周知が図られていること。\n\n3　前2号に掲げるもののほか、厚生労働省令で定める要件\n\n③　厚生労働大臣は、対象業務に従事する労働者の適正な労働条件の確保を図るために、労働政策審議会の意見を聴いて、第1項各号に掲げる事項その他同項の委員会が決議する事項について指針を定め、これを公表するものとする。\n\n④　第1項の規定による届出をした使用者は、厚生労働省令で定めるところにより、定期的に、同項第4号に規定する措置の実施状況を行政官庁に報告しなければならない。\n⑤　第1項の委員会においてその委員の5分の4以上の多数による議決により第32条の2第1項、第32条の3第1項、第32条の4第1項及び第2項、第32条の5第1項、第34条第2項ただし書、第36条第1項、第2項及び第5項、第37条第3項、第38条の2第2項、前条第1項並びに次条第4項、第6項及び第9項ただし書に規定する事項について決議が行われた場合における第32条の2第1項、第32条の3第1項、第32条の4第1項から第3項まで、第32条の5第1項、第34条第2項ただし書、第36条、第37条第3項、第38条の2第2項、前条第1項並びに次条第4項、第6項及び第9項ただし書の規定の適用については、第32条の2第1項中「協定」とあるのは「協定若しくは第38条の4第1項に規定する委員会の決議（第106条第1項を除き、以下「決議」という。）」と、第32条の3第1項、第32条の4第1項から第3項まで、第32条の5第1項、第34条第2項ただし書、第36条第2項及び第5項から第7項まで、第37条第3項、第38条の2第2項、前条第1項並びに次条第4項、第6項及び第9項ただし書中「協定」とあるのは「協定又は決議」と、第32条の4第2項中「同意を得て」とあるのは「同意を得て、又は決議に基づき」と、第36条第1項中「届け出た場合」とあるのは「届け出た場合又は決議を行政官庁に届け出た場合」と、「その協定」とあるのは「その協定又は決議」と、同条第8項中「又は労働者の過半数を代表する者」とあるのは「若しくは労働者の過半数を代表する者又は同項の決議をする委員」と、「当該協定」とあるのは「当該協定又は当該決議」と、同条第9項中「又は労働者の過半数を代表する者」とあるのは「若しくは労働者の過半数を代表する者又は同項の決議をする委員」とする。", "bg": "【1998年改正・2000年施行】本社等で企画・立案・調査・分析を行う労働者について、創造的な能力や主体的な時間配分を活かせる制度を設けた。労使の話合いによって導入する仕組みを重視した。\n【2003年以降】導入手続の見直しなどが続き、現在は対象業務・労使委員会決議・本人同意・健康確保を確認する必要がある。", "deb": "—", "tsu": "【令和5年8月2日 基発0802第7号・2024年4月1日適用】\n企画業務型では、従来の本人同意に加え、同意撤回手続等を決議事項に追加。撤回後の不利益取扱いを避け、記録を決議の有効期間中及び満了後3年間保存する。\n労使委員会の運営規程には6か月以内ごとに1回の開催等を定める。2024年4月以降に有効期間が始まる決議の定期報告は、初回6か月以内に1回、以後1年以内ごとに1回。旧決議には経過措置がある。", "kako": "—", "rows": [19, 20, 21, 22, 23, 24], "ch": 3}, {"key": "h39", "num": [39], "label": "第39条", "caption": "年次有給休暇", "status": null, "sheet": "第36～40条", "scope": "honsoku", "text": "（年次有給休暇）第39条\n使用者は、その雇入れの日から起算して6箇月間継続勤務し全労働日の8割以上出勤した労働者に対して、継続し、又は分割した10労働日の有給休暇を与えなければならない。\n\n②　使用者は、1年6箇月以上継続勤務した労働者に対しては、雇入れの日から起算して6箇月を超えて継続勤務する日（以下「6箇月経過日」という。）から起算した継続勤務年数1年ごとに、前項の日数に、次の表の上欄に掲げる6箇月経過日から起算した継続勤務年数の区分に応じ同表の下欄に掲げる労働日を加算した有給休暇を与えなければならない。ただし、継続勤務した期間を6箇月経過日から1年ごとに区分した各期間（最後に1年未満の期間を生じたときは、当該期間）の初日の前日の属する期間において出勤した日数が全労働日の8割未満である者に対しては、当該初日以後の1年間においては有給休暇を与えることを要しない。\n6箇月経過日から起算した継続勤務年数　労働日\n1年　1労働日\n2年　2労働日\n3年　4労働日\n4年　6労働日\n5年　8労働日\n6年以上　10労働日\n\n③　次に掲げる労働者（1週間の所定労働時間が厚生労働省令で定める時間以上の者を除く。）の有給休暇の日数については、前2項の規定にかかわらず、これらの規定による有給休暇の日数を基準とし、通常の労働者の1週間の所定労働日数として厚生労働省令で定める日数（第1号において「通常の労働者の週所定労働日数」という。）と当該労働者の1週間の所定労働日数又は1週間当たりの平均所定労働日数との比率を考慮して厚生労働省令で定める日数とする。\n\n1　1週間の所定労働日数が通常の労働者の週所定労働日数に比し相当程度少ないものとして厚生労働省令で定める日数以下の労働者\n2　週以外の期間によつて所定労働日数が定められている労働者については、1年間の所定労働日数が、前号の厚生労働省令で定める日数に1日を加えた日数を1週間の所定労働日数とする労働者の1年間の所定労働日数その他の事情を考慮して厚生労働省令で定める日数以下の労働者\n\n④　使用者は、当該事業場に、労働者の過半数で組織する労働組合があるときはその労働組合、労働者の過半数で組織する労働組合がないときは労働者の過半数を代表する者との書面による協定により、次に掲げる事項を定めた場合において、第1号に掲げる労働者の範囲に属する労働者が有給休暇を時間を単位として請求したときは、前3項の規定による有給休暇の日数のうち第2号に掲げる日数については、これらの規定にかかわらず、当該協定で定めるところにより時間を単位として有給休暇を与えることができる。\n\n1　時間を単位として有給休暇を与えることができることとされる労働者の範囲\n2　時間を単位として与えることができることとされる有給休暇の日数（5日以内に限る。）\n\n3　その他厚生労働省令で定める事項\n\n⑤　使用者は、前各項の規定による有給休暇を労働者の請求する時季に与えなければならない。ただし、請求された時季に有給休暇を与えることが事業の正常な運営を妨げる場合においては、他の時季にこれを与えることができる。\n\n⑥　使用者は、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者との書面による協定により、第1項から第3項までの規定による有給休暇を与える時季に関する定めをしたときは、これらの規定による有給休暇の日数のうち5日を超える部分については、前項の規定にかかわらず、その定めにより有給休暇を与えることができる。\n⑦　使用者は、第1項から第3項までの規定による有給休暇（これらの規定により使用者が与えなければならない有給休暇の日数が10労働日以上である労働者に係るものに限る。以下この項及び次項において同じ。）の日数のうち5日については、基準日（継続勤務した期間を6箇月経過日から1年ごとに区分した各期間（最後に1年未満の期間を生じたときは、当該期間）の初日をいう。以下この項において同じ。）から1年以内の期間に、労働者ごとにその時季を定めることにより与えなければならない。ただし、第1項から第3項までの規定による有給休暇を当該有給休暇に係る基準日より前の日から与えることとしたときは、厚生労働省令で定めるところにより、労働者ごとにその時季を定めることにより与えなければならない。\n⑧　前項の規定にかかわらず、第5項又は第6項の規定により第1項から第3項までの規定による有給休暇を与えた場合においては、当該与えた有給休暇の日数（当該日数が5日を超える場合には、5日とする。）分については、時季を定めることにより与えることを要しない。\n⑨　使用者は、第1項から第3項までの規定による有給休暇の期間又は第4項の規定による有給休暇の時間については、就業規則その他これに準ずるもので定めるところにより、それぞれ、平均賃金若しくは所定労働時間労働した場合に支払われる通常の賃金又はこれらの額を基準として厚生労働省令で定めるところにより算定した額の賃金を支払わなければならない。ただし、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者との書面による協定により、その期間又はその時間について、それぞれ、健康保険法（大正11年法律第70号）第40条第1項に規定する標準報酬月額の30分の1に相当する金額（その金額に、5円未満の端数があるときは、これを切り捨て、5円以上10円未満の端数があるときは、これを10円に切り上げるものとする。）又は当該金額を基準として厚生労働省令で定めるところにより算定した金額を支払う旨を定めたときは、これによらなければならない。\n⑩　労働者が業務上負傷し、又は疾病にかかり療養のために休業した期間及び育児休業、介護休業等育児又は家族介護を行う労働者の福祉に関する法律第2条第1号に規定する育児休業又は同条第2号に規定する介護休業をした期間並びに産前産後の女性が第65条の規定によつて休業した期間は、第1項及び第2項の規定の適用については、これを出勤したものとみなす。", "bg": "【制定時】戦後の産業復興の最中でも休暇を法定の権利とし、1947年には1年継続勤務・8割出勤で6日の年次有給休暇を保障した。\n【現在】1987年以降の改正で日数や要件を整え、2018年改正では年休の取得率が低い実態に対応して、年5日の確実な取得を義務付けた。", "deb": "1947年3月22日・貴族院特別委員会\n① 種田虎雄委員は、交通機関などの繁忙期に労働者が休暇を請求すれば業務に支障が出ないかと質問。\n→ 吉武惠市政府委員は、事業の正常な運営を妨げるときは別の時季に与えられると説明した。\n② 東久世通忠委員は、1年契約を更新した人は「継続勤務」になるのかと確認。\n→ 吉武委員は、1年ごとに契約を更新しても引き続き勤務していれば継続勤務と扱うと答えた。\n③ 畠山一清委員長は、未取得年休の時効と、全員の付与起算日を統一できるかを質問。\n→ 寺本廣作政府委員は年休請求権について2年の時効を説明し、吉武委員は労働者に不利とならない前倒し付与による統一を例示した。", "tsu": "【制定時・昭和22年9月13日 発基第17号】①使用者は年次有給休暇を積極的に与える義務がある。②労働者に年休を放棄させたり、年休の日に働くことを条件に割増賃金・手当を支給したりするのは違法。③請求時季を聴く手続は、使用者の負担で簡素化してもよい。④取得した年休の日は、次の年休の出勤率を計算する際は出勤日として扱う。\n【2018年9月7日 基発0907第1号】年10日以上の年休が発生する労働者について、原則として基準日から1年以内に5日取得させる。労働者の指定や計画的付与で既に取った日数は控除し、使用者の時季指定時には労働者の意見を聴き尊重する。\n\n【改廃確認】昭和63年3月14日基発150号・婦発47号の第39条関係＜出勤率の基礎となる全労働日＞は平成25年7月10日基発0710第3号で改正された。制定時解釈・1988年版と区別する。", "kako": "平成29年\n令和元年\n令和2年\n令和3年\n令和4年\n令和6年", "rows": [25, 26, 27, 28, 29, 30, 31, 32], "ch": 3}, {"key": "h40", "num": [40], "label": "第40条", "caption": "労働時間及び休憩の特例", "status": null, "sheet": "第36～40条", "scope": "honsoku", "text": "（労働時間及び休憩の特例）第40条\n別表第1第1号から第3号まで、第6号及び第7号に掲げる事業以外の事業で、公衆の不便を避けるために必要なものその他特殊の必要あるものについては、その必要避くべからざる限度で、第32条から第32条の5までの労働時間及び第34条の休憩に関する規定について、厚生労働省令で別段の定めをすることができる。\n\n②　前項の規定による別段の定めは、この法律で定める基準に近いものであつて、労働者の健康及び福祉を害しないものでなければならない。", "bg": "【制定時】公共交通など公衆の利便と関係する業務や、労働の態様が特殊な事業に、全産業共通の労働時間・休憩規制をそのまま適用しにくい場合がある。ただし例外も必要最小限とし、健康・福祉を害してはならないという歯止めを置く。", "deb": "1947年3月22日・貴族院特別委員会\n種田虎雄委員は、鉄道その他の特殊な事業について、省令などで別の取扱いを認める具体的な準備があるのかと質問した。\n→ 吉武惠市政府委員は、この条文に基づく命令案はまだできていないと率直に答えた。法案成立後、各業界の使用者・労働者の意見を聴き、公聴会も開いて適切な内容を定める方針を示した。", "tsu": "【制定時・昭和22年9月13日 発基第17号】当時の鉄道の特殊日勤勤務、車掌・荷扱手等に関する特別な勤務形態について、許可や対象範囲の考え方を示した。例えば手待時間が常態的に相当あることなどを重視した。\n※これは制定当時の施行規則に対応する歴史的説明である。現在の第40条の特例の対象・時間・手続は現行の労働基準法施行規則等で確認する必要があり、当時の許可制度をそのまま適用しない。", "kako": "令和4年", "rows": [33], "ch": 3}, {"key": "h41", "num": [41], "label": "第41条", "caption": "労働時間等に関する規定の適用除外", "status": null, "sheet": "第41～45条", "scope": "honsoku", "text": "（労働時間等に関する規定の適用除外）\n第41条　この章、第6章及び第6章の2で定める労働時間、休憩及び休日に関する規定は、次の各号の一に該当する労働者については適用しない。\n\n1　別表第1第6号(林業を除く。)又は第7号に掲げる事業に従事する者\n2　事業の種類にかかわらず監督若しくは管理の地位にある者又は機密の事務を取り扱う者\n3　監視又は断続的労働に従事する者で、使用者が行政官庁の許可を受けたもの", "bg": "【1947年制定時】働き方の性質が一般の定時勤務と異なる職種について、労働時間・休憩・休日規制の例外を設けた。ただし、管理監督者等と、許可を要する監視・断続的労働者を区別する。深夜割増賃金や年次有給休暇は、この適用除外だけで消えるものではない。", "deb": "【1947年3月22日・貴族院特別委員会】\n① 種田虎雄委員は、管理監督の地位にある者の適用除外は、官公吏だけでなく一般企業にも及ぶかと質問。\n→ 吉武惠市政府委員は、部課長や秘書などは定型的な労働時間の制限になじみにくいため例外を設け、官公吏にも同様の考え方が及ぶと答えた。\n② 畠山一清委員長は、守衛や料理番を例に挙げて、管理監督者と同じ扱いなのかと確認。\n→ 吉武委員は、守衛は管理監督者ではなく、監視業務として行政官庁の許可が必要な区分だと説明した。\n※当時の答弁の職名だけで、今日の個々の労働者が当然に適用除外となるわけではない。", "tsu": "【昭和22年9月13日 発基第17号・第41条関係】\n① 管理監督者は局長・部長・工場長などを想定するが、地位の名称ではなく、労働条件の決定・労務管理で経営者と一体の立場にあり、出退勤の厳格な制限を受けない実態から判定する。\n② 機密事務従事者は、経営者や管理監督者の活動と一体不可分の秘書等で、出退勤の厳格な制限を受けない者を指す。\n③ 監視業務は、一定場所で監視を主務とし、常態として心身の緊張が少ない仕事。火の番・門番・守衛・メーター監視などは許可対象の例だが、犯罪人の看視や緊張の高い交通監視は許可対象としない。\n④ 断続的労働は実作業より手待時間が多い仕事。事故待機の修繕夫などは許可例。貨物積卸し・寄宿舎の賄人、鉄道踏切番については作業と待機の割合・交通量を踏まえ、危険な汽罐夫等は許可しないと説明した。\n⑤ 宿日直の許可は、原則として通常業務を継続せず、巡視・緊急連絡・非常時の準備等に限る。相当の手当、宿直には睡眠設備が条件。\n⑥ 適用除外者にも深夜割増賃金の規定は残る。\n【昭和63年3月14日 基発150号】役職者すべてが管理監督者になるのではなく、重要な職務・責任、勤務実態、待遇等を踏まえて限定的に判断する（制定時通達を補充する後年の行政解釈）。\n\n【改廃確認】昭和63年3月14日基発150号・婦発47号の一部改正通知が公表されている。管理監督者に関する当時の解釈の存在は厚労省公表抜粋でも確認できるが、通達全体の改廃履歴の網羅確認は別途必要。", "kako": "令和3年\n令和6年", "rows": [5], "ch": 3}, {"key": "h41-2", "num": [41, 2], "label": "第41条の2", "caption": "", "status": null, "sheet": "第41～45条", "scope": "honsoku", "text": "第41条の2　賃金、労働時間その他の当該事業場における労働条件に関する事項を調査審議し、事業主に対し当該事項について意見を述べることを目的とする委員会(使用者及び当該事業場の労働者を代表する者を構成員とするものに限る。)が設置された事業場において、当該委員会がその委員の5分の4以上の多数による議決により次に掲げる事項に関する決議をし、かつ、使用者が、厚生労働省令で定めるところにより当該決議を行政官庁に届け出た場合において、第2号に掲げる労働者の範囲に属する労働者(以下この項において「対象労働者」という。)であつて書面その他の厚生労働省令で定める方法によりその同意を得たものを当該事業場における第1号に掲げる業務に就かせたときは、この章で定める労働時間、休憩、休日及び深夜の割増賃金に関する規定は、対象労働者については適用しない。ただし、第3号から第5号までに規定する措置のいずれかを使用者が講じていない場合は、この限りでない。\n\n1　高度の専門的知識等を必要とし、その性質上従事した時間と従事して得た成果との関連性が通常高くないと認められるものとして厚生労働省令で定める業務のうち、労働者に就かせることとする業務(以下この項において「対象業務」という。)\n2　この項の規定により労働する期間において次のいずれにも該当する労働者であつて、対象業務に就かせようとするものの範囲\nイ　使用者との間の書面その他の厚生労働省令で定める方法による合意に基づき職務が明確に定められていること。\nロ　労働契約により使用者から支払われると見込まれる賃金の額を1年間当たりの賃金の額に換算した額が基準年間平均給与額(厚生労働省において作成する毎月勤労統計における毎月きまつて支給する給与の額を基礎として厚生労働省令で定めるところにより算定した労働者1人当たりの給与の平均額をいう。)の3倍の額を相当程度上回る水準として厚生労働省令で定める額以上であること。\n\n3　対象業務に従事する対象労働者の健康管理を行うために当該対象労働者が事業場内にいた時間(この項の委員会が厚生労働省令で定める労働時間以外の時間を除くことを決議したときは、当該決議に係る時間を除いた時間)と事業場外において労働した時間との合計の時間(第5号ロ及びニ並びに第6号において「健康管理時間」という。)を把握する措置(厚生労働省令で定める方法に限る。)を当該決議で定めるところにより使用者が講ずること。\n4　対象業務に従事する対象労働者に対し、1年間を通じ104日以上、かつ、4週間を通じ4日以上の休日を当該決議及び就業規則その他これに準ずるもので定めるところにより使用者が与えること。\n\n5　対象業務に従事する対象労働者に対し、次のいずれかに該当する措置を当該決議及び就業規則その他これに準ずるもので定めるところにより使用者が講ずること。\nイ　労働者ごとに始業から24時間を経過するまでに厚生労働省令で定める時間以上の継続した休息時間を確保し、かつ、第37条第4項に規定する時刻の間において労働させる回数を1箇月について厚生労働省令で定める回数以内とすること。\nロ　健康管理時間を1箇月又は3箇月についてそれぞれ厚生労働省令で定める時間を超えない範囲内とすること。\nハ　1年に1回以上の継続した2週間(労働者が請求した場合においては、1年に2回以上の継続した1週間)(使用者が当該期間において、第39条の規定による有給休暇を与えたときは、当該有給休暇を与えた日を除く。)について、休日を与えること。\nニ　健康管理時間の状況その他の事項が労働者の健康の保持を考慮して厚生労働省令で定める要件に該当する労働者に健康診断(厚生労働省令で定める項目を含むものに限る。)を実施すること。\n6　対象業務に従事する対象労働者の健康管理時間の状況に応じた当該対象労働者の健康及び福祉を確保するための措置であつて、当該対象労働者に対する有給休暇(第39条の規定による有給休暇を除く。)の付与、健康診断の実施その他の厚生労働省令で定める措置のうち当該決議で定めるものを使用者が講ずること。\n7　対象労働者のこの項の規定による同意の撤回に関する手続\n8　対象業務に従事する対象労働者からの苦情の処理に関する措置を当該決議で定めるところにより使用者が講ずること。\n9　使用者は、この項の規定による同意をしなかつた対象労働者に対して解雇その他不利益な取扱いをしてはならないこと。\n10　前各号に掲げるもののほか、厚生労働省令で定める事項\n\n②　前項の規定による届出をした使用者は、厚生労働省令で定めるところにより、同項第4号から第6号までに規定する措置の実施状況を行政官庁に報告しなければならない。\n③　第38条の4第2項、第3項及び第5項の規定は、第1項の委員会について準用する。\n④　第1項の決議をする委員は、当該決議の内容が前項において準用する第38条の4第3項の指針に適合したものとなるようにしなければならない。\n⑤　行政官庁は、第3項において準用する第38条の4第3項の指針に関し、第1項の決議をする委員に対し、必要な助言及び指導を行うことができる。", "bg": "【2018年改正で創設】時間と成果の結び付きが弱い高度専門業務について、一定の高年収・職務の明確化・本人の同意を条件に、自律的な働き方の選択肢を設ける構想。労働時間規制を外す代わりに、年間104日以上の休日と健康管理時間の把握等を必須とした。", "deb": "【2018年5月2日・衆議院厚生労働委員会（第196回国会第15号、発言070・072）】高度プロフェッショナル制度について、政府側は本人同意、職務範囲の明確化、高年収の要件、年間104日以上・4週4日以上の休日、健康管理時間の把握等による健康確保と、高度専門職が自律的に働く選択肢を設ける趣旨を説明した。牧原秀樹副大臣は対象業務・年収要件について、法律改正なく大幅拡大や引下げはできないとの考えを示した。\n※2018年の法案審議時の政府説明。令和8年時点の制度要件は現行法令・厚労省資料で確認する。", "tsu": "【平成31年3月25日 基発0325第1号（第41条の2関係）】\n① 労使委員会の5分の4以上の決議と届出、対象者本人の同意が必要。決議事項が適正でない場合や、必要な健康管理措置を実施しない場合には適用除外の効力は生じない。\n② 対象業務・対象者は法令で限定し、職務内容を明確化し、年収要件を満たす必要がある。\n③ 年間104日以上かつ4週間4日以上の休日、健康管理時間の把握と選択的な健康確保措置を実施する。\n④ 同意撤回の手続、苦情処理、不利益取扱い禁止なども決議事項である。\n⑤ 第41条とは異なり、要件を満たす場合は深夜割増賃金の規定も適用除外の対象となる。\n※第41条の2そのものの解釈と、労安衛法上の医師面接指導等は法律上の根拠が異なるため区別する。\n\n【公的資料確認】平成31年3月25日基発0325第1号は厚労省原文に掲載される。同制度については別の関連通知に令和8年4月28日最終改正との公表もあるため、2019年通達だけで現在の制度要件を判断しない（同一通達の改正とは区別）。", "kako": "令和2年\n令和6年", "rows": [6, 7, 8, 9], "ch": 3}, {"key": "h42", "num": [42], "label": "第42条", "caption": "", "status": null, "sheet": "第41～45条", "scope": "honsoku", "text": "第42条　労働者の安全及び衛生に関しては、労働安全衛生法(昭和47年法律第57号)の定めるところによる。", "bg": "【1947年制定時】旧第42条は、機械・器具・設備、原材料、ガス・蒸気・粉じん等の危害を防ぐため、使用者に必要な措置を求めていた。\n【1972年改正】重大災害や新しい有害要因に対応するため、安全衛生規定の中心を労働安全衛生法へ移し、労基法第42条は同法への接続規定となった。", "deb": "—", "tsu": "【昭和47年9月18日 発基第91号・労働安全衛生法施行通達（他法の通達）】\n① 技術革新・設備高度化の一方、重大災害や職業病、中小・下請企業での災害が続いた。旧労基法第5章を中心に他の安全衛生関係規制を統合し、責任体制と自主的な安全衛生活動を強化した。\n② 新法は形式上独立したが、労働基準法と一体として運用する。安全衛生も重要な労働条件であり、労基法第1〜3条の理念を基本として扱う。\n※現行第42条に、労安衛法の個別の危険防止義務の全文が記載されているわけではない。", "kako": "—", "rows": [10], "ch": 4}, {"key": "h43-old", "num": [43], "label": "旧第43条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第41～45条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【旧第43条（1972年削除）】制定時の旧条文は、労働者が働く建物と附属建物について換気・採光・照明・保温・防湿・休養・避難・清潔など、健康と生命の維持に必要な措置を使用者に求めていた。安全衛生規制は1972年に労働安全衛生法へ整理された。", "deb": "—", "tsu": "【昭和47年9月18日 発基第91号（労働安全衛生法の施行通達／移管経緯）】旧労基法第42条・第43条の危険防止・衛生基準を拡充し、新技術・新工法・有害物質などに対応する防止基準を整えたと説明。現行の労基法第43条は削除であり、旧条文の義務をそのまま現行条文として扱わない。", "kako": "—", "rows": [11], "ch": 4}, {"key": "h44-old", "num": [44], "label": "旧第44条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第41～45条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【旧第44条（1972年削除）】旧条文は、危害防止のために必要な事項を労働者が遵守する義務を定めていた。1972年の独立法制定で旧第5章の条文配置は整理された。", "deb": "—", "tsu": "【昭和47年9月18日 発基第91号（労働安全衛生法の施行通達／移管経緯）】新法は、最低基準の遵守に加え、事業場の安全衛生責任体制や労働者・関係者の協力を通じて災害防止を図る。旧第44条の具体的義務が現行労基法に存続しているという説明ではない。", "kako": "—", "rows": [12], "ch": 4}, {"key": "h45-old", "num": [45], "label": "旧第45条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第41～45条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【旧第45条（1972年削除）】旧条文は、旧第42・43条の使用者が講じる措置の基準と、旧第44条の労働者が守る事項を命令で定める仕組みだった。1972年に独立した安全衛生法制へ整理された。", "deb": "—", "tsu": "【昭和47年9月18日 発基第91号（労働安全衛生法の施行通達／移管経緯）】機械・建物・有害要因への対応を具体的な防止基準で定め、さらに業種や作業の実態に即した技術上の指針を設ける考えを説明。旧第45条の委任規定と現行労安衛法の詳細な体系は同一ではない。", "kako": "—", "rows": [13], "ch": 4}, {"key": "h46-old", "num": [46], "label": "旧第46条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第46～50条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【1947年制定時の旧第46条】危険な機械・器具は、必要な規格や安全装置を備えていなければ譲渡・貸与・設置を禁止した。特に危険な機械等には、製造・変更・設置前の行政認可も設けた。\n【1972年】旧労基法第5章から独立した労働安全衛生法へ移行。安全な機械を使うだけでなく、市場への流通段階から危険を防ぐという発想が受け継がれた。", "deb": "—", "tsu": "【昭和47年9月18日 発基第91号（労働安全衛生法の施行通達）】\n① 技術革新で設備が高度化する一方、重大災害や中小・下請事業場の事故が続いたことから、従来の労基法第5章を中心に安全衛生制度を強化した。\n② 新法では危険な機械等を種類とリスクに応じて規制し、規格・安全装置、特定機械等の製造・検査制度を整備する。現在の具体的な義務は労基法旧第46条ではなく、労働安全衛生法第37条以下・第42条等で確認する。\n※制定時の旧第46条について、昭和22年発基第17号に独立した逐条解説は確認できない。", "kako": "—", "rows": [5], "ch": 4}, {"key": "h47-old", "num": [47], "label": "旧第47条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第46～50条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【1947年制定時の旧第47条】特に危険な機械・器具について、認可を得て設置した後も、一定期間ごとに性能検査に合格しなければ使用できない仕組みを設けた。検査は行政官庁だけでなく、指定を受けた者も実施できた。\n【1972年】性能検査は労働安全衛生法の特定機械等に関する制度へ移行。", "deb": "—", "tsu": "【昭和47年9月18日 発基第91号（労働安全衛生法の施行通達）】\n特定機械等の設置数が増えたことを受け、新法でも性能検査を行う仕組みを維持し、労働大臣が指定する検査機関の代行を認めた。その一方で、
