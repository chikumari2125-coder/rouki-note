）第36条の規定（新労基法第139条第2項、第140条第2項、第141条第4項及び第142条の規定により読み替えて適用する場合を含む。）は、平成31年4月1日以後の期間のみを定めている協定について適用し、同年3月31日を含む期間を定めている協定については、当該協定に定める期間の初日から起算して1年を経過する日までの間については、なお従前の例による。\n\n（中小事業主に関する経過措置）\n\n第3条\n\n中小事業主（その資本金の額又は出資の総額が300,000,000円（小売業又はサービス業を主たる事業とする事業主については50,000,000円、卸売業を主たる事業とする事業主については100,000,000円）以下である事業主及びその常時使用する労働者の数が300人（小売業を主たる事業とする事業主については50人、卸売業又はサービス業を主たる事業とする事業主については100人）以下である事業主をいう。第4項及び附則第11条において同じ。）の事業に係る協定（新労基法第139条第2項に規定する事業、第140条第2項に規定する業務、第141条第4項に規定する者及び第142条に規定する事業に係るものを除く。）についての前条の規定の適用については、「平成31年4月1日」とあるのは、「令和2年4月1日」とする。\n\n２　前項の規定により読み替えられた前条の規定によりなお従前の例によることとされた協定をする使用者及び労働組合又は労働者の過半数を代表する者は、当該協定をするに当たり、新労基法第36条第1項から第5項までの規定により当該協定に定める労働時間を延長して労働させ、又は休日において労働させることができる時間数を勘案して協定をするように努めなければならない。\n\n３　政府は、前項に規定する者に対し、同項の協定に関して、必要な情報の提供、助言その他の支援を行うものとする。\n\n４　行政官庁は、当分の間、中小事業主に対し新労基法第36条第9項の助言及び指導を行うに当たっては、中小企業における労働時間の動向、人材の確保の状況、取引の実態その他の事情を踏まえて行うよう配慮するものとする。\n\n（年次有給休暇に関する経過措置）\n\n第4条\n\nこの法律の施行の際4月1日以外の日が基準日（継続勤務した期間を労働基準法第39条第2項に規定する6箇月経過日から1年ごとに区分した各期間（最後に1年未満の期間を生じたときは、当該期間をいう。以下この条において同じ。）の初日をいい、同法第39条第1項から第3項までの規定による有給休暇を当該有給休暇に係る当該各期間の初日より前の日から与えることとした場合はその日をいう。以下この条において同じ。）である労働者に係る有給休暇については、この法律の施行の日後の最初の基準日の前日までの間は、新労基法第39条第7項の規定にかかわらず、なお従前の例による。\n\n（検討）\n\n第12条\n\n政府は、この法律の施行後5年を経過した場合において、新労基法第36条の規定について、その施行の状況、労働時間の動向その他の事情を勘案しつつ検討を加え、必要があると認めるときは、その結果に基づいて所要の措置を講ずるものとする。\n\n２　政府は、新労基法第139条に規定する事業及び新労基法第140条に規定する業務に係る新労基法第36条の規定の特例の廃止について、この法律の施行後の労働時間の動向その他の事情を勘案しつつ引き続き検討するものとする。\n\n３　政府は、前2項に定める事項のほか、この法律の施行後5年を目途として、この法律による改正後のそれぞれの法律（以下この項において「改正後の各法律」という。）の規定について、労働者と使用者の協議の促進等を通じて、仕事と生活の調和、労働条件の改善、雇用形態又は就業形態の異なる労働者の間の均衡のとれた待遇の確保その他の労働者の職業生活の充実を図る観点から、改正後の各法律の施行の状況等を勘案しつつ検討を加え、必要があると認めるときは、その結果に基づいて所要の措置を講ずるものとする。\n\n（罰則に関する経過措置）\n\n第29条\n\nこの法律（附則第1条第3号に掲げる規定にあっては、当該規定）の施行前にした行為並びにこの附則の規定によりなお従前の例によることとされる場合及びこの附則の規定によりなおその効力を有することとされる場合におけるこの法律の施行後にした行為に対する罰則の適用については、なお従前の例による。\n\n（政令への委任）\n\n第30条\n\nこの附則に規定するもののほか、この法律の施行に伴い必要な経過措置（罰則に関する経過措置を含む。）は、政令で定める。", "bg": "平成三〇年七月六日法律第七一号\n\n2018年の働き方改革を、36協定の対象期間・中小企業・年休基準日などに応じて段階的に導入した。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 旧制度は境界日を含む36協定で一定期間残る。中小企業の上限規制は2020年4月へ読替え、月60時間超の割増率猶予廃止は2023年4月という別の日付である。", "tsu": "平成30年9月7日 基発0907第1号。\n時間外上限・年休・フレックス・中小企業の割増率猶予の見直しを説明する。A欄の法律全体の施行日と、各制度の経過措置の期間は別に読む。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "k53", "num": null, "label": "令和2年3月31日法律第13号　附則", "caption": "", "status": null, "sheet": "改正法附則51～55", "scope": "kaisei", "text": "令和2年3月31日法律第13号　附則\n【e-Gov掲載範囲】\n\n（施行期日）\n\n第1条\n\nこの法律は、民法の一部を改正する法律（平成29年法律第44号）の施行の日から施行する。\n\n（付加金の支払及び時効に関する経過措置）\n\n第2条\n\nこの法律による改正後の労働基準法（以下この条において「新法」という。）第114条及び第143条第2項の規定は、この法律の施行の日（以下この条において「施行日」という。）以後に新法第114条に規定する違反がある場合における付加金の支払に係る請求について適用し、施行日前にこの法律による改正前の労働基準法第114条に規定する違反があった場合における付加金の支払に係る請求については、なお従前の例による。\n\n２　新法第115条及び第143条第3項の規定は、施行日以後に支払期日が到来する労働基準法の規定による賃金（退職手当を除く。以下この項において同じ。）の請求権の時効について適用し、施行日前に支払期日が到来した同法の規定による賃金の請求権の時効については、なお従前の例による。\n\n（検討）\n\n第3条\n\n政府は、この法律の施行後5年を経過した場合において、この法律による改正後の規定について、その施行の状況を勘案しつつ検討を加え、必要があると認めるときは、その結果に基づいて必要な措置を講ずるものとする。", "bg": "令和二年三月三一日法律第一三号\n\n2020年4月からの賃金時効等の延長を、旧債権・旧違反に遡って一律に適用しないための規定。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 賃金は支払期日、付加金は違反があった日で区切る。施行5年後の検討は、第143条の当分の間3年という規定を自動的に5年へ変えない。\n本法第143条の議論欄に、確認した国会質疑を掲載。", "tsu": "令和2年4月1日 基発0401第27号\n① 賃金（退職手当を除く。）の時効、労働者名簿等の保存、付加金の請求期間は、本則5年を当分の間3年にする。退職手当の時効は5年を維持。\n② 賃金の新期間は2020年4月1日以後に支払期日が来る請求権に適用。付加金は同日以後の違反に適用する。\n③ 施行5年後の検討規定は、暫定3年を自動的に5年へ変える規定ではない。年休等のその他の請求権を3年にする規定でもない。", "kako": "—\n（未確認）", "rows": [11]}, {"key": "k54", "num": null, "label": "令和2年3月31日法律第14号　附則", "caption": "", "status": null, "sheet": "改正法附則51～55", "scope": "kaisei", "text": "令和2年3月31日法律第14号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、令和2年4月1日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　第1条中雇用保険法第19条第1項の改正規定、同法第36条の見出しを削る改正規定並びに同法第48条及び第54条の改正規定並びに同法附則第4条、第5条、第10条及び第11条の2第1項の改正規定並びに附則第10条、第26条及び第28条から第32条までの規定公布の日", "bg": "令和二年三月三一日法律第一四号\n\n法文上の役割：施行期日。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 冒頭の規定は「この法律は、令和二年四月一日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：冒頭の規定は「この法律は、令和二年四月一日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。」と定める。この掲載範囲で決めているのは施行時点であり、改正の政策理由そのものまで書かれているわけではない。", "kako": "—\n（未確認）", "rows": [13]}, {"key": "k55", "num": null, "label": "令和4年6月17日法律第68号　附則", "caption": "", "status": null, "sheet": "改正法附則51～55", "scope": "kaisei", "text": "令和4年6月17日法律第68号　附則\n【e-Gov掲載範囲（抄）】\n\n１　この法律は、刑法等一部改正法施行日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　第509条の規定公布の日", "bg": "令和四年六月一七日法律第六八号\n\n刑法等の改正による拘禁刑への切替えに施行時点を合わせる。A欄は関連する公布済み改正法の附則の掲載部分。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 公布された日から、改正された仕組みはすべて動くのか。\n→ 本則の罰則の名称変更と、施行日の接続を確認する。別法の施行日を引用する条文なので、この行だけで実際の日付まで確定したと扱わない。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：本則の罰則の名称変更と、施行日の接続を確認する。別法の施行日を引用する条文なので、この行だけで実際の日付まで確定したと扱わない。", "kako": "—\n（未確認）", "rows": [14]}, {"key": "k56", "num": null, "label": "令和6年5月31日法律第42号　附則", "caption": "", "status": null, "sheet": "改正法附則56～58", "scope": "kaisei", "text": "令和6年5月31日法律第42号　附則\n【e-Gov掲載範囲（抄）】\n\n（施行期日）\n\n第1条\n\nこの法律は、令和7年4月1日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　第3条中次世代育成支援対策推進法附則第2条第1項の改正規定並びに附則第3条、第8条、第10条及び第13条の規定公布の日\n\n（政令への委任）\n\n第13条\n\nこの附則に定めるもののほか、この法律の施行に伴い必要な経過措置は、政令で定める。", "bg": "令和六年五月三一日法律第四二号\n\n育児・介護休業法等の改正の施行時点と、必要な経過措置の政令への委任を掲載する。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 2025年4月1日という本体の施行日と、公布日から動く例外の規定が分かれる。労基法だけでなく一括改正法全体の附則なので、対象法を確認する。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：2025年4月1日という本体の施行日と、公布日から動く例外の規定が分かれる。労基法だけでなく一括改正法全体の附則なので、対象法を確認する。", "kako": "—\n（未確認）", "rows": [5]}, {"key": "k57", "num": null, "label": "令和8年6月24日法律第46号　附則", "caption": "", "status": null, "sheet": "改正法附則56～58", "scope": "kaisei", "text": "令和8年6月24日法律第46号　附則\n【e-Gov掲載範囲（抄）】\n【2026年公布法：本体の施行状況はB・C欄参照】\n\n（施行期日）\n\n第1条\n\nこの法律は、民法等の一部を改正する法律（令和8年法律第45号。以下「民法等改正法」という。）の施行の日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　附則第5条の規定公布の日\n\n（政令への委任）\n\n第5条\n\n前3条に定めるもののほか、この法律の施行に関し必要な経過措置は、政令で定める。", "bg": "令和八年六月二四日法律第四六号\n\n2026年公布の改正法。民法等改正法の施行日への接続と、経過措置の政令委任を定める。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 本体は引用する別法の施行日に連動し、附則第5条は公布日施行。掲載されていることだけで本体も施行済みと判断しない。具体的な施行日はこの作業では未照合。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：本体は引用する別法の施行日に連動し、附則第5条は公布日施行。掲載されていることだけで本体も施行済みと判断しない。具体的な施行日はこの作業では未照合。", "kako": "—\n（未確認）", "rows": [6]}, {"key": "k58", "num": null, "label": "令和8年7月17日法律第60号　附則", "caption": "", "status": null, "sheet": "改正法附則56～58", "scope": "kaisei", "text": "令和8年7月17日法律第60号　附則\n【e-Gov掲載範囲（抄）】\n【2026年公布法：本体の施行状況はB・C欄参照】\n\n（施行期日）\n\n第1条\n\nこの法律は、令和9年4月1日から施行する。ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n\n1　附則第11条及び第17条の規定公布の日\n\n（政令への委任）\n\n第11条\n\nこの附則に定めるもののほか、この法律の施行に関し必要な経過措置（罰則に関する経過措置を含む。）は、政令で定める。", "bg": "令和八年七月一七日法律第六〇号\n\n2026年公布の改正法。2027年4月1日の本体施行と、先行して動く準備規定を分けている。", "deb": "条文から読む論点（実際の個別質疑は未確認）\n① 新しい法律になれば、既存の関係も一斉に置き換わるのか。\n→ 2026年10月10日時点では本体の2027年4月1日は未到来。附則第11条・第17条は公布日施行なので、将来の施行に向けた経過措置の委任と本体の効力を分ける。", "tsu": "個別の施行通達は未照合。\n法文の適用関係：2026年10月10日時点では本体の2027年4月1日は未到来。附則第11条・第17条は公布日施行なので、将来の施行に向けた経過措置の委任と本体の効力を分ける。", "kako": "—\n（未確認）", "rows": [7]}], "sources": [{"t": "第1〜5条", "kind": "法令原文", "what": "現行労働基準法", "url": "https://www.mhlw.go.jp/web/t_doc?dataId=73022000", "hits": ["h1", "h2", "h3", "h4", "h5"]}, {"t": "第1・3・4・5条", "kind": "議会一次資料", "what": "1947年3月22日 貴族院特別委員会", "url": "https://teikokugikai-i.ndl.go.jp/simple/txt/009203759X00219470322", "hits": ["h1", "h3", "h4", "h5"]}, {"t": "第2条", "kind": "議会一次資料", "what": "1947年3月20日 貴族院特別委員会", "url": "https://teikokugikai-i.ndl.go.jp/simple/detail?minId=009203759X00119470320&spkNum=0", "hits": ["h2"]}, {"t": "第1・3・4・5条", "kind": "通達一次資料", "what": "1947年9月13日 発基第17号", "url": "https://www.mhlw.go.jp/web/t_doc?dataId=00tb1896&dataType=1&pageNo=1", "hits": ["h1", "h3", "h4", "h5"]}, {"t": "第1条", "kind": "過去問", "what": "平成28年", "url": "https://sharoushi.kakomonn.com/questions/26565", "hits": ["h1"]}, {"t": "第1条", "kind": "過去問", "what": "平成30年", "url": "https: <script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const E = {}; D.entries.forEach((e,i) => { e.i = i; E[e.key] = e; });
const SH = {}; D.sheets.forEach(s => SH[s.title] = s);
const ORDER = {honsoku:[], fusoku:[], kaisei:[]};
D.entries.forEach(e => ORDER[e.scope].push(e.key));
const CH = D.chapters;
CH.forEach((c, i) => { c.h = Math.round(45 + i * 20);   /* 45°–305°: keeps chapter hues away from the rose used for past exams */ c.keys = ORDER.honsoku.filter(k => E[k].ch === i); });
const SCOPE_NAME = {honsoku:'本則', fusoku:'本法附則', kaisei:'改正法附則', src:'出典資料'};
const sourcesFor = {}; D.sources.forEach((s,i) => (s.hits||[]).forEach(k => (sourcesFor[k] = sourcesFor[k]||[]).push(i)));
const NOTE_DEB_66 = D.sources.find(s => s.t.startsWith('第66～121条・議論欄'));
const NOTE_DEB_FU = D.sources.find(s => s.t === '附則教材の議論欄');
const NOTE_KAKO_FU = D.sources.find(s => s.t === '附則教材の過去問欄');
const NOTE_KAISEI = D.sources.find(s => s.t === '改正法附則の収録範囲');
const hv = h => `style="--h:${h}"`;

/* ---------- per-browser learning record ---------- */
const STORE = 'lsa-record-v1';
let REC = {};
try { REC = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch(e) { REC = {}; }
let storeOk = true;
function saveRec(){ try { localStorage.setItem(STORE, JSON.stringify(REC)); storeOk = true; } catch(e) { storeOk = false; } }
const rec = k => REC[k] || {};
function setRec(k, patch){ REC[k] = Object.assign({}, REC[k], patch, {t: new Date().toISOString()}); if (!REC[k].st && !REC[k].memo) delete REC[k]; saveRec(); }
let UI = {}; try { UI = JSON.parse(localStorage.getItem('lsa-ui') || '{}') || {}; } catch(e) { UI = {}; }
function saveUI(){ try { localStorage.setItem('lsa-ui', JSON.stringify(UI)); } catch(e) {} }

/* ---------- past exam years ---------- */
const isDash = v => !v || /^[—\-－ー]+$/.test(v.trim());
function kako(e){
  // years in the cell order; other lines (問番号・注記) stay with the year above them
  const lines = (e.kako || '').split('\n').map(x => x.trim()).filter(Boolean);
  const out = {years: [], other: [], dash: false};
  if (!lines.length || lines.every(l => isDash(l) || /^（未確認）$/.test(l))) { out.dash = true; out.raw = lines.join(' '); return out; }
  lines.forEach(l => {
    if (/^(平成|令和)(\d+|元)年(度)?$/.test(l)) out.years.push({y: l, d: []});
    else if (out.years.length) out.years[out.years.length - 1].d.push(l);
    else out.other.push(l);
  });
  return out;
}
const short = y => y.replace('令和', 'R').replace('平成', 'H').replace('元年', '1').replace(/年(度)?$/, '');
function examHtml(e){
  const k = kako(e), sh = SH[e.sheet];
  const note = (sh.notes_top[1] && sh.notes_top[1].startsWith('過去問')) ? sh.notes_top[1] : (NOTE_KAKO_FU ? NOTE_KAKO_FU.what : '');
  let h = `<div class="exam"><span class="lb" title="${esc(note)}">過去問</span>`;
  if (k.dash) h += `<span class="yr none" title="確認済みの資料に記載がない、または確認対象外。未出題の断定ではありません">${esc(k.raw || '—')}　記載なし（未確認を含む）</span>`;
  k.years.forEach(y => {
    h += `<span class="yr ${y.y.startsWith('令和') ? 'r' : 'h'}" title="${esc(y.y)}">${esc(y.y)}</span>`;
    if (y.d.length) h += `<span class="dt">${esc(y.d.join('　'))}</span>`;
  });
  if (k.other.length) h += `<span class="dt">${esc(k.other.join('　'))}</span>`;
  if (k.years.length) h += `<span class="cnt">${k.years.length}回</span>`;
  return h + '</div>';
}

/* ---------- text rendering ---------- */
const CIRC = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const RX_NUM = /(満)?\d[\d,，]*(?:\.\d+)?(?:分の\d[\d,]*|か月|箇月|ヵ月|週間|時間|日分|労働日|日間|年間|日|年|月|週|時|分|歳|才|人|回|割|倍|円|万円|億円|%|％|パーセント|以上|以下|未満|以内)/g;
const RX_SUB = /(使用者|労働者|事業主|行政官庁|厚生労働大臣|都道府県労働局長|労働基準監督署長|労働基準監督官|労働基準主管局長|何人|親権者|後見人|過半数で組織する労働組合|労働者の過半数を代表する者)(?=は|が|も)/g;
const RX_EXC = /(ただし、|ただし書|但し、|この限りでない|を除く|を除き|にかかわらず|場合においては|場合には|次の各号|前項の規定は|適用しない)/g;
let MARKS = {n:false, s:false, x:false};
let CUR = null, SCOPE = 'honsoku';

// where the text being rendered comes from (used to decide whether 「第○条」 means this Act)
let REFCTX = {key:null, field:null, off:false, hist:false, alias:[]};
// individual places where the wording alone does not show that another Act is meant (checked against the Excel text)
const NOLINK = [
  {key:'h93', field:'tsu', at:'第12条の最低基準効'}   // 労働契約法第12条（直前の「労契法第７条・第10条」に続く記述）
];
const OTHER_LAW = /(法律|法|令|規則|則|規程|条約|号)(（[^）]*）|\([^)]*\))?の?$/;
const IS_LSA = /(労働基準法|労基法)(（[^）]*）|\([^)]*\))?の?$/;
// a run of article numbers joined by ・、及び など: 「労働安全衛生法第59条・第60条」の「第60条」も安衛法の条
const CHAIN = /(?:第\d+条(?:の\d+)*(?:第\d+項)?(?:第\d+号)?(?:ただし書)?(?:以下|以降)?\s*(?:[・、，,]|及び|又は|若しくは|並びに|から|乃至|〜|～|~)\s*)+$/;
function findRefs(t0, scope){
  const self = PEEKSELF || CUR, out = [];
  if (REFCTX.off) return out;
  const t = t0.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0));   // same length, so positions stay
  // 「第37条の50％」の「の50」は枝番ではない
  const rx = /(附則)?第(\d+)条((?:の\d+(?![\d％%割倍円]))*)/g; let m;
  const lsa = x => IS_LSA.test(x) || (REFCTX.field !== 'law' && /本法$/.test(x))
    || (REFCTX.alias || []).some(a => x.endsWith(a) || new RegExp(a + '(（[^）]*）)?の?$').test(x));
  while ((m = rx.exec(t))){
    const before = t.slice(Math.max(0, m.index-60), m.index);
    const head = before.replace(CHAIN, '');
    const isLSA = lsa(before) || (head !== before && lsa(head));
    if (scope === 'kaisei' && (!isLSA || /(改正前の|旧)労働基準法(（[^）]*）)?$/.test(head))) continue;
    if (!isLSA && (OTHER_LAW.test(before) || (head !== before && OTHER_LAW.test(head)))) continue;
    if (/(旧|同|改正前の|旧条番号は|旧番号は)$/.test(before)) continue;
    if (/(旧|改正前の)(労働基準法|労基法)(（[^）]*）)?の?$/.test(head)) continue;
    if (REFCTX.rule && /^(第\d+項)?(以下)?[：:は]/.test(t.slice(m.index + m[0].length).replace(/^(の\d+)+/, ''))) continue;
    if (NOLINK.some(o => o.key === REFCTX.key && o.field === REFCTX.field && t0.startsWith(o.at, m.index))) continue;
    const n = +m[2], subs = (m[3].match(/\d+/g)||[]).map(Number);
    const fu = !!m[1] || (scope === 'fusoku' && n >= 122 && !isLSA);
    const pref = fu ? 'f' : 'h';
    const cand = subs.length ? [pref + [n, ...subs].join('-')] : [pref + n, pref + n + '-old'];
    // 本則は第121条まで。第122条以降の労働基準法の条は附則の条
    // ただし改正法附則の条文中の「新法第133条」などは、当時の附則の条（その後に条番号や内容が入れ替わっている場合がある）なのでリンクにしない
    if (!m[1] && n >= 122 && !cand.some(k => E[k]) && !(scope === 'kaisei' && REFCTX.field === 'law')) cand.push('f' + [n, ...subs].join('-'));
    const target = cand.find(k => E[k]);
    if (!target || target === self) continue;
    const km = t.slice(m.index + m[0].length).match(/^第(\d+)項/);
    out.push({s:m.index, e:m.index+m[0].length, kind:'ref', target, kou: km ? +km[1] : 0, hist: REFCTX.hist});
  }
  return out;
}
function marksIn(t){
  const out = [];
  const add = (rx, cls) => { rx.lastIndex = 0; let m; while ((m = rx.exec(t))) out.push({s:m.index, e:m.index+m[0].length, kind:cls}); };
  if (MARKS.n) add(RX_NUM, 'n'); if (MARKS.s) add(RX_SUB, 's'); if (MARKS.x) add(RX_EXC, 'x');
  return out;
}
function inline(t, scope, withMarks){
  const spans = findRefs(t, scope).concat(withMarks ? marksIn(t) : []);
  spans.sort((a,b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  let h = '', pos = 0;
  for (const sp of spans){
    if (sp.s < pos) continue;
    h += esc(t.slice(pos, sp.s));
    const inner = esc(t.slice(sp.s, sp.e));
    if (sp.kind === 'ref') h += `<a class="ref" href="#${sp.target}" data-ref="${sp.target}" data-kou="${sp.kou}" data-from="${scope}"${sp.hist ? ' data-hist="1"' : ''} title="${scope === 'kaisei' ? '現行の本則' + esc(E[sp.target].label) + 'へ移動（この附則が定められた当時の条文とは異なる場合があります）' : esc(E[sp.target].label) + 'へ移動'}">${inner}</a>`;
    else h += `<span class="${sp.kind}">${inner}</span>`;
    pos = sp.e;
  }
  return h + esc(t.slice(pos));
}
// time-point tags 【…】 coloured by what they mark
function tagClass(x){
  if (/削除|廃止|範囲外|旧規定|旧条文|旧第|旧法|猶予廃止|失効/.test(x)) return 'gone';
  if (/現行|現在|掲載条文|e-Gov掲載/.test(x)) return 'now';
  if (/改正|\d{4}年(?!3月|制定)|施行/.test(x) && !/制定時|1947|1946|草案|法案/.test(x)) return 'amend';
  return 'old';
}
const tagHtml = x => `<span class="tag ${tagClass(x)}">【${esc(x)}】</span>`;
function lawHtml(e){
  let h = '';
  const keep = REFCTX;
  REFCTX = {key:e.key, field:'law', off:false, hist: e.scope === 'fusoku' && !!e.status && tagClass(e.status) === 'gone',

function segsFor(k, full){
  // keep a line only where its text still matches (the workbook may be revised later)
  const out = [];
  (HL[k] || []).forEach(([s, e, c, t]) => {
    if (full.slice(s, e) === t) { out.push([s, e, c, t]); return; }
    let best = -1, i = full.indexOf(t);
    while (i >= 0){ if (best < 0 || Math.abs(i - s) < Math.abs(best - s)) best = i; i = full.indexOf(t, i + 1); }
    if (best >= 0 && t) out.push([best, best + t.length, c, t]);
  });
  return out;
}
function cutSegs(segs, a, b){
  const out = [];
  segs.forEach(([s, e, c]) => { if (e <= a || s >= b) out.push([s, e, c]); else { if (s < a) out.push([s, a, c]); if (e > b) out.push([b, e, c]); } });
  return out;
}
function tidy(segs, full){
  segs.sort((x, y) => x[0] - y[0]);
  const out = [];
  segs.forEach(([s, e, c]) => { if (e <= s) return; const l = out[out.length - 1]; if (l && l[2] === c && l[1] >= s) l[1] = Math.max(l[1], e); else out.push([s, e, c]); });

}
function paintHL(live){
  const el = $('#law'); if (!el || !CUR) return;
  el.querySelectorAll('mark.hl').forEach(m => m.replaceWith(...m.childNodes)); el.normalize();
  const full = el.textContent, segs = live || segsFor(CUR, full);
  if (!segs.length) return;
  const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = []; let n;
  while ((n = tw.nextNode())) nodes.push(n);
  let pos = 0;
  nodes.forEach(nd => {
    const t = nd.data, a = pos, b = pos + t.length; pos = b;
    const hit = segs.filter(([s, e]) => s < b && e > a); if (!hit.length) return;
    const fr = document.createDocumentFragment(); let p = 0;
    hit.forEach(([s, e, c]) => {
      const x = Math.max(s, a) - a, y = Math.min(e, b) - a;
      if (x > p) fr.appendChild(document.createTextNode(t.slice(p, x)));
      const m = document.createElement('mark'); m.className = 'hl c' + c; m.textContent = t.slice(x, y); fr.appendChild(m); p = y;

}

function caretAt(x, y){

  else if (document.caretRangeFromPoint){ const c = document.caretRangeFromPoint(x, y); if (!c) return null; node = c.startContainer; off = c.startOffset; }
  else return null;

}
let DRAG = null;
function liveSegs(){
  const full = $('#law').textContent, base = segsFor(CUR, full).map(x => x.slice(0, 3));
  const a = Math.min(DRAG.a, DRAG.b), b = Math.max(DRAG.a, DRAG.b);

function endDrag(ev, cancel){

/* ---------- search ---------- */
const NFKC = s => (s || '').normalize('NFKC').replace(/\s+/g, '');
const IDX = D.entries.map(e => ({e, f:{条文:NFKC(e.text), 背景:NFKC(e.bg), 議論:NFKC(e.deb), 通達:NFKC(e.tsu), 過去問:NFKC(e.kako)}, label:NFKC(e.label + e.caption)}));
function search(q0){
  CUR = null; renderList();
  const q = NFKC(q0);
  crumb('検索：' + esc(q0));
  if (!q){ home(); return; }
  const m = q.match(/^(附則)?第?(\d+)条?((?:の\d+)*)$/);
  let exact = [];
  if (m){
    const want = [+m[2], ...(m[3].match(/\d+/g)||[]).map(Number)].join('-');
    exact = D.entries.filter(e => e.num && e.num.join('-') === want && (m[1] ? e.scope === 'fusoku' : true));
  }
  const hits = IDX.filter(x => !exact.includes(x.e) && (x.label.includes(q) || Object.values(x.f).some(v => v.includes(q))));
  const res = exact.map(e => IDX[e.i]).concat(hits);
  const snip = x => { for (const [name, v] of Object.entries(x.f)){ const i = v.indexOf(q); if (i >= 0) return `［${name}］` + esc(v.slice(Math.max(0,i-30), i)) + '<mark>' + esc(q) + '</mark>' + esc(v.slice(i+q.length, i+q.length+50)); } return ''; };
  $('#page').innerHTML = `<div class="doc"><h1>検索結果</h1><p class="saved">「${esc(q0)}」　${res.length}件（条文原文・背景・議論・通達・過去問の各欄が対象）</p>
    <div class="hits">${res.map(x => { const c = x.e.ch !== undefined ? CH[x.e.ch] : null; return `<button class="hit" data-go="${x.e.key}"><b>${esc(x.e.label)}</b><small>${c ? esc(c.no) + '　' : ''}${SCOPE_NAME[x.e.scope]}${x.e.caption ? '　' + esc(x.e.caption) : ''}</small><span>${snip(x)}</span></button>`; }).join('') || '<p class="none">見つかりませんでした。語句を短くしてお試しください。</p>'}</div></div>`;
  $('#main').scrollTop = 0; closeSide();
}

/* ---------- routing & events ---------- */
function route(){
  const h = decodeURIComponent((location.hash || '').slice(1));
  if (!h || h === 'home') return home();
  if (h === 'records') return records();
  if (h === 'about') return about();
  if (h === 'src') return sourcesPage('');
  if (h.startsWith('q=')) return search(h.slice(2));
  const cm = h.match(/^ch(\d+)$/); if (cm) return chapterPage(+cm[1]);
  if (E[h]) return article(h);
  if (h.startsWith('memo-') || h.startsWith('s-')) return;
  home();
}
function go(t){ if (location.hash === '#' + t) route(); else location.hash = t; }
window.addEventListener('hashchange', () => { closePeek(); route(); syncBack(); });
const narrow = () => window.matchMedia('(max-width:900px)').matches;
function closeSide(){ $('#side').classList.remove('open'); }
function setCollapsed(b){ $('.app').classList.toggle('collapsed', b); UI.collapsed = b; saveUI(); }
$('#menu').addEventListener('click', () => { if (narrow()) $('#side').classList.toggle('open'); else setCollapsed(!$('.app').classList.contains('collapsed')); });
$('#sideclose').addEventListener('click', ev => { ev.stopPropagation(); if (narrow()) closeSide(); else setCollapsed(true); });
$('#scrim').addEventListener('click', closeSide);
$('#peekscrim').addEventListener('click', closePeek);
if (UI.collapsed) $('.app').classList.add('collapsed');
// swipe the list to the left to put it away (phone)
let sx = null, sy = null;
$('#side').addEventListener('touchstart', ev => { sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; }, {passive:true});
$('#side').addEventListener('touchend', ev => { if (sx === null) return; const dx = ev.changedTouches[0].clientX - sx, dy = ev.changedTouches[0].clientY - sy; sx = null;
  if (dx < -70 && Math.abs(dy) < Math.abs(dx) * 0.6) closeSide(); }, {passive:true});
document.addEventListener('click', ev => {
  const a = ev.target.closest('a[href^="#s-"],a[href^="#memo-"]');
  if (a){ ev.preventDefault(); const el = document.getElementById(a.getAttribute('href').slice(1)); if (el){ if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({behavior:'smooth', block:'start'}); } return; }
  const chh = ev.target.closest('.chh');
  if (chh){ const i = chh.dataset.ch; UI.open = UI.open || {}; const open = chh.getAttribute('aria-expanded') === 'true';
    if (open) { delete UI.open[i]; saveUI(); if (CUR && String(E[CUR].ch) === i) { CUR = null; } renderList(); return; }
    UI.open[i] = true; saveUI(); return go('ch' + i); }
  const rf = ev.target.closest('a.ref[data-ref]');
  if (rf){ ev.preventDefault(); openPeek(rf.dataset.ref, +rf.dataset.kou || 0, rf.dataset.from, rf.dataset.hist === '1'); return; }
  const bc = ev.target.closest('#backchip');
  if (bc){ if (ev.target.closest('[data-x]')) { RET = null; syncBack(); return; }
    const r = RET; RET = null; slide(r.key, -1); setTimeout(() => { if (CUR === r.key) $('#main').scrollTop = r.y; }, 420); syncBack(); return; }
  const hb = ev.target.closest('[data-hl]'); if (hb){ HLMODE = HLMODE === hb.dataset.hl ? '' : hb.dataset.hl; HLCLR = 0; syncHL(); return; }
  const hc = ev.target.closest('[data-hlc]'); if (hc){ HLCOL = +hc.dataset.hlc; try{ localStorage.setItem('lsa-hlcol', HLCOL); }catch(e){} syncHL(); return; }
  const hx = ev.target.closest('[data-hlclear]');
  if (hx && CUR){ if (!HLCLR){ HLCLR = 1; hx.textContent = 'もう一度押すと全部消えます'; clearTimeout(hx._t); hx._t = setTimeout(() => { HLCLR = 0; syncHL(); }, 3000); return; }
    HLCLR = 0; delete HL[CUR]; saveHL(); paintHL(); syncHL(); renderList(); return; }
  const sl = ev.target.closest('[data-slide]'); if (sl){ if (sl.dataset.slide) slide(sl.dataset.slide, +sl.dataset.dir); return; }
  const g = ev.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }
  const sc = ev.target.closest('[data-scope]');
  if (sc){ SCOPE = sc.dataset.scope; if (SCOPE === 'src') go('src'); else { renderList(); if (!CUR || E[CUR].scope !== SCOPE) go(SCOPE === 'honsoku' ? 'home' : ORDER[SCOPE][0]); } return; }
  const st = ev.target.closest('[data-st]');
  if (st && CUR){ const v = st.dataset.st; setRec(CUR, {st: rec(CUR).st === v ? null : v});
    document.querySelectorAll('[data-st]').forEach(b => b.setAttribute('aria-pressed', rec(CUR).st === b.dataset.st)); renderList(); return; }
  const mk = ev.target.closest('[data-mark]');
  if (mk && CUR){ MARKS[mk.dataset.mark] = !MARKS[mk.dataset.mark]; try{ localStorage.setItem('lsa-marks', JSON.stringify(MARKS)); }catch(e){}
    const y = $('#main').scrollTop; article(CUR); $('#main').scrollTop = y; return; }
});
$('#sform').addEventListener('submit', ev => { ev.preventDefault(); const v = $('#q').value.trim(); if (v) go('q=' + v); });
['#f-rev','#f-memo','#f-ex'].forEach(id => $(id).addEventListener('change', renderList));
$('#f-now').checked = !!UI.now;
$('#f-now').addEventListener('change', () => { UI.now = $('#f-now').checked; saveUI();
  if (CUR) { const y = $('#main').scrollTop, open = $('#side').classList.contains('open'); article(CUR); $('#main').scrollTop = y; if (open) $('#side').classList.add('open'); } else renderList(); });
const fsz = $('#fsz');
function applyFs(b){ document.documentElement.classList.toggle('big', b); fsz.setAttribute('aria-pressed', b); }
try { applyFs(JSON.parse(localStorage.getItem('lsa-big') || 'false')); MARKS = Object.assign(MARKS, JSON.parse(localStorage.getItem('lsa-marks') || '{}')); } catch(e) {}
const thm = $('#thm'), THM = {light:'ライト', dark:'ダーク', auto:'端末'};
function applyTheme(t){ if (!THM[t]) t = 'light'; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); thm.textContent = '表示 ' + THM[t]; thm.dataset.t = t; }
try { applyTheme(localStorage.getItem('lsa-theme') || 'light'); } catch(e) { applyTheme('light'); }
thm.addEventListener('click', () => { const nx = {light:'dark', dark:'auto', auto:'light'}[thm.dataset.t]; applyTheme(nx); try{ localStorage.setItem('lsa-theme', nx); }catch(e){} });
fsz.addEventListener('click', () => { const b = !document.documentElement.classList.contains('big'); applyFs(b); try{ localStorage.setItem('lsa-big', JSON.stringify(b)); }catch(e){} });
document.addEventListener('keydown', ev => {
  if (PEEK.length){ if (ev.key === 'Escape') closePeek(); return; }
  if (!CUR || /input|textarea/i.test(document.activeElement.tagName)) return;
  const nb = neighbours(CUR);
  if (ev.key === 'ArrowRight' && nb.next) slide(nb.next.key, 1);
  if (ev.key === 'ArrowLeft' && nb.prev) slide(nb.prev.key, -1);
});
/* slide to the neighbouring article: the page moves out to one side and the next one comes in from the other */
let sliding = false;
const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function slide(key, dir){
  const pg = $('#page');
  if (sliding) return;
  if (reduced() || !pg.animate){ go(key); return; }
  sliding = true;
  pg.animate([{transform:'translateX(0)', opacity:1}, {transform:`translateX(${-dir * 48}px)`, opacity:0}], {duration:150, easing:'ease-in'})
    .finished.then(() => {
      go(key);
      pg.animate([{transform:`translateX(${dir * 48}px)`, opacity:0}, {transform:'translateX(0)', opacity:1}], {duration:200, easing:'ease-out'})
        .finished.then(() => { sliding = false; }, () => { sliding = false; });
    }, () => { sliding = false; go(key); });
}
// swipe on touch screens (tables that scroll sideways are left alone)
let tx = null, ty = null;
$('#page').addEventListener('touchstart', ev => { if (ev.target.closest('.tw,textarea,input,.hlbar') || (HLMODE && ev.target.closest('#law'))) { tx = null; return; } tx = ev.touches[0].clientX; ty = ev.touches[0].clientY; }, {passive:true});
$('#page').addEventListener('touchend', ev => {
  if (tx === null || !CUR) return;
  const dx = ev.changedTouches[0].clientX - tx, dy = ev.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
  const nb = neighbours(CUR);
  if (dx < 0 && nb.next) slide(nb.next.key, 1);
  if (dx > 0 && nb.prev) slide(nb.prev.key, -1);
}, {passive:true});
route();
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
