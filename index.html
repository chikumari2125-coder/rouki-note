検査や検定を代行する機関の監督規定を整備・強化した。\n※現在の検査証の有効期間・性能検査の実施主体等は、労働安全衛生法第41条と現行の関係法令で判断する。旧制度の「認可」の文言をそのまま現在へ移さない。", "kako": "—", "rows": [6], "ch": 4}, {"key": "h48-old", "num": [48], "label": "旧第48条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第46～50条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【1947年制定時の旧第48条】黄りんマッチなど、著しく有害な物の製造・販売・輸入・販売目的の所持を禁止した。働く人の安全を工場内の作業方法だけで守るのではなく、危険な製品や有害物そのものの流通にも規制を及ぼした。\n【1972年】有害物の製造等の禁止は、労働安全衛生法の規制体系へ移行。", "deb": "—", "tsu": "【昭和47年9月18日 発基第91号（労働安全衛生法の施行通達）】\n有害な化学物質の利用拡大による新しい災害・職業病を、新法制定の重要な背景の一つとした。旧法にあった有害物への流通段階からの規制を、労働安全衛生法上の製造等禁止・許可等の制度とともに扱う。\n※現行の禁止物質や行為の範囲は労働安全衛生法第55条等および政令により確認する。旧第48条の列挙を現在の禁止物質一覧とは扱わない。", "kako": "—", "rows": [7], "ch": 4}, {"key": "h49-old", "num": [49], "label": "旧第49条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第46～50条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【1947年制定時の旧第49条】経験のない労働者に、運転中の機械の危険部分の掃除・修理、ベルト等の着脱、動力によるクレーン運転などをさせることを禁止した。特に危険な業務には必要な技能のない者を就かせないと定め、安全対策を作業者の経験・技能にも及ぼした。\n【1972年】危険業務に必要な資格や特別教育等を含む、安全衛生法上の就業管理へ移行。", "deb": "—", "tsu": "【昭和47年9月18日 発基第91号（労働安全衛生法の施行通達）】\n制定時には、労働災害を受けやすい未熟練労働者の増大も問題として挙げられた。新法では危険・有害な作業に就く者への教育や、特に危険な業務の資格・技能に基づく就業制限の仕組みを整えた。\n※現行の対象業務は、労働安全衛生法第59条第3項・第61条および関係規則で判断し、旧第49条の列挙と同一視しない。", "kako": "—", "rows": [8], "ch": 4}, {"key": "h50-old", "num": [50], "label": "旧第50条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第46～50条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【1947年制定時の旧第50条】採用時に、従事する業務に必要な安全・衛生教育を使用者へ義務付けた。単に設備を整えるだけでなく、作業者が危険を理解し、安全な操作・衛生行動を身に付けることを重視。\n【1972年】安全衛生教育は、労働安全衛生法第59条などへ移行し、作業内容変更時の教育等も体系化された。", "deb": "【1947年3月22日・貴族院労働基準法案特別委員会】\n① 渡邉覺造委員は「第50条の『衛生のための教育』とは具体的に何をするのか」と質問した。\n→ 吉武惠市政府委員は、工場に入った労働者へ教育を行わなければ、けがや職業病につながると説明。戦前から行ってきた安全運動にも触れ、化学工場などでは、マスクを着ける場面や手を洗うべき場面を教育することが必要だと答弁した。\n※抽象的な「教育義務」を、実際の工場作業に即して説明した質疑である。", "tsu": "【昭和47年9月18日 基発第602号（労働安全衛生法・同施行令の施行通達）】\n① 現行の労働安全衛生法第59条・第60条による安全衛生教育は、労働災害を防ぐため事業者の責任で実施する。\n② 教育は原則として所定労働時間内に行い、教育時間は労働時間に当たる。法定時間外に実施すれば、法令所定の割増賃金の支払が必要である。\n③ 法定の特別教育・職長教育を社外で受けさせる場合、講習会費や必要な旅費等は事業者が負担する。\n※これは現行の労働安全衛生法の制度についての通達であり、旧労基法第50条そのものの施行通達ではない。", "kako": "—", "rows": [9], "ch": 4}, {"key": "h51-old", "num": [51], "label": "旧第51条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第51～55条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【旧第51条：病者の就業禁止】\n1947年の法案は、感染性の疾病や労働によって悪化するおそれのある疾病等について就業を禁止し、対象となる疾病の種類・程度を命令に委ねた。病名だけで一律に判断する条文構造ではなく、具体的範囲を下位規範で定める仕組みだった。\n1972年の労働安全衛生法制定に伴い、労基法の旧第43〜55条は削除された（同法附則第4条、1972年10月1日施行）。以下は削除前の制度の立法史である。", "deb": "—", "tsu": "—", "kako": "—", "rows": [5], "ch": 4}, {"key": "h52-old", "num": [52], "label": "旧第52条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第51～55条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【旧第52条：健康診断】\n1947年の法案は、一定の事業で雇入れ時・定期の医師による健診を義務付けた。会社指定医を希望しない労働者には、他の医師による結果の証明書を提出する道を認め、使用者には配置転換・時間短縮等の事後措置を求めた。診断と、その結果を仕事の改善に結び付ける義務を一体で置いた。\n1972年の労働安全衛生法制定に伴い、労基法の旧第43〜55条は削除された（同法附則第4条、1972年10月1日施行）。以下は削除前の制度の立法史である。", "deb": "【1947年3月22日・貴族院委員会】\n質問：渡邉覺造・種田虎雄は、別の医師の診断を認めると、会社の健診を避けたり、不正確な証明で休業等を求めたりするおそれがないかと追及した。\n答弁：吉武惠市は、健診を受ける義務と、会社指定の医師を受診する義務は別だと説明した。会社側の医師が労働者の疾病を十分に明らかにしない場合も考えられ、労働者が信頼する医師を選ぶ道が必要だという。健診は職場の健康保護のための制度であり、健康保険の給付や休業の認定とは区別して扱うとした。\n再質問：畠山一清委員長は、病気を発見しても療養施設や治療が足りなければ、かえって不安を生まないかと尋ねた。\n答弁：吉武は、形式だけの健診では足りず、診断後の職場改善、業務の転換、時間短縮等を進める必要があると説明した。療養施設の整備も必要だが、一挙に十分な体制を整えられる状況ではなく、漸次改善を指導する考えを示した。\n※当時の答弁を現代語で整理。現在の適用根拠は安衛法。", "tsu": "—", "kako": "—", "rows": [6], "ch": 4}, {"key": "h53-old", "num": [53], "label": "旧第53条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第51～55条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【旧第53条：安全管理者・衛生管理者】\n1947年の法案は、一定の事業に安全管理者・衛生管理者の選任を求めた。事業の種類・規模、資格・職務を命令に委ねる一方、行政官庁には必要に応じた増員・解任命令の権限を与えた。管理を担当する者を事業場に置くことで、安全衛生の実施体制を制度化する構造である。\n1972年の労働安全衛生法制定に伴い、労基法の旧第43〜55条は削除された（同法附則第4条、1972年10月1日施行）。以下は削除前の制度の立法史である。", "deb": "—", "tsu": "—", "kako": "—", "rows": [7], "ch": 4}, {"key": "h54-old", "num": [54], "label": "旧第54条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第51～55条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【旧第54条：計画段階の監督措置】\n1947年の法案は、常時10人以上の事業や命令で定める危険・有害な事業について、建設物・寄宿舎・設備等の設置、移転、変更の計画を着工14日前までに届け出させた。行政官庁は着工の差止めや計画変更を命じることができた。\n1952年改正では、危険・有害なものを除く仮設建設物等を届出の例外とするただし書を加えた（昭和27年法律第287号）。\n1972年の労働安全衛生法制定に伴い、労基法の旧第43〜55条は削除された（同法附則第4条、1972年10月1日施行）。以下は削除前の制度の立法史である。", "deb": "—", "tsu": "—", "kako": "—", "rows": [8], "ch": 4}, {"key": "h55-old", "num": [55], "label": "旧第55条", "caption": "第43条から第55条まで　削除", "status": "削除", "sheet": "第51～55条", "scope": "honsoku", "text": "第43条から第55条まで　削除", "bg": "【旧第55条：基準違反への監督措置】\n1947年の法案は、建設物・設備・原材料等が安全衛生基準に反するとき、行政官庁が使用者に使用停止・変更等を命じる仕組みを置いた。さらに、その命令を実効あるものとするため、労働者にも必要な事項を命じることができた。計画段階を扱う旧第54条に対し、基準違反の状態に対する措置を扱った。\n1972年の労働安全衛生法制定に伴い、労基法の旧第43〜55条は削除された（同法附則第4条、1972年10月1日施行）。以下は削除前の制度の立法史である。", "deb": "【1947年3月22日・貴族院委員会】\n質問：種田虎雄は、第2項にいう「労働者に命ずる」とは、どのような場合を想定しているのかと尋ねた。\n答弁：寺本廣作は、建物や機械が基準に反している場合、使用者に使用停止等を命じるだけでなく、労働者にも、その機械等を使わないよう命じる場合があると説明した。\n確認：種田が、労働者には結局「それを使ってはいけない」と命じる趣旨かと確認し、寺本はその理解でよいと答えた。\n※当時の質疑を現代語で整理。", "tsu": "—", "kako": "—", "rows": [9], "ch": 4}, {"key": "h56", "num": [56], "label": "第56条", "caption": "最低年齢", "status": null, "sheet": "第56～60条", "scope": "honsoku", "text": "（最低年齢）\n第56条　使用者は、児童が満15歳に達した日以後の最初の3月31日が終了するまで、これを使用してはならない。\n②　前項の規定にかかわらず、別表第1第1号から第5号までに掲げる事業以外の事業に係る職業で、児童の健康及び福祉に有害でなく、かつ、その労働が軽易なものについては、行政官庁の許可を受けて、満13歳以上の児童をその者の修学時間外に使用することができる。映画の製作又は演劇の事業については、満13歳に満たない児童についても、同様とする。", "bg": "【制定時：教育との両立】\n1947年の法案は原則15歳を最低年齢とし、一定の義務教育課程を修了した14歳以上の者の例外と、非工業的事業等での12歳以上の軽易な労働の許可制を置いた。教育を損なわないかが審議の争点となった。\n【改正】\n1952年改正で14歳以上の課程修了者の例外を削除。1998年改正は、原則の禁止期間を「15歳に達した日以後の最初の3月31日が終了するまで」に改め、軽易な労働の許可対象を12歳から13歳へ引き上げた。この最低年齢に関する部分は2000年4月1日施行。映画・演劇には年齢に関する別の例外が残る。", "deb": "【1947年3月13日・衆議院委員会】\n質問：野本品吉は、12歳以上の児童の就労を例外として認めると、過去の児童労働と同じように教育を受けられない子が生じないかと懸念した。\n答弁：吉武惠市は、健康・福祉に有害でない軽易な労働を、修学時間外に限って認める仕組みであり、第60条では授業時間も労働時間と通算して1日7時間以内とする、と説明した。\n文部省側の答弁：剣木亨弘は、教育の立場からは児童が十分に就学できることを望む一方、社会の実情から例外を全くなくすことは難しいとした。就学を支える措置と、教育を妨げる就労を防ぐ学校教育法側の規律を通じて、教育の確保を図る考えを述べた。\n再質問：野本は、制度を作るだけでなく、教育が実際に妨げられないよう徹底して運用する必要があると求めた。\n※「12歳」は制定時の法案。現在の許可対象の原則は13歳以上。", "tsu": "—", "kako": "平成29年\n令和6年", "rows": [5], "ch": 5}, {"key": "h57", "num": [57], "label": "第57条", "caption": "年少者の証明書", "status": null, "sheet": "第56～60条", "scope": "honsoku", "text": "（年少者の証明書）\n第57条　使用者は、満18才に満たない者について、その年齢を証明する戸籍証明書を事業場に備え付けなければならない。\n②　使用者は、前条第2項の規定によつて使用する児童については、修学に差し支えないことを証明する学校長の証明書及び親権者又は後見人の同意書を事業場に備え付けなければならない。", "bg": "【制定時】\n1947年の法案から、18歳未満の者の年齢証明書を事業場に備え付ける義務が置かれていた。また、最低年齢の例外により働く児童には、年齢証明に加え、学校長による修学に差し支えない旨の証明と、親権者・後見人の同意書を求めた。年齢と就学への影響を、使用者が確認できるようにする構造である。\n【運用】\n1975年通達は、年齢確認に必要な氏名・出生年月日の住民票記載事項の証明書で足りるとし、戸籍等の画一的な提出要求を避ける取扱いを示した。", "deb": "【1947年3月22日・貴族院委員会】\n質問：種田虎雄は、戸籍証明書を備え付ける義務は、18歳未満の者だけに課されるのかと確認した。\n答弁：寺本廣作は、そのとおりであると答えた。\nこの質疑は年齢証明義務の対象を確認したもの。住民票記載事項証明書による代替は、この答弁ではなく、後の通達で整理されている。", "tsu": "【1975年2月17日・基発第83号／婦発第40号】\n年少者の年齢証明には、戸籍謄抄本等に代えて、氏名と出生年月日について証明された「住民票記載事項の証明書」を備えれば足りる。\n戸籍謄抄本や住民票の写しを画一的に提出・提示させず、具体的に必要になった時点で、その必要性に応じて使用目的を本人に十分説明し、提示を求める。確認後は速やかに返却するよう指導する。就業規則等で一般的な提出を求めている場合も、可能な限り記載事項の証明書による処理へ変更するよう指導する。\n※厚労省掲載の現行整理版「一 イ・ハ・ニ」を現代語化。削除された「ロ」は復元しない。\n\n【改正履歴】昭和50年2月17日基発83号・婦発40号は厚労省の都道府県労働局公開資料で原文と平成9年2月21日の改正を確認。削除済みの旧『ロ』の内容を現行解釈として復元しない。", "kako": "平成29年", "rows": [6], "ch": 5}, {"key": "h58", "num": [58], "label": "第58条", "caption": "未成年者の労働契約", "status": null, "sheet": "第56～60条", "scope": "honsoku", "text": "（未成年者の労働契約）\n第58条　親権者又は後見人は、未成年者に代つて労働契約を締結してはならない。\n②　親権者若しくは後見人又は行政官庁は、労働契約が未成年者に不利であると認める場合においては、将来に向つてこれを解除することができる。", "bg": "【制定時】\n1947年の法案は、親権者・後見人が未成年者に代わって労働契約を締結することを禁止した。同時に、未成年者に不利な契約には、親権者・後見人だけでなく行政官庁も、将来に向かって解除できる仕組みを置いた。\n条文構造としては、本人による契約と、不利な契約から離脱するための保護を組み合わせている。これは条文からの整理であり、個別の制定理由についての答弁としては扱わない。第57条第2項の「同意書」と、本人に代わる「契約締結」は区別して読む。", "deb": "—", "tsu": "—", "kako": "—", "rows": [7], "ch": 5}, {"key": "h59", "num": [59], "label": "第59条", "caption": "", "status": null, "sheet": "第56～60条", "scope": "honsoku", "text": "第59条　未成年者は、独立して賃金を請求することができる。親権者又は後見人は、未成年者の賃金を代つて受け取つてはならない。", "bg": "【制定時】\n1947年の法案から、未成年者は独立して賃金を請求でき、親権者・後見人が代わって受け取ることはできないとされた。\n条文構造としては、第58条で本人による契約を確保し、本条で本人による賃金請求と受領を保護する関係にある。これは条文相互の関係からの整理であり、個別の制定理由についての発言を確認したものではない。条文上、本条には独立の見出しが付いていないため、原文欄にも見出しを補っていない。", "deb": "—", "tsu": "—", "kako": "—", "rows": [8], "ch": 5}, {"key": "h60", "num": [60], "label": "第60条", "caption": "労働時間及び休日", "status": null, "sheet": "第56～60条", "scope": "honsoku", "text": "（労働時間及び休日）\n第60条　第32条の2から第32条の5まで、第36条、第40条及び第41条の2の規定は、満18才に満たない者については、これを適用しない。\n②　第56条第2項の規定によつて使用する児童についての第32条の規定の適用については、同条第1項中「1週間について40時間」とあるのは「、修学時間を通算して1週間について40時間」と、同条第2項中「1日について8時間」とあるのは「、修学時間を通算して1日について7時間」とする。\n③　使用者は、第32条の規定にかかわらず、満15歳以上で満18歳に満たない者については、満18歳に達するまでの間（満15歳に達した日以後の最初の3月31日までの間を除く。）、次に定めるところにより、労働させることができる。\n1　1週間の労働時間が第32条第1項の労働時間を超えない範囲内において、1週間のうち1日の労働時間を4時間以内に短縮する場合において、他の日の労働時間を10時間まで延長すること。\n2　1週間について48時間以下の範囲内で厚生労働省令で定める時間、1日について8時間を超えない範囲内において、第32条の2又は第32条の4及び第32条の4の2の規定の例により労働させること。", "bg": "【制定時】\n1947年の法案は、18歳未満の者を36協定等による一般の延長の仕組みから外し、例外就労の児童には修学時間を通算する規律を置いた。就労を認めても教育と健康の保護を継続する制度だった。\n【改正・現行との対応】\n児童の修学時間を通算する規律は現在も続く。現在は1週40時間・1日7時間が基準。1998年改正では、第3項の対象から、15歳到達後の最初の3月31日までの期間を除く規定を加えた（この部分は2000年4月施行）。\n第1項の適用除外と、第3項の限定された特例を併せて読む必要がある。年少者の変形労働時間制を一律に全て禁止する、とだけ説明すると第3項第2号を落とす。", "deb": "【1947年3月13日・衆議院委員会】\n質問：野本品吉は、最低年齢に例外を置くことで、児童の就学が犠牲にならないかと尋ねた。\n答弁：吉武惠市は、例外の就労も授業時間外に限定し、授業時間と労働時間を合わせて1日7時間以内とする規制を置くと説明した。児童の就労を一般労働者と同じ労働時間の枠で扱う考えではなかった。\n【同月14日・同委員会】\n野村ミスが働く子の教育機会について質問すると、吉武は、15歳以上18歳未満の労働時間も厳格に制限することや、夜間に学ぶ場合の勤務との関係を説明した。\n※制定時の質疑。現在の数値・例外は原文欄で確認する。", "tsu": "【1988年1月1日 基発第1号・婦発第1号／当初の制度】\n年少者保護のため、1か月単位の変形制、フレックスタイム制、当時の3か月単位の変形制、1週間単位の非定型的変形制を原則として年少者に適用しない。1988年当初は「1年単位」の制度ではない。\n【1994年施行の改正後／掲載整理版】\n3か月単位の制度は1年単位の変形労働時間制へ改められた。後年改正を反映した掲載通達の制度名を1988年当時の名称として扱わない。\n【原則と例外】第60条第1項の適用除外と、第3項第2号の年齢・期間・時間限度付きの例外を区別する。第60条は第32条の構成要件を修正する規定であり、その要件を満たさない場合は第32条違反となる。\n【確認範囲】1988年通達の公表原文と後続の一部改正資料は確認済み。全改正後の全文照合は未完了。", "kako": "平成29年\n平成30年\n令和3年\n令和7年", "rows": [9], "ch": 5}, {"key": "h61", "num": [61], "label": "第61条", "caption": "深夜業", "status": null, "sheet": "第61～65条", "scope": "honsoku", "text": "（深夜業）\n第61条　使用者は、満18才に満たない者を午後10時から午前5時までの間において使用してはならない。ただし、交替制によつて使用する満16才以上の男性については、この限りでない。\n②　厚生労働大臣は、必要であると認める場合においては、前項の時刻を、地域又は期間を限つて、午後11時及び午前6時とすることができる。\n③　交替制によつて労働させる事業については、行政官庁の許可を受けて、第1項の規定にかかわらず午後10時30分まで労働させ、又は前項の規定にかかわらず午前5時30分から労働させることができる。\n④　前3項の規定は、第33条第1項の規定によつて労働時間を延長し、若しくは休日に労働させる場合又は別表第1第6号、第7号若しくは第13号に掲げる事業若しくは電話交換の業務については、適用しない。\n⑤　第1項及び第2項の時刻は、第56条第2項の規定によつて使用する児童については、第1項の時刻は、午後8時及び午前5時とし、第2項の時刻は、午後9時及び午前6時とする。", "bg": "【制定時】戦後の労働法制では、若年者の健康や就学への影響に配慮して深夜労働を制限した。制定時の対応条文は旧第62条であり、当時は女性の深夜業も含めて規律していた。\n【改正時】昭和60年法律第45号で旧第62条から第61条へ繰り上げ。平成9年法律第92号などの改正を経て、女性一般と18歳未満を区別する構造となった。現行の対象は原則として18歳未満。\n【読解】①原則22時～5時、②大臣の地域・期間別変更、③交替制の行政許可、④法定の適用除外、⑤許可を受けた児童について特別時刻、という五層。", "deb": "—", "tsu": "【平成16年11月22日 基発第1122001号・16文科初第827号／2005年1月1日適用】\n第61条第5項による児童の深夜業の例外を定める告示を説明。第56条第2項の許可で演劇事業に使用される児童が「演技を行う業務」に従事する場合、就労可能な終業時刻を午後9時までとする特例（始業側は午前6時）を認め、期間は「当分の間」。その他の年少者の深夜業規制は変わらない。\n①学業・心身の健康への配慮と就労許可、②稽古・衣装替えも原則労働時間、③既存許可は自動的に午後9時まで延長されず再度許可が必要。\n※本通知の後続改廃の網羅的確認は未了。原典：https://www.mhlw.go.jp/web/t_doc?dataId=00tb2891&dataType=1&pageNo=1", "kako": "—", "rows": [5], "ch": 5}, {"key": "h62", "num": [62], "label": "第62条", "caption": "危険有害業務の就業制限", "status": null, "sheet": "第61～65条", "scope": "honsoku", "text": "（危険有害業務の就業制限）\n第62条　使用者は、満18才に満たない者に、運転中の機械若しくは動力伝導装置の危険な部分の掃除、注油、検査若しくは修繕をさせ、運転中の機械若しくは動力伝導装置にベルト若しくはロープの取付け若しくは取りはずしをさせ、動力によるクレーンの運転をさせ、その他厚生労働省令で定める危険な業務に就かせ、又は厚生労働省令で定める重量物を取り扱う業務に就かせてはならない。\n②　使用者は、満18才に満たない者を、毒劇薬、毒劇物その他有害な原料若しくは材料又は爆発性、発火性若しくは引火性の原料若しくは材料を取り扱う業務、著しくじんあい若しくは粉末を飛散し、若しくは有害ガス若しくは有害放射線を発散する場所又は高温若しくは高圧の場所における業務その他安全、衛生又は福祉に有害な場所における業務に就かせてはならない。\n③　前項に規定する業務の範囲は、厚生労働省令で定める。", "bg": "【制定時】旧第63条に由来。年少者を機械、重量物、化学物質、粉じん等の危険から保護する規制の系譜に位置する。制定当時は女性も対象に含む規制が置かれていた。\n【改正時】昭和47年法律第57号による安全衛生規制の再編を経て、昭和60年法律第45号で旧第63条から現行第62条に繰り上がった。\n【読解】第1項は危険な機械作業・重量物、第2項は危険物質・有害な場所、第3項は第2項の具体的範囲を省令に委任。具体的な重量・業務範囲は下位法令の照合が必要。", "deb": "—", "tsu": "—", "kako": "—", "rows": [6], "ch": 5}, {"key": "h63", "num": [63], "label": "第63条", "caption": "坑内労働の禁止", "status": null, "sheet": "第61～65条", "scope": "honsoku", "text": "（坑内労働の禁止）\n第63条　使用者は、満18才に満たない者を坑内で労働させてはならない。", "bg": "【制定時】旧第64条では、18歳未満と女性の坑内労働を厳しく制限していた。\n【改正時】昭和60年法律第45号で年少者の坑内労働禁止を第63条に配置し、女性の坑内業務制限は別の条文群に整理。2006年改正は、成人女性の坑内業務を一律禁止する制度を見直したが、年少者の坑内労働禁止とは混同しない。\n【読解】現行第63条は18歳未満の坑内労働を禁止し、年少者用の但書や許可例外を条文には置いていない。", "deb": "—", "tsu": "—", "kako": "—", "rows": [7], "ch": 5}, {"key": "h64", "num": [64], "label": "第64条", "caption": "帰郷旅費", "status": null, "sheet": "第61～65条", "scope": "honsoku", "text": "（帰郷旅費）\n第64条　満18才に満たない者が解雇の日から14日以内に帰郷する場合においては、使用者は、必要な旅費を負担しなければならない。ただし、満18才に満たない者がその責めに帰すべき事由に基づいて解雇され、使用者がその事由について行政官庁の認定を受けたときは、この限りでない。", "bg": "【制定時】旧第68条の帰郷旅費制度を継承する系譜。1947年の制定時には、18歳未満の者だけでなく女性も対象だった。起草関係者は、旧工場法施行令にあった保護規定を引き継いだと答弁している。\n【改正時】昭和60年法律第45号による配置替えで現行第64条へ。現在の対象は18歳未満のみ。\n【読解】①解雇、②解雇の日から14日以内の帰郷、③必要な旅費負担。例外は「本人の責めに帰すべき事由」だけでなく、その事由について「行政官庁の認定」が必要。", "deb": "【1947年3月22日・貴族院労働基準法案特別委員会／旧第68条：発言195～206】\n① 種田虎雄委員が「帰郷旅費を年少者と女性に限るのか。一般労働者にも規定すべきではないか」と質問。吉武惠市政府委員は、制定案では解雇から14日以内に帰郷する年少者と女性に限ると回答した。\n② 種田委員は繊維工場の寄宿舎労働者を想定した制度なのかと追及。吉武委員は業種を限定せず、解雇後の帰郷費用に窮する人を保護する趣旨を説明した。\n③ 種田委員は男女平等との関係を疑問視。吉武委員は特別の保護が必要だという当時の政策判断を示した。\n④ 寺本廣作政府委員は旧工場法施行令の規定を踏襲したと説明し、第15条（明示労働条件の相違による解除後の帰郷旅費）とは発生原因が異なると整理した。\n⑤ 労働者の責任による解雇について、行政認定があれば例外とする理由と、第15条に同種の例外がないことがさらに議論された。\n※発言者の当時の説明を史実として記載。現行の男女平等・年少者保護の価値判断とは区別。", "tsu": "—", "kako": "—", "rows": [8], "ch": 5}, {"key": "h64-2", "num": [64, 2], "label": "第64条の2", "caption": "坑内業務の就業制限", "status": null, "sheet": "第61～65条", "scope": "honsoku", "text": "（坑内業務の就業制限）\n第64条の2　使用者は、次の各号に掲げる女性を当該各号に定める業務に就かせてはならない。\n1　妊娠中の女性及び坑内で行われる業務に従事しない旨を使用者に申し出た産後1年を経過しない女性　坑内で行われるすべての業務\n2　前号に掲げる女性以外の満18歳以上の女性　坑内で行われる業務のうち人力により行われる掘削の業務その他の女性に有害な業務として厚生労働省令で定めるもの", "bg": "【制定時の前身】1947年の坑内労働規制では女性全般が原則禁止の対象だった。\n【2006年改正・2007年4月1日施行】施工技術・安全衛生技術の進歩、規制見直しの要望を踏まえ、成人女性の坑内労働一律禁止を見直した。管理・監督等の安全性が確保された業務に従事する道を広げつつ、妊産婦と有害業務への規制は維持した。\n【読解】第1号は「妊娠中」ならすべて禁止、「産後1年未満」は従事しない旨の申出が鍵。第2号は第1号に当たらない18歳以上の女性の一定の有害坑内業務を禁止。", "deb": "—", "tsu": "【平成18年10月11日 基発第1011001号・雇児発第1011001号／2007年4月1日施行関係】\n① 趣旨：技術進歩等により、女性技術者が坑内の管理・監督等に従事できるよう原則禁止を見直した。\n② 妊娠中は坑内のすべての業務が禁止。事業場で妊娠の申出や診断書提出等の手続を定めて早期に把握することが「望ましい」とする（申出書・診断書の提出を一律の法的義務とまでは書いていない）。\n③ 成人女性に禁止される掘削・掘採等の範囲について、人力作業、機械操作、発破、付随する運搬や打設を具体化。機械と離れた操作室からの遠隔操作や技術上の管理・指導監督業務の位置付けも説明している。\n※2006年発出文としての内容。後続改正による各細目の現行適用は個別再確認が必要。\n\n【同通達「第2 関係通達の整理」：改廃を確認】\n昭和63年3月14日基発第150号・婦発第47号「労働基準法関係解釈例規について」の「第64条の2関係」部分を削除。従前の女性坑内就労の全面禁止を現在も適用する扱いは誤り。\n※この削除事実は原典確認済。2006年通知自体に後年の改正・廃止が一切ないかの全履歴の網羅調査は未了。\n\n【改廃原文確認】平成18年10月11日基発1011001号・雇児発1011001号の第2により、昭和63年基発150号・婦発47号の『第64条の2関係』を削除。削除後の旧解釈を現行法へ転用しない。", "kako": "—", "rows": [9], "ch": 6}, {"key": "h64-3", "num": [64, 3], "label": "第64条の3", "caption": "危険有害業務の就業制限", "status": null, "sheet": "第61～65条", "scope": "honsoku", "text": "（危険有害業務の就業制限）\n第64条の3　使用者は、妊娠中の女性及び産後1年を経過しない女性(以下「妊産婦」という。)を、重量物を取り扱う業務、有害ガスを発散する場所における業務その他妊産婦の妊娠、出産、哺育等に有害な業務に就かせてはならない。\n②　前項の規定は、同項に規定する業務のうち女性の妊娠又は出産に係る機能に有害である業務につき、厚生労働省令で、妊産婦以外の女性に関して、準用することができる。\n③　前2項に規定する業務の範囲及びこれらの規定によりこれらの業務に就かせてはならない者の範囲は、厚生労働省令で定める。", "bg": "【制定時の前身】危険有害業務について女性・年少者への保護を置く旧規制の系譜。\n【改正】昭和60年法律第45号で追加された旧第64条の5が、平成9年法律第92号により現行第64条の3へ繰り上がった。平成18年法律第82号などで一部改正。\n【読解】第1項は妊産婦の有害業務禁止。第2項は「妊産婦以外の女性」にも一部準用する省令への委任で、全業務を一律準用するわけではない。第3項により職務と対象者の詳細は省令で判断。", "deb": "—", "tsu": "【平成18年10月11日 基発第1011001号・雇児発第1011001号／関連部分】\n妊娠中の女性の危険有害業務（本条・女性労働基準規則第2条）についても、女性労働者からの申出、診断書提出など所要の手続を事業場で整備し、妊娠の有無を適切に把握して就業制限を運用することが望ましいと説明。\n※この通知は同条に関する手続運用を補足するもので、重量物等の対象業務一覧を網羅したものではない。詳細範囲は女性労働基準規則で確認する。\n\n【2006年の通達整理】同通達「第2」は昭和63年3月14日基発第150号・婦発第47号の第64条の3関係見出しを「妊産婦に対する就業制限」から「妊産婦等に対する就業制限」へ改めた。\n【平成24年4月10日 基発0410第3号・雇児発0410第10号】女性労働基準規則の化学物質に係る禁止業務を見直し（同年10月1日施行）。旧9物質を新たな分類に改めた。\n【平成24年10月26日 基発1026第6号・雇児発1026第2号】2012年4月通知中の対象物質数等を「25物質→26物質」「13物質→14物質」に修正（2013年1月1日施行関係）。この数字は当時の改正時点のものであり、現在の法令・対象物質数だと断定しない。\n※女性労働基準規則本文を別資料として管理し、後続改正・全通達の廃止履歴については引き続き要追加確認。\n\n【後続改正確認】平成24年10月26日基発1026第6号・雇児発1026第2号で、平成24年4月10日の通達中の物質数を『25→26』『13→14』へ改めたことを公的原文で確認。対象物質の現在の範囲は最新の女性労働基準規則で確認する。", "kako": "令和2年", "rows": [10], "ch": 6}, {"key": "h65", "num": [65], "label": "第65条", "caption": "産前産後", "status": null, "sheet": "第61～65条", "scope": "honsoku", "text": "（産前産後）\n第65条　使用者は、6週間(多胎妊娠の場合にあつては、14週間)以内に出産する予定の女性が休業を請求した場合においては、その者を就業させてはならない。\n②　使用者は、産後8週間を経過しない女性を就業させてはならない。ただし、産後6週間を経過した女性が請求した場合において、その者について医師が支障がないと認めた業務に就かせることは、差し支えない。\n③　使用者は、妊娠中の女性が請求した場合においては、他の軽易な業務に転換させなければならない。", "bg": "【制定時】1947年当初から出産前後の女性の健康保護と、妊娠中の軽易業務への転換を労働条件の最低基準として位置付けた。現行の数字を1947年に遡及させない。\n【1985年改正】昭和60年法律第45号により産後休業は従前の6週間から8週間に延長され、産後の就業例外の扱いも整えられた。\n【1997年改正】平成9年法律第92号などを通じて多胎妊娠の産前期間は14週間となった。\n【読解】第1項は請求が条件（6週／多胎14週）、第2項は原則禁止（産後8週）と6週経過後の「本人の請求＋医師の判断」による例外、第3項は請求による軽易業務転換。", "deb": "—", "tsu": "【昭和22年9月13日 発基第17号／制定時の第65条第3項】\n妊娠中の女性が軽易な業務への転換を求めた場合、原則としてその女性が請求した業務に転換させる趣旨であると説明している。\n※1947年の施行解釈。個別の就業可能な職務の有無、請求の具体的態様、後年の行政解釈・改廃を含む現行の全射程は再確認事項。\n\n【公式過去問との対応】令和3年度（第53回）択一式・労基安衛 問6肢Eは、第65条第3項につき「原則として妊娠中の女性が請求した業務へ転換する趣旨」と「新たな軽易業務の創設までは要求しない」を問う。前段は上記昭和22年発基第17号の論点に直接対応する。\n※昭和22年通達は制定当時の解釈記録。全面的な現行有効性・後続改廃の網羅照合までは未了。", "kako": "平成29年\n平成30年\n令和元年\n令和3年\n令和6年\n令和7年", "rows": [11], "ch": 6}, {"key": "h66", "num": [66], "label": "第66条", "caption": "", "status": null, "sheet": "第66～70条", "scope": "honsoku", "text": "第66条　使用者は、妊産婦が請求した場合においては、第32条の2第1項、第32条の4第1項及び第32条の5第1項の規定にかかわらず、1週間について第32条第1項の労働時間、1日について同条第2項の労働時間を超えて労働させてはならない。\n\n②　使用者は、妊産婦が請求した場合においては、第33条第1項及び第3項並びに第36条第1項の規定にかかわらず、時間外労働をさせてはならず、又は休日に労働させてはならない。\n\n③　使用者は、妊産婦が請求した場合においては、深夜業をさせてはならない。", "bg": "【1947年制定時】女性労働者について時間外・休日・深夜の保護が章内に別個に置かれた。政府の制定時提案理由は、女性の健康上の特殊な配慮を述べ、当時の女性一般の時間外労働制限等を説明した。ただし、現在の第66条は制定時にその番号・内容で存在したものではない。\n【1985年改正】昭和60年法律第45号により「妊産婦が請求した場合」の時間外・休日・深夜業制限を第66条として新設し、従来の女性一般の規制との制度分化を進めた。\n【1987年改正】変形労働時間制の拡張に伴い、各日・各週の法定労働時間を超える勤務についても、請求した妊産婦を保護する構成となった。", "deb": "【1947年3月20日・貴族院特別委員会／第6章の政府説明】\n① 女性や年少者に、成人男性と同じ働き方を求めてよいのか。\n→ 河合良成厚生大臣は、健康上特別の配慮を要する者を保護する責務を述べ、女子の時間外・休日・深夜業を制限する制度を説明した。\n② その後、保護の対象と方法はどう変わったか。\n→ 1985年改正では、妊産婦が請求した場合の時間外・休日・深夜業の制限を現行第66条に置いた。1987年改正では、変形労働時間制の下でも妊産婦の請求による保護を設けた。\n※①は制定時の章別説明、②は改正法・施行通知の整理。現行第66条の改正時の個別質疑は未確認。", "tsu": "【昭和63年1月1日 基発第1号・婦発第1号／改正労働基準法の施行について】変形労働時間制の下で1日又は1週の法定労働時間を超える労働をさせる場合にも、妊産婦の請求があれば就労させないのは、従前の時間外労働の母性保護との均衡による、と説明。\n【厚生労働省・労働条件Q&A（行政説明。通達ではない）】請求により①変形制の日・週の法定時間超過②時間外・休日労働③深夜業を禁止する。\n※昭和63年通知の後続改廃履歴の網羅確認は未了。\n\n【後続改正確認】昭和63年1月1日基発第1号・婦発第1号は厚労省公表原文で確認。平成22年5月18日の関係通達整備、令和5年の裁量労働制関係改正など、後年の部分改正がある。発出当初の条項番号や対象要件をそのまま現行法へ適用しない。", "kako": "平成29年\n令和3年", "rows": [5], "ch": 6}, {"key": "h67", "num": [67], "label": "第67条", "caption": "育児時間", "status": null, "sheet": "第66～70条", "scope": "honsoku", "text": "（育児時間）\n第67条　生後満1年に達しない生児を育てる女性は、第34条の休憩時間のほか、1日2回各々少なくとも30分、その生児を育てるための時間を請求することができる。\n\n②　使用者は、前項の育児時間中は、その女性を使用してはならない。", "bg": "【1947年制定時】旧第66条「育兒時間」として、出生後1年に満たない子を育てる女性に通常の休憩とは別の育児時間を法律上保障。政府は第6章の制定時説明で「育兒時間等、従来認められていた制度にはそれぞれ改善」を加えたと述べた。\n【1985年改正】昭和60年法律第45号で旧第66条から現行第67条へ移り、文言を整備。制度の中心である「1日2回・各30分以上」は維持された。", "deb": "【1947年3月20日・貴族院特別委員会／第6章の政府説明】\n① 母親が職場に戻っても、乳児の世話は続く。その時間を通常の休憩だけに任せてよいのか。\n→ 河合良成厚生大臣は、女子保護の制度改善の一つとして育児時間を挙げた。\n② 制度は、休憩時間とどう区別したのか。\n→ 提出法案の旧第66条は、生後1年未満の子を育てる女性が、通常の休憩とは別に、1日2回・各30分以上の育児時間を請求できる形にした。仕事中の休息と、子を育てるための時間を分けて保障したのである。\n※①は政府説明、②は法案本文からの整理。1985年改正で現行第67条へ移動。条文固有の往復質疑は未確認。", "tsu": "【労基法第67条・公式資料に基づく説明】生後満1年に達しない生児を育てる女性は、通常の休憩時間とは別に、1日2回各30分以上の育児時間を請求できる。使用者はその育児時間中に使用してはならない。法はこの時間を有給とすることまでは義務付けていない。\n※平成31年3月29日『雇均発0329第7号』は育児・介護休業法の別法通知であり、労基法第67条の直接の解釈通達として掲げない。", "kako": "平成30年", "rows": [6], "ch": 6}, {"key": "h68", "num": [68], "label": "第68条", "caption": "生理日の就業が著しく困難な女性に対する措置", "status": null, "sheet": "第66～70条", "scope": "honsoku", "text": "（生理日の就業が著しく困難な女性に対する措置）\n第68条　使用者は、生理日の就業が著しく困難な女性が休暇を請求したときは、その者を生理日に就業させてはならない。", "bg": "【1947年制定時】旧第67条「生理休暇」は、①生理日の就業が著しく困難な女性、②生理に有害な業務に従事する女性が請求した場合を対象とし、業務指定の委任条項があった。当時の条文と現行条文は同一ではない。\n【1985年改正】昭和60年法律第45号は旧第67条から後者の「生理に有害な業務に従事する女性」を削除し、委任の第2項も削除。現在につながる「生理日に就業が著しく困難」の請求を中心とした制度に整理し、第68条に移した。", "deb": "【1947年3月22日・貴族院特別委員会／発言189〜190】\n① 畠山一清委員長は、休暇が多くなれば、実際に働く日が減ってしまうのではないかと懸念を示した。\n→ 吉武惠市政府委員は、女性全員が一律に休む制度ではないと説明した。生理により就業が著しく困難な場合など、当時の法案が定めた事情のある者が請求する仕組みだった。\n② 休ませるなら、その日は当然に有給となるのか。\n→ 吉武は、法律が当然に有給を要求するものではない旨を答えた。休む権利の保障と、その日の賃金の扱いは別の問題として説明された。\n※当時は、一定の業務で生理への悪影響が懸念される場合も対象。これは1985年に削除され、現在の要件は「生理日の就業が著しく困難」である。", "tsu": "【厚労省・モデル就業規則解説（行政資料・通達ではない）】生理日の就業が著しく困難な女性から休暇請求があれば、請求された期間は就業させない旨を説明する。\n【1947年政府答弁（通達ではない）】法は一律の日数・有給扱いを定める趣旨ではない、と説明。\n※今回、発出番号・原文と現行有効性まで確認できた第68条固有通達は確認できず「—」扱い。行政資料と通達を区別する。", "kako": "平成29年\n令和6年", "rows": [7], "ch": 6}, {"key": "h69", "num": [69], "label": "第69条", "caption": "徒弟の弊害排除", "status": null, "sheet": "第66～70条", "scope": "honsoku", "text": "（徒弟の弊害排除）\n第69条　使用者は、徒弟、見習、養成工その他名称の如何を問わず、技能の習得を目的とする者であることを理由として、労働者を酷使してはならない。\n\n②　使用者は、技能の習得を目的とする労働者を家事その他技能の習得に関係のない作業に従事させてはならない。", "bg": "【1947年制定時】従来の徒弟制度が過酷な労働の温床になっていたため、教育・養成の名目で労働者を酷使したり、技能と無関係な家事・雑用に従事させたりする弊害を禁止。\n【改正史】現行法の第7章にも中心規定が維持され、見習・養成工という名称や修業名目が保護を失わせないという原則を示す。", "deb": "【1947年3月20日・貴族院特別委員会／第7章の政府説明】\n① 技術を教えるという名目なら、厳しい働かせ方も許されるのか。\n→ 河合良成厚生大臣は、従来の徒弟制度を劣悪労働の一例と捉え、まずその弊害を取り除く必要があると説明した。技能者を育てる必要があっても、養成の名で労働者保護を外すことはできない、という章の出発点である。\n② 法案は、どこに歯止めを置いたのか。\n→ 第69条は、養成の名による酷使と、技能習得に関係のない作業への従事を禁じた。「何を教えているか」だけでなく、「養成を口実に何をさせているか」を問う規定になっている。\n※①は政府説明、②は法案本文の整理。第69条単独の往復質疑は未確認。", "tsu": "—", "kako": "—", "rows": [8], "ch": 7}, {"key": "h70", "num": [70], "label": "第70条", "caption": "職業訓練に関する特例", "status": null, "sheet": "第66～70条", "scope": "honsoku", "text": "（職業訓練に関する特例）\n第70条　職業能力開発促進法(昭和44年法律第64号)第24条第1項(同法第27条の2第2項において準用する場合を含む。)の認定を受けて行う職業訓練を受ける労働者について必要がある場合においては、その必要の限度で、第14条第1項の契約期間、第62条及び第64条の3の年少者及び妊産婦等の危険有害業務の就業制限、第63条の年少者の坑内労働の禁止並びに第64条の2の妊産婦等の坑内業務の就業制限に関する規定について、厚生労働省令で別段の定めをすることができる。ただし、第63条の年少者の坑内労働の禁止に関する規定については、満16歳に満たない者に関しては、この限りでない。", "bg": "【1947年制定時】旧第70条は長期教習を要する技能者を労働過程で養成するため、教習方法、契約期間、賃金等の特別規程を命令に委ねる制度だった。今日の条文内容と異なる。\n【1958年改正】昭和33年法律第133号（職業訓練法）第5条が労基法第70・71条を全面改正。認定職業訓練を受ける労働者について、必要の限度で契約期間や危険有害業務などの特例を省令で設けられる制度へ変更。\n【現在】職業能力開発促進法の認定訓練に限り、他条文の最低基準からの例外が無制限ではない。16歳未満の坑内労働禁止は特例の対象外。さらに第71条の行政官庁の許可に関する条件にも注意。", "deb": "【1947年3月20日・貴族院特別委員会／第7章の政府説明】\n① 国の再建には技能者が要る。しかし、昔の徒弟制度に戻してよいのか。\n→ 河合良成厚生大臣は、技能者養成の必要と従来の徒弟制度の弊害を併せて取り上げた。特別な規程を設ける際は委員会に諮り、労働条件の最低基準との調整を図ると説明した。\n② 特例を、使用者だけの判断に任せるのか。\n→ 政府説明は、行政官庁の認可で濫用を防ぐ仕組みを示した。1958年改正では、認定職業訓練について特例を定める現在の枠組みに改められた。\n※1947年は章別説明、1958年は改正法文による整理。改正時の個別質疑は未確認。現行法でも、満16歳未満の坑内労働を認める特例ではない。", "tsu": "【現行法第71条・職業能力開発促進法第24条（法令であり通達ではない）】第70条の省令特例は、許可を受けた使用者に使用される労働者以外には及ばない。都道府県知事による職業訓練の認定と、第71条に基づく使用許可を同一視しない。\n【個別通達】今回、番号・適用時点・改廃まで原文検証済みの第70条固有通達は確認できず「—」。", "kako": "—", "rows": [9], "ch": 7}, {"key": "h71", "num": [71], "label": "第71条", "caption": "", "status": null, "sheet": "第71～75条", "scope": "honsoku", "text": "第71条　前条の規定に基いて発する厚生労働省令は、当該厚生労働省令によつて労働者を使用することについて行政官庁の許可を受けた使用者に使用される労働者以外の労働者については、適用しない。", "bg": "【1947年制定時】旧第71条は、技能者養成のため特例的に労働者を使用する使用者が、あらかじめ訓練人数・教習方法・契約期間・労働時間・賃金基準・支払方法について行政官庁の「認可」を受ける仕組みと、その後の証明書交付・備付けを規定。教育の名の下で労働条件が低下する弊害を防ぐことが目的だった。\n【1958年改正】昭和33年法律第133号（職業訓練法）で第71条を全文改正。法第70条に基づく特例省令は、当該省令による使用につき行政官庁の許可を受けた使用者の労働者にだけ適用する仕組みに改めた。旧条文の認可事項・証明書の規定がそのまま現行条文に残っているわけではない。", "deb": "【1947年3月20日・貴族院特別委員会／第7章の政府説明と法案】\n① 「技能者を養成している」と言えば、誰でも特例を使えるのか。\n→ 河合良成厚生大臣は、特殊な養成の必要と最低労働条件を調整する一方、行政官庁の認可によって弊害を防ぐと説明した。\n② 行政は、何を見て認めるのか。\n→ 旧第71条は、養成人数・養成方法・契約・労働時間・賃金などを認可の対象とし、養成証明書の交付・備付けも求めた。名称だけで特例を使わせず、養成の中身を確かめる仕組みだった。\n③ 1958年改正後はどうなったか。\n→ 第70条に基づく特例は、行政官庁の許可を受けた使用者に限って適用する構造へ改められた。\n※①は章別説明、②③は法文の整理。1958年の本条固有の往復質疑は未確認。", "tsu": "【法令に基づく実施規定（通達ではない）】労働基準法施行規則第34条の4により、法第71条の許可は「職業訓練に関する特例許可申請書」（様式第14号の4）で事業場所在地を管轄する都道府県労働局長から受ける。同規則第34条の5により、労働局長は許可・不許可・取消しを都道府県知事へ通知する。\n【通達】本条に固有で発出番号・原文・後続改廃まで確認済みの通達：—。一般的な省令要件を「通達」と呼ばない。", "kako": "—", "rows": [5], "ch": 7}, {"key": "h72", "num": [72], "label": "第72条", "caption": "", "status": null, "sheet": "第71～75条", "scope": "honsoku", "text": "第72条　第70条の規定に基づく厚生労働省令の適用を受ける未成年者についての第39条の規定の適用については、同条第1項中「10労働日」とあるのは「12労働日」と、同条第2項の表6年以上の項中「10労働日」とあるのは「8労働日」とする。", "bg": "【1947年制定時】旧第72条は、旧第70・71条による技能者養成の特例を受ける未成年者に対し、年次有給休暇「12労働日」を付与する規定だった（当時の一般的な年休日数とは区別）。技能習得の名の下で保護が弱まらないよう、休暇面で特別の保障を設けたと読むことができるが、議会で理由を条文固有に説明した発言は未確認。\n【1958年改正】昭和33年法律第133号で対象表現を「第70条の規定に基いて発する命令の適用を受ける未成年者」に変更。\n【1998年等の改正】現行第39条の付与日数との整合のため読替方式へ改め、現行条文では第39条1項の「10日→12日」と、同条2項の表の六年以上の項「10日→8日」が併記されている。旧12日一律の文言を現在の条文と取り違えない。", "deb": "【1947年の提出法案／年休の特例から読む制度の焦点】\n① 技能を身に付ける途中の若者には、特例だけを設ければ十分なのか。\n→ 第7章の政府説明は、技能者養成の必要と最低労働条件の調整を重視した。旧第72条は、養成対象の未成年者に年12労働日の年休を保障し、休暇については手厚くした。\n② 現在の条文では、どこが手厚いのか。\n→ 第39条の最初の「10労働日」を「12労働日」に読み替え、第39条第2項の表の「6年以上」の増加日数は「10労働日」を「8労働日」に読み替える。最初の付与日数を増やす一方、最終的に20日となる部分の増加日数を調整している。\n※法案・現行法文からの整理。12日とした理由を述べる個別答弁や、後年改正時の本条固有の質疑は未確認。", "tsu": "【条文の読替え（通達ではない）】現行第72条は「未成年者」「第70条の特例省令の適用」が対象。第39条1項の年休日数を12日に、同条2項の表の六年以上の項の「10日」を「8日」に読み替える。一般の年次有給休暇表に機械的に12日を上乗せする規定ではない。\n【通達】本条の付与日数を直接説明し、現在の改廃まで確認できた個別通達：—。", "kako": "—", "rows": [6], "ch": 7}, {"key": "h73", "num": [73], "label": "第73条", "caption": "", "status": null, "sheet": "第71～75条", "scope": "honsoku", "text": "第73条　第71条の規定による許可を受けた使用者が第70条の規定に基いて発する厚生労働省令に違反した場合においては、行政官庁は、その許可を取り消すことができる。", "bg": "【1947年制定時】旧第73条は、技能者養成に関する特例を利用する使用者が「資格を失い、又は認可の条件に反した場合」、行政官庁が認可を取り消せる旨を規定。特例を利用した劣悪な労働を防止する行政監督の仕組みだった。\n【1958年改正】昭和33年法律第133号により全文改正。新制度では、第71条の「許可」を受けた使用者が第70条の特例省令に違反したときの許可取消しを規定。取消事由の条文の書き方が、旧法の「資格喪失・認可条件違反」から変わっている。", "deb": "【1947年3月20日・貴族院特別委員会／第7章の政府説明と法案】\n① 認めた養成が、後から劣悪な労働に変わってしまったらどうするのか。\n→ 河合良成厚生大臣は、養成の特殊性を認める一方、行政官庁の認可で弊害を防ぐと説明した。その入口だけでなく、特例を続けてよいかを扱うのが第73条である。\n② 一度認めたものは、取り消せないのか。\n→ 旧第73条は、使用者が資格を失った場合や認可条件に違反した場合に取消しを可能にした。1958年改正後も、特例に基づく規定への違反があれば許可を取り消せる。\n※①は章別説明、②は制定法・改正法文からの整理。取消しをめぐる本条単独の往復質疑は未確認。", "tsu": "【法令上の取消手続（通達ではない）】労働基準法施行規則第34条の4・5は、許可申請先を都道府県労働局長とし、許可を取り消した場合は都道府県知事に通知することを規定。法第73条は取消しを「できる」と規定しており、違反したら当然に自動失効するとは書いていない。\n【通達】条文固有で改廃履歴まで追跡した番号付き通知：—。", "kako": "—", "rows": [7], "ch": 7}, {"key": "h74", "num": [74], "label": "第74条", "caption": "", "status": "削除", "sheet": "第71～75条", "scope": "honsoku", "text": "第74条　削除", "bg": "【1947年制定時】旧第74条は、特例を定める命令につき「技能者養成委員会」に諮問する規定。委員は関係労働者・関係使用者・公益の各代表を同数とする仕組みだった。技能者養成により最低基準を緩和する場合、労使公益の意見を反映することが当時の制度設計に含まれていた。\n【1958年改正】職業訓練法（昭和33年法律第133号）第5条により旧第74条を「削除」に変更。同改正で第70・71・73条を制度上組み替え、労基法中の旧技能者養成委員会の規定を整理。現行第74条には実体的規制はない。", "deb": "【1947年3月20日・貴族院特別委員会／第7章の政府説明】\n① 技能者養成のためなら、最低基準をどこまで特別扱いしてよいのか。\n→ 河合良成厚生大臣は、特別な規程を設ける際に技能者養成委員会へ諮り、養成の必要と労働条件の最低基準を調整すると説明した。\n② その判断に、誰の声を入れるのか。\n→ 旧第74条は、労働者・使用者・公益を代表する委員を同数とした。養成する側の都合だけでも、行政だけの判断でも決めず、三者の視点を制度に組み込んだ。\n③ その委員会は今もあるのか。\n→ 本条は1958年に削除された。\n※①は政府説明、②③は法文の整理。削除の理由を直接述べた本条固有の国会答弁は未確認。", "tsu": "—（現行法に実体的な第74条は存在しない。旧第74条の技能者養成委員会は1958年改正で削除済み。制定時の制度を現行行政実務へ持ち込まない。）", "kako": "—", "rows": [8], "ch": 7}, {"key": "h75", "num": [75], "label": "第75条", "caption": "療養補償", "status": null, "sheet": "第71～75条", "scope": "honsoku", "text": "（療養補償）\n第75条　労働者が業務上負傷し、又は疾病にかかつた場合においては、使用者は、その費用で必要な療養を行い、又は必要な療養の費用を負担しなければならない。\n\n②　前項に規定する業務上の疾病及び療養の範囲は、厚生労働省令で定める。", "bg": "【1947年制定時】政府は災害補償について、それまでの労働法制上の原則を引き継ぎながら、災害補償に関する「実質上の責任」と「補償義務」をできるだけ一致させ、災害被害者の最低必要を保障する方針を示した。第75条は使用者負担で業務上傷病の療養を行う、または費用を負担するという無過失の災害補償を具体化した規定。\n【成立時と現行】1項の骨格は維持。第2項の委任先は制定時の「命令」から現在「厚生労働省令」に整理された。\n【省令の整備】業務上疾病は労基則第35条・別表第1の2、療養範囲は労基則第36条で具体化。業務上疾病の範囲は新たな医学的知見を受けて改正され、2019年や2022〜2023年にも検討・改正の資料がある。", "deb": "【1947年3月20日・貴族院特別委員会／第8章の政府説明】\n① 業務で傷病を負った人の療養を、誰の責任で支えるのか。\n→ 河合良成厚生大臣は、災害の実質的責任と補償義務をできる限り一致させる方針を説明した。補償は産業の負担能力を考慮しつつ、被災者の最低限の必要を満たすことを目指すとした。\n② 病気も、けがと同じように業務との関係を判断できるのか。\n→ 2018年10月16日の厚労省検討会では、負傷に比べて職業病は業務との因果関係を判断しにくいため、対象疾病を省令別表に定めると説明された。\n※①は第8章共通の政府説明、②は後年の行政検討会での説明。第75条固有の制定時の往復質疑は未確認。", "tsu": "【昭和53年3月30日 基発第186号（歴史的通達）】労基則別表第1の2に関する省令施行通知が厚労省検討会資料として公開されている。2019年の改正通達を含め後続通知が存在するため、1978年当時の説明を無条件に現行の疾病一覧として用いない。\n【現行規則の定め（通達とは区別）】第35条は業務上疾病を別表第1の2に定め、第36条は療養相当の診察・薬剤・治療材料・処置・手術・在宅管理と看護・入院と看護・移送を列挙する。\n【労基法第84条との関係】労災保険法等に基づき同じ災害補償に相当する給付が行われるべき場合、使用者は相当する災害補償義務を免れる。通勤災害を当然に75条の「業務上」と扱わない。\n\n【後続改正確認】昭和53年3月30日基発第186号は、厚労省公開の改正統合資料により平成5年・8年・22年・25年・31年・令和5年1月18日の改正履歴を確認。疾病一覧の適用は現行の施行規則別表第1の2に従う。", "kako": "—", "rows": [9], "ch": 8}, {"key": "h76", "num": [76], "label": "第76条", "caption": "休業補償", "status": null, "sheet": "第76～80条", "scope": "honsoku", "text": "（休業補償）\n第76条　労働者が前条の規定による療養のため、労働することができないために賃金を受けない場合においては、使用者は、労働者の療養中平均賃金の100分の60の休業補償を行わなければならない。\n\n②　使用者は、前項の規定により休業補償を行つている労働者と同一の事業場における同種の労働者に対して所定労働時間労働した場合に支払われる通常の賃金の、1月から3月まで、4月から6月まで、7月から9月まで及び10月から12月までの各区分による期間(以下四半期という。)ごとの1箇月1人当り平均額(常時100人未満の労働者を使用する事業場については、厚生労働省において作成する毎月勤労統計における当該事業場の属する産業に係る毎月きまつて支給する給与の四半期の労働者1人当りの1箇月平均額。以下平均給与額という。)が、当該労働者が業務上負傷し、又は疾病にかかつた日の属する四半期における平均給与額の100分の120をこえ、又は100分の80を下るに至つた場合においては、使用者は、その上昇し又は低下した比率に応じて、その上昇し又は低下するに至つた四半期の次の次の四半期において、前項の規定により当該労働者に対して行つている休業補償の額を改訂し、その改訂をした四半期に属する最初の月から改訂された額により休業補償を行わなければならない。改訂後の休業補償の額の改訂についてもこれに準ずる。\n\n③　前項の規定により難い場合における改訂の方法その他同項の規定による改訂について必要な事項は、厚生労働省令で定める。", "bg": "【1947年制定時】業務上の傷病で働けず賃金を受けない労働者の生活を保障するため、使用者に平均賃金の60％の休業補償を義務付けた。第8章の「使用者の災害補償責任」を具体化する規定である。\n【1952年改正】昭和27年法律第287号により第2・3項を新設。長期間の療養中に同種労働者の通常賃金が変動しても補償額が固定化しないよう、四半期ごとの平均給与額を基準に増減20％超／20％未満となった場合の改訂方法を設けた。改訂する四半期は変動した四半期の「次の次」。\n【現行法との区別】第76条の休業補償（平均賃金60％）と労災保険法の休業（補償）等給付・特別支給金の制度及びスライド率を混同しない。", "deb": "【休業補償をめぐる後年の国会審議】\n① 1952年5月27日・衆議院本会議で、修正案の説明者は、珪肺などで2〜3年療養しても補償額が負傷当時の平均賃金の60％に固定される問題を指摘した。\n→ 議員側は、療養が長引く間の賃金水準の変化を補償へ反映するスライドの必要を主張した。\n② 1960年3月30日・参議院社会労働委員会で、坂本昭委員は、療養で働けない間は使用者の60％の休業補償義務が続くのかと質問した。\n→ 澁谷直藏政府委員は、その原則を肯定した。\n③ 1970年4月27日・衆議院社会労働委員会で、川俣健二郎委員は、なぜ常時100人以上かどうかで区分するのかと尋ねた。\n→ 和田勝美政府委員は、100人以上なら事業場内の同種労働者の賃金を把握しやすいからと説明した。\n※①は議員による修正案説明、②③は委員と政府の質疑。", "tsu": "【労働基準法施行規則（通達ではない）】第38条：所定労働時間の一部だけ勤務した場合は、「平均賃金－実際にその労働に対して支払われる賃金」の60％を補償。第39条：療養補償・休業補償は毎月1回以上行う。第38条の2以下：100人未満の判定、同種労働者の賃金算定方法、基準賃金の変動と告示による改訂率などを具体化。\n【改正時の公的通達】昭和27年9月20日基発第675号は1952年改正の施行通達として公表されている。ただし当該公開本文から第76条固有の解釈段落は確認できず、本欄の具体的な改訂要件は法律・省令の説明にとどめる。後続改廃の網羅調査は未完了。\n【第84条との関係】労災保険法等の同一災害補償に相当する給付が行われるべき場合は、使用者の相当する補償責任が免除される。\n\n【原典・後続改正】昭和27年9月20日基発第675号の厚労省原文を確認。また、同通達の一部改正を行う後年の通知があるため、1952年当時の第76条関係の説明をそのまま現行に当てはめない。", "kako": "—", "rows": [5], "ch": 8}, {"key": "h77", "num": [77], "label": "第77条", "caption": "障害補償", "status": null, "sheet": "第76～80条", "scope": "honsoku", "text": "（障害補償）\n第77条　労働者が業務上負傷し、又は疾病にかかり、治つた場合において、その身体に障害が存するときは、使用者は、その障害の程度に応じて、平均賃金に別表第2に定める日数を乗じて得た金額の障害補償を行わなければならない。", "bg": "【1947年制定時】療養を終えても身体の障害が残る労働者について、障害の程度に応じた定額の補償を使用者に求めた。制定時は「別表第一」の日数を参照していた。\n【1998年改正】平成10年法律第112号による別表の整理で、それまで「別表第一 身体障害等級及び災害補償表」とされていたものを「別表第二」に移動。参照番号の変更と補償額そのものの変更を取り違えない。\n【現在】治ゆ後の障害等級に応じる補償。補償等級と支払時期の具体化は施行規則第40・47条。", "deb": "【1947年3月23日・貴族院特別委員会／障害補償に関わる第82条の質疑】\n① 障害補償を一時金で払う仕組みに、なぜ分割払いも設けるのか。種田虎雄委員は、第82条の趣旨を尋ねた。\n→ 寺本廣作政府委員は、使用者の支払能力と補償を受ける側の利益の両方を考慮し、一時金と定期金を調整した制度だと説明した。\n② 種田は、少額の障害補償まで分割できるのかと重ねて尋ねた。\n→ 寺本は、金額の多い少ないを問わず、原則6年の分割とする設計だと答えた。\n補償額を決める第77条と、それをどう支払うかという第82条は、被災者に補償を届ける同じ問題の別の面として読める。\n※実際の質疑の対象は第82条。第77条単独の往復質疑は未確認。", "tsu": "【労働基準法施行規則（通達とは区別）】第40条：障害等級は別表第二による。複数障害の等級決定、加重障害、一覧外の障害を準じて扱う場合などを定める。第47条第1項：治ゆ後、等級が決定した日から7日以内に補償を行う。\n【用語の確認】厚生労働省の労災保険Q&Aでは「治ゆ」を症状固定を含む概念として説明。ただし、これは労災保険給付の説明であり、第77条専用の通達と記載しない。\n【通達】本条固有で番号・原文・全後続改廃まで確認した現行有効な通達：—。", "kako": "—", "rows": [6], "ch": 8}, {"key": "h78", "num": [78], "label": "第78条", "caption": "休業補償及び障害補償の例外", "status": null, "sheet": "第76～80条", "scope": "honsoku", "text": "（休業補償及び障害補償の例外）\n第78条　労働者が重大な過失によつて業務上負傷し、又は疾病にかかり、且つ使用者がその過失について行政官庁の認定を受けた場合においては、休業補償又は障害補償を行わなくてもよい。", "bg": "【1947年制定時】使用者が責任を負うことを原則としつつ、労働者の「重大な過失」によって生じた業務上災害には、行政の認定を条件として休業・障害補償を免除できる特則を置いた。\n【制度構造】単なる注意不足ではなく重大な過失が要件。使用者が自ら重大と判断するだけでは足りず行政官庁による認定が必要。免除対象は休業補償または障害補償のみであり、療養補償・遺族補償・葬祭料が当然に免除される規定ではない。", "deb": "【1947年の提出法案／重大な過失をめぐる制度の焦点】\n① 労働者にも落ち度があれば、使用者は補償をやめてよいのか。\n→ 第78条は、単なる不注意ではなく「重大な過失」を要件とし、さらに行政官庁の認定を求めた。使用者が自分で重大な過失と決めるだけでは免れない構造である。\n② 認定があれば、災害補償はすべてなくなるのか。\n→ 対象は休業補償と障害補償に限られる。療養補償まで一括して除外する条文にはしていない。\n第8章の政府説明は、災害の実質的責任と補償義務をできる限り一致させる方針を示した。この条文では、労働者側の重大な過失をどう扱い、その判断を誰に委ねるかが焦点になる。\n※法案本文と章別政府説明の整理。本条固有の往復質疑は未確認。", "tsu": "【労働基準法施行規則第41条（通達ではない）】法第78条の認定は使用者が様式第15号で所轄労働基準監督署長から受ける。重大な過失の事実を証明する書面も提出する。\n【労働局の手続案内】高知労働局は重大過失認定申請の提出先・証明書添付を説明。\n【条文の射程】「行わなくてもよい」は所定の行政認定を受けたときの例外であり、認定前から免除が確定しているとは言えない。\n【通達】個別の番号と全後続改廃が裏付けられたもの：—。", "kako": "—", "rows": [7], "ch": 8}, {"key": "h79", "num": [79], "label": "第79条", "caption": "遺族補償", "status": null, "sheet": "第76～80条", "scope": "honsoku", "text": "（遺族補償）\n第79条　労働者が業務上死亡した場合においては、使用者は、遺族に対して、平均賃金の1000日分の遺族補償を行わなければならない。", "bg": "【1947年制定時】業務上の死亡により遺族の生活基盤が失われることに対する補償として、平均賃金1,000日分を義務付けた。提出法案には遺族だけでなく「労働者の死亡当時その収入によつて生計を維持した者」も本文に明記されていた。\n【1965年改正】昭和40年法律第130号第19条により、本文から上記の被生計維持者に関する語句を削除。現行法は「遺族」に限る表現で、その具体的順位や要件は施行規則第42条以下で定める。1952年の改正等と混同しない。", "deb": "【1947年3月23日・貴族院特別委員会／遺族補償に関わる第82条の質疑】\n① 労働者が亡くなった場合、多額の補償を一度に支払えない小規模事業はどうするのか。種田虎雄委員は、障害補償・遺族補償の分割払いの趣旨を尋ねた。\n→ 寺本廣作政府委員は、使用者の支払能力を考慮すると同時に、受給者の同意と利益を重視する仕組みだと説明した。使用者の都合だけで分割する制度ではなかった。\n② なぜ、行政の許可ではなく同意を重視したのか。\n→ 寺本は、行政の簡素化と当事者間の合意尊重などを挙げた。補償する責任を置くだけでなく、その支払い方も議論になっていたのである。\n※実際の質疑は第82条。第79条の旧文言を1965年に削除した理由について、個別答弁は未確認。", "tsu": "【労働基準法施行規則（通達ではない）】第42条：原則として配偶者（事実婚を含む）を第1順位とし、いない場合の子・父母・孫・祖父母等の要件と順位を規定。第43条：42条に該当者がいない場合の遺族と指定の仕組み。第44・45条：同順位者が複数のときの均等分割や受給権者死亡後の扱い。第47条第2項：受給すべき者が決定してから7日以内。\n【重要】法第79条の平均賃金1,000日分は労基法上の使用者補償であり、労災保険法の遺族補償年金・一時金と制度・受給要件が一致するとは限らない。\n【通達】本条固有の現行有効性と全後続改廃まで確認済の個別通達：—。", "kako": "—", "rows": [8], "ch": 8}, {"key": "h80", "num": [80], "label": "第80条", "caption": "葬祭料", "status": null, "sheet": "第76～80条", "scope": "honsoku", "text": "（葬祭料）\n第80条　労働者が業務上死亡した場合においては、使用者は、葬祭を行う者に対して、平均賃金の60日分の葬祭料を支払わなければならない。", "bg": "【1947年制定時】業務上死亡の際の葬祭費用について、遺族補償と別に「葬祭を行う者」に平均賃金60日分を支払う義務を置いた。\n【対象の区別】法第79条は「遺族」に対する補償、第80条は「葬祭を行う者」への支払。受給主体が同一とは限らない。\n【現行との連続性】提出法案からの補償額60日分と「葬祭を行う者」の基本構造を現行法にも確認。", "deb": "【1947年の提出法案／葬祭料から読む制度の焦点】\n① 労働者が業務上亡くなったとき、遺族の補償とは別に、葬祭の費用をどう扱うのか。\n→ 第80条は、葬祭を行う者に平均賃金60日分の葬祭料を支払うとした。第79条の遺族補償とは、受け取る人も、補償する事柄も分けている。\n② 補償水準を決める際、政府は何を重視していたのか。\n→ 3月20日の第8章説明で、河合良成厚生大臣は、産業の負担能力を考慮しながら災害犠牲者の最低限の必要を満たす方針を述べた。\n※①は法案本文、②は章共通の政府説明。葬祭料を60日分とした算定根拠や「葬祭を行う者」を直接めぐる個別質疑は未確認。", "tsu": "【労働基準法施行規則第47条第2項（通達ではない）】死亡後、葬祭料を受けるべき者が決定した日から7日以内に支払う。\n【法の文言】「葬祭を行う者」は「遺族」に限る文言ではない。ただし、個別の認定基準を本条固有の通達として確認できていないため、他法の葬祭料通達を流用しない。\n【第84条との関係】労災保険法等による対応給付の取扱いと、労基法80条の使用者責任の関係を区別する。\n【通達】原文・番号・全後続改廃を照合した個別通達：—。", "kako": "—", "rows": [9], "ch": 8}, {"key": "h81", "num": [81], "label": "第81条", "caption": "打切補償", "status": null, "sheet": "第81～85条", "scope": "honsoku", "text": "（打切補償）\n第81条　第75条の規定によつて補償を受ける労働者が、療養開始後3年を経過しても負傷又は疾病がなおらない場合においては、使用者は、平均賃金の1200日分の打切補償を行い、その後はこの法律の規定による補償を行わなくてもよい。", "bg": "【1947年制定時】使用者が業務災害について療養・休業等の補償義務を負う仕組みを定めつつ、療養が3年を超えて長期化したとき、平均賃金1200日分の補償で以後の労基法上の災害補償を打ち切る制度を設けた。長期負担と被災労働者の補償とを調整する制度と理解される（この一文は条文の仕組みからの説明で、個別の政府答弁の直接引用ではない）。\n【現行法との接続】第19条1項ただし書の解雇制限除外に関係。労災保険法19条の傷病補償年金に関する『打切補償を支払ったものとみなす』規定とは別の要件である。", "deb": "【1947年の提出法案／長期療養と打切補償の焦点】\n① 療養が長く続くとき、使用者の補償義務には区切りがあるのか。\n→ 第81条は、療養開始後3年を経過しても治らない場合、平均賃金1200日分の打切補償を支払えば、その後の法定補償を行わなくてよいとした。長期療養を、まとまった補償に切り替える構造である。\n② 労災保険から療養給付を受ける人にも、この仕組みが関わるのか。\n→ 2015年6月8日最高裁判決は、第19条の解雇制限の例外との関係では、その労働者も第81条の対象に含まれ得ると判断した。\n③ それなら解雇も当然に有効となるのか。\n→ 最高裁は、労働契約法第16条による解雇の有効性を差戻審で審理させた。解雇制限の例外と、解雇そのものの有効性は別に検討される。\n※①は法案、②③は後年の司法判断。制定時の本条固有の往復質疑は未確認。", "tsu": "【平成27年6月9日 基発0609第4号・現行解釈上の重要資料】療養開始後3年を経過しても治ゆせず労災療養補償給付が継続している労働者について、平均賃金1200日分の打切補償の支払により第19条1項の解雇制限の例外を適用し得るとする最高裁判決を監督行政に周知。第19条の解雇制限が外れても、解雇権濫用（労働契約法16条）など別の有効性要件は残る。\n【労災保険法19条】療養開始後3年を経過した日に傷病補償年金を受けている場合等は、同条所定の日に労基法81条の打切補償を支払ったものとみなされる。この『みなし』は使用者の現金支払という意味ではない。通達の後続改廃を網羅する独立検索は未完了。", "kako": "—", "rows": [5], "ch": 8}, {"key": "h82", "num": [82], "label": "第82条", "caption": "分割補償", "status": null, "sheet": "第81～85条", "scope": "honsoku", "text": "（分割補償）\n第82条　使用者は、支払能力のあることを証明し、補償を受けるべき者の同意を得た場合においては、第77条又は第79条の規定による補償に替え、平均賃金に別表第3に定める日数を乗じて得た金額を、6年にわたり毎年補償することができる。", "bg": "【1947年制定時】障害補償・遺族補償は原則として一時金だが、使用者の支払能力と受給者の利益に配慮し、同意による6年間の毎年補償を選べる制度を整備。従来の工場法下での行政官庁の許可方式を改め、当事者の同意を重視した。\n【1998年改正】平成10年法律第112号で、条文に引用する『別表第二』が『別表第三』へ整理された。現行の別表第三は一時金の6分の1を機械的に列挙した表ではなく、別途の年額日数が定められている（別表第三の補助シート参照）。", "deb": "【1947年3月23日・貴族院特別委員会／発言024〜027】\n① 種田虎雄委員は、障害補償・遺族補償を分割して支払う第82条の趣旨を尋ねた。\n→ 寺本廣作政府委員は、工場法の行政許可を廃し、使用者が支払能力を証明し、受給者の同意を得る方式にしたと説明した。行政の簡素化だけでなく、労働者の職場継続や当事者の合意も考慮したという。\n② 分割払いは、使用者だけの便宜なのか。\n→ 寺本は、一時金と定期金の考え方を調整し、双方の便宜を考えて原則6年としたと説明した。国際的な定期金制度も念頭にあった。\n③ 種田は、それなら少額の障害補償まで6年に分けるのかと問い返した。\n→ 寺本は、金額の多い少ないで分けず、原則6年とする設計だと答えた。少額まで分割するのかという疑問と、制度を一つの形にそろえる説明が向き合っている。", "tsu": "【制定時行政手続に関する寺本政府答弁】分割の際には履行可能性の把握のため届出・報告の義務を省令等で定める考えを説明した。これは1947年の政府答弁であり、現行の具体的届出義務をこの答弁だけから断定しない。\n【現行法の直接要件】①使用者の支払能力の証明、②補償受給者の同意、③第77条障害補償又は第79条遺族補償、④別表第三の各年額を6年間毎年支払う。第81条打切補償や第80条葬祭料は対象外。確認済み番号付き通達の現行効力・全後続改廃：—。", "kako": "—", "rows": [6], "ch": 8}, {"key": "h83", "num": [83], "label": "第83条", "caption": "補償を受ける権利", "status": null, "sheet": "第81～85条", "scope": "honsoku", "text": "（補償を受ける権利）\n第83条　補償を受ける権利は、労働者の退職によつて変更されることはない。\n\n②　補償を受ける権利は、これを譲渡し、又は差し押えてはならない。", "bg": "【1947年制定時】雇用関係の終了によって災害補償の権利が左右されることを防ぎ、受給権自体を取引や強制執行から保護する仕組みを設けた。この保護目的は条文構造からの要約である。\n【現行との区別】第83条は労働基準法の使用者に対する災害補償請求権の規定。労災保険法の保険給付受給権に関する譲渡・差押え禁止等とは根拠条文を取り違えない。", "deb": "【1947年の提出法案／補償を受ける権利の保護】\n① 被災した労働者が退職したら、元の使用者への補償請求もなくなるのか。\n→ 第83条は、退職によって補償を受ける権利は変更されないとした。雇用関係が終わっても、その仕事で生じた災害の補償は続く。\n② 権利が残っても、他人へ譲ったり、債権者に差し押さえられたりしたらどうなるのか。\n→ 同条は、その権利の譲渡と差押えを禁じた。補償義務を定めるだけでなく、受給者の手に補償が届くよう、権利そのものを守る形にしたのである。\n※提出法案から読む制度の焦点。退職・譲渡・差押えをめぐる本条固有の議会質疑は未確認。", "tsu": "【法の直接の効果】退職しても補償請求権の内容は変わらない。補償を受ける権利を譲渡・差押えできない。『受給権の保護』と『現実の支払債権の履行・強制執行』などの細部は別論点であり、本欄に未確認の通達解釈は載せない。\n【番号・原文・有効性まで確認した本条固有の通達】—。", "kako": "—", "rows": [7], "ch": 8}, {"key": "h84", "num": [84], "label": "第84条", "caption": "他の法律との関係", "status": null, "sheet": "第81～85条", "scope": "honsoku", "text": "（他の法律との関係）\n第84条　この法律に規定する災害補償の事由について、労働者災害補償保険法(昭和22年法律第50号)又は厚生労働省令で指定する法令に基づいてこの法律の災害補償に相当する給付が行なわれるべきものである場合においては、使用者は、補償の責を免れる。\n\n②　使用者は、この法律による補償を行つた場合においては、同一の事由については、その価額の限度において民法による損害賠償の責を免れる。", "bg": "【1947年制定時】労基法上の使用者の無過失災害補償責任を、同時に設けられた労災保険制度で実質的に担保し、同じ事由に対する二重の補償負担を調整する規定を置いた。制定時の第1項は『保険給付を受けるべき場合、その価額の限度で免責』と『命令指定法令の給付の場合の免責』を区別する文言であった。\n【1965年改正】昭和40年法律第130号による労災保険の給付制度の改正に伴い第84条1項の整理。現行条文は『相当する給付が行なわれるべきものである場合』という構成。\n【現行法】労災保険法の給付が相当する限り使用者の労基法上の災害補償義務は免除。ただし休業初日〜第3日の待期期間等、労災保険の給付がなく労基法の補償が必要な範囲は残る。第2項は民法の損害賠償との価額調整。", "deb": "【1947年の提出法案／労災保険と使用者補償の関係】\n① 同じ業務災害について、保険給付と使用者の補償を両方受けるのか。\n→ 第84条は、労災保険などの給付と使用者補償を調整する仕組みを置いた。労災保険があるから使用者の責任が全部なくなるのではなく、対応する給付との関係で扱う。\n② 保険が出ない期間は、誰が支えるのか。\n→ 2025年2月4日の厚労省研究会資料は、休業の待期3日間は労災保険の休業補償給付がなく、労基法上の使用者の休業補償が残ることを示している。\n「保険で払われる範囲」と「使用者がなお負う範囲」を分けるところが、この条文の読みどころである。\n※①は法案の仕組み、②は後年の研究会資料。制定時の個別質疑は未確認。研究会資料自体は通達ではない。", "tsu": "【昭和41年1月31日 基発第73号に関する公的資料】厚労省の令和7年研究会資料は、労災保険の療養・休業・障害・遺族・葬祭・傷病補償年金がそれぞれ労基法上の補償と相当し、労災休業補償給付の支給されない最初の3日間を除き使用者は労基法上の対応する責任を免れる旨の解説を掲載。\n【平成27年 基発0609第4号との関係】打切補償と解雇制限に関する最高裁解釈を参照。\n【注意】実際に保険金が振り込まれたことを免責の唯一の条件とする条文ではない。個別の給付に相当する範囲を判断する必要がある。昭和41年通達の後続改廃を網羅的に確認できていないため『現在まで無改廃』とは記載しない。\n\n【原文確認の限界】昭和41年1月31日基発第73号は厚労省研究会の資料で引用を確認したものの、通達原文全体と全後続改廃は確認できていない。この資料を『原文照合済み・現在も無改廃』と扱わない。", "kako": "—", "rows": [8], "ch": 8}, {"key": "h85", "num": [85], "label": "第85条", "caption": "審査及び仲裁", "status": null, "sheet": "第81～85条", "scope": "honsoku", "text": "（審査及び仲裁）\n第85条　業務上の負傷、疾病又は死亡の認定、療養の方法、補償金額の決定その他補償の実施に関して異議のある者は、行政官庁に対して、審査又は事件の仲裁を申し立てることができる。\n\n②　行政官庁は、必要があると認める場合においては、職権で審査又は事件の仲裁をすることができる。\n\n③　第1項の規定により審査若しくは仲裁の申立てがあつた事件又は前項の規定により行政官庁が審査若しくは仲裁を開始した事件について民事訴訟が提起されたときは、行政官庁は、当該事件については、審査又は仲裁をしない。\n\n④　行政官庁は、審査又は仲裁のために必要であると認める場合においては、医師に診断又は検案をさせることができる。\n\n⑤　第1項の規定による審査又は仲裁の申立て及び第2項の規定による審査又は仲裁の開始は、時効の完成猶予及び更新に関しては、これを裁判上の請求とみなす。", "bg": "【1947年制定時】業務上災害か否か、療養の方法、補償額などの争いについて行政官庁による審査・仲裁制度を整えた。当初は現在の第3項（民事訴訟との並行排除）がなかった。制定当時の時効条項は『時効の中断』と表現。\n【1956年改正】昭和31年法律第126号により、民事訴訟が提起された場合には行政官庁は同一事件の審査・仲裁をしない旨を第3項として追加。\n【2017年改正】平成29年法律第45号により、時効の文言を『中断』から『完成猶予及び更新』に変更。施行前事由の経過措置もある。", "deb": "【1947年の提出法案／補償をめぐる争いの処理】\n① 業務上の災害か、どの程度の障害かで食い違ったら、誰に判断を求めるのか。\n→ 第85条は、行政官庁への審査・仲裁の申立てを認め、必要に応じて医師に診断や検案をさせる仕組みを置いた。法律上の争いだけでなく、医学上の判断も手続に組み込んだ。\n② 同じ争いが裁判にも持ち込まれたらどうするのか。\n→ 1956年改正では、民事訴訟が提起された事件について行政の審査・仲裁を行わない規定を加えた。\n③ 審査・仲裁を求めている間に、請求権の時効が進んでしまわないか。\n→ 法は申立てに時効上の効果を与え、2017年改正で「完成猶予及び更新」という表現へ改めた。\n※提出法案・改正法文からの整理。これらを直接めぐる個別国会質疑は未確認。", "tsu": "【現行第85条】①申立人は『異議のある者』であり労働者だけに限定しない。②行政官庁が職権で開始可能。③民事訴訟の提起後は当該事件の行政審査・仲裁をしない。④必要と認めれば医師に診断・検案させる。⑤時効完成猶予・更新に関して裁判上の請求とみなす。\n【第86条との関係】次段階の審査・仲裁は第86条に規定。労災保険給付そのものに関する審査請求手続と無条件に同一視しない。\n【番号付き行政通達・現行効力までの照合】本条固有では—（未確認）。", "kako": "—", "rows": [9], "ch": 8}, {"key": "h86", "num": [86], "label": "第86条", "caption": "", "status": null, "sheet": "第86～90条", "scope": "honsoku", "text": "第86条　前条の規定による審査及び仲裁の結果に不服のある者は、労働者災害補償保険審査官の審査又は仲裁を申し立てることができる。\n\n②　前条第3項の規定は、前項の規定により審査又は仲裁の申立てがあつた場合に、これを準用する。", "bg": "【1947年制定】災害補償をめぐる異議について行政機関が簡易・迅速・公正に審査・仲裁する制度を置いた。制定時の二段階目の機関は現在の『労働者災害補償保険審査官』とは異なるため、旧名称を現行条文へ転記しない。\n【1956年改正】昭和31年法律第126号による労働保険審査官制度との再編が現行の審査官への申立てに連なる。第85条の行政官庁における審査・仲裁と、労災保険給付の保険処分に対する審査請求は、対象・根拠を分けて理解する。", "deb": "【1947年3月20日・貴族院特別委員会／第8章の政府説明】\n① 災害補償で争いが起きたとき、裁判だけに任せればよいのか。\n→ 河合良成厚生大臣は、紛議を簡易・迅速・公正に処理するため、監督官の審査・仲裁に加え、労働者・使用者・公益の代表者から成る審査機関を設けると説明した。\n② 最初の審査・仲裁で解決しなければ、次はどうするのか。\n→ 旧第86条は、三者で構成される労働者災害補償審査委員会へ、さらに審査・仲裁を申し立てる道を置いた。1956年改正後は、労働者災害補償保険審査官への申立てに改められた。\n※①は章別政府説明、②は法文の整理。1947年当時に現在の審査官制度があったわけではない。本条固有の往復質疑は未確認。", "tsu": "【現行条文・第85条と連続】第85条の審査・仲裁の結果に不服があれば、労働者災害補償保険審査官へ審査・仲裁を申し立てられる。第85条3項を準用するため、民事訴訟が提起された当該事件について審査・仲裁を行わない。\n【労働保険審査官及び労働保険審査会法6条】第86条に基づく審査・仲裁の事務を審査官が担当。施行令20条は申立先や文書・口頭の方法を規定する。番号付き通達の全後続改廃：—（未網羅）。", "kako": "—", "rows": [5], "ch": 8}, {"key": "h87", "num": [87], "label": "第87条", "caption": "請負事業に関する例外", "status": null, "sheet": "第86～90条", "scope": "honsoku", "text": "（請負事業に関する例外）\n第87条　厚生労働省令で定める事業が数次の請負によつて行われる場合においては、災害補償については、その元請負人を使用者とみなす。\n\n②　前項の場合、元請負人が書面による契約で下請負人に補償を引き受けさせた場合においては、その下請負人もまた使用者とする。但し、2以上の下請負人に、同一の事業について重複して補償を引き受けさせてはならない。\n\n③　前項の場合、元請負人が補償の請求を受けた場合においては、補償を引き受けた下請負人に対して、まづ催告すべきことを請求することができる。ただし、その下請負人が破産手続開始の決定を受け、又は行方が知れない場合においては、この限りでない。", "bg": "【1947年制定】重層下請の末端で災害が起きても下請負人が補償を履行できない場合があることに対応し、災害補償に限って元請負人を使用者とみなす特例を維持・整備した。\n【現行法】対象は施行規則48条の2が参照する法別表第一第3号の事業（土木・建築等）。一般の労働契約や就業規則の義務まで当然に元請へ移転するわけではない。", "deb": "【1947年3月23日・貴族院特別委員会／発言033〜038】\n① 竹中藤右衞門委員は、二次・三次の下請がいる現場では、退職などの就業規則まで元請が責任を負うのかと尋ねた。\n→ 吉武惠市政府委員は、通常の労働関係の義務は直接雇う下請が負うと答えた。第87条は災害補償についての特例で、下請の不履行に備え、原則として元請を使用者と扱うという説明だった。\n② 竹中は、短期の仕事や出来高払の現場で、就業規則の項目をすべて整えるのは難しいと指摘した。\n→ 吉武は、必ず記載する事項と、その事業場に制度がある場合に記載する事項を区別した。\n一つの現場に複数の使用者がいるとき、「誰が補償するか」と「誰が通常の労働条件を決めるか」を分けたやり取りである。", "tsu": "【施行規則48条の2】対象を法別表第一第3号事業に限定。\n【第87条2項】元請が下請に補償を引き受けさせるには書面契約が必要で、同一事業について2以上の下請に重複して引き受けさせてはならない。\n【第87条3項】元請は補償請求を受けたとき原則として引受下請への先催告を請求できるが、当該下請が破産手続開始決定を受けたとき又は所在不明の場合は例外。現行法令上の説明と番号付き通達を混同しない。通達の全改廃照合：—。", "kako": "—", "rows": [6], "ch": 8}, {"key": "h88", "num": [88], "label": "第88条", "caption": "補償に関する細目", "status": null, "sheet": "第86～90条", "scope": "honsoku", "text": "（補償に関する細目）\n第88条　この章に定めるものの外、補償に関する細目は、厚生労働省令で定める。", "bg": "【1947年制定】災害補償について法律が主要な補償義務を定め、支払時期や実務上の算定手順等の技術的細目を命令に委ねる制度構造を採用した。\n【改正後】『命令』から『厚生労働省令』への表記整理がなされ、現在は労働基準法施行規則の災害補償関連規定に委任先が具体化されている。", "deb": "【1947年の提出法案／法律と命令の役割分担】\n① 災害補償の責任を法律に置くだけで、実際の支払いまで決まるのか。\n→ 第8章は、療養・休業・障害・遺族などの補償義務と基本額を法律で定めた。一方、第88条は、補償に関する細目を命令に委ねた。\n② 何を法律に残し、何を細目にするのか。\n→ 誰にどの補償義務があるかという骨格は前の各条に置き、制度を実施するための具体的な扱いを下位の規定で補う構造である。\n3月20日の河合良成厚生大臣の説明は、実質的責任と補償義務の一致、被災者の最低限の必要という章全体の方針を示していた。\n※法案の構造と章別政府説明の整理。命令への委任を直接問う本条固有の答弁は未確認。", "tsu": "【委任先の一例：労働基準法施行規則】災害補償の支払・算定の時期、平均賃金算定の基準日、請負事業の適用範囲などが省令で定められる。具体例：同規則48条は死傷の原因となる事故発生日又は疾病発生の診断確定日を平均賃金算定事由発生日とする。同48条の2は第87条の対象事業を指定。\n【番号付き通達の原文と後続改廃】本条固有では—（確認できず）。", "kako": "—", "rows": [7], "ch": 8}, {"key": "h89", "num": [89], "label": "第89条", "caption": "作成及び届出の義務", "status": null, "sheet": "第86～90条", "scope": "honsoku", "text": "（作成及び届出の義務）\n第89条　常時10人以上の労働者を使用する使用者は、次に掲げる事項について就業規則を作成し、行政官庁に届け出なければならない。次に掲げる事項を変更した場合においても、同様とする。\n\n1　始業及び終業の時刻、休憩時間、休日、休暇並びに労働者を2組以上に分けて交替に就業させる場合においては就業時転換に関する事項\n\n2　賃金(臨時の賃金等を除く。以下この号において同じ。)の決定、計算及び支払の方法、賃金の締切り及び支払の時期並びに昇給に関する事項\n\n3　退職に関する事項(解雇の事由を含む。)\n\n3の2　退職手当の定めをする場合においては、適用される労働者の範囲、退職手当の決定、計算及び支払の方法並びに退職手当の支払の時期に関する事項\n\n4　臨時の賃金等(退職手当を除く。)及び最低賃金額の定めをする場合においては、これに関する事項\n\n5　労働者に食費、作業用品その他の負担をさせる定めをする場合においては、これに関する事項\n\n6　安全及び衛生に関する定めをする場合においては、これに関する事項\n\n7　職業訓練に関する定めをする場合においては、これに関する事項\n\n8　災害補償及び業務外の傷病扶助に関する定めをする場合においては、これに関する事項\n\n9　表彰及び制裁の定めをする場合においては、その種類及び程度に関する事項\n\n10　前各号に掲げるもののほか、当該事業場の労働者のすべてに適用される定めをする場合においては、これに関する事項", "bg": "【1947年制定】使用者が定める就業規則を労働条件の共通準則として把握し、一定規模以上の事業場に作成・届出を要求。賃金・労働時間・退職の基本条件を明確にし、その他は制度がある場合に記載する方式を採った。\n【後年の改正】昭和44・62年、平成10・15年などの改正が法本文の改正注記にある。特に【2003年改正】解雇をめぐるトラブルを予防し予測可能性を高めるため、89条3号に『解雇の事由を含む。』と明記された。", "deb": "【1947年3月23日・貴族院特別委員会／発言029〜032、041〜046】\n① 種田虎雄委員は、外国の就業規則には何を記載するのかと尋ねた。\n→ 寺本廣作政府委員は、始業・終業、休日、賃金の計算・支払などは必要事項で、制裁・表彰などは定めがある場合に記載すると説明した。\n② 種田は、法案のどこで必須とそれ以外を区別するのかと問い返した。\n→ 寺本は、当時の第1〜3号が必須、それ以降はその事業場に定めがある場合の事項だと答えた。全項目について新しく制度を作れ、という意味ではなかった。\n③ 鉄道など別の事業法でも届出があるなら、どこへ届けるのか。\n→ 寺本・吉武惠市政府委員は、労基法の監督官庁への届出と、別の事業法による届出を区別した。\n※号番号・項目は制定当時のもの。現在の必須記載事項の区分とは分けて読む。", "tsu": "【第89条・現行】『常時10人以上』は企業単位でなく事業場単位。パート・有期等を含む常時使用者数で判定する。絶対的必要記載事項：①始業・終業等②通常賃金等③退職（解雇事由含む）。相対的必要記載事項：退職手当・臨時賃金等・費用負担・安全衛生・職業訓練・補償・表彰制裁等の定めを置く場合に記載。\n【平成15年10月22日 基発第1022001号】『解雇の事由』の明確な記載を促し、モデル就業規則の活用等で届出受理時に相談・援助する行政対応を示す。\n【施行規則49条1項】要件該当後の届出は遅滞なく所轄労働基準監督署長へ。関連：90条の意見書添付、106条周知義務。通達の全後続改廃：未網羅。", "kako": "平成30年\n令和元年\n令和2年\n令和3年\n令和6年\n令和7年", "rows": [8], "ch": 9}, {"key": "h90", "num": [90], "label": "第90条", "caption": "作成の手続", "status": null, "sheet": "第86～90条", "scope": "honsoku", "text": "（作成の手続）\n第90条　使用者は、就業規則の作成又は変更について、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者の意見を聴かなければならない。\n\n②　使用者は、前条の規定により届出をなすについて、前項の意見を記した書面を添付しなければならない。", "bg": "【1947年制定】使用者が作成する就業規則に労働者が発言する機会を設け、労使の意見を反映する手続を整えた。制定時の政府提案理由には『其の作成に付ては勞働者に發言の機會を與へる』と記されている。\n【1998年改正】平成10年法律第112号による改正注記あり。現行の代表者選出の細目は施行規則6条の2等で確認する。", "deb": "【1947年3月20日・貴族院特別委員会／第9章の政府説明】\n① 使用者が決めた就業規則は、労働者の条件にも影響する。それなら、労働者の声はどこで聞くのか。\n→ 河合良成厚生大臣は、就業規則の準則的な効力と一定規模以上の事業場での作成義務を説明するとともに、労働者に発言の機会を保障する考えを示した。\n② 条文は、誰の意見を聞く形にしたのか。\n→ 第90条は、過半数組合があればその組合、なければ過半数代表者の意見を聞き、届出に意見書を添える形にした。「意見を聞く」ことを制度に組み込んだのであり、条文は労働者側の同意を成立要件とはしていない。\n※①は章別政府説明、②は法文の整理。過半数・意見聴取そのものを直接めぐる個別質疑は未確認。", "tsu": "【現行第90条】事業場に過半数組合があればその組合、なければ過半数代表者に就業規則の作成・変更の意見を聴く。第2項により意見を記した書面を届出に添付。\n【施行規則6条の2】代表者は管理監督者でなく、意見聴取の目的を明示した投票・挙手等で使用者の意向によらず選出。\n【厚労省公式Q&A】必要なのは『意見聴取』で、同意取得まで法律上必要とはしない。意見書は署名押印必須と断定せず、施行規則49条2項では代表者の氏名の記載が必要。短時間・有期雇用労働者の別規則についても事業場の全労働者の過半数代表の意見が必要。対象者の代表への別途聴取は別法上の努力義務。\n【平成24年8月10日 基発0810第2号等・労契法関連通達】就業規則変更時の89・90条手続と労契法10条の合理性判断は区別。通達の改廃網羅は未了。\n\n【改正済み通達】平成24年8月10日『労働契約法の施行について』の正式番号は基発0810第2号（行政サイトで『基発第810002号』とも表記）。平成24年10月26日・平成25年3月28日・平成26年11月28日・平成27年3月18日・平成30年12月28日・令和5年10月12日に一部改正。令和5年改正反映版の公表原文で確認した。同通達は労働契約法の通知であり、労基法独自の新通達としない。", "kako": "平成30年\n令和元年\n令和2年\n令和3年\n令和7年", "rows": [9], "ch": 9}, {"key": "h91", "num": [91], "label": "第91条", "caption": "制裁規定の制限", "status": null, "sheet": "第91～95条", "scope": "honsoku", "text": "（制裁規定の制限）\n第91条　就業規則で、労働者に対して減給の制裁を定める場合においては、その減給は、1回の額が平均賃金の1日分の半額を超え、総額が1賃金支払期における賃金の総額の10分の1を超えてはならない。", "bg": "【1947年制定】使用者が就業規則で懲戒を定める余地を認めつつ、減給という経済的不利益については法定の上限を設けた。第89条で「制裁」を定める際にその種類と程度の記載を求める制度と組み合わせて理解する。\n【要点】１回の事案につき「平均賃金１日分の半額」以内、同一賃金支払期の合計で「実際に支払われる賃金の総額の10分の１」以内という二重の制約である。", "deb": "【1947年3月23日・貴族院特別委員会／発言002〜009】\n① 種田虎雄委員は、労働者に怠慢などがあるとき、使用者はどのような制裁を行えるのかと尋ねた。\n→ 河合良成厚生大臣は、労働者保護を基本としつつ、職場の規律は就業規則とその運用を中心に扱うと答えた。\n② 種田は、外国ではどのような制裁があるのかと重ねて質問した。\n→ 寺本廣作政府委員は、即時解雇・出勤停止・譴責・減俸などを挙げ、減俸には外国法でも上限の例があると説明した。\n③ 日本の法案では、減給にどう歯止めを掛けるのか。\n→ 寺本は、第91条が1回の額と賃金支払期の総額を制限していると説明した。法案は1回につき平均賃金1日分の半額、総額はその支払期の賃金の10分の1を上限とした。\n具体的な運用については、施行段階で各方面の意見を聞いて指導する考えも示された。", "tsu": "【厚労省モデル就業規則・第60条解説（行政解説。番号付き通達ではない）】遅刻・早退により労務を提供しなかった時間に対応する不支給は、そもそも賃金請求権が生じない範囲であり、第91条の減給制裁に当たらない。実際に働かなかった時間分を超えて減額する場合は制裁規定の制限対象となる。\n【制裁の上限】１回の違反を分割し、１回当たりの半額の限度内を複数回繰り返せばよい、という意味ではない。法定の２つの限度をともに満たす必要がある。\n【通達改廃】本条固有の発出番号・当初原文・後続改廃まで確認した通達：—（未完了）。", "kako": "平成30年\n令和元年\n令和2年\n令和3年\n令和7年", "rows": [5], "ch": 9}, {"key": "h92", "num": [92], "label": "第92条", "caption": "法令及び労働協約との関係", "status": null, "sheet": "第91～95条", "scope": "honsoku", "text": "（法令及び労働協約との関係）\n第92条　就業規則は、法令又は当該事業場について適用される労働協約に反してはならない。\n\n②　行政官庁は、法令又は労働協約に牴触する就業規則の変更を命ずることができる。", "bg": "【1947年制定】就業規則は使用者が作成する職場内規範だが、強行法規や当該事業場に適用される労働協約に優先できない。この法令・労働協約・就業規則の上下関係を明示する。\n【2007年労働契約法制定後】労働契約法第13条は法令・労働協約に反する就業規則の労働契約内容としての効力を定める。厚労省通知は、労基法92条１項と同趣旨で、その関係を変更するものではないと説明。", "deb": "【1947年3月20日・貴族院特別委員会／第9章の政府説明と法案】\n① 就業規則に書けば、どんな条件でも労働者を拘束できるのか。\n→ 河合良成厚生大臣は、労働協約がない場合や協約に定めのない労働条件について、就業規則が労働契約の準則となると説明した。就業規則だけが労働条件の出発点になるわけではない。\n② 法令や労働協約と食い違う規則は、どうするのか。\n→ 第92条は、法令・労働協約に反する就業規則を認めず、行政官庁が変更を命じることもできる形にした。規則を作る権限に、上位の基準と行政の監督による歯止めを置いている。\n※①は章別説明、②は法案の仕組み。優劣関係・変更命令を直接めぐる本条固有の往復質疑は未確認。", "tsu": "【平成24年8月10日・基発0810第2号／労働契約法第13条関係】労基法92条１項と労働契約法13条は同趣旨で、就業規則と法令・労働協約の関係を変更しない。ここでいう法令は強行法規としての法律・政令・省令を含み、罰則の有無を問わない。労働協約の規範的部分と矛盾する就業規則については、協約の適用を受ける労働者との関係で労働契約の内容とならない。\n【第92条２項】法令・適用労働協約に抵触する就業規則に対し行政官庁が変更を命じることができる。\n※通知は労契法13条の解釈を含むもので、労基法92条の当初通達だと誤記しない。通知の全後続改廃は未網羅。\n\n【改正済み通達】平成24年8月10日『労働契約法の施行について』の正式番号は基発0810第2号（行政サイトで『基発第810002号』とも表記）。平成24年10月26日・平成25年3月28日・平成26年11月28日・平成27年3月18日・平成30年12月28日・令和5年10月12日に一部改正。令和5年改正反映版の公表原文で確認した。同通達は労働契約法の通知であり、労基法独自の新通達としない。", "kako": "—", "rows": [6], "ch": 9}, {"key": "h93", "num": [93], "label": "第93条", "caption": "労働契約との関係", "status": null, "sheet": "第91～95条", "scope": "honsoku", "text": "（労働契約との関係）\n第93条　労働契約と就業規則との関係については、労働契約法(平成19年法律第128号)第12条の定めるところによる。", "bg": "【1947年制定時の旧規定】旧93条は、就業規則を下回る労働条件を定める労働契約について、その部分を無効とし、就業規則の基準で補充する内容だった。\n【2007年改正】労働契約法（平成19年法律第128号）の成立に伴い労基法93条を全面改正し、労働契約法12条を参照する現行条文へ移した。労働条件の民事的ルールを労働契約法に体系化した改正であり、労基法93条の旧内容を実質的に変更したものではないことが厚労省の施行通知に明記されている。", "deb": "【1947年3月23日・貴族院特別委員会／旧第93条、発言063〜070】\n① 牧野英一委員は、就業規則より不利な労働契約が無効になるなら、その後に規則の方が下がったとき、元の契約は復活するのかと尋ねた。\n→ 寺本廣作政府委員は、就業規則を上回る有利な契約条件まで無効になるわけではないと説明した。\n② 牧野の問いは、最初から有利な契約ではなく、後の規則変更で有利になった契約をどう扱うか、という点にあった。\n→ 吉武惠市政府委員は、そこまでは考えていなかったと断った上で、契約が有利になれば再び効力を持つとの見解を示した。\n「無効」は永久に消えることなのか、それとも最低基準を下回る間だけ効力を止めるのか。条文の一語から、政府も検討していなかった場面へ議論が進んだ。\n※旧第93条の審議。現在の労働契約法第12条を直接説明した答弁ではない。", "tsu": "【平成24年8月10日・基発0810第2号／労契法第12条関係】就業規則で定める基準以上の条件を定めた労働契約は有効。下回る部分だけが無効で、その他の部分は有効。無効部分には就業規則に定める基準を適用して権利義務関係が決まる。\n同通知は、労基法93条の現行参照規定が改正前と同じ内容であると明記している。\n【混同注意】労契法第７条・第10条の就業規則による労働条件設定・変更ルールと、第12条の最低基準効は別の論点。番号付き通達の全後続改廃の網羅確認は未了。\n\n【改正済み通達】平成24年8月10日『労働契約法の施行について』の正式番号は基発0810第2号（行政サイトで『基発第810002号』とも表記）。平成24年10月26日・平成25年3月28日・平成26年11月28日・平成27年3月18日・平成30年12月28日・令和5年10月12日に一部改正。令和5年改正反映版の公表原文で確認した。同通達は労働契約法の通知であり、労基法独自の新通達としない。", "kako": "—", "rows": [7], "ch": 9}, {"key": "h94", "num": [94], "label": "第94条", "caption": "寄宿舎生活の自治", "status": null, "sheet": "第91～95条", "scope": "honsoku", "text": "（寄宿舎生活の自治）\n第94条　使用者は、事業の附属寄宿舎に寄宿する労働者の私生活の自由を侵してはならない。\n\n②　使用者は、寮長、室長その他寄宿舎生活の自治に必要な役員の選任に干渉してはならない。", "bg": "【1947年制定】繊維・土建業等の労働者を住み込みで働かせる寄宿舎では、使用者による居住・外出等の私生活支配が問題とされた。政府提案理由は、寄宿舎で全生活の自由を拘束されたような弊害を除去し、私的生活の自由を保障すると説明した。\n【制度趣旨】事業附属寄宿舎であっても、生活上の自治と寮長等の自主的選出は労働者の側に留保する。寄宿舎管理の必要性を口実に私生活の自由を侵すことは許されない。", "deb": "【1947年3月20日・貴族院特別委員会／第10章の政府説明】\n① 会社が住まいを用意するなら、仕事が終わった後の生活にも指図してよいのか。\n→ 河合良成厚生大臣は、寄宿舎が労務確保のため設けられる事情を認めながら、従来は労働者の生活全体を拘束する弊害があったと指摘した。新しい規制の目的は、私生活の自由を確保することだった。\n② 寄宿舎のまとめ役も、使用者が決めてよいのか。\n→ 第94条は、私生活の自由への干渉を禁じるだけでなく、寮長・室長など自治に必要な役員の選任に使用者が干渉することも禁じた。住む場所を提供する立場と、そこでの自治を決める立場を分けている。\n※①は章別説明、②は法案本文の整理。役員選任を直接めぐる個別質疑は未確認。", "tsu": "【事業附属寄宿舎規程（昭和22年労働省令第7号）第４条／建設業附属寄宿舎規程（昭和42年労働省令第27号）第５条：省令であり通達ではない】外出・外泊に使用者の承認を受けさせること、教育・娯楽等の行事への参加を強制すること、共同の利益を害しない時間・場所の面会自由を制限することを、私生活の自由を侵す例として禁止。建設業用には別の附属寄宿舎規程が適用される。\n【役員の選任】第94条２項自体が、寮長・室長等の自治役員の選任への使用者の干渉を禁止する。\n【番号付き通達】後続改廃まで確認した本条固有のもの：—。", "kako": "—", "rows": [8], "ch": 10}, {"key": "h95", "num": [95], "label": "第95条", "caption": "寄宿舎生活の秩序", "status": null, "sheet": "第91～95条", "scope": "honsoku", "text": "（寄宿舎生活の秩序）\n第95条　事業の附属寄宿舎に労働者を寄宿させる使用者は、左の事項について寄宿舎規則を作成し、行政官庁に届け出なければならない。これを変更した場合においても同様である。\n1　起床、就寝、外出及び外泊に関する事項\n2　行事に関する事項\n3　食事に関する事項\n4　安全及び衛生に関する事項\n5　建設物及び設備の管理に関する事項\n\n②　使用者は、前項第1号乃至第4号の事項に関する規定の作成又は変更については、寄宿舎に寄宿する労働者の過半数を代表する者の同意を得なければならない。\n\n③　使用者は、第1項の規定により届出をなすについて、前項の同意を証明する書面を添附しなければならない。\n\n④　使用者及び寄宿舎に寄宿する労働者は、寄宿舎規則を遵守しなければならない。", "bg": "【1947年制定】事業附属寄宿舎での共同生活を規律するルールを明確化しつつ、日々の私生活に深く関係する事項は使用者の一方的決定を認めず、寄宿労働者の多数意思による同意を必要とした。私生活の自治を規定する第94条と一体の制度。\n【第90条との区別】一般の就業規則の作成・変更は原則として過半数代表から「意見聴取」だが、寄宿舎規則の第１〜４号については「過半数代表の同意」が必要。第５号（建設物及び設備の管理）には第95条２項の同意要件は明記されていないが、第１項の届出事項である。", "deb": "【1947年3月20日・貴族院特別委員会／第10章の政府説明と法案】\n① 私生活の自由を守りながら、共同生活の規則はどう決めるのか。\n→ 河合良成厚生大臣は、寄宿舎で労働者の私生活の自由を確保する方針を説明した。第95条は、共同生活の規則を作る際に居住者の関与を求める形を採った。\n② 居住者の同意は、どの事項に必要なのか。\n→ 起床・就寝、外出・外泊、行事、食事、安全衛生については、居住者の過半数を代表する者の同意を必要とした。建設物・設備の管理は、この同意の対象とは区別した。\n③ 就業規則と同じ「意見聴取」なのか。\n→ 第90条の意見聴取より強い「同意」を求める部分がある。働く場の規則と、暮らす場の規則を同じ手続にはしていない。\n※法案本文と章別説明からの整理。同意の範囲を直接めぐる個別質疑は未確認。", "tsu": "【事業附属寄宿舎規程第１条の２・第２〜３条（省令）】寄宿舎規則の届出先は事業場所在地の所轄労働基準監督署長。同意書面には寄宿労働者の過半数を代表する者の氏名を記載。規則案をあらかじめ寄宿労働者に周知し、入舎に際して規則を示す。\n【建設業附属寄宿舎規程第２条（省令）】届出先に例外があり、他人所有建物の使用時の添付書類も定める。建設業の制度を全事業の附属寄宿舎に一律に当てはめない。\n【法第95条】１〜４号のみ代表の「同意」、全５事項が作成・届出対象。３項は同意の証明を添付、４項は使用者・寄宿労働者双方の遵守義務。\n【通達改廃】省令は確認済み。番号付き通達の全後続改廃は未完了。", "kako": "令和6年", "rows": [9], "ch": 10}, {"key": "h96", "num": [96], "label": "第96条", "caption": "寄宿舎の設備及び安全衛生", "status": null, "sheet": "第96～100条", "scope": "honsoku", "text": "（寄宿舎の設備及び安全衛生）\n第96条　使用者は、事業の附属寄宿舎について、換気、採光、照明、保温、防湿、清潔、避難、定員の収容、就寝に必要な措置その他労働者の健康、風紀及び生命の保持に必要な措置を講じなければならない。\n\n②　使用者が前項の規定によつて講ずべき措置の基準は、厚生労働省令で定める。", "bg": "【1947年制定】寄宿舎生活の自治を保障するだけでなく、居住設備・避難・衛生の面で使用者に物的保護義務を課した。換気、採光、避難等を法定し、細かな設備基準は命令に委ねる構造は制定時法案にも見られる。\n【現在】安全衛生基準は一般の「事業附属寄宿舎規程」と、一定の建設事業に適用される「建設業附属寄宿舎規程」で具体化されている。職場の労働安全衛生管理体制とは別に、居住場所の規律であることがポイント。", "deb": "【1947年3月12日・衆議院委員会／第10章の政府説明】\n① 自由に暮らせても、住まいが不衛生で危険なら、寄宿舎の保護は十分なのか。\n→ 河合良成厚生大臣は、寄宿舎制度を、私生活の自由と健康・安全を守るものとして説明した。\n② 条文は、生活環境のどこを対象にしたのか。\n→ 第96条は、換気・採光・照明・保温・防湿・清潔・避難・定員・就寝などを、使用者が講じる措置の対象にした。職場の作業設備だけでなく、労働者が毎日眠り、暮らす環境も最低基準で守る仕組みである。\n※①は章別説明の論点、②は法文の整理。換気や避難の具体的基準を直接論じた本条固有の往復質疑は未確認。", "tsu": "【事業附属寄宿舎規程（昭和22年労働省令第7号）】一般の事業附属寄宿舎について、設置場所、火災防止、避難経路、寝室、採光・換気などを具体化する。長期寄宿舎と短期寄宿舎で基準の章を分けているため、すべての寄宿舎に同一規格を当てはめない。\n【建設業附属寄宿舎規程（昭和42年労働省令第27号）】工期の予定される建設事業の寄宿舎には専用省令を適用する。危険地の回避、避難・便所等の衛生基準を置く。\n※上記は通達ではなく省令。番号付き通達の現行効力・全改廃は未照合。", "kako": "—", "rows": [5], "ch": 10}, {"key": "h96-2", "num": [96, 2], "label": "第96条の2", "caption": "監督上の行政措置", "status": null, "sheet": "第96～100条", "scope": "honsoku", "text": "（監督上の行政措置）\n第96条の2　使用者は、常時10人以上の労働者を就業させる事業、厚生労働省令で定める危険な事業又は衛生上有害な事業の附属寄宿舎を設置し、移転し、又は変更しようとする場合においては、前条の規定に基づいて発する厚生労働省令で定める危害防止等に関する基準に従い定めた計画を、工事着手14日前までに、行政官庁に届け出なければならない。\n\n②　行政官庁は、労働者の安全及び衛生に必要であると認める場合においては、工事の着手を差し止め、又は計画の変更を命ずることができる。", "bg": "【1972年改正・昭和47年法律第57号】労働安全衛生法の制定に伴う労基法改正で新設。事業附属寄宿舎の設置・移転・変更について危害防止を事前に審査できる手続を法律に置いた。1947年の制定時にはこの条番号は存在しない。\n【制度目的と現行要件】規模等の条件に該当する寄宿舎の計画を、工事の着手より14日前までに届け出させ、必要なら行政官庁が工事の着手差止め又は計画変更を命じる。労働者を「寄宿させる人数が常時10人以上」と単純に置き換えない（本文は「常時十人以上の労働者を就業させる事業」）。", "deb": "【1972年改正法／寄宿舎を造る前の届出】\n① 不安全な寄宿舎を、完成してから直すだけでよいのか。\n→ 1972年に新設された第96条の2は、一定の寄宿舎について、設置・移転・変更の前に計画を届け出る仕組みを置いた。工事の着手14日前までに届け出るため、完成前の段階で監督の対象となる。\n② 計画が安全衛生基準に合っていなければ、どうするのか。\n→ 行政官庁は、工事の差止めや計画変更を命じることができる。使用を始めた後の措置を定める第96条の3と、時間の段階を分けている。\n※改正法・現行法文から読む制度の焦点。対象の「常時10人以上」は事業の使用労働者数であり、入寮者数ではない。1972年の個別国会質疑は未確認。", "tsu": "【事業附属寄宿舎規程第３条の２】所轄労働基準監督署長への所定届書に、周囲の状況・四隣との関係を示す図面及び建物の各階平面図・断面図を添付。一部分の変更であればその部分について届出を行えば足りる。\n【建設業附属寄宿舎規程第５条の２】建設業寄宿舎の届出様式・添付図面等を規定。\n【法第96条の２第２項】行政官庁の「工事着手差止め／計画変更命令」を定める。これは完成後の使用停止命令（第96条の３）とは別。\n※以上は法令・省令であり、特定の通達原文とは区別する。番号付き通達の後続改廃は未完了。", "kako": "令和2年", "rows": [6], "ch": 10}, {"key": "h96-3", "num": [96, 3], "label": "第96条の3", "caption": "", "status": null, "sheet": "第96～100条", "scope": "honsoku", "text": "第96条の3　労働者を就業させる事業の附属寄宿舎が、安全及び衛生に関し定められた基準に反する場合においては、行政官庁は、使用者に対して、その全部又は一部の使用の停止、変更その他必要な事項を命ずることができる。\n\n②　前項の場合において行政官庁は、使用者に命じた事項について必要な事項を労働者に命ずることができる。", "bg": "【1972年改正・昭和47年法律第57号】労働安全衛生法の制定に合わせ、寄宿舎安全衛生基準の違反に対する行政上の是正命令を明文化。1947年制定時には当条はなかった。\n【現行法の機能】設置計画を事前に届出させる第96条の２とは別に、基準に反した寄宿舎について、使用の全部又は一部の停止や変更等を命じる。第２項は使用者に命じた事項について、必要な事項を労働者にも命じ得る。", "deb": "【1972年改正法／使い始めた寄宿舎の是正】\n① 届出を済ませた寄宿舎でも、使用中に危険が分かったらどうするのか。\n→ 新設された第96条の3は、寄宿舎が安全衛生基準に違反するとき、行政官庁が使用停止や変更など、必要な措置を命じることを可能にした。\n② 工事前の計画届だけでは足りないのか。\n→ 第96条の2が設置等の計画を点検するのに対し、この条文は実際に使われる寄宿舎を是正する。建設前と使用中の双方に、行政が介入できる場面を置いたのである。\n※1972年改正法・現行法文からの整理。新設をめぐる個別国会質疑は未確認。制定時の1947年には、この枝番号の条文はなかった。", "tsu": "【法第96条の３第１項】行政官庁による使用の全部・一部停止、変更等の命令（省令基準に違反する寄宿舎）。第２項では労働者にも必要事項を命ずることが可能。\n【法第103条との関連】安全衛生基準違反に加えて労働者に急迫した危険があれば、労働基準監督官が第96条の３の権限を即時に行使できる。通常の行政官庁による命令と、急迫危険時の監督官の即時権限を区別する。\n【関係省令】事業附属寄宿舎規程・建設業附属寄宿舎規程が安全衛生基準を定める。通達の改廃連鎖は未確認。", "kako": "—", "rows": [7], "ch": 10}, {"key": "h97", "num": [97], "label": "第97条", "caption": "監督機関の職員等", "status": null, "sheet": "第96～100条", "scope": "honsoku", "text": "（監督機関の職員等）\n第97条　労働基準主管局(厚生労働省の内部部局として置かれる局で労働条件及び労働者の保護に関する事務を所掌するものをいう。以下同じ。)、都道府県労働局及び労働基準監督署に労働基準監督官を置くほか、厚生労働省令で定める必要な職員を置くことができる。\n\n②　労働基準主管局の局長(以下「労働基準主管局長」という。)、都道府県労働局長及び労働基準監督署長は、労働基準監督官をもつてこれに充てる。\n\n③　労働基準監督官の資格及び任免に関する事項は、政令で定める。\n\n④　厚生労働省に、政令で定めるところにより、労働基準監督官分限審議会を置くことができる。\n\n⑤　労働基準監督官を罷免するには、労働基準監督官分限審議会の同意を必要とする。\n\n⑥　前2項に定めるもののほか、労働基準監督官分限審議会の組織及び運営に関し必要な事項は、政令で定める。", "bg": "【1947年制定】最低労働基準を実効あるものとするため、専門の監督行政機構・監督官を設ける思想。工場法期の産業行政・警察的取締りと異なり、労働保護の専門性を重視した。\n【1999年の機構改革】平成11年法律第160号で現行の都道府県労働局等の組織に対応する全面改正。制定当初の監督組織の条文構造を現行本文と混同しない。\n【身分保障】監督官の罷免には労働基準監督官分限審議会の「同意」が必要であり、単なる意見聴取とは異なる。", "deb": "【1947年3月23日・貴族院特別委員会／発言010〜013】\n① 種田虎雄委員は、広い範囲を扱う労働基準法の専門監督官をどう養成し、警察系統から独立した中央・地方の組織をどう整えるのかと尋ねた。\n→ 河合良成厚生大臣は、工場法の監督が警察との関係を深め、取締りの色が強くなった経緯に触れた。新制度では、労働保護を専門とする監督官が育つことを期待すると答えた。\n② 吉武惠市政府委員は、制度の細目を決める際、労使・中立の委員から意見を聞く構想を示した。\n→ 種田は、委員会に責任を転嫁せず、専門性を持つ監督行政を貫くべきだと要望した。\n法律の条文だけでなく、それを誰が、どのような専門性と責任で実施するかが問われていた。\n※創設時の監督制度全体の質疑。1999年の組織再編後の現行文言を直接論じたものではない。", "tsu": "【現行第97条】労働基準主管局・都道府県労働局・労基署の監督官配置、局長・署長の充当、任免・分限審議会を定める。４項は審議会設置について「置くことができる」、５項は罷免に「同意を必要」と表現しており、法的意味が異なる。\n【資格・任免】第３項は政令委任。実際の任用制度の詳細・各種特例は該当政令を確認する必要がある。\n【番号付き通達】発出番号・原文・全改廃を確認したものは—。条文自体と未調査の通達を混同しない。", "kako": "—", "rows": [8], "ch": 11}, {"key": "h98", "num": [98], "label": "第98条", "caption": "", "status": "削除", "sheet": "第96～100条", "scope": "honsoku", "text": "第98条　削除", "bg": "【1947年制定】監督行政への労使等の意見反映の仕組みの一部として、労働基準に関する審議会制度を法律に規定していた。\n【1983年改正】昭和58年法律第78号により中央・地方労働基準審議会に関する文言を改正。\n【2001年改正】平成13年法律第35号によって第98条全体を「削除」に改めた。旧条文の中身を、現在も効力のある第98条の規定のように書かない。", "deb": "【1947年3月23日・貴族院特別委員会／発言012〜013】\n① 監督行政を進めるとき、労使や中立の立場の意見をどう取り入れるのか。\n→ 吉武惠市政府委員は、労使・中立の委員から成る労働基準委員会に、運用について意見を聞く構想を説明した。\n② 種田虎雄委員は、その仕組みが行政の責任逃れにならないかと懸念した。\n→ 委員会への責任転嫁を防ぎ、専門性のある監督行政を貫くよう求めた。関係者の声を聞くことと、行政が責任を持つことを両立できるかが焦点だった。\n※創設時の監督制度に関する実際のやり取り。第98条は2001年に削除されたが、その削除理由を直接述べた個別国会答弁は未確認。", "tsu": "【2001年法律第35号・第８条】労基法98条を「第九十八条　削除」とし、関連して99条の「及び地方労働基準審議会」の文言も削った。\n【参照注意】削除条文に適用される現行解釈通達を無理に設定しない。旧法の中央・地方審議会関係事項は沿革資料としてのみ扱う。", "kako": "—", "rows": [9], "ch": 11}, {"key": "h99", "num": [99], "label": "第99条", "caption": "労働基準主管局長等の権限", "status": null, "sheet": "第96～100条", "scope": "honsoku", "text": "（労働基準主管局長等の権限）\n第99条　労働基準主管局長は、厚生労働大臣の指揮監督を受けて、都道府県労働局長を指揮監督し、労働基準に関する法令の制定改廃、労働基準監督官の任免教養、監督方法についての規程の制定及び調整、監督年報の作成並びに労働政策審議会及び労働基準監督官分限審議会に関する事項(労働政策審議会に関する事項については、労働条件及び労働者の保護に関するものに限る。)その他この法律の施行に関する事項をつかさどり、所属の職員を指揮監督する。\n\n②　都道府県労働局長は、労働基準主管局長の指揮監督を受けて、管内の労働基準監督署長を指揮監督し、監督方法の調整に関する事項その他この法律の施行に関する事項をつかさどり、所属の職員を指揮監督する。\n\n③　労働基準監督署長は、都道府県労働局長の指揮監督を受けて、この法律に基く臨検、尋問、許可、認定、審査、仲裁その他この法律の実施に関する事項をつかさどり、所属の職員を指揮監督する。\n\n④　労働基準主管局長及び都道府県労働局長は、下級官庁の権限を自ら行い、又は所属の労働基準監督官をして行わせることができる。", "bg": "【1947年制定】専門監督機関の階層的な権限分担と指揮監督の系統を定め、最低基準の履行を全国的に確保する構造。\n【1999年・2001年改正】労働行政組織の再編で「労働基準主管局長」「都道府県労働局長」等の現行体系となり、2001年には地方労働基準審議会関係の文言が削除。条文末尾の沿革と成立法で確認。", "deb": "【1947年3月23日・貴族院特別委員会／監督機関をめぐる発言010〜013】\n① 種田虎雄委員は、新しい法律を実施する中央・地方の専門機関の準備や、監督官の養成を問いただした。\n→ 河合良成厚生大臣は、労働保護を目的とする専門の行政機構を育てる考えを説明した。\n② 組織を置けば、それだけで運用も決まるのか。\n→ 吉武惠市政府委員は、具体的な制度や運用について各方面の意見を聞く構想を示した。種田は、意見を聞くことによって行政の責任を曖昧にしないよう求めた。\n第97条が監督機関の設置を扱うのに対し、第99条は機関の権限を具体化する条文として読める。\n※質疑は創設時の制度全体に関するもの。1999年以降の再編による現行各項の権限を、当時の答弁と同一視しない。", "tsu": "【第99条各項の読み方】第１項は労働基準主管局長、第２項は都道府県労働局長、第３項は労働基準監督署長、第４項は上級機関による下級機関権限の行使を定める。\n【第３項】労基署長の職務には臨検、尋問、許可、認定、審査、仲裁等の法律実施に関する事項が含まれる。\n【第４項】主管局長・労働局長は、下級官庁の権限を自ら行うことも、所属の監督官をして行わせることもできる。\n【通達の改廃】本条の番号付き行政通達について原文と改廃まで検証できたものは—。条文による説明を「通達原文」と表示しない。", "kako": "—", "rows": [10], "ch": 11}, {"key": "h100", "num": [100], "label": "第100条", "caption": "女性主管局長の権限", "status": null, "sheet": "第96～100条", "scope": "honsoku", "text": "（女性主管局長の権限）\n第100条　厚生労働省の女性主管局長(厚生労働省の内部部局として置かれる局で女性労働者の特性に係る労働問題に関する事務を所掌するものの局長をいう。以下同じ。)は、厚生労働大臣の指揮監督を受けて、この法律中女性に特殊の規定の制定、改廃及び解釈に関する事項をつかさどり、その施行に関する事項については、労働基準主管局長及びその下級の官庁の長に勧告を行うとともに、労働基準主管局長が、その下級の官庁に対して行う指揮監督について援助を与える。\n\n②　女性主管局長は、自ら又はその指定する所属官吏をして、女性に関し労働基準主管局若しくはその下級の官庁又はその所属官吏の行つた監督その他に関する文書を閲覧し、又は閲覧せしめることができる。\n\n③　第101条及び第105条の規定は、女性主管局長又はその指定する所属官吏が、この法律中女性に特殊の規定の施行に関して行う調査の場合に、これを準用する。", "bg": "【1947年８月・昭和22年法律第97号】労働省設置時に、旧第100条の２として「婦人少年局長」の権限を追加。制定時当初から現行第100条の条番号だったわけではない。\n【1999年改正】平成11年法律第160号による条番号繰上げ等の後、現在の「女性主管局長」の規定に連なる。現在は女性に特殊な規定の制定・解釈、監督への勧告・援助、文書閲覧・調査を担う。", "deb": "【1947年8月改正法／女性・年少者保護の専門行政】\n① 女性や年少者の保護について、一般の監督機関だけでなく専門の行政部門には何を担わせるのか。\n→ 昭和22年法律第97号は、旧第100条の2を加え、婦人少年局長の権限を明文化した。現在の第100条は、この追加条文に由来する。\n② 専門部門は、現場の監督とどう関わるのか。\n→ 現在の条文は、女性に特殊な規定の制定・改廃・解釈、監督に関する勧告・援助、文書閲覧や調査などを定める。一般の監督機関の権限と、専門部門の役割を分けて読める。\n※改正法・現行法文からの整理。1947年3月の制定審議にはまだこの条文はなく、8月の追加をめぐる個別質疑は未確認。", "tsu": "【第100条１項】女性に特殊の規定に関する事項をつかさどり、その施行について労働基準主管局長・下級官庁長に勧告し、指揮監督を援助する。\n【同２項】関係する監督等の文書を閲覧し、指定職員に閲覧させることができる。\n【同３項】女性に特殊な規定の施行調査について第101条（臨検等）・第105条（守秘義務）を準用。\n【旧法との注意】昭和22年法97号の「婦人少年局長」「女子及び年少者」という旧法文言を現在の女性主管局長の原文に混入させない。固有通達の改廃照合は未完了。", "kako": "—", "rows": [11], "ch": 11}, {"key": "h101", "num": [101], "label": "第101条", "caption": "労働基準監督官の権限", "status": null, "sheet": "第101～105条", "scope": "honsoku", "text": "（労働基準監督官の権限）\n第101条　労働基準監督官は、事業場、寄宿舎その他の附属建設物に臨検し、帳簿及び書類の提出を求め、又は使用者若しくは労働者に対して尋問を行うことができる。\n\n②　前項の場合において、労働基準監督官は、その身分を証明する証票を携帯しなければならない。", "bg": "【1947年制定】労働条件の最低基準を単なる宣言に終わらせず、行政官が現場・寄宿舎に立ち入り、帳簿や関係者の説明を通じて履行状況を把握できる仕組みを設けた。警察的な取締りに偏らない、労働者保護の専門行政として監督制度を整備する方向が議会審議で説明された。\n【1972年改正】昭和47年法律第57号により第101条が一部改正。制定時の監督体制と現行の寄宿舎・安全衛生関係の範囲を混同しない。", "deb": "【1947年3月23日・貴族院特別委員会／発言079〜080】\n① 種田虎雄委員は、自治体の行政機関と労働基準の監督機関で、仕事が重複しないかと質問した。\n→ 吉武惠市政府委員は、労働条件の最低基準は地域ごとにばらついてはならないと説明した。監督は地方行政から独立した国の直轄機関が、全国で統一的に行うという答えだった。\n② その監督官が、現場の実態を確かめる手段は何か。\n→ 第101条は、事業場や寄宿舎等への立入り、帳簿書類の提出要求、労使への尋問を認め、身分を示す証票の携帯も求めた。\n※①は監督制度全体についての実際の質疑、②は法文の整理。立入りの範囲や証票そのものを直接めぐる個別答弁は未確認。", "tsu": "【法第101条・厚生労働省の監督官業務説明】監督官は事業場等に立ち入り、帳簿・書類の提出を求め、使用者・労働者に尋問できる。臨検の際は身分を証する証票の携帯が法定される。法第120条第4号は臨検拒否・妨害・忌避、尋問への不答弁や虚偽、書類の不提出等を処罰対象にしている。\n【他法との区別】労働安全衛生法第91条にも立入等の権限があり、法ごとの要件・権限を混同しない。\n【番号付き通達】原文と後続改廃を確認できた固有通達は—。以上は法令・公的業務説明に基づく整理。", "kako": "—", "rows": [5], "ch": 11}, {"key": "h102", "num": [102], "label": "第102条", "caption": "", "status": null, "sheet": "第101～105条", "scope": "honsoku", "text": "第102条　労働基準監督官は、この法律違反の罪について、刑事訴訟法に規定する司法警察官の職務を行う。", "bg": "【1947年制定】監督官を、違反の是正を指導するだけの行政官とせず、労基法違反の犯罪について司法警察官としての職務も担える制度とした。一般の警察を全面的に排除する制度ではないことが制定時の審議で確認された。\n【現行】法令違反が重大・悪質な事案では捜査・送検も行われる。刑事捜査権限と第101条の監督上の臨検等を区別して理解する。", "deb": "【1947年3月23日・貴族院特別委員会／発言081〜086】\n① 種田虎雄委員は、労基法違反の捜査は監督官だけが扱うのか、一般の司法警察官も扱うのかと尋ねた。\n→ 寺本廣作政府委員は、一般の司法警察官を排除する意味ではないと答えた。\n② 種田は、それなら両者が協力して捜査するという理解でよいかと問い返した。\n→ 寺本は、実際には監督官が単独で行う場合が多いと思うと説明した。\n③ 種田はさらに、そうした仕事を担う監督官には、どんな素養・資格が必要なのかと追及した。\n→ 寺本は、国際的にも監督官に高い資格・教養が求められることを念頭に、採用・養成する考えを述べた。\n捜査権限を与えることから、それに見合う人材をどう育てるかへ、質問が進んでいる。\n※1947年当時の答弁であり、現在の捜査運用の細則ではない。", "tsu": "【法第102条】労働基準監督官は「この法律違反の罪」について刑事訴訟法上の司法警察官の職務を行う。権限の対象法律を「すべての労働関係法令違反」と読み替えない。\n【厚労省の現在の業務説明】重大・悪質な違反について司法警察権限に基づく捜査を行い、検察官への送致につなげる。監督上の是正指導と刑事捜査は法的性質が異なる。\n【通達】法102条に固有の番号付き通達の原文・全改廃は照合済みといえないため—。", "kako": "令和2年", "rows": [6], "ch": 11}, {"key": "h103", "num": [103], "label": "第103条", "caption": "", "status": null, "sheet": "第101～105条", "scope": "honsoku", "text": "第103条　労働者を就業させる事業の附属寄宿舎が、安全及び衛生に関して定められた基準に反し、且つ労働者に急迫した危険がある場合においては、労働基準監督官は、第96条の3の規定による行政官庁の権限を即時に行うことができる。", "bg": "【1947年制定】寄宿舎の安全衛生違反が労働者の生命・身体に直ちに危険を及ぼす場面で、監督官が速やかに対応できる仕組み。\n【1972年改正】労働安全衛生法の制定に伴い第96条の3による行政措置が法定され、第103条も同条を参照する形に改められた。制定時の条文参照先を現行文言と同一視しない。", "deb": "【制定法と1972年改正法／急迫した危険への対応】\n① 寄宿舎に差し迫った危険があるとき、通常の行政手続を待ってよいのか。\n→ 第103条は、労働基準監督官が直ちに所定の権限を行使できる仕組みを置いた。危険が急迫する場面では、現場の監督官が使用停止などの措置を採れる。\n② 通常の是正と緊急措置は、どこで分かれるのか。\n→ 第96条の3の行政官庁による命令に対し、この条文は監督官による即時の対応を扱う。1972年改正では、寄宿舎規制の組替えに伴って参照条文も改められた。\n※制定法・改正法・現行法文から読む制度の焦点。「急迫した危険」の判断を直接問い返した個別議会質疑は未確認。", "tsu": "【法第103条・二重要件】①事業附属寄宿舎が安全衛生基準に違反し、②労働者に急迫した危険がある場合に限り、監督官は法第96条の3の行政官庁の権限（寄宿舎の使用停止・変更その他必要な命令等）を即時に行使できる。\n【第96条の3との差】通常の法第96条の3は行政官庁の命令。第103条は二重要件を満たす急迫危険時の監督官の即時行使である。\n【通達・省令】寄宿舎規程の各基準と合わせて判断するが、特定の通達原文の継続効力までは照合未了。", "kako": "—", "rows": [7], "ch": 11}, {"key": "h104", "num": [104], "label": "第104条", "caption": "監督機関に対する申告", "status": null, "sheet": "第101～105条", "scope": "honsoku", "text": "（監督機関に対する申告）\n第104条　事業場に、この法律又はこの法律に基いて発する命令に違反する事実がある場合においては、労働者は、その事実を行政官庁又は労働基準監督官に申告することができる。\n\n②　使用者は、前項の申告をしたことを理由として、労働者に対して解雇その他不利益な取扱をしてはならない。", "bg": "【1947年制定】労基法違反を行政に知らせる労働者の申告経路を確保し、申告を理由とする解雇その他不利益取扱いを禁じることで、労働者が不利益を恐れず監督を求める制度を設けた。\n【実効性】申告制度は、行政機関だけでは把握しきれない事業場内の違反を発見・是正する契機となる。", "deb": "【1947年3月23日・貴族院特別委員会／申告・監督に関連する発言097〜098】\n① 種田虎雄委員は、保温・採光などの基準に違反し、告発があれば、直ちに処罰されるのかと懸念を示した。\n→ 河合良成厚生大臣は、施行当初は監督官による教育や警告を重視し、段階を踏んで厳格に適用する考えを説明した。違反を知る経路には、告発だけでなく監督官自身の発見もあるとした。\n② 労働者が違反を知らせたことで、仕事を失ってしまわないか。\n→ 第104条は、労働者の申告を認め、申告を理由とする解雇その他の不利益取扱いを禁じた。\n※①は関連する実際の質疑、②は法案本文の仕組み。不利益取扱い禁止そのものを直接めぐる制定時の往復質疑は未確認。", "tsu": "【第104条1項】事業場に労基法または同法に基づく命令への違反事実がある場合、労働者は行政官庁または監督官に申告できる。\n【同2項】使用者は申告を理由に解雇・その他不利益な取扱いをしてはならない。この不利益取扱い禁止は第119条1号の罰則対象である。\n【厚労省の実務案内】申告は臨検・来署での事情聴取等の契機になり、違反が確認されれば是正指導につながる。申告しただけで必ず刑事処罰される制度ではない。\n【通達】番号付き解釈通達と後続改廃の全件照合は未完了。", "kako": "—", "rows": [8], "ch": 11}, {"key": "h104-2", "num": [104, 2], "label": "第104条の2", "caption": "報告等", "status": null, "sheet": "第101～105条", "scope": "honsoku", "text": "（報告等）\n第104条の2　行政官庁は、この法律を施行するため必要があると認めるときは、厚生労働省令で定めるところにより、使用者又は労働者に対し、必要な事項を報告させ、又は出頭を命ずることができる。\n\n②　労働基準監督官は、この法律を施行するため必要があると認めるときは、使用者又は労働者に対し、必要な事項を報告させ、又は出頭を命ずることができる。", "bg": "【1993年改正・平成5年法律第79号】第104条の次に「報告等」の第104条の2を新設。制定時には存在しない枝番号。あわせて従来の第110条を「削除」とし、第120条の罰則の報告・出頭に関する参照を第104条の2へ変更した。\n【趣旨として確認できる構造】行政官庁と監督官の双方に報告・出頭要求権限を明文化。新設の政策上の具体的理由を、成立法の改正文だけから断定しない。", "deb": "【1993年改正法／報告・出頭の権限の整理】\n① 監督機関が事業の実態を調べるには、訪問する以外にどんな手段があるのか。\n→ 第104条の2は、使用者や労働者に必要な事項の報告・出頭を命じる権限を定めた。監督官から報告や出頭を求める規定も置いている。\n② この権限は1993年に初めて作られたのか。\n→ 改正法は、第104条の次にこの条文を加える一方、報告・出頭を扱っていた旧第110条を削除した。既存の規定を監督の章へ移して整理した沿革がある。\n※平成5年法律第79号と法文からの整理。新設・移動をめぐる個別国会質疑は未確認。1947年にはこの枝番号はなかった。", "tsu": "【労働基準法施行規則第58条（1994年改正）】行政官庁が法104条の2第1項に基づいて報告・出頭を命ずるときは、(1)報告・出頭を命ずる理由、(2)出頭を命ずる場合に聴取する事項を通知することとされる。\n【権限主体】第1項は行政官庁（省令の定めによる）、第2項は労働基準監督官（法本文の定め）。\n【罰則】報告せず・虚偽報告・不出頭は法120条5号の罰則対象。\n【改廃】1993年法79号の新設と施行規則58条平成6年改正は確認済。以後のすべての改廃・個別通達の網羅は未了。", "kako": "—", "rows": [9], "ch": 11}, {"key": "h105", "num": [105], "label": "第105条", "caption": "労働基準監督官の義務", "status": null, "sheet": "第101～105条", "scope": "honsoku", "text": "（労働基準監督官の義務）\n第105条　労働基準監督官は、職務上知り得た秘密を漏してはならない。労働基準監督官を退官した後においても同様である。", "bg": "【1947年制定】監督官が事業場の帳簿、労働者の事情、企業の内部情報などに接し得る制度を設ける一方、その職務上知り得た秘密を外部に漏らさない義務を課すことにより、監督への信頼と情報保護の両立を図る条文。\n【退官後】退職すれば秘密保持義務が消滅する構造にせず、退官後にも同じ義務が続くと明記している。", "deb": "【1947年の提出法案／監督官が知った秘密】\n① 帳簿を調べ、労使から事情を聞く監督官は、事業や個人の秘密にも触れる。その情報を外へ漏らしてよいのか。\n→ 第105条は、職務上知り得た秘密を漏らすことを禁じた。立入りや尋問の権限を与える一方で、得た情報の扱いに義務を課している。\n② 監督官を辞めれば、その義務も終わるのか。\n→ 条文は、退官後も同様とした。秘密を知った職務を離れても、秘密保持の責任は残る。\n※提出法案から読む制度の焦点。「秘密」の範囲や退官後の義務を直接めぐる制定時の個別質疑は未確認。", "tsu": "【法第105条】秘密を漏らしてはならない義務の主体は労働基準監督官で、退官後も同様。この違反は法第120条1号の罰則対象。\n【法第100条第3項の準用】女性主管局長または指定官吏が女性に特殊の規定に関する調査を行う場合には、第105条が準用される。第100条の規定による準用も含め第120条1号が規定。\n【行政解釈通達】固有の番号付き通達と後続の改廃を一次資料で確認したものは—。", "kako": "—", "rows": [10], "ch": 11}, {"key": "h105-2", "num": [105, 2], "label": "第105条の2", "caption": "国の援助義務", "status": null, "sheet": "第105の2～109条", "scope": "honsoku", "text": "（国の援助義務）\n第105条の2　厚生労働大臣又は都道府県労働局長は、この法律の目的を達成するために、労働者及び使用者に対して資料の提供その他必要な援助をしなければならない。", "bg": "【1947年制定時】この条番号は存在しなかった。したがって、1947年の議会審議を本条固有の制定理由として扱わない。\n【1952年改正】昭和27年法律第287号（1952年7月31日公布、同年9月1日施行）によって第105条の2を新設。監督・取締りに加えて、労働者・使用者へ資料を提供する等の援助を国の行政機関の義務として法律に明記した。\n【後年の組織改正】労働大臣・都道府県労働基準局長という当時の名称は、現行の厚生労働大臣・都道府県労働局長と区別する。", "deb": "【1952年改正法／取締りと実施の援助】\n① 最低基準を法律に書き、違反を取り締まるだけで、現場は実施できるのか。\n→ 昭和27年法律第287号は、第105条の2を新設し、国の労働行政が、労働者・使用者に資料の提供その他必要な援助をする義務を置いた。\n② 援助は、使用者だけを対象とするのか。\n→ 条文は労働者と使用者の双方を挙げている。行政には、基準を守らせる役割だけでなく、守るために必要な情報を双方へ届ける役割もある。\n※改正法文から読む制度の焦点。1952年改正全体には施行5年間の経験を踏まえた見直しという説明があるが、本条の新設理由を直接述べた個別国会答弁は未確認。", "tsu": "【法第105条の2／現行制度】厚生労働大臣又は都道府県労働局長は、法の目的達成のため、労使双方への資料提供その他必要な援助をしなければならない。事業主に対する「努力義務」ではなく行政機関への法定義務である。\n【昭和27年9月20日 基発第675号】1952年改正全体の施行方針を示した通達。第105条の2単独の要件や例外を定める個別指示を確認できず、この項目を個別通達として扱わない。\n【後続改廃】個別通達の網羅的な効力・改廃調査は未完了。", "kako": "—", "rows": [5], "ch": 12}, {"key": "h106", "num": [106], "label": "第106条", "caption": "法令等の周知義務", "status": null, "sheet": "第105の2～109条", "scope": "honsoku", "text": "（法令等の周知義務）\n第106条　使用者は、この法律及びこれに基づく命令の要旨、就業規則、第18条第2項、第24条第1項ただし書、第32条の2第1項、第32条の3第1項、第32条の4第1項、第32条の5第1項、第34条第2項ただし書、第36条第1項、第37条第3項、第38条の2第2項、第38条の3第1項並びに第39条第4項、第6項及び第9項ただし書に規定する協定並びに第38条の4第1項及び同条第5項(第41条の2第3項において準用する場合を含む。)並びに第41条の2第1項に規定する決議を、常時各作業場の見やすい場所へ掲示し、又は備え付けること、書面を交付することその他の厚生労働省令で定める方法によつて、労働者に周知させなければならない。\n\n②　使用者は、この法律及びこの法律に基いて発する命令のうち、寄宿舎に関する規定及び寄宿舎規則を、寄宿舎の見易い場所に掲示し、又は備え付ける等の方法によつて、寄宿舎に寄宿する労働者に周知させなければならない。", "bg": "【1947年制定】労働者が最低労働基準や就業規則を知らないままでは保護が実効化しにくいため、使用者に法令要旨・就業規則等の周知を求めた。寄宿舎規則の周知も別項で規定された。\n【1998年改正】平成10年法律第112号に伴い労使協定・決議の周知範囲と手段の規定が改められ、平成11年1月29日基発第45号が対象・方法を説明。\n【2008年・2018年改正】平成20年法律第89号、平成30年法律第71号等により、周知対象に関連する協定・決議の参照条番号が改められた。現在の列挙は2018年改正後の条文であり、1947年の文言ではない。", "deb": "【1947年の提出法案／労働者に知らせる仕組み】\n① 法律や就業規則があっても、労働者が内容を知らなければ、どうやって自分の条件を確かめるのか。\n→ 第106条は、法令や就業規則を、掲示・備付けなどの方法で労働者に周知する義務を置いた。監督官庁へ届け出ることと、労働者本人に知らせることを分けている。\n② 労使で結んだ協定も、結んだ当事者だけが知っていればよいのか。\n→ 1998年改正では、労使協定などの周知を拡充した。1999年1月29日基発第45号は、その施行上の扱いを示している。\n働く条件を決める手続に加え、その内容を働く人が確認できる状態にする条文である。\n※法案・改正法・施行通達からの整理。個別国会質疑は未確認。通達を議会答弁とは扱わない。", "tsu": "【平成9年10月20日 基発第680号】電子機器での就業規則等の周知は、①労働者に電子データを取り出す操作権限が与えられていること、②必要なときに容易に確認できるよう取出方法を労働者へ周知していること、を満たすことを要するとした（発出時の解釈）。\n【平成11年1月29日 基発第45号】法令要旨・就業規則に加え、法定の労使協定・委員会決議等を周知対象とし、方法は①常時作業場に掲示・備付、②書面交付、③電子的記録を常時確認できる機器の設置のいずれかと整理。規則第52条の2は令和5年厚労令第165号による電子記録媒体に関する文言改正あり。2000年4月施行に言及する古い説明を現行の適用日と取り違えない。\n【現行注意】法令は「要旨」、就業規則・協定・決議は規定内容を周知する。労働契約法第7条の実質的周知とは法的場面と判断方法を区別。\n\n【改廃確認】平成11年1月29日基発45号について、平成22年5月18日基発0518第1号の改正文を確認。1999年当時の旧項番号・周知方法と現在の施行規則を区別。", "kako": "令和元年\n令和2年\n令和7年", "rows": [6], "ch": 12}, {"key": "h107", "num": [107], "label": "第107条", "caption": "労働者名簿", "status": null, "sheet": "第105の2～109条", "scope": "honsoku", "text": "（労働者名簿）\n第107条　使用者は、各事業場ごとに労働者名簿を、各労働者(日日雇い入れられる者を除く。)について調製し、労働者の氏名、生年月日、履歴その他厚生労働省令で定める事項を記入しなければならない。\n\n②　前項の規定により記入すべき事項に変更があつた場合においては、遅滞なく訂正しなければならない。", "bg": "【1947年制定】最低労働条件の履行を監督する際、労働者の属性、雇入れ・退職の履歴を事業場単位で明らかにする帳簿を整備。制定時の法案にも日々雇い入れられる者の名簿作成の除外と、変更時の訂正義務が置かれていた。\n【後年改正】平成11年法律第160号で「命令」の権限名等を整理。名簿の具体的な必要記載事項や小規模事業の例外は労働基準法施行規則第53条で確認する。", "deb": "【1947年の提出法案／誰を雇っているかの記録】\n① 労働条件を監督する前に、その事業場に誰が働いているかをどう確かめるのか。\n→ 第107条は、事業場ごとの労働者名簿を求め、氏名・生年月日・履歴などの記録を置いた。事業全体で一つあれば足りる、という形にはしていない。\n② 一度書けば、古い情報のままでもよいのか。\n→ 記載事項に変更があれば、遅滞なく訂正する義務も定めた。名簿を作ることと、実態に合わせて保つことを一組にしている。\n③ 日々雇い入れられる者も対象なのか。\n→ 法案は日々雇い入れられる者を除外した。ただし、この除外理由を述べた個別答弁までは確認できていない。\n※法案本文から読む制度の焦点。記載事項・事業場別作成を直接めぐる往復質疑も未確認。", "tsu": "【法第107条】事業場ごとに労働者一人ずつ名簿を調製し、日々雇い入れられる者を除外する。変更は遅滞なく訂正。\n【施行規則第53条】氏名・生年月日・履歴に加え、性別、住所、業務の種類、雇入年月日、退職年月日・理由（解雇なら解雇理由）、死亡年月日・原因を記入。常時30人未満の労働者を使用する事業では「従事する業務の種類」を省略可。常時10人未満ではなく「30人未満」であることに注意。\n【通達】本条固有の番号付き通達の発出文書・全改廃は未確定。ここでは法令・省令と通達を明確に区別。", "kako": "—", "rows": [7], "ch": 12}, {"key": "h108", "num": [108], "label": "第108条", "caption": "賃金台帳", "status": null, "sheet": "第105の2～109条", "scope": "honsoku", "text": "（賃金台帳）\n第108条　使用者は、各事業場ごとに賃金台帳を調製し、賃金計算の基礎となる事項及び賃金の額その他厚生労働省令で定める事項を賃金支払の都度遅滞なく記入しなければならない。", "bg": "【1947年制定】賃金支払の実態と計算根拠を監督・検証可能にするため、事業場ごとの賃金台帳を法定。戦時中の賃金統制令に伴う帳簿実務について、制定時の政府答弁が比較対象として言及している。\n【制定時からの区別】第107条では日々雇い入れられる者を労働者名簿の対象から除外するが、第108条の賃金台帳には同じ一律除外は置かれていない。施行規則第55条は常用と日々雇用を別様式で規定している。\n【後年】平成11年法律第160号で省令等の表記が整理された。", "deb": "【1947年3月23日・貴族院特別委員会／発言090〜093】\n① 種田虎雄委員は、賃金台帳には個人ごとの賃金額を全部書くのか、計算の基礎事項だけでよいのかと尋ねた。\n→ 寺本廣作政府委員は、様式はまだ決まっていないと断った上で、継続雇用の労働者は戦時中の賃金統制令の台帳に倣い、個人別に記載する構想を説明した。\n② 日雇労働者も、同じ細かさで記録するのか。\n→ 寺本は、日雇については、より簡略な記載を想定していると述べた。\n③ 種田は、現場での記入負担が大きくなることを懸念した。\n→ 河合良成厚生大臣は、手続面の負担を避けるよう配慮すると答えた。賃金の実態を残す必要と、日々の事務負担の間で、様式をどう設計するかが議論された。\n※当時の様式の構想であり、現在の必須記載事項をそのまま決定した答弁ではない。", "tsu": "【法第108条】各事業場に賃金台帳を備え、賃金を支払う都度遅滞なく記載。単なる総支給額だけでなく計算の基礎事項が必要。\n【施行規則第54条】氏名・性別・賃金計算期間・労働日数・労働時間数・時間外/休日/深夜労働時間数・賃金種類別の額・控除額等を各人別に記載。日々雇い入れられる者（一月超継続使用を除く）には賃金計算期間の記載が不要。第41条該当者及び高度プロフェッショナル制度の対象者には労働時間数等の一部記載除外がある（記録義務全体がなくなる趣旨ではない）。\n【施行規則第55・55の2条】常用労働者と日々雇入れ労働者の様式を区別。年休管理簿・労働者名簿と合わせて調製することも可能。\n【固有通達・改廃】網羅確認は未了。上記は現行の法令・省令に基づく整理。", "kako": "—", "rows": [8], "ch": 12}, {"key": "h109", "num": [109], "label": "第109条", "caption": "記録の保存", "status": null, "sheet": "第105の2～109条", "scope": "honsoku", "text": "（記録の保存）\n第109条　使用者は、労働者名簿、賃金台帳及び雇入れ、解雇、災害補償、賃金その他労働関係に関する重要な書類を5年間保存しなければならない。", "bg": "【1947年制定】労働関係の重要記録を一定期間保管し、労働条件の履行確認や紛争時の事実確認ができるようにする仕組みを定めた。制定時の法文では保存期間は「三年間」であった。\n【2020年改正】令和2年法律第13号で本則の保存期間を「五年間」に延長。賃金請求権の消滅時効の延長に合わせ、保存する記録の期間も見直された。\n【現行の経過措置】労基法第143条1項が当分の間「五年間」を「三年間」と読み替える。条文109の文字面をそのまま現行の一律5年義務と説明しない。行政資料は、リスク管理上は3年を超える保管の必要が生じ得ると説明している。", "deb": "【1947年の提出法案と2020年改正後の行政説明】\n① 名簿や賃金台帳を作っても、すぐ捨ててしまったら、後から労働条件を確かめられるのか。\n→ 制定時の第109条は、労働者名簿・賃金台帳・雇入れ等の重要書類を3年間保存する義務を置いた。\n② 賃金請求権の時効が見直されたとき、記録の保存期間はどうしたのか。\n→ 2020年改正では、本則5年・当分の間3年とした。3月30日の労働政策審議会で行政側は、省令上の関連記録も原則5年・経過措置3年に整えると説明した。\n請求できる期間と、それを裏付ける記録が残る期間を、併せて読む必要がある。\n※①は法案、②は改正法と行政審議会の説明。制定時に3年とした理由を直接めぐる個別質疑は未確認。", "tsu": "【法第109条・第143条1項】条文の本則は5年間だが、当分の間の保存義務は3年間（現行の読み替え）。本則5年と経過措置3年を必ず併記する。\n【施行規則第56条1項】起算日は①労働者名簿＝死亡・退職・解雇の日、②賃金台帳＝最後の記入日、③雇入・退職書類＝退職・死亡日、④災害補償書類＝補償終了日、⑤その他の重要書類＝完結日。\n【同条2項】賃金台帳等で、対象賃金の支払期日が最後の記入日／完結日より後の場合、当該支払期日を起算日とする。関連の労働時間記録等にも規定の準用あり。\n【2020年3月30日労働政策審議会記録】現行運用の経過措置説明を確認。昭和22年発基第17号を今回の改正通知であると誤認しない。公式の後続改廃を網羅済みとは記載しない。", "kako": "—", "rows": [9], "ch": 12}, {"key": "h110", "num": [110], "label": "第110条", "caption": "", "status": "削除", "sheet": "第110～114条", "scope": "honsoku", "text": "第110条　削除", "bg": "【1947年法案】旧第110条は「報告の義務」。行政官庁又は労働基準監督官の要求に対し、使用者・労働者が報告又は出頭する義務を規定していた。\n【1993年改正】平成5年法律第79号により第110条は「削除」とされる一方、第104条の2（報告等）が新設された。旧規定と新規定を同時に適用しないよう区別する。\n※1993年改正の具体的な提案理由について、今回の成立法本文だけから推測しない。", "deb": "【1947年の提出法案と1993年改正法／削除された報告規定】\n① 現在の第110条は削除されている。それなら、元の条文は何を扱っていたのか。\n→ 旧第110条は、使用者や労働者に必要な事項の報告・出頭を求める監督上の権限を定めていた。\n② 削除によって、その権限もなくなったのか。\n→ 1993年改正では、第104条の2を新設するとともに旧第110条を削除した。現在は監督機関の章に、報告・出頭の規定を置いている。\n「削除」の一語だけでは、制度の廃止と条文の移動を見分けられない。新旧の置き場所を追うと、監督のための仕組みが続いていることが分かる。\n※提出法案・改正法文からの整理。この移動を直接めぐる個別国会質疑は未確認。", "tsu": "【現行の条文配置】第110条は削除。行政官庁・労働基準監督官による報告・出頭命令は第104条の2で規定される。\n【改廃】平成5年法律第79号により第104条の2が追加、第110条は削除。旧第110条の文言を現行通達として援用しない。\n【通達】当該条固有の現行で有効な通達原文・改廃履歴は確認未了のため「—」。", "kako": "—", "rows": [5], "ch": 12}, {"key": "h111", "num": [111], "label": "第111条", "caption": "無料証明", "status": null, "sheet": "第110～114条", "scope": "honsoku", "text": "（無料証明）\n第111条　労働者及び労働者になろうとする者は、その戸籍に関して戸籍事務を掌る者又はその代理者に対して、無料で証明を請求することができる。使用者が、労働者及び労働者になろうとする者の戸籍に関して証明を請求する場合においても同様である。", "bg": "【1947年制定時】当時の法案にも、労働者・労働者となろうとする者に加え、使用者による同人の戸籍に関する無料証明請求を規定していた。\n【立法目的の扱い】証明費用の負担軽減という趣旨は条文の構造から考えられるが、政府提出理由で本条固有の根拠を確認していないため、その推測を制定の確定事実としては記さない。\n【現行条文】無料証明という権利の対象・請求先・請求者を記した規定。", "deb": "【1947年の提出法案／証明書の費用】\n① 労働者や求職者が必要な証明を得るために、その都度手数料を負担しなければならないのか。\n→ 第111条は、労働者・労働者になろうとする者・使用者について、法律の実施に必要な戸籍の証明を無料で請求できる仕組みを置いた。\n② 無料なら、どんな証明でも対象となるのか。\n→ 条文は、この法律やこれに基づく命令の実施に必要な戸籍事項の証明に対象を絞っている。一般的な証明書をすべて無料にする規定ではない。\n労働基準を実施する際の小さな手続費用を、どの範囲で取り除くかを定めた条文として読める。\n※提出法案の仕組みの整理。無料請求を設けた理由を直接述べる本条固有の議会答弁は未確認。", "tsu": "【要件の条文解釈】請求者は、①労働者、②労働者になろうとする者、③これらの者の戸籍について証明を請求する使用者。請求先は戸籍事務を掌る者又はその代理者、対象は「その戸籍に関して」の証明。\n【注意】本条のみから使用者が制限なく個人情報を取得できると結論づけない。現実の請求手続や本人確認等は、戸籍法その他の現行手続との照合が別途必要。\n【個別通達】改廃まで確認できた公的通達は今回見つからず「—」。", "kako": "—", "rows": [6], "ch": 12}, {"key": "h112", "num": [112], "label": "第112条", "caption": "国及び公共団体についての適用", "status": null, "sheet": "第110～114条", "scope": "honsoku", "text": "（国及び公共団体についての適用）\n第112条　この法律及びこの法律に基いて発する命令は、国、都道府県、市町村その他これに準ずべきものについても適用あるものとする。", "bg": "【1947年制定時】国・地方の行政主体であっても労働基準を適用対象とする旨を明文で示した。提出法案にも同趣旨の規定を確認。\n【現行法との関係】国家公務員・地方公務員の適用関係は別法の特別規定も関係するため、本条を根拠に一律にすべての労働基準法の規定が無条件に適用されると解釈しない。", "deb": "【1947年の提出法案／国・地方公共団体への適用】\n① 国や市町村が使用者なら、労働基準法の外に置かれるのか。\n→ 第112条は、国・地方公共団体その他これに準ずるものにも法律とその命令を適用するとした。使用者が公的な主体であるだけでは、適用を外さない形にしている。\n② 公務の職場にある従来の規則との関係はどうなるのか。\n→ 制定時の法案は、公的な使用者も適用対象に含めていた。ただし、現在の公務員については、国家公務員法・地方公務員法等の適用特例も併せて確認する必要がある。\n※提出法案と現行の法体系を分けた整理。本条単独の制定時の往復質疑は未確認。「公的な職場なら現在も全条文が一律に適用される」とは読めない。", "tsu": "【現行法の条文趣旨】適用主体に国・都道府県・市町村等を含める規定。特定の公務員の適用可否は身分や勤務形態、特別法を別途照合する。\n【通達】当該条固有で現行有効性を確認できた通達は「—」。", "kako": "—", "rows": [7], "ch": 12}, {"key": "h113", "num": [113], "label": "第113条", "caption": "命令の制定", "status": null, "sheet": "第110～114条", "scope": "honsoku", "text": "（命令の制定）\n第113条　この法律に基いて発する命令は、その草案について、公聴会で労働者を代表する者、使用者を代表する者及び公益を代表する者の意見を聴いて、これを制定する。", "bg": "【1947年制定時】草案段階の命令制定に、労働者・使用者・公益という三つの立場の意見聴取を組み込む仕組みを法案に規定した。\n【現行運用】厚生労働省は2023年2月20日、同月24日に労基法113条に基づく公聴会を開催する旨を公表し、改正省令案の三者意見聴取を目的と明示した。形式だけの歴史的条文ではなく現行の運用が確認できる。", "deb": "【1947年の提出法案／命令を作る前に誰の声を聞くか】\n① 法律の細目を命令で決めるとき、行政内部だけで決めてよいのか。\n→ 第113条は、法律に基づく命令の制定に当たり、労働者・使用者・公益を代表する者の参加する公聴会で、意見を聞く仕組みを置いた。\n② この手続は、条文に残るだけのものなのか。\n→ 2023年2月20日の厚労省公表資料では、労基法施行規則等の改正案について、同月24日に公聴会を開催すると案内している。\n最低基準の細目を定める段階でも、影響を受ける側の意見を取り入れる手続がある。\n※①は法案本文、②は後年の開催案内。2023年の公聴会は制定時の議会審議ではなく、本条固有の1947年の往復質疑も未確認。", "tsu": "【要件】対象＝労働基準法に基づき制定する命令。対象時点＝命令制定前の草案段階。手段＝公聴会。意見を聴く相手＝労働者代表・使用者代表・公益代表。\n【運用資料】厚生労働省2023年2月20日「労働基準法第113条の規定による公聴会」は3代表を明記。2014年・2018年の公聴会公表資料も制度の実際の運用事例。\n※意見聴取は三者の全員一致や同意取得を条文上要求するものではない。個別の通達改廃は未確認。", "kako": "—", "rows": [8], "ch": 12}, {"key": "h114", "num": [114], "label": "第114条", "caption": "付加金の支払", "status": null, "sheet": "第110～114条", "scope": "honsoku", "text": "（付加金の支払）\n第114条　裁判所は、第20条、第26条若しくは第37条の規定に違反した使用者又は第39条第9項の規定による賃金を支払わなかつた使用者に対して、労働者の請求により、これらの規定により使用者が支払わなければならない金額についての未払金のほか、これと同一額の付加金の支払を命ずることができる。ただし、この請求は、違反のあつた時から5年以内にしなければならない。", "bg": "【1947年法案】第114条の付加金制度は当初から存在。対象と請求期間は、当時の提出法案と現行法で異なるため法案本文で区別する。\n【1947年制定時の制度選択】1947年3月23日、付加金を未払金と同額とした理由について吉武惠市政府委員は、米国の労働基準法制が同様の原則を採用しているためと答弁した（発言094〜095）。これは政府が当時述べた説明である。\n【2020年改正】令和2年法律第13号により請求期間は本則5年に延長。経過措置により当分の間は3年。\n【現在の位置付け】法制度の性質・裁判所の運用については後年の法令・判例・行政資料と区別して検討する。", "deb": "【1947年3月23日・貴族院特別委員会／発言094〜095】\n① 牧野英一委員は、未払いがあったときの付加金を、未払金と同額に固定するのは適切なのかと尋ねた。裁判所に金額を調整する余地を与えた方が、公平ではないかという疑問だった。\n→ 吉武惠市政府委員は、同額の付加金を採用したのは、アメリカの労働基準法制が同じ原則を採っているためと説明した。\n② 支払うべき金銭を払わせるだけでなく、なぜさらに同額を付けるのか。\n→ この質疑では、同額という法案の設計と、個々の事情に応じた裁判所の裁量をどう考えるかが向き合っている。単なる未払金の回収を超える制度である点が焦点だった。\n※①は実際の質疑、②はその論点の整理。現在の付加金の請求期間や裁判実務は、2020年改正・現行法と分けて読む。", "tsu": "【現行の対象】①20条解雇予告手当、②26条休業手当、③37条割増賃金、④39条9項年休中賃金。労基法24条の賃金全額払違反一般が一律に付加金対象となるわけではない。\n【裁判所】労働者の請求で裁判所が未払金と「同一額」の付加金を「命ずることができる」。行政官庁が当然に命令する制度ではなく、裁判所の裁量を含む。\n【期間】条文は違反時から5年。附則143条2項で「当分の間3年」。令和2年4月1日以降に生じた違反に新期間を適用。\n【2020年改正通達・Q&A】「違反があった時」は各手当・賃金の支払期日に支払われなかった時と説明。", "kako": "令和7年", "rows": [9], "ch": 12}, {"key": "h115", "num": [115], "label": "第115条", "caption": "時効", "status": null, "sheet": "第115～119条", "scope": "honsoku", "text": "(時効)\n第115条　この法律の規定による賃金の請求権はこれを行使することができる時から5年間、この法律の規定による災害補償その他の請求権(賃金の請求権を除く。)はこれを行使することができる時から2年間行わない場合においては、時効によつて消滅する。", "bg": "【1947年の法案】労基法による賃金・災害補償その他の請求権を、共通して「2年間」の消滅時効とする規定だった。1947年3月6日の衆議院本会議に提出法案の全文が掲載されている。\n【後年改正】退職手当の5年時効を区別する改正が行われた。2020年改正（令和2年法律第13号）は、民法の短期消滅時効の見直しに対応し、賃金請求権を本則5年とし、起算点を「権利を行使することができる時」と明確化。\n【経過措置】附則143条3項により、退職手当を除く賃金は当分の間3年。2020年4月1日以後に支払期日が到来した分から適用し、それ以前は旧法の扱いとなる。", "deb": "【1947年の提出法案と2020年改正の政府説明】\n① 賃金などの請求権は、いつまで行使できるのか。\n→ 制定時の第115条は、賃金・災害補償その他の請求権について、2年間の時効を置いた。当時の法案本文から、この共通の期間を確認できる。\n② 民法が変わったとき、賃金だけを従来の短い時効のままにしてよいのか。\n→ 2020年改正で厚労省は、給料債権の短期時効が民法からなくなることと、労働政策審議会の建議を踏まえた見直しを説明した。\n③ すべての請求権が5年になったのか。\n→ 賃金請求権は本則5年・当分の間3年。退職手当は5年、災害補償その他は2年と、対象を区別している。\n※①は法案、②は政府の改正説明、③は現行法・経過措置の整理。制定時に2年を選んだ理由の個別質疑は未確認。", "tsu": "【令和2年4月1日／基発0401第27号（厚労省の公表ページに収録）】賃金請求権は原則5年へ延長し、当分の間3年とする。旧法の支払期日まで遡って新期間を適用しない。\n【適用範囲】退職手当は5年。災害補償その他の請求権（年休権など）は従前どおり2年。年休取得日に支払われる賃金請求権は賃金として3年の経過措置の対象となる。\n【資料】厚生労働省2020年改正概要・Q&A、および労働条件Q&Aを参照。最新の後続改廃の全件確認は未完了。", "kako": "—", "rows": [5], "ch": 12}, {"key": "h115-2", "num": [115, 2], "label": "第115条の2", "caption": "経過措置", "status": null, "sheet": "第115～119条", "scope": "honsoku", "text": "(経過措置)\n第115条の2　この法律の規定に基づき命令を制定し、又は改廃するときは、その命令で、その制定又は改廃に伴い合理的に必要と判断される範囲内において、所要の経過措置(罰則に関する経過措置
